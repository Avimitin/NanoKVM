  /api/ws:
    get:
      tags:
      - WebSocket
      summary: Real-time control channel (WebSocket)
      operationId: ws_connect
      description: |
        Real-time control channel of the web UI: it carries keyboard/mouse HID reports from the
        client and status notifications from the server.

        Requires an authenticated session (any role). `Origin`, when present, must match the
        request host; a request without a valid session is answered with `401` before the upgrade.
        The server answers `101` on success. No WebSocket subprotocol is negotiated and the server
        does not send ping frames on this socket.

        ### Client → server (binary)
        Every frame starts with a one-byte message type; the server reads any frame type, but the
        official web UI always sends binary frames.

        | Byte 0 | Total length | Meaning |
        |--------|--------------|---------|
        | `0x00` | 1 byte | Heartbeat. No payload, no reply. |
        | `0x01` | 9 bytes | Keyboard: an 8-byte HID keyboard report follows. |
        | `0x02` | 5 or 7 bytes | Mouse: a 4-byte relative or 6-byte absolute HID report follows. |

        Empty frames and unknown message types are ignored. A keyboard payload that is not exactly
        8 bytes, or a mouse payload that is neither 4 nor 6 bytes, is dropped (logged, no reply).
        After the length check the report bytes are forwarded verbatim to the corresponding HID
        gadget device (`/dev/hidg0`, `/dev/hidg1` or `/dev/hidg2`), so the layouts below describe
        exactly what the host receives.

        **Keyboard report (`0x01`, 8 bytes — written to `/dev/hidg0`)**

        | Offset | Size | Meaning |
        |--------|------|---------|
        | 0 | 1 | Modifier bitmap: bit0 LeftCtrl, bit1 LeftShift, bit2 LeftAlt, bit3 LeftMeta, bit4 RightCtrl, bit5 RightShift, bit6 RightAlt, bit7 RightMeta |
        | 1 | 1 | Reserved, always `0x00` |
        | 2–7 | 6 | Up to six concurrently pressed USB HID usage IDs (keyboard page); `0x00` = empty slot |

        **Relative mouse report (`0x02`, 4 bytes — written to `/dev/hidg1`)**

        | Offset | Size | Meaning |
        |--------|------|---------|
        | 0 | 1 | Button bitmap: bit0 left, bit1 right, bit2 middle, bit3 back, bit4 forward |
        | 1 | 1 | X movement, signed (`-127`…`127`) |
        | 2 | 1 | Y movement, signed (`-127`…`127`) |
        | 3 | 1 | Wheel, signed (negative = down) |

        **Absolute mouse report (`0x02`, 6 bytes — written to `/dev/hidg2`)**

        | Offset | Size | Meaning |
        |--------|------|---------|
        | 0 | 1 | Button bitmap (same layout as the relative report) |
        | 1–2 | 2 | X position, unsigned 16-bit **little-endian** (`1`–`0x8000`; the web UI sends `floor(0x7FFF * x) + 1` for a normalized x in `0…1`) |
        | 3–4 | 2 | Y position, unsigned 16-bit little-endian (same scale) |
        | 5 | 1 | Wheel, signed (negative = down) |

        Examples (hex):

        ```
        client: 00                                        heartbeat
        client: 01 00 00 04 00 00 00 00 00                key "a" press (modifier 0, usage 0x04)
        client: 01 02 00 00 00 00 00 00 00                Left Shift held (modifier bit 1)
        client: 02 00 05 00 00                            relative: move right 5 px
        client: 02 01 00 40 00 40 00                      absolute: left button at ~center (x=y=0x4000)
        ```

        ### Server → client (text)
        JSON text messages of the form `{"type": "<event>", "data": "<payload>"}`, where `data` is
        again a JSON-encoded string. Every message is written with a 10 s write deadline.

        Immediately after the upgrade the server sends the current snapshots in this order:
        one `capture-status` per known capture mode (sorted by mode), one `h264-mode-status`, one
        `hid-led-status`. Afterwards, updates are broadcast to all connected clients.

        | `type` | Payload schema | When |
        |--------|----------------|------|
        | `capture-status` | `Stream_CaptureStatus` | Snapshot on connect, then whenever a streaming mode reports a new public capture state (unchanged, still-OK states are suppressed). |
        | `h264-mode-status` | `Stream_H264ModeStatus` | Snapshot on connect, then only when the `mixed` flag changes. |
        | `hid-led-status` | `Ws_KeyboardLedStatus` | Snapshot on connect, then whenever the host changes the keyboard lock-key LEDs. |

        Example messages:

        ```json
        {"type":"capture-status","data":"{\"ok\":false,\"result\":-6,\"message\":\"Unsupported HDMI resolution\",\"mode\":\"mjpeg\",\"severity\":\"error\",\"updatedAt\":\"2026-10-01T13:09:23.482115712+08:00\"}"}
        {"type":"h264-mode-status","data":"{\"generation\":\"5f0dbe1a-9c9e-4c0b-8f3a-4a1e5e6d7c8b\",\"revision\":7,\"direct\":1,\"webrtc\":0,\"mixed\":false}"}
        {"type":"hid-led-status","data":"{\"numLock\":true,\"capsLock\":false,\"scrollLock\":false,\"known\":true,\"updatedAt\":\"2026-10-01T13:09:23.482115712+08:00\"}"}
        ```

        `capture-status` semantics (`mode` is `mjpeg`, `h264` for WebRTC or `direct`): `result` is
        the raw capture result code, `ok` is `result >= 0`, and `message`/`severity` are derived
        from it: `-7` HDMI input resolution error (error), `-6` Unsupported HDMI resolution
        (error), `-5` Retrieving image (warning), `-4` Changing image resolution (warning),
        `-3` Image buffer full (error), `-2` Encoder error (error), `-1` No image captured (error),
        any other negative value Capture failed (error); non-negative results carry an empty
        `message` and `severity`. Statuses are only produced while a stream of that mode has at
        least one viewer; the last value of each mode is retained and replayed to newly connected
        clients as the connect snapshot.

        `h264-mode-status` semantics: `generation` identifies the server run (new UUID per
        process), `revision` increases on every viewer registration/unregistration, `direct` and
        `webrtc` are the numbers of currently connected viewers per H.264 mode, and `mixed` is
        `true` while both modes are in use at the same time.

        `hid-led-status` semantics: `numLock`, `capsLock`, `scrollLock` are the LED states last
        reported by the remote host through the keyboard HID output report; `known` is `false`
        (and all LEDs `false`) until the host has sent at least one such report.

        ### Heartbeat and timeouts
        The server sets a read deadline of **90 seconds** and refreshes it on every received frame;
        a client that sends nothing for 90 s is disconnected (TCP close, no close frame). The
        official web UI sends `0x00` every **10 seconds**. When the connection closes, the manual
        control lease is released and any still-held keys/buttons are released on the host side, so
        a dead client cannot leave the remote desktop with stuck keys.

        ### Control-mode blocking (PicoClaw / MCP)
        Keyboard and mouse reports are arbitrated by the input-control coordinator:

        * While the AI control mode is **`picoclaw`** and a PicoClaw session holds the session lock,
          manual reports are **dropped silently** (logged at debug level; nothing is sent back over
          this socket). Reports that only *release* already-held keys/buttons are still accepted, so
          a client can always let go.
        * While a control-mode transition is in progress, reports are dropped as well.
        * In **`mcp`** mode manual input stays usable: a report preempts (cancels) a running MCP HID
          operation, waiting up to 2 s for it to finish; if it does not, the report is dropped.
        * Once the manual session becomes idle (no pending reports, no held keys/buttons) after a
          keyboard report or a mouse button/wheel report, MCP HID operations are refused for a 2 s
          cooldown. Plain mouse-move reports do not arm the cooldown.

        None of these conditions is reported to the client; only the server log records the drop.

        ### Session revocation
        When the session is revoked, the JWT expires or the user is disabled, the server sends a
        WebSocket **close frame with code `4401`** (reason `session expired or revoked`) and closes
        the connection. Clients should stop reconnecting and require a new login.
      security:
      - cookieAuth: []
      responses:
        '101':
          description: |
            WebSocket upgrade accepted (Switching Protocols). The binary control frames and the
            JSON status notifications are described in the operation description.
        '401':
          $ref: '#/components/responses/Unauthorized'
