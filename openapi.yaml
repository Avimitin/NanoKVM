  /api/picoclaw/screenshot:
    get:
      tags:
      - PicoClaw Internal
      summary: Capture a JPEG screenshot of the HDMI input
      operationId: picol_getScreenshot
      description: |
        Captures one JPEG frame through the native KVM vision pipeline (`kvmv_read_img`, MJPEG
        encoder) and returns it to the on-device PicoClaw runtime (its `kvm_screenshot` tool and
        the `nanokvm-bridge.sh` helper). This endpoint is **not intended for remote clients**.

        **Security** — accepted only from loopback (`127.0.0.1`/`::1`) and only with a valid
        `X-NanoKVM-Internal-Token` header whose value is the shared secret stored on the device in
        `/etc/kvm/.picoclaw_internal_token` (generated on first boot, compared in constant time).
        Any other caller — non-loopback source or missing/wrong token — receives HTTP `401` with
        the JSON string `"unauthorized"`. When the device is configured for HTTPS, this path is
        additionally allow-listed on the plain-HTTP listener so loopback callers holding the
        token are served directly instead of being redirected (`307`) to HTTPS.

        **Session** — the `X-PicoClaw-Session-ID` header is required and names the PicoClaw
        gateway session (the same id used with `/api/picoclaw/gateway/ws`). While capturing, the
        call temporarily holds the shared PicoClaw session lock for that id (renewing its
        30-minute expiry) and releases it again after the response; if a *different* session
        currently owns the lock, the call fails with `AI_LOCK_HELD`.

        **Query parameters** — `format`, `width`, `height`, `quality`. Values that do not parse
        as unsigned 16-bit integers are rejected with `INVALID_ACTION` "invalid screenshot
        query".

        - `format=base64` returns the standard JSON envelope with the JPEG encoded in
          `data.image_base64`; for this form the target size starts from the configured screen
          (stream) resolution fitted into **960×540** and the quality defaults to the screen
          quality capped at **60**.
        - any other `format` (or omitting it) returns the raw JPEG bytes with `Content-Type:
          image/jpeg`; the target size then defaults to the configured screen resolution and the
          quality to the screen quality.

        `width`/`height` override the target capture size: giving both requests exactly that
        size, giving one scales the other while keeping the aspect ratio of the current size.
        The values are passed unchanged to the capture library (which also accepts `0`/`0` to let
        the encoder choose). `quality` overrides the JPEG quality when greater than 0.

        **Capture behaviour** — an HDMI capture lease is taken first, so a pipeline stopped for
        idling is resumed (the first frame produced right after a resume is discarded and a fresh
        one is waited for). Transient states — encoder result `5` "image not changed" (for
        example a static, black or blocked screen), `-3` buffer full, `-4` resolution change,
        `-5` image being retrieved — are retried up to **30 times, 100 ms apart** (about 3 s) and
        then answered with `SCREENSHOT_NO_SIGNAL` "no HDMI signal or frame unavailable". Other
        failures (`-1` no image, `-2` encoder error, `-6`/`-7` resolution errors, empty frame)
        fail immediately with `SCREENSHOT_FAILED` "failed to capture screenshot"; request
        cancellation also reports `SCREENSHOT_FAILED` "screenshot capture canceled".

        **Errors** — application errors use the structured body `{"code": "<CODE>", "message":
        "..."}` with **HTTP 200** instead of the envelope, both for the JSON form and the raw
        JPEG form. Codes produced here: `SESSION_ID_MISSING`, `AI_LOCK_HELD`, `INVALID_ACTION`,
        `SCREENSHOT_FAILED`, `SCREENSHOT_NO_SIGNAL`.
      security:
      - internalToken: []
      parameters:
      - in: query
        name: format
        required: false
        schema:
          type: string
          default: jpeg
        description: |
          `base64` returns the JSON envelope with `data.image_base64`; any other value
          (typically `jpeg`) returns the raw JPEG bytes. The parameter is not rejected when it
          contains something else — only the literal `base64` selects the JSON form.
        example: base64
      - in: query
        name: width
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 65535
        description: |
          Requested capture width in pixels. With `height` unset the height is scaled to keep
          the current aspect ratio. Unsigned 16-bit; `0` is passed through to the capture
          library.
        example: 960
      - in: query
        name: height
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 65535
        description: |
          Requested capture height in pixels (see `width`).
        example: 540
      - in: query
        name: quality
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 65535
        description: |
          JPEG quality passed to the encoder when greater than `0` (the native library
          documents the range 50–100 for MJPEG). When `0`/absent, the configured screen quality
          is used, capped at 60 for the base64 form.
        example: 60
      - in: header
        name: X-PicoClaw-Session-ID
        required: true
        schema:
          type: string
        description: |
          Id of the PicoClaw gateway session that owns the request. When a different session
          holds the session lock the call fails with `AI_LOCK_HELD`.
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      responses:
        '200':
          description: |
            Raw JPEG bytes (`Content-Type: image/jpeg`, default), or the JSON envelope for
            `format=base64`. Application errors are JSON `{"code", "message"}` bodies (HTTP 200,
            also in the JPEG form).
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PicoLocalScreenshotMeta'
                - $ref: '#/components/schemas/PicoLocalError'
              example:
                code: 0
                msg: success
                data:
                  image_base64: 
                  source_width: 1280
                  source_height: 720
                  capture_width: 960
                  capture_height: 540
                  format: jpeg
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/picoclaw/sessions:
    get:
      tags:
      - PicoClaw
      summary: List PicoClaw chat sessions
      operationId: pico_listSessions
      description: |
        Lists the stored PicoClaw chat sessions, newest first.

        **Requires the admin role.**

        The server reads the sessions directory (`<agents.defaults.workspace>/sessions`, default
        `<picoclaw home>/workspace/sessions`) and only considers files belonging to the "pico"
        channel: JSONL transcripts named
        `agent_main_pico_direct_pico_<sessionID>.jsonl` (optionally with a
        `...<sessionID>.meta.json` sidecar that may carry a `summary`) and opaque store files named
        `sk_v1_*.jsonl` / `sk_v1_*.meta.json`. Legacy `<key>.json` transcripts are also accepted.
        Sessions with no user/assistant messages and no summary are skipped, duplicates are
        dropped, and the list is sorted by `updated` descending (RFC 3339 string order).

        `id` is normally the UUID the browser sent as `session_id` when it opened the PicoClaw
        gateway WebSocket; `sk_v1_...` ids are opaque store keys.

        Pagination is applied **after** the directory scan: `offset` defaults to `0` (negative
        values are clamped to `0`), `limit` defaults to `20` (values `<= 0` fall back to `20`); an
        offset past the end yields `[]`. A missing sessions directory yields `[]`, not an error.

        `title` is the stored summary, falling back to the first user message; `preview` is the
        first user message (`(empty)` when there is none); both are truncated to 60 runes with a
        trailing `...`.

        Application failures use the structured `PicoError` body `{code, message}` returned with
        **HTTP 200**: `RUNTIME_UNAVAILABLE` "failed to resolve sessions directory" or "failed to
        read sessions directory".
      security:
      - cookieAuth: []
      parameters:
      - in: query
        name: offset
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
          example: 0
        description: Number of sessions to skip after sorting.
        example: 0
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          default: 20
          example: 20
        description: Maximum number of sessions to return. Values `<= 0` are replaced by the default `20`.
        example: 20
      responses:
        '200':
          description: |
            Array of session summaries (possibly empty). Application failures also use HTTP 200
            with a `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/PicoSessionListItem'
              example:
                code: 0
                msg: success
                data:
                - id: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  title: Power on the server and open the BIOS
                  preview: Power on the server and open the BIOS
                  message_count: 12
                  created: '2026-09-28T09:12:44Z'
                  updated: '2026-09-28T09:31:07Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/sessions/{id}:
    get:
      tags:
      - PicoClaw
      summary: Get one PicoClaw chat session
      operationId: pico_getSession
      description: |
        Returns the stored transcript of one session.

        **Requires the admin role.**

        The session id from the list endpoint is resolved to
        `<sessions dir>/agent_main_pico_direct_pico_<id>` (JSONL + optional `.meta.json`, falling
        back to the legacy `<key>.json` transcript) or, for ids starting with `sk_v1_`, directly to
        the opaque store file. Missing files and empty sessions (no messages and no summary) are
        reported as not found.

        Only messages with role `user` or `assistant` and non-empty content are returned, in file
        order; timestamps are RFC 3339 (taken from the `.meta.json` sidecar, otherwise from the
        file modification time). `summary` is omitted when empty.

        Errors: `{"code": "INVALID_ACTION", "message": "missing session id"}` (HTTP 200, blank path
        parameter), `{"code": "RUNTIME_UNAVAILABLE", "message": "session not found"}` with
        **HTTP 404**, and `{"code": "RUNTIME_UNAVAILABLE", "message": "failed to resolve sessions
        directory"}` with HTTP 200 (structured `PicoError` body, see
        `#/components/schemas/PicoError`).
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: |
          Session id as returned by `GET /api/picoclaw/sessions` (the gateway `session_id` UUID,
          or an opaque `sk_v1_...` store key).
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      responses:
        '200':
          description: Session transcript.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoSessionDetail'
              example:
                code: 0
                msg: success
                data:
                  id: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  messages:
                  - role: user
                    content: Take a screenshot of the remote screen.
                  summary: Powered on the host and opened the BIOS menu.
                  created: '2026-09-28T09:12:44Z'
                  updated: '2026-09-28T09:31:07Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Session not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoError'
              example:
                code: RUNTIME_UNAVAILABLE
                message: session not found
    delete:
      tags:
      - PicoClaw
      summary: Delete a PicoClaw chat session
      operationId: pico_deleteSession
      description: |
        Deletes the stored transcript files of one session.

        **Requires the admin role.**

        Deletes, when present, `<sessions dir>/agent_main_pico_direct_pico_<id>.jsonl`,
        `...<id>.meta.json` and `...<id>.json` (opaque `sk_v1_...` ids address `<sessions dir>/<id>`
        with the same three suffixes). If none of them exists the call answers **HTTP 404** with
        `{"code": "RUNTIME_UNAVAILABLE", "message": "session not found"}`.

        This is a pure file operation: it does **not** close a live PicoClaw gateway WebSocket for
        that session, does **not** release the session lock or capture leases (use
        `DELETE /api/picoclaw/runtime/session` for that) and does not touch the running PicoClaw
        process, which may recreate the transcript on the next turn.

        Other errors: `{"code": "INVALID_ACTION", "message": "missing session id"}` (HTTP 200) and
        `{"code": "RUNTIME_UNAVAILABLE", "message": "failed to delete session"}` (HTTP 200).
      security:
      - cookieAuth: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
        description: Session id as returned by `GET /api/picoclaw/sessions`.
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      responses:
        '200':
          description: Session files removed (or application error, HTTP 200, `PicoError` body).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoSessionDeleteResult'
              example:
                code: 0
                msg: success
                data:
                  id: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  deleted: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No transcript file for this session id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoError'
              example:
                code: RUNTIME_UNAVAILABLE
                message: session not found
  /api/storage/cdrom:
    get:
      operationId: storage_getCdRom
      tags:
      - Storage
      summary: Get CD-ROM flag
      description: |
        Returns the CD-ROM flag of the virtual mass-storage LUN. Requires the **admin** role.

        The flag is read from
        `/sys/kernel/config/usb_gadget/g0/functions/mass_storage.disk0/lun.0/cdrom` and parsed as a
        base-10 integer, so `data.cdrom` is an **integer** (`0` or `1`), not a boolean:

        * `1` — the medium currently exported to the host is presented as a CD/DVD-ROM (last mount
          used `cdrom: true`);
        * `0` — normal disk, or nothing mounted (the flag is reset to `0` on unmount).

        In `hid-only` device mode the attribute does not exist, so the endpoint fails.

        Error codes: `-1` `read failed` (attribute unreadable), `-2` `parse failed` (content is not
        a number).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StorageCdromFlag'
              example:
                code: 0
                msg: success
                data:
                  cdrom: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/storage/image:
    get:
      operationId: storage_getImages
      tags:
      - Storage
      summary: Get image list
      description: |
        Lists the disk images stored on the device. Requires the **admin** role.

        The handler walks `/data` recursively (`filepath.Walk`, so subdirectories are included) and
        collects every non-directory whose name ends with `.iso` or `.img`; the extension check is
        case-insensitive (the name is lower-cased first, the original name is returned). The entries
        are **absolute paths** exactly as produced by the walk, for example `/data/ubuntu-24.04.iso`
        or `/data/images/win11.img` — this is the value to pass as `file` to
        `POST /api/storage/image/mount` and `POST /api/storage/image/delete`.

        Environment note: the images live on the `/data` partition, which is the same partition the
        virtual USB disk can serve to the controlled host (see `POST /api/storage/image/mount` and
        the VM virtual-device API). While the virtual disk is enabled the host owns `/data` as a
        writable disk and it is mounted read-only here; the file system is still readable, so this
        endpoint keeps working, but writing/deleting images is not possible in that state.

        Error codes: `-2` `get images failed` (the walk failed, e.g. `/data` cannot be read).
        On success `data.files` is an array of strings, empty when no image is present.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StorageImageList'
              example:
                code: 0
                msg: success
                data:
                  files: *id008
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/storage/image/delete:
    post:
      operationId: storage_deleteImage
      tags:
      - Storage
      summary: Delete image
      description: |
        Deletes an image file from `/data`. Requires the **admin** role.

        The body is bound with `ShouldBind` (`application/json` or
        `application/x-www-form-urlencoded`); `file` is required.

        Validation (all on the lower-cased copy of the path): the value must start with `/data` and
        end with `.iso` or `.img`, otherwise `-2 invalid arguments`. The file is then removed with
        the exact string that was sent.

        Environment notes:

        * The server does **not** check whether the file is currently mounted — deleting the mounted
          image is accepted by the API (the official web UI hides the delete action for the mounted
          image and while the virtual disk shares `/data` with the host).
        * While the virtual disk is enabled the host owns `/data` as a writable disk and the
          partition is mounted read-only here, so the removal fails.

        Error codes: `-1` `invalid arguments` (binding or validation failed), `-2`
        `invalid arguments` (path does not start with `/data` or lacks the `.iso`/`.img`
        extension), `-3` `remove file failed` (the OS refused the removal, e.g. read-only file
        system or missing file).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageDeleteImageRequest'
            example:
              file: /data/old-backup.img
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/storage/image/mount:
    post:
      operationId: storage_mountImage
      tags:
      - Storage
      summary: Mount image
      description: |
        Attaches an image to the virtual USB mass-storage device, or releases it.
        Requires the **admin** role.

        The body is bound with `ShouldBind`, so `application/json` (what the official web UI sends)
        and `application/x-www-form-urlencoded` are both accepted.

        Request fields:

        * `file` — optional. Absolute path of the image as returned by `GET /api/storage/image`.
          An empty string (or an absent field) means **unmount**: the raw `/data` partition
          (`/dev/mmcblk0p3`) is attached as a *writable* disk to the host instead.
        * `cdrom` — optional boolean, default `false`. Only honoured when `file` is non-empty: it
          presents the medium as a CD/DVD-ROM drive instead of a disk. Ignored (forced to `false`)
          when unmounting.

        What the handler does, in order:

        1. When unmounting (`file` empty) `/data` is remounted **read-only** on the KVM before the
           host receives the raw partition as a writable disk ("only one side may write the
           partition at a time"). When mounting an image, `/data` is remounted **read-write** again
           after the LUN has been switched (a failure there is only logged).
        2. The LUN `file` attribute is written empty first, so no image is ever served writable.
        3. `ro` is set to `0` when unmounting and to `1` when mounting — images are served
           **read-only** to the host, so the host can never write into the image file.
        4. `cdrom` is set to `1` only when mounting with `cdrom: true`, otherwise `0`.
        5. The SCSI inquiry string (`NanoKVM`, `USB Mass Storage` / `USB CD/DVD-ROM`, version
           `0x0520`) and the USB product string are rewritten; when an image is mounted, the image
           base name without extension replaces the product name, truncated to 16 bytes for the
           SCSI inquiry field (cut at a UTF-8 boundary) and to 126 bytes for the USB product string.
        6. The image path (or `/dev/mmcblk0p3`) is written to the LUN `file` attribute.
        7. The USB gadget is re-enumerated: the UDC binding is cleared (`echo > …/g0/UDC`), the
           handler sleeps 100 ms, the first UDC from `/sys/class/udc/` is bound again, and it sleeps
           another 100 ms. HID descriptors are closed before this and reopened afterwards.

        The call is **synchronous**: it returns only after the gadget has been rebound. The
        controlled host sees the USB device disconnect and re-enumerate (mass storage *and* HID), so
        a running guest logs a device removal/re-add and a medium change; the official web UI even
        closes its WebSocket connection before calling this endpoint. Mounting a different medium
        while the host is using the previous one may confuse the host OS.

        Error codes (all HTTP 200): `-1` `invalid arguments` (binding/validation failed),
        `-2` `make /data read-only failed`, `-2` `unmount image failed`, `-2` `set ro flag failed`,
        `-2` `set cdrom flag failed`, `-2` `set inquiry failed`, `-2` `mount image failed`,
        `-2` `execute command failed` (the UDC rebind commands failed). A failure to write the USB
        product string is only logged and does **not** fail the request. Mounting is not possible
        in `hid-only` device mode, because that gadget has no mass-storage function (the writes to
        the LUN attributes fail with `-2`).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageMountImageRequest'
            example:
              file: /data/ubuntu-24.04.2-live-server-amd64.iso
              cdrom: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/storage/image/mounted:
    get:
      operationId: storage_getMountedImage
      tags:
      - Storage
      summary: Get mounted image
      description: |
        Returns the image currently attached to the virtual mass-storage device.
        Requires the **admin** role.

        The value is read from the USB gadget LUN attribute
        `/sys/kernel/config/usb_gadget/g0/functions/mass_storage.disk0/lun.0/file` and the trailing
        newline is stripped. The sentinel value `/dev/mmcblk0p3` — the whole `/data` partition
        served to the host as a writable disk, i.e. the "unmounted image / virtual disk enabled"
        state — is reported as the empty string `""`.

        In `hid-only` device mode (`GET /api/hid/mode`) the endpoint short-circuits and always
        reports `""`, because that gadget has no mass-storage function at all. It does not read the
        LUN file in that case.

        Error codes: `-2` `get HID mode failed` (the mode flag
        `/sys/kernel/config/usb_gadget/g0/bcdDevice` is missing or holds an unknown value),
        `-2` `read failed` (the LUN `file` attribute could not be read).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/StorageMountedImage'
              example:
                code: 0
                msg: success
                data:
                  file: /data/ubuntu-24.04.2-live-server-amd64.iso
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/stream/h264:
    get:
      tags:
      - Stream
      summary: H.264 video stream (WebRTC signaling)
      operationId: stream_h264Signaling
      description: |
        WebSocket endpoint carrying the **WebRTC signaling** for the H.264 WebRTC video mode. The
        video itself flows over WebRTC (SRTP) on a separate transport, not over this socket.

        Requires an authenticated session (any role). The upgrade happens before any of the WebRTC
        setup; a request without a valid session is answered with `401` before switching protocols.

        `Origin`, when present, must match the request host (`middleware.CheckWebSocketOrigin`);
        requests without an `Origin` header are accepted. No WebSocket subprotocol is negotiated.

        ### Message envelope
        Both directions use JSON **text** messages of the form:

        ```json
        {"event": "<name>", "data": "<payload>"}
        ```

        `data` is always a **string**; for SDP/ICE events it contains JSON that has to be parsed a
        second time. Events that are not handled are ignored (logged server-side), and messages
        that are not valid JSON are dropped without closing the socket. Binary frames whose payload
        is JSON are accepted as well (the server does not check the frame type).

        ### Server → client

        | `event` | `data` | When |
        |---------|--------|------|
        | `ice-servers` | JSON array of ICE server objects (`urls`, optional `username`, optional `credential`) | Immediately after the upgrade, before any client message. Can be an empty array. |
        | `video-answer` | JSON `RTCSessionDescription`, e.g. `{"type":"answer","sdp":"v=0\r\n..."}` | In response to a valid `video-offer`. |
        | `video-candidate` | JSON `RTCIceCandidateInit`, e.g. `{"candidate":"candidate:...","sdpMid":"0","sdpMLineIndex":0,"usernameFragment":"..."}` | As the server's peer connection gathers local ICE candidates. |
        | `heartbeat` | `""` | Echo of a client `heartbeat`. |

        Example:

        ```json
        {"event":"ice-servers","data":"[{\"urls\":[\"stun:stun.l.google.com:19302\"]}]"}
        ```

        ### Client → server

        | `event` | `data` | Notes |
        |---------|--------|-------|
        | `video-offer` | JSON `RTCSessionDescription`, e.g. `{"type":"offer","sdp":"v=0\r\n..."}` | Accepted only while the server peer connection is in signaling state `stable`; an offer at any other time is ignored (logged, nothing is sent back). |
        | `video-candidate` | JSON `RTCIceCandidateInit` | Applied to the server peer connection. Candidates may be sent before the answer; the official web UI buffers its own candidates until the remote description is set. |
        | `heartbeat` | `""` | Keep-alive; answered with `{"event":"heartbeat","data":""}`. The official web UI sends one every 60 s. |

        ### ICE / STUN / TURN configuration
        Taken from the server configuration file (`/etc/kvm/server.yaml`) when the connection is
        created:

        * `stun` — a `stun:<value>` ICE server is advertised when the value is non-empty and not
          the literal `disable`. Default: `stun.l.google.com:19302`.
        * `turn` — a `turn:<turnAddr>` ICE server with `turnUser`/`turnCred` credentials is
          advertised only when all three values are set.

        The resulting list is sent in the initial `ice-servers` message and may be empty (for
        example with `stun: disable` and no TURN configuration). The client is expected to build
        its `RTCPeerConnection` from exactly this list.

        ### Media configuration
        Immediately after the upgrade the server creates its peer connection in unified-plan mode
        with one H.264 track (`video` / `pion-video`); the client therefore only has to offer
        to receive video (`recvonly`, as the official web UI does with
        `addTransceiver('video', {direction: 'recvonly'})`). The server advertises
        `packetization-mode=1`, `profile-level-id=4d001f`, `level-asymmetry-allowed=1`; NACK and
        RTCP report interceptors are enabled, and the SRTP profiles `SRTP_AEAD_AES_128_GCM` and
        `SRTP_AES128_CM_HMAC_SHA1_80` are offered. The video is fed from the shared H.264 capture
        pipeline, so it follows the device screen settings (resolution, FPS, bitrate) and the
        capture status published on `/api/ws`.

        ### Connection lifecycle

        1. Client connects → the server sends `ice-servers`.
        2. Client sends an offer (`video-offer`) after creating its peer connection.
        3. Server answers with `video-answer`; ICE candidates are exchanged in both directions.
        4. When ICE reaches `connected` or `completed`, the client is registered as an H.264
           **WebRTC** viewer (visible in the `h264-mode-status` notification on `/api/ws`) and the
           shared H.264 stream is started for it.
        5. If ICE leaves the connected state, the viewer is unregistered and no more video is sent
           to it. The server does not initiate renegotiation.

        Note that H.264 Direct (`GET /api/stream/h264/direct`) and H.264 WebRTC share the capture
        pipeline; using both at the same time causes the `mixed` state reported on `/api/ws` and can
        produce screen tearing.

        ### Errors / restart semantics
        The protocol has **no error message**. Failures (offer while not `stable`, SDP that cannot
        be applied, ICE failure) are logged on the server only; the client detects them as a
        missing `video-answer`, as a stalled track or via its own timeout. To retry, close the
        socket and open a new one with a fresh peer connection and offer (the official web UI
        reconnects after 3 s and treats "not connected after 10 s" as a failure). Repeated offers
        on the same socket are only accepted when the signaling state is `stable` again (for an ICE
        restart the server never performs by itself).

        ### Session revocation
        When the session is revoked, the JWT expires, or the user is disabled, the server sends a
        WebSocket **close frame with code `4401`** and reason `session expired or revoked`, then
        closes the connection. Clients should treat `4401` as "logged out" and stop reconnecting.
      security:
      - cookieAuth: []
      responses:
        '101':
          description: |
            WebSocket upgrade accepted (Switching Protocols). The messaging protocol is described
            in the operation description.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/h264/direct:
    get:
      tags:
      - Stream
      summary: H.264 video stream (direct WebSocket)
      operationId: stream_h264Direct
      description: |
        WebSocket endpoint that streams the raw **H.264** capture as binary WebSocket frames, for
        clients that decode locally (the official web UI uses the WebCodecs `VideoDecoder`).

        Requires an authenticated session (any role). `Origin`, when present, must match the
        request host; the server answers `101` on success.

        ### Query parameters

        * `flow` — optional; an integer `> 0` enables per-client **flow control** with that window
          size (values are clamped to `1`–`8`). Omitted, non-numeric or `<= 0` selects the
          best-effort mode without flow control. The official web UI always connects with
          `?flow=8`.

        ### Server → client framing (binary)
        Every WebSocket message carries exactly one access unit:

        | Offset | Size | Meaning |
        |--------|------|---------|
        | 0 | 1 byte | `0x01` = key frame (H.264 I-frame, SPS/PPS included), `0x00` = delta frame (P-frame) |
        | 1–8 | 8 bytes | Timestamp, unsigned 64-bit **little-endian**, microseconds since the shared H.264 capture loop started (monotonic, not a wall clock) |
        | 9… | rest | Raw H.264 Annex-B access unit (start code `00 00 00 01`, then NAL units) |

        Example — key frame with timestamp 1234567 µs, followed by a two-frame exchange:

        ```
        server: 01 87 D6 12 00 00 00 00 00 00 00 00 01 67 4D 00 1F ...   (key frame, Annex-B AU)
        server: 00 2A 7E 13 00 00 00 00 00 00 00 00 01 41 9A ...        (delta frame)
        ```

        ### Client → server messages (binary)
        Text frames, empty frames and any other length are ignored (`SetReadLimit(64)`; a larger
        frame terminates the connection). Only these two control frames are handled:

        | Frame | Meaning |
        |-------|---------|
        | `0x02` + 8 bytes | Frame acknowledgement: timestamp (unsigned 64-bit little-endian) of the newest frame the client has finished decoding. Only relevant in flow-control mode. |
        | `0x03` | Stream resync request: drop all queued and in-flight frames and resume at the next key frame. |

        Examples:

        ```
        client: 02 87 D6 12 00 00 00 00 00      (ack timestamp 1234567)
        client: 03                              (resync, wait for the next key frame)
        ```

        ### Flow control and back-pressure

        * **With `flow=N`**: at most `N` frames may be unacknowledged. When the window is full the
          server drops queued frames and waits for the next key frame, which is sent once the
          client acknowledges enough frames. A stalled client therefore does not accumulate an
          unbounded backlog, but the stream can pause until the next I-frame.
        * **Without `flow`**: frames are queued best-effort (up to 8 frames / 2 MiB); on overflow
          the queue is dropped and the stream resumes at the next key frame.

        ### Keep-alive and close

        * The server sends WebSocket **ping** control frames every 15 s and requires traffic
          (a pong or any other frame) at least every **30 s**; otherwise the read deadline expires
          and the connection is closed. Browsers answer pings automatically.
        * Session revocation, JWT expiry or a disabled user closes the socket with code **4401**
          (`session expired or revoked`), the same as the other WebSocket endpoints.
        * While the connection is open it is registered as an H.264 **Direct** viewer, which is
          reported in the `h264-mode-status` notification on `/api/ws` (together with WebRTC
          viewers). Direct and WebRTC H.264 at the same time can cause screen tearing.

        ### Client requirements
        Start decoding only at a key frame, decode the Annex-B payload as an H.264 access unit
        with the frame-header timestamp, send `0x03` whenever the decoder needs a fresh key frame
        (decoder reset/error), and — in flow-control mode — send the `0x02` acknowledgement for
        decoded frames to let the stream advance. Capture errors do not produce in-band messages;
        they are reported as `capture-status` notifications on `/api/ws` (`mode: "direct"`).
      security:
      - cookieAuth: []
      parameters:
      - name: flow
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 8
        description: |
          Flow-control window (`1`–`8`, values outside the range are clamped). Enables
          acknowledgement-based flow control for this connection. Omit or pass a non-positive
          value for best-effort streaming without acknowledgements.
        example: 8
      responses:
        '101':
          description: |
            WebSocket upgrade accepted (Switching Protocols). The binary framing and control
            messages are described in the operation description.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/mjpeg:
    get:
      tags:
      - Stream
      summary: MJPEG video stream
      operationId: stream_mjpegStream
      description: |
        Continuous **MJPEG** (multipart JPEG) view of the captured screen. The device grabs one
        JPEG per frame and fans it out to every connected client from a single shared capture
        loop, so all viewers of this endpoint receive the same frames.

        Requires an authenticated session (any role).

        ### Request
        The handler reads **no query parameters and no request headers** (beyond the session
        cookie). The official web UI only appends a cache-busting `?v=<nonce>`, which the server
        ignores. Image size, quality and frame rate come from the device screen settings
        (`POST /api/vm/screen`), not from this request: the streamer re-reads `screen.FPS`
        (default `30`, valid range `10`–`60`) on every tick and follows changes live. The JPEGs are
        produced with the configured width/height and quality.

        ### Response
        `200` with `Content-Type: multipart/x-mixed-replace; boundary=frame`; every frame is one
        part:

        ```
        --frame\r\n
        Content-Type: image/jpeg\r\n
        Content-Length: <n>\r\n
        \r\n
        <n bytes of JPEG>\r\n
        ```

        The status line and the headers listed below are written together with the **first frame**:
        a client whose request never produces a frame (for example because HDMI capture is
        disabled) sees the request pending with no data — not an HTTP error.

        ### Frame detection
        When frame detection is enabled (`POST /api/stream/mjpeg/detect`), the capture pipeline
        reports frames that did not change with result code `5` (`IMG not changed`) and the
        streamer does not transmit them, so a static remote desktop produces no data at all. Use
        `POST /api/stream/mjpeg/detect` (`enabled: false`) or
        `POST /api/stream/mjpeg/detect/stop` to keep receiving frames.

        ### HDMI capture disabled or unavailable
        An MJPEG viewer counts as capture demand and can resume capture that was suspended by the
        HDMI idle timeout, but it never overrides an administrative HDMI disable. When HDMI
        capture is disabled in the device settings, when the HDMI signal is missing, or when the
        capture pipeline reports an error, no frames are produced; the HTTP connection stays open
        and the condition is published asynchronously as `capture-status` notifications on
        `GET /api/ws` (`mode: "mjpeg"`, negative `result`, e.g. `-1` → `No image captured`).

        ### Lifecycle
        The first client starts the shared capture loop; each loop iteration stops as soon as the
        last client has disconnected. Closing the client connection cancels the HTTP request
        context and removes the client from the fan-out.

        This endpoint does not use the `{code,msg,data}` JSON envelope; the payload is the raw
        multipart stream.

        **Example**

        ```sh
        curl -N -b 'nano-kvm-token=<jwt>' http://nanokvm.local/api/stream/mjpeg
        ```
      security:
      - cookieAuth: []
      parameters:
      - name: v
        in: query
        required: false
        schema:
          type: string
          example: '1727779200000'
        description: |
          Ignored by the server. The official web UI appends a monotonically increasing value to
          bust browser caches when the stream is re-opened. Any other query parameter is ignored
          as well.
        example: '1727779200000'
      responses:
        '200':
          description: |
            The multipart MJPEG stream. The body is a sequence of `image/jpeg` parts introduced by
            the delimiter line `--frame`; there is no final closing delimiter while the stream is
            running.
          headers:
            Content-Type:
              schema:
                type: string
              description: '`multipart/x-mixed-replace; boundary=frame` — the boundary token is `frame`, so part delimiters are written as `--frame`.'
              example: multipart/x-mixed-replace; boundary=frame
            Cache-Control:
              schema:
                type: string
              description: Always `no-cache`.
              example: no-cache
            Pragma:
              schema:
                type: string
              description: Always `no-cache`.
              example: no-cache
            Connection:
              schema:
                type: string
              description: Always `keep-alive`.
              example: keep-alive
            X-Server-Date:
              schema:
                type: string
              description: Server time in RFC 1123 format, set when the stream handler starts.
              example: Thu, 01 Oct 2026 13:09:23 CST
          content:
            multipart/x-mixed-replace; boundary=--frame:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/mjpeg/detect:
    post:
      tags:
      - Stream
      summary: Update frame detection
      operationId: stream_updateFrameDetect
      description: |
        Enables or disables MJPEG **frame detection**.

        With frame detection enabled the capture pipeline compares consecutive frames and reports
        unchanged frames with result code `5` (`IMG not changed`); the MJPEG streamer skips these
        frames instead of transmitting them. This saves bandwidth on static screens, but it also
        means a freshly connected MJPEG viewer may receive nothing until the remote screen changes
        — the official web UI therefore calls `POST /api/stream/mjpeg/detect/stop` with
        `duration: 10` when it (re)opens the MJPEG view.

        * `enabled: true` → frame-detect interval is set to `60`.
        * `enabled: false` → frame detection is switched off (interval `0`).

        The value is applied to the **shared** capture pipeline (it is a device-wide setting, not a
        per-connection one) and it is **not persisted**: the official web UI stores the user's
        preference in browser local storage and re-applies it on page load.

        Requires an authenticated session (any role).

        **Note** — the Go request struct has no `json` tag, so Gin matches the field name
        case-insensitively; the official web UI sends the lower-case `enabled`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_UpdateFrameDetectReq'
            example:
              enabled: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Stream_UpdateFrameDetectReq'
            example:
              enabled: true
      responses:
        '200':
          description: |
            Successful response. `code` is `0` on success; `-1` with `msg` `invalid parameters`
            when the body cannot be bound.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: Not returned; this endpoint has no payload.
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/mjpeg/detect/stop:
    post:
      tags:
      - Stream
      summary: Temporarily stop frame detection
      operationId: stream_stopFrameDetect
      description: |
        Temporarily pauses MJPEG frame detection and **blocks until the pause is over**.

        The handler switches frame detection off (`0`), sleeps for `duration` seconds, switches it
        back on (`60`) and only then answers — the HTTP response arrives after the pause, so the
        client needs an HTTP timeout longer than `duration`.

        * `duration` — pause length in **seconds**. Values `<= 0` (including an omitted field) use
          the default of **10** seconds.
        * The re-enable is unconditional: frame detection is **left enabled** after this call even
          if it was disabled before. Call `POST /api/stream/mjpeg/detect` with `enabled: false`
          afterwards to switch it off again.
        * Concurrent calls sleep independently; the last one to finish re-enables detection.

        The official web UI calls this with `duration: 10` after (re)opening or re-sizing the MJPEG
        view so that the first picture is transmitted even while the remote screen is static.

        Requires an authenticated session (any role).

        **Note** — the Go request struct has no `json` tag, so Gin matches the field name
        case-insensitively; the official web UI sends the lower-case `duration`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_StopFrameDetectReq'
            example:
              duration: 10
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Stream_StopFrameDetectReq'
            example:
              duration: 10
      responses:
        '200':
          description: |
            Successful response, sent after the pause has elapsed. `code` is `0` on success; `-1`
            with `msg` `invalid parameters` when the body cannot be bound.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
                      description: Not returned; this endpoint has no payload.
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/autostart:
    get:
      operationId: vm_getAutostart
      tags:
      - VM
      summary: Get autostart list
      description: |
        Lists the autostart scripts installed in `/etc/kvm/autostart`. **Requires the admin
        role.**

        `files` contains the base names of all regular files in the directory, without any
        extension filter or ordering guarantee (hidden files included).

        Error codes: `-1` `get autostart directory fail` (directory missing or unreadable).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmAutostartList'
              example:
                code: 0
                msg: success
                data:
                  files: *id009
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/autostart/{name}:
    get:
      operationId: vm_getAutostartContent
      tags:
      - VM
      summary: Get autostart content
      description: |
        Returns the content of one autostart script as a plain string. **Requires the admin
        role.**

        `name` is the file name inside `/etc/kvm/autostart` (a single path segment, as returned
        by `GET /api/vm/autostart`); the data field is the file content verbatim.

        Error codes: `-1` `read file fail` (file missing or unreadable).
      security:
      - cookieAuth: []
      parameters:
      - name: name
        in: path
        required: true
        description: File name of the autostart script inside `/etc/kvm/autostart`.
        schema:
          type: string
        example: start-camera.sh
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: string
                      description: Full content of the autostart script.
                      example: '#!/bin/sh'
              example:
                code: 0
                msg: success
                data: '#!/bin/sh'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: vm_uploadAutostart
      tags:
      - VM
      summary: Upload autostart script
      description: |
        Creates or overwrites an autostart script. **Requires the admin role.** The handler
        binds with `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`) and
        takes the file name from the path.

        * `name` — path parameter, the file name inside `/etc/kvm/autostart`; the directory is
          created (mode `0755`) when missing. New files are created with mode `0755`. There is no
          name or content validation: the path segment is used as-is, so a `name` containing
          slashes cannot be expressed (Gin routes a single segment) and a name that resolves to
          an existing file is truncated and overwritten.
        * `content` — the script text to write (optional; an empty value creates/truncates the
          file).

        The response `data` is the file name as received in the path.

        Error codes: `-1` `parse form request fail` (unbindable body), `-1` `create file fail`,
        `-1` `write content fail`.
      security:
      - cookieAuth: []
      parameters:
      - name: name
        in: path
        required: true
        description: File name of the autostart script inside `/etc/kvm/autostart`.
        schema:
          type: string
        example: start-camera.sh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmAutostartUploadRequest'
            example:
              content: |
                #!/bin/sh
                echo "autostart" >> /tmp/boot.log
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: string
                      description: File name of the written autostart script (echoes the path parameter).
                      example: start-camera.sh
              example:
                code: 0
                msg: success
                data: start-camera.sh
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: vm_deleteAutostart
      tags:
      - VM
      summary: Delete autostart script
      description: |
        Deletes one autostart script. **Requires the admin role.** No request body; `name` is the
        file name inside `/etc/kvm/autostart`.

        Error codes: `-3` `remove file fail` (file missing or not removable).
      security:
      - cookieAuth: []
      parameters:
      - name: name
        in: path
        required: true
        description: File name of the autostart script inside `/etc/kvm/autostart`.
        schema:
          type: string
        example: start-camera.sh
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/device/virtual:
    get:
      operationId: vm_getVirtualDevice
      tags:
      - VM
      summary: Get virtual device
      description: |
        Reports which virtual USB devices are currently exposed to the controlled host.
        **Requires the admin role.**

        * `network` — the RNDIS network adapter is enabled (flag file `/boot/usb.rndis0`).
        * `disk` — the virtual USB disk is attached. It must both be enabled
          (`/boot/usb.disk0`) **and** currently serve the whole `/data` partition to the host;
          serving a mounted image (or nothing) counts as disabled.
        * `media` — present in the response for compatibility but never populated by the
          handler; it is **always `false`**.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmVirtualDeviceState'
              example:
                code: 0
                msg: success
                data:
                  network: true
                  media: false
                  disk: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: vm_updateVirtualDevice
      tags:
      - VM
      summary: Update virtual device
      description: |
        Toggles a virtual USB device of the controlled host. **Requires the admin role.** The
        handler binds with `ShouldBind` (`application/json` or
        `application/x-www-form-urlencoded`).

        `device` must be `network` or `disk`; the call **toggles** the current state and returns
        the resulting state in `on`:

        * `network` — mounts/unmounts the RNDIS USB network adapter: creates or removes
          `/boot/usb.rndis0` and restarts the USB gadget (`/etc/init.d/S03usbdev stop|start`).
          A disabled USB network interface on the host side (network cable unplugged/blacklisted)
          can hide the adapter until it is re-enabled; the web UI shows the toggle as active
          regardless.
        * `disk` — attaches/detaches the **whole `/data` partition** as a writable USB mass
          storage device. Enabling first remounts `/data` read-only on the device (the host owns
          it from then on); disabling removes `/boot/usb.disk0` and re-mounts `/data` read-write
          once the gadget no longer shares it. A mounted image is released by the gadget restart.
          The web UI warns that a running image download writes to `/data` and should be stopped
          first.

        Side effect common to both: the HID device is closed and re-opened around the operation,
        so keyboard/mouse input is briefly interrupted (the USB device re-enumerates on the
        host).

        Error codes: `-1` `invalid argument` (unbindable body), `-2` `invalid arguments`
        (unknown `device`), `-3` `make /data read-only failed`, `-3` `operation failed` (a gadget
        command failed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmVirtualDeviceRequest'
            example:
              device: network
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmVirtualDeviceOn'
              example:
                code: 0
                msg: success
                data:
                  true: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/gpio:
    get:
      operationId: vm_getGpio
      tags:
      - VM
      summary: Get gpio
      description: |
        Reads the front-panel LED states from the GPIO sysfs. Requires an authenticated session
        (any role).

        * `pwr` — power LED state. The sysfs value is active-low, i.e. `0` means the LED is lit
          (`pwr: true`).
        * `hdd` — HDD activity LED. Only read on **Alpha** hardware (the `GPIOHDDLed` line is not
          wired on Beta/PCIE); it is always `false` on those revisions.

        Error codes: `-2` `failed to read power led: <error>` or `failed to read hdd led: <error>`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmGpioState'
              example:
                code: 0
                msg: success
                data:
                  pwr: true
                  hdd: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: vm_setGpio
      tags:
      - VM
      summary: Update gpio
      description: |
        Presses the ATX power or reset button of the controlled host by pulsing the corresponding
        GPIO line. Requires an authenticated session (any role).

        The handler binds the body with `ShouldBind`, so `application/json` (what the web UI
        sends) and `application/x-www-form-urlencoded` are both accepted.

        * `type` — required; `power` (GPIO from the hardware profile, e.g.
          `/sys/class/gpio/gpio503/value`) or `reset` (`/sys/class/gpio/gpio505/value`). Any other
          value is rejected with `-2`.
        * `duration` — press time in **milliseconds**; optional. `0` or absent means **800 ms**.
          The handler writes `1`, sleeps for the duration and writes `0`, so the HTTP request
          blocks for the whole pulse (the official web UI uses 800 ms for a short power press and
          `seconds × 1000` for a long press).

        Error codes: `-1` `invalid arguments: <bind error>` (missing/zero `type` or a negative
        duration, which cannot be bound to `uint`), `-2` `invalid power event: <type>`,
        `-3` `operation failed: <error>` (sysfs write failed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmGpioRequest'
            example:
              type: power
              duration: 800
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hardware:
    get:
      operationId: vm_getHardware
      tags:
      - VM
      summary: Get hardware version
      description: |
        Returns the hardware revision of the device. Requires an authenticated session (any role).

        The version is read from `/etc/kvm/hw` (`alpha`, `beta`, `pcie`) and rendered as
        `Alpha`, `Beta` or `PCIE`; any other or missing content falls back to `Alpha`. The web UI
        uses this value to gate hardware-specific settings — HDMI capture/idle-timeout controls
        are only shown for `PCIE`, and the HDD LED is only reported on `Alpha`
        (see `GET /api/vm/gpio`).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmHardware'
              example:
                code: 0
                msg: success
                data:
                  version: PCIE
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hdmi:
    get:
      operationId: vm_getHdmiState
      tags:
      - VM
      summary: Get HDMI state
      description: |
        Returns the HDMI capture state. Requires an authenticated session (any role).
        HDMI capture is only available on **PCIE** hardware revisions.

        * `enabled` — capture is not disabled, i.e. the persistence file
          `/etc/kvm/hdmi_disable` does **not** exist.
        * `signal` — a live signal is detected on the HDMI input; always `false` while capture
          is disabled.
        * `idleTimeout` — minutes without viewers after which capture is stopped automatically;
          `0` = never. Read from `/etc/kvm/hdmi_idle_timeout` (default `0`, accepted range
          0–10080 = 7 days; an out-of-range stored value falls back to `0`).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmHdmiState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
                  signal: true
                  idleTimeout: 30
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hdmi/disable:
    post:
      operationId: vm_disableHdmi
      tags:
      - VM
      summary: Disable hdmi
      description: |
        Disables HDMI capture. **Requires the admin role.** Only meaningful on **PCIE** hardware
        revisions.

        Creates the persistence file `/etc/kvm/hdmi_disable` (capture stays disabled across
        reboots) and stops the capture pipeline, which also releases the HDMI input. Has no
        request body and no error path (failures are logged only).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/hdmi/enable:
    post:
      operationId: vm_enableHdmi
      tags:
      - VM
      summary: Enable hdmi
      description: |
        Enables HDMI capture. **Requires the admin role.** Only meaningful on **PCIE** hardware
        revisions.

        Removes the persistence file `/etc/kvm/hdmi_disable` (so capture stays enabled across
        reboots) and starts the capture pipeline. Has no request body and no error path
        (failures are logged only). The web UI waits ~1 second before refreshing the state.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/hdmi/reset:
    post:
      operationId: vm_resetHdmi
      tags:
      - VM
      summary: Reset hdmi
      description: |
        Restarts the HDMI capture pipeline to recover from a stuck or black picture. Requires an
        authenticated session (any role). Only meaningful on **PCIE** hardware revisions.

        The handler removes the persistence file `/etc/kvm/hdmi_disable` (HDMI ends up
        **enabled**, even if it had been disabled), stops the capture, waits **1 second** and
        starts it again. The request blocks for that second and has no request body.

        There is no dedicated error path — failures are logged only and the endpoint answers
        success.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hdmi/timeout:
    post:
      operationId: vm_setHdmiTimeout
      tags:
      - VM
      summary: Set HDMI idle timeout
      description: |
        Sets the HDMI capture idle timeout. **Requires the admin role.** Only meaningful on
        **PCIE** hardware revisions. The handler binds with `ShouldBind` (`application/json` or
        `application/x-www-form-urlencoded`).

        `minutes` is **required** by validation (`gte=0,lte=10080`) and is persisted to
        `/etc/kvm/hdmi_idle_timeout`: capture is stopped after that many minutes without an
        active viewer/consumer; `0` disables the timeout (capture never stops by itself).
        The new value is applied immediately: a capture that had been stopped because of
        idleness is resumed, and the idle timer is re-armed.

        Error codes: `-1` `invalid arguments` — missing `minutes`, or a value outside
        **0–10080** (7 days). `SetHdmiIdleTimeout` itself ignores out-of-range values, but that
        bound is the same 0–10080, so every accepted value is applied.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmHdmiTimeoutRequest'
            example:
              minutes: 30
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/hostname:
    get:
      operationId: vm_getHostname
      tags:
      - VM
      summary: Get Hostname
      description: |
        Returns the device hostname from `/etc/hostname` (trailing newline removed). Requires an
        authenticated session (any role). The hostname is the base of the mDNS name
        (`<hostname>.local`, see `GET /api/vm/info`).

        Error codes: `-1` `read Hostname failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmHostname'
              example:
                code: 0
                msg: success
                data:
                  hostname: nanokvm
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: vm_setHostname
      tags:
      - VM
      summary: Set Hostname
      description: |
        Changes the device hostname. **Requires the admin role.** The handler binds with
        `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        `hostname` is required but is **not** validated or sanitized by the server. The handler
        writes it to `/boot/hostname` and `/etc/hostname`, replaces the previous hostname in
        `/etc/hosts` (only when the value actually changed) and finally applies it with
        `hostname -F /etc/hostname`. The mDNS advertisement follows on the next avahi
        (re)start.

        Error codes: `-1` `invalid arguments` (missing `hostname`), `-1` `read Hostname failed`
        / `read Hosts failed`, `-2` `failed to write data` (`/etc/hosts` or `/boot/hostname`),
        `-3` `failed to write data` (`/etc/hostname`).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmHostnameRequest'
            example:
              hostname: my-nanokvm
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/info:
    get:
      operationId: vm_getInfo
      tags:
      - VM
      summary: Get device information
      description: |
        Returns the device identity: network addresses, mDNS name, firmware image version,
        server application version and device key. Requires an authenticated session (any role).

        Field semantics (all values are read from the device on every call; missing files yield
        empty strings / an empty list instead of an error):

        * `ips` — one entry per **up** network interface that is classified `Wired` (name starts
          with `eth`/`en`) or `Wireless` (name starts with `wlan`/`wl`) **and** whose first
          address is IPv4. Interfaces with another name (`lo`, `usb0`, …) or an IPv6 first address
          are omitted, so the array may be empty. `version` is always the string `IPv4`.
        * `mdns` — `<hostname>.local` (hostname read from `/etc/hostname`) when the avahi daemon
          is running (its pid file `/run/avahi-daemon/pid` exists), otherwise `""`.
        * `image` — OS image version. `/boot/ver` contains an image file name which is mapped
          through a fixed table of known releases (`2024-06-23-20-59-2d2bfb.img` → `v1.0.0` …
          `2026-01-05-1_4_1.img` → `v1.4.2`); an unknown file name is returned verbatim, an
          unreadable file yields `""`.
        * `application` — server application version (`/kvmapp/version`), or `1.0.0` when that
          file cannot be read.
        * `deviceKey` — content of `/device_key` (empty when absent).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmInfo'
              example:
                code: 0
                msg: success
                data:
                  ips:
                  - name: eth0
                    addr: 192.168.1.42
                    version: IPv4
                    type: Wired
                  mdns: nanokvm.local
                  image: v1.4.2
                  application: 2.5.1
                  deviceKey: 0a1b2c3d4e5f
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/input-region:
    get:
      operationId: vm_getInputRegion
      tags:
      - VM
      summary: Get input region
      description: |
        Returns the device-level **mouse calibration** ("control region") configuration stored in
        `/etc/kvm/input-region.json`. Requires an authenticated session (any role).

        The setting compensates for non-16:9 host resolutions by mapping absolute-mouse
        coordinates onto a region of the video frame. `mode` is one of:

        * `off` — calibration disabled (also the value returned when the configuration file does
          not exist; in that case every other field is zero/empty).
        * `auto` — the region is derived from the host's original resolution chosen in
          `selectedResolution` (a `WIDTHxHEIGHT` key from `resolutions`).
        * `manual` — the region is taken from the selected entry of `regions`
          (`selectedRegion`, keyed `WIDTHxHEIGHT` of the region size), or from the legacy
          single-region fields `frameWidth`/`frameHeight`/`left`/`top`/`width`/`height`.

        Response fields: `mode`, the legacy manual fields (`frameWidth`, `frameHeight`, `left`,
        `top`, `width`, `height`), `resolutions[]` and `regions[]` (both omitted when empty),
        `selectedResolution` and `selectedRegion` (both `""` when nothing is selected — only one
        of them may be set at a time).

        A configuration file that fails validation (bad geometry, duplicate entries, both
        selections set, unknown selection) is treated as absent: the response is `{"mode":"off"}`
        and the file is not rewritten.

        Error codes: `-1` `failed to read input region` (unreadable file).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmInputRegion'
              example:
                code: 0
                msg: success
                data:
                  mode: auto
                  frameWidth: 1280
                  frameHeight: 720
                  left: 0
                  top: 0
                  width: 640
                  height: 480
                  resolutions:
                  - width: 1920
                    height: 1080
                  selectedResolution: 1920x1080
                  regions:
                  - frameWidth: 1280
                    frameHeight: 720
                    left: 0
                    top: 0
                    width: 640
                    height: 480
                  selectedRegion: 640x480
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: vm_setInputRegion
      tags:
      - VM
      summary: Set input region
      description: |
        Updates the mouse calibration configuration. Requires an authenticated session (any
        role). This handler binds with `ShouldBindJSON`, so the body **must** be
        `application/json`; a form body or invalid JSON fails with `-1`.

        `mode` is required. All numeric fields are optional and are merged into the stored
        configuration:

        * `mode: "off"` / `"auto"` — stores the mode (plus any provided configuration fields).
        * `mode: "manual"` **with all six of** `frameWidth`, `frameHeight`, `left`, `top`,
          `width`, `height` — stores a complete legacy manual region. The previously stored
          `resolutions`, `selectedResolution`, `regions` and `selectedRegion` are kept unless
          they are supplied again; `regions: []` clears the legacy manual fields.
        * `mode: "manual"` **without** any of those six fields — a pure configuration update of
          `resolutions` / `selectedResolution` / `regions` / `selectedRegion`.
        * any other mode — `-1` `invalid input region mode`.

        Validation (all failures answer `-1`): resolutions must be positive and unique; manual
        regions must be positive (`width`/`height` > 0, `left`/`top` ≥ 0) and fit inside the
        frame (`left ≤ frameWidth − width`, `top ≤ frameHeight − height`), without duplicates;
        `selectedResolution` must exist in `resolutions` (`invalid selected resolution`);
        `selectedRegion` must exist in `regions`; and only one of the two selections may be
        non-empty (`invalid selected resolution`). The file is written atomically (temp file +
        rename).

        Error codes: `-1` `invalid arguments` (bind/JSON failure), `invalid input region`,
        `invalid original resolutions`, `invalid manual regions`, `invalid selected resolution`,
        `invalid input region mode`; `-2` `failed to read input region` or
        `failed to save input region` / `failed to save input region mode` (I/O failure).

        The official web UI sends partial updates such as `{"mode":"auto"}`,
        `{"mode":"manual","resolutions":[…],"selectedResolution":"1920x1080","selectedRegion":""}`
        or `{"mode":"manual","regions":[…],"selectedRegion":"640x480","selectedResolution":""}`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmInputRegionRequest'
            examples:
              modeOnly:
                summary: Disable calibration
                value:
                  mode: 'off'
              selectedResolution:
                summary: Use the host's original resolution
                value:
                  mode: manual
                  resolutions:
                  - width: 1920
                    height: 1080
                  selectedResolution: 1920x1080
                  selectedRegion: ''
              legacyManualRegion:
                summary: Complete legacy manual region
                value:
                  mode: manual
                  frameWidth: 1280
                  frameHeight: 720
                  left: 0
                  top: 0
                  width: 640
                  height: 480
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/input-resolution:
    get:
      operationId: vm_getInputResolution
      tags:
      - VM
      summary: Get input resolution
      description: |
        Returns the resolution of the video signal currently captured from the host, read from
        `/kvmapp/kvm/width` and `/kvmapp/kvm/height`. Requires an authenticated session (any
        role). Used by the web UI to display/calibrate the original resolution.

        Error codes: `-1` `failed to read input resolution` (either file missing, unreadable or
        not a positive integer).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmInputResolution'
              example:
                code: 0
                msg: success
                data:
                  width: 1920
                  height: 1080
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mdns:
    get:
      operationId: vm_getMdnsState
      tags:
      - VM
      summary: Get mDNS state
      description: |
        Reports whether the avahi mDNS daemon is running. **Requires the admin role.** `enabled`
        is true when `/run/avahi-daemon/pid` exists and can be read.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmMdnsState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/mdns/disable:
    post:
      operationId: vm_disableMdns
      tags:
      - VM
      summary: Disable mDNS
      description: |
        Disables mDNS. **Requires the admin role.**

        Kills the avahi daemon (`kill -9 <pid>`) and removes its pid file and init script, so the
        daemon does not start again on reboot. If it is not running the call is a no-op success.
        Has no request body.

        Error codes: `-1` `failed to disable mdns` (the kill could not be executed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/mdns/enable:
    post:
      operationId: vm_enableMdns
      tags:
      - VM
      summary: Enable mDNS
      description: |
        Enables mDNS (`<hostname>.local` discovery). **Requires the admin role.**

        Restores the init script from its backup (`cp -f /kvmapp/system/init.d/S50avahi-daemon
        /etc/init.d/S50avahi-daemon`) and starts the daemon. If it is already running the call is
        a no-op success. Has no request body.

        Error codes: `-1` `failed to enable mdns` (the daemon could not be started).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/memory/limit:
    get:
      operationId: vm_getMemoryLimit
      tags:
      - VM
      summary: Get memory limit
      description: |
        Returns the Go runtime soft memory limit (GOMEMLIMIT) configured for the server.
        **Requires the admin role.**

        * `enabled` — the limit file `/etc/kvm/GOMEMLIMIT` exists.
        * `limit` — the persisted limit in **MB**; `0` when disabled.

        Error codes: `-1` `failed to get memory limit` (file exists but cannot be read/parsed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmMemoryLimit'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
                  limit: 75
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: vm_setMemoryLimit
      tags:
      - VM
      summary: Set memory limit
      description: |
        Enables or disables the Go soft memory limit and persists it to
        `/etc/kvm/GOMEMLIMIT`. **Requires the admin role.** The handler binds with
        `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        * `enabled: true` — applies `debug.SetMemoryLimit(limit MB)`. Values below **50 MB** are
          clamped to 50 MB in the running process (the file keeps the requested value). The
          official web UI uses **75** MB.
        * `enabled: false` — deletes the file and sets the runtime limit back to 1 GiB.

        The limit is applied immediately to the Go runtime (aggressive garbage collection when
        exceeded) and restored on the next boot. It does not limit other processes; restarting
        Tailscale is recommended by the UI after a change.

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `failed to set memory limit`
        (cannot write/remove the file).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmMemoryLimitRequest'
            example:
              enabled: true
              limit: 75
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/mouse-jiggler:
    get:
      operationId: vm_getMouseJiggler
      tags:
      - VM
      summary: Get mouse jiggler
      description: |
        Returns the mouse-jiggler state. **Requires the admin role.**

        * `enabled` — the jiggler is active; device-side the configuration file
          `/etc/kvm/mouse-jiggler` exists and was readable (it is read once at startup, so a file
          created externally only takes effect after a restart).
        * `mode` — `relative` (default) or `absolute`; the stored file contains exactly this
          string. The jiggler moves the mouse every 15 seconds to keep the controlled host
          awake; `relative` sends a small relative move, `absolute` a 100 ms absolute-pointer
          wiggle (with the UI's mode selector offering `disable`/`relative`/`absolute`).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmMouseJiggler'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
                  mode: relative
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/mouse-jiggler/:
    post:
      operationId: vm_setMouseJiggler
      tags:
      - VM
      summary: Set mouse jiggler
      description: |
        Enables, changes the mode of, or disables the mouse jiggler. **Requires the admin
        role.** The handler binds with `ShouldBind` (`application/json` or
        `application/x-www-form-urlencoded`).

        Note the **trailing slash** in the registered route: this is the path exactly as the
        server registers it. `POST /api/vm/mouse-jiggler` (what the official web UI sends) is
        answered with a `307` redirect to `/api/vm/mouse-jiggler/` by Gin's trailing-slash
        redirect, which clients follow with the same method and body.

        * `enabled: true` — writes `mode` to `/etc/kvm/mouse-jiggler` and starts the 15 s move
          loop. `mode` is `relative` (default if empty) or `absolute`; any other string behaves
          like `relative` (the move routine only distinguishes `absolute`).
        * `enabled: false` (or absent) — removes the file, stops the loop and resets the mode to
          `relative`.

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `operation failed`
        (the configuration file could not be written/removed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmMouseJigglerRequest'
            examples:
              enable:
                summary: Enable in relative mode
                value:
                  enabled: true
                  mode: relative
              disable:
                summary: Disable
                value:
                  enabled: false
                  mode: relative
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/oled:
    get:
      operationId: vm_getOLED
      tags:
      - VM
      summary: Get OLED configuration
      description: |
        Returns the OLED display configuration. **Requires the admin role.**

        * `exist` — `/etc/kvm/oled_exist` exists, i.e. the device has an OLED display. When it
          does not exist the response is `{"exist": false, "sleep": 0}`.
        * `sleep` — seconds of inactivity after which the OLED is switched off; `0` = never.
          Read from `/etc/kvm/oled_sleep` (missing or unreadable → `0`). The web UI offers
          0, 15, 30, 60, 180, 300, 600, 1800 and 3600 seconds.

        Error codes: `-1` `failed to parse OLED config` (the sleep file is not an integer).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmOledState'
              example:
                code: 0
                msg: success
                data:
                  exist: true
                  sleep: 60
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: vm_setOLED
      tags:
      - VM
      summary: Set OLED configuration
      description: |
        Sets the OLED screen-off timeout. **Requires the admin role.** The handler binds with
        `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        `sleep` is written verbatim to `/etc/kvm/oled_sleep` as seconds (`0` = never turn off);
        there is no validation and no range check on the server — the firmware reads the value.
        Setting the timeout only makes sense when the hardware has an OLED
        (`GET /api/vm/oled` → `exist`).

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `failed to write data`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmOledRequest'
            example:
              sleep: 60
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/screen:
    post:
      operationId: vm_setScreen
      tags:
      - VM
      summary: Update screen
      description: |
        Changes one video-capture parameter. Requires an authenticated session (any role). The
        body is bound with `ShouldBind` (`application/json` or
        `application/x-www-form-urlencoded`).

        `type` selects the parameter and `value` carries the new setting:

        | `type` | `value` | Effect |
        |--------|---------|--------|
        | `type` | `0` = MJPEG, any non-zero = H.264 | writes `/kvmapp/kvm/type` (`mjpeg` / `h264`) |
        | `resolution` | target **height**: `1080`, `720`, `600`, `480`, `0` = auto (native signal resolution) | writes `/kvmapp/kvm/res`; the running server maps the height to 1920×1080 / 1280×720 / 800×600 / 640×480 |
        | `fps` | frame rate | writes `/kvmapp/kvm/fps`; the in-memory value is clamped to 10–60 (default 30) |
        | `quality` | MJPEG quality `100`/`80`/`60`/`50`, or — for H.264 — the bitrate in kbps when the value is `> 100` (`5000`/`3000`/`2000`/`1000`) | writes `/kvmapp/kvm/qlty` |
        | `gop` | `1`–`100` (values outside the range fall back to 30) | applied to the running H.264 encoder only, **not persisted** |

        Only `type`, `resolution`, `fps` and `quality` are persisted (the `/kvmapp/kvm/*` files
        are read back by the video pipeline at startup); `gop` lives in memory. The server's own
        in-memory model validates persisted values on first use: an unknown resolution falls back
        to 1920×1080, an unknown quality to 80 %, an unknown bitrate to 3000 kbps.

        Error codes: `-1` `invalid arguments` (missing `type` or unbindable body), `-2`
        `update screen failed` (unknown `type` key — `writeScreen` only knows `type`, `fps`,
        `quality`, `resolution` — or a failed file write).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmScreenRequest'
            examples:
              resolution:
                summary: Switch to 1280×720
                value:
                  type: resolution
                  value: 720
              quality:
                summary: MJPEG quality 80 %
                value:
                  type: quality
                  value: 80
              gop:
                summary: H.264 GOP 50 (not persisted)
                value:
                  type: gop
                  value: 50
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/script:
    get:
      operationId: vm_getScripts
      tags:
      - VM
      summary: Get script
      description: |
        Lists the scripts available on the device. **Requires the admin role.**

        `files` contains the base names of all regular files directly inside `/etc/kvm/scripts`
        whose name ends in `.sh` or `.py` (case-insensitive); the path is walked recursively but
        the returned entries are bare file names, without directories or ordering guarantees.

        Error codes: `-1` `get scripts failed` (the directory does not exist or cannot be read).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmScriptList'
              example:
                code: 0
                msg: success
                data:
                  files: *id010
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: vm_deleteScript
      tags:
      - VM
      summary: Delete script
      description: |
        Deletes a script from `/etc/kvm/scripts`. **Requires the admin role.**

        The request carries a JSON body (the official web UI uses an axios `DELETE` with
        `{"name":"…"}`); the handler binds with `ShouldBind`, so
        `application/x-www-form-urlencoded` works too. Unlike upload, `name` is not restricted to
        `.sh`/`.py` — the file name is joined to the script directory and removed.

        Error codes: `-1` `invalid arguments` (missing `name`), `-3` `delete failed` (file not
        found or not removable).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmScriptDeleteRequest'
            example:
              name: backup.sh
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/script/run:
    post:
      operationId: vm_runScript
      tags:
      - VM
      summary: Run script
      description: |
        Executes a script from `/etc/kvm/scripts`. **Requires the admin role.** The handler binds
        with `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        * `name` — required; the file name inside `/etc/kvm/scripts`. It is not validated against
          the `.sh`/`.py` suffix here. If the (lower-cased) name ends in `.py` the command becomes
          `python <path>`, otherwise the file itself is executed. Both run through
          `sh -c` **without a timeout**: a foreground script can block the request for as long as
          it runs.
        * `type` — required; `foreground` waits for the process and returns its combined
          stdout+stderr in `log`. Any other value (the UI also sends `background`) starts the
          process detached in a goroutine and returns immediately with `log: ""`.

        Error codes: `-1` `invalid arguments` (missing `name`/`type` or unbindable body), `-2`
        `run script failed` (the script could not be started, only reported for foreground runs).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmScriptRunRequest'
            examples:
              foreground:
                summary: Wait for the script and return its output
                value:
                  name: backup.sh
                  type: foreground
              background:
                summary: Start and return immediately
                value:
                  name: monitor.py
                  type: background
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmScriptRun'
              example:
                code: 0
                msg: success
                data:
                  log: |
                    backup finished
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/script/upload:
    post:
      operationId: vm_uploadScript
      tags:
      - VM
      summary: Upload script
      description: |
        Uploads a script into `/etc/kvm/scripts`. **Requires the admin role.**

        Multipart form upload with a single file part named **`file`** (the official web UI
        builds a `FormData` with `formData.append('file', file)` and an `accept=".sh,.py"`
        input). The file must end in `.sh` or `.py` (case-insensitive); only the base name of the
        submitted file name is used. The directory is created (mode `0755`) when missing, the
        file is stored with the owner-execute bit added (`0100`) and an existing file with the
        same name is overwritten.

        **Example** (upload a shell script):

        ```sh
        curl -b 'nano-kvm-token=<jwt>' -F 'file=@backup.sh' http://nanokvm.local/api/vm/script/upload
        ```

        Error codes: `-1` `bad request` (no `file` part in the request), `-2` `invalid arguments`
        (name does not end in `.sh`/`.py`), `-2` `save failed` (write error).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Script file to store; the file name must end in `.sh` or `.py`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmUploadedFile'
              example:
                code: 0
                msg: success
                data:
                  file: backup.sh
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/ssh:
    get:
      operationId: vm_getSshState
      tags:
      - VM
      summary: Get SSH state
      description: |
        Reports whether the SSH server of the NanoKVM device is enabled. **Requires the admin
        role.**

        SSH counts as enabled unless the stop flag `/etc/kvm/ssh_stop` exists (an unreadable flag
        file also reports `false`).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmSshState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/ssh/disable:
    post:
      operationId: vm_disableSsh
      tags:
      - VM
      summary: Disable SSH
      description: |
        Disables the SSH server permanently. **Requires the admin role.**

        Runs `/etc/init.d/S50sshd permanent_off`, which stops sshd and leaves the stop flag in
        place so it stays disabled after a reboot. Has no request body.

        Error codes: `-1` `operation failed` (the init script could not be executed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/ssh/enable:
    post:
      operationId: vm_enableSsh
      tags:
      - VM
      summary: Enable SSH
      description: |
        Enables the SSH server permanently. **Requires the admin role.**

        Runs `/etc/init.d/S50sshd permanent_on`, which starts sshd and removes the stop flag so
        it keeps running after a reboot. Has no request body.

        Error codes: `-1` `operation failed` (the init script could not be executed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/swap:
    get:
      operationId: vm_getSwap
      tags:
      - VM
      summary: Get swap file size
      description: |
        Returns the size of the swap file in **MB**. **Requires the admin role.**

        `size` is the size of `/swapfile` (file size ÷ 1024²); `0` means no swap file. Errors
        are not reported — an unreadable/missing file simply yields `0`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/VmSwap'
              example:
                code: 0
                msg: success
                data:
                  size: 256
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: vm_setSwap
      tags:
      - VM
      summary: Set swap file size
      description: |
        Enables, resizes or disables the swap file. **Requires the admin role.** The handler
        binds with `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        `size` is the desired swap file size in **MB**; the official web UI offers 0 (disable),
        64, 128, 256 and 512 MB, and there is no upper bound in the handler. If the requested
        size equals the current size the call is a no-op success.

        * `size: 0` — `swapoff -a`, removes `/swapfile` and strips the swap line from
          `/etc/inittab` (swap stays off after reboot).
        * `size > 0` — (re)creates the file with
          `fallocate -l <size>M /swapfile`, `chmod 600`, `mkswap`, `swapon` (300 ms between the
          commands, so the request takes at least ~1.2 s and blocks), then appends
          `si11::sysinit:/sbin/swapon /swapfile` to `/etc/inittab` so it is re-enabled at boot.
          A previously existing swap file is disabled first.

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `disable swap failed`,
        `-3` `disable inittab failed`, `-4` `enable swap failed`, `-5` `enable inittab failed`.

        Note: the web UI warns that enabling swap can shorten the SD card's life.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmSwapRequest'
            example:
              size: 256
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/system/reboot:
    post:
      operationId: vm_reboot
      tags:
      - VM
      summary: Reboot system
      description: |
        Reboots the NanoKVM device (the KVM, not the controlled host). **Requires the admin
        role.** Has no request body.

        The handler runs the `reboot` command synchronously and then answers success; the device
        goes down within a few seconds, so the HTTP response usually still arrives but the
        connection is then lost and the device is unreachable until it has booted again
        (the web UI expects the reconnect to fail for a while).

        Error codes: `-1` `operation failed` (the command could not be executed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/terminal:
    get:
      operationId: vm_terminal
      tags:
      - VM
      summary: Web terminal
      description: |
        WebSocket endpoint that attaches an interactive shell to the device — the web terminal
        the official UI opens at `/#terminal`. **Requires the admin role**; a `user` session is
        refused with `403` before the upgrade.

        ### Handshake

        * The `nano-kvm-token` cookie must authenticate the request (`401` otherwise); browsers
          send it automatically for same-origin WebSocket connections.
        * `Origin`, when present, must match the request host — host and effective port (the
          scheme defaults to `http`/`443` ports unless `X-Forwarded-Proto` is set). A mismatching
          Origin is rejected by the upgrader with a **plain-text** HTTP `403` (`Forbidden`, not
          the JSON envelope); a missing `Origin` header is accepted (command-line clients).
        * A plain GET without the WebSocket upgrade headers is answered `400 Bad Request` by the
          upgrader.
        * No WebSocket subprotocol is negotiated.

        ### Session

        After the upgrade the server starts `/bin/sh -l` (login shell) with working directory
        `/root` on a fresh pseudo-terminal. There is no in-band authentication and no login
        prompt — the server sends no banner of its own — and the connection is already the admin
        session; the shell runs as root.

        ### Wire protocol

        Server → client: **binary** frames only. Every chunk read from the PTY (prompt, command
        output, `picocom` serial traffic) is sent as raw bytes, at most **1024 bytes** per frame.
        The server sets a **10 s write deadline** per frame; if the socket stalls longer, the
        output pump stops. No text frames and no control messages are ever sent.

        Client → server:

        | Frame | Payload | Meaning |
        |-------|---------|---------|
        | **text** | raw bytes (UTF-8) | written verbatim to the shell's stdin — keystrokes, pasted text and the `\r` that executes a command. This is the "raw shell bytes" direction. |
        | **binary** | JSON `{"rows":<uint16>,"cols":<uint16>}` | resize the PTY (terminal dimensions) |

        Resize example (sent by the UI right after `open` and on every window resize):

        ```
        client: {"rows":24,"cols":80}          (binary frame)
        ```

        Any binary frame whose payload is not valid JSON for `{rows, cols}` (for example a
        non-JSON blob, negative numbers or values above 65535) is **silently ignored** — there is
        no acknowledgement and no error frame. Text frames have no size limit.

        The official web UI wraps the socket with `xterm.js` `AttachAddon` (keystrokes → text
        frames) and sends the resize as a `Blob` of JSON (binary frame). It starts the remote
        serial console of the controlled host by writing `picocom …\r` as a text frame.

        ### Keep-alive and close

        * There is **no heartbeat**: the server sets no read deadline and never sends ping
          frames, so idle connections stay open.
        * When the client closes the socket the read loop ends, the PTY is closed and the shell
          process is killed.
        * When the shell exits on its own (exit/logout), the PTY read fails and the server stops
          producing output but sends **no close frame**; the socket is torn down when the client
          disconnects or the next inbound frame detects the closed PTY.
        * **Session revocation**: when the session is revoked, the JWT expires, the user is
          disabled or the account changes, the server sends a WebSocket close frame with code
          **`4401`** and reason `session expired or revoked` (sessions are re-validated every
          5 s) and closes the connection. Clients should treat `4401` as "logged out".
      security:
      - cookieAuth: []
      responses:
        '101':
          description: |
            WebSocket upgrade accepted (Switching Protocols). The full wire protocol is described
            in the operation description.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/vm/tls:
    post:
      operationId: vm_setTls
      tags:
      - VM
      summary: Enable/disable TLS
      description: |
        Switches the web server between HTTP and HTTPS. **Requires the admin role.** The handler
        binds with `ShouldBind` (`application/json` or `application/x-www-form-urlencoded`).

        * `enabled: true` — generates a self-signed certificate (RSA 2048, CN `localhost`,
          SANs `localhost`, `127.0.0.1`, `::1`, valid 10 years) at `/etc/kvm/server.crt` /
          `/etc/kvm/server.key` and writes `proto: https` plus the certificate paths into
          `/etc/kvm/server.yaml`.
        * `enabled: false` — writes `proto: http` (the certificate files are left in place).

        After the response has been sent the server restarts itself
        (`/etc/init.d/S95nanokvm restart`), so the connection may be dropped and the device is
        then reachable only on the new scheme (the certificate is self-signed and will trigger a
        browser warning).

        Error codes: `-1` `invalid arguments: <error>` (unbindable body), `-2`
        `operation failed` (certificate or configuration write failed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmTlsRequest'
            example:
              enabled: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
