  /api/picoclaw/runtime/uninstall:
    post:
      tags:
      - PicoClaw
      summary: Uninstall the PicoClaw runtime
      operationId: pico_uninstallRuntime
      description: |
        Removes the PicoClaw runtime and its configuration. **Synchronous** (can block for a few
        seconds while the runtime is stopped).

        **Requires the admin role.**

        Steps:

        1. Rejected with `RUNTIME_START_FAILED` "cannot uninstall while installation is in
           progress" when an install is running (re-checked after taking the lifecycle lock).
        2. If PicoClaw currently owns device control, the mode is switched to `off` (active
           control operations are canceled and HID state is released); a failed switch yields
           `RUNTIME_START_FAILED` "control release failed before uninstall: ..." with the runtime
           status in `data.status`.
        3. If the gateway process is running (or the status says ready/stopping), it is stopped
           first: live gateway WebSockets are closed with **code 4007** ("PicoClaw runtime
           stopped").
        4. The desired-running intent is persisted as `false` (`updated_by: "web"`).
        5. The config directory (`~/.picoclaw`), the binary `/usr/bin/picoclaw` and the cache
           `/root/.picoclaw-cache` are deleted, and the status is reset to `not_installed`.

        A failure while stopping is not fatal: the response still reports success with
        `output: "picoclaw uninstalled successfully (stop failed before uninstall: ...)"`.

        Errors: `RUNTIME_UNAVAILABLE` "failed to check picoclaw runtime status" (HTTP 200,
        `PicoError` body) when the process check fails; `RUNTIME_START_FAILED` for the control
        release and in-progress-install cases.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Runtime uninstalled. `data.installed` is `false`, `data.status.status` is
            `not_installed`. Application failures also use HTTP 200 with a `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeInstallResult'
              example:
                code: 0
                msg: success
