# NanoKVM API — generated from server source; see /workspace/experiments/nanokvm-openapi
openapi: 3.0.3
info:
  title: NanoKVM API
  version: 2.5.1
  description: |
    HTTP API of **NanoKVM**, the open-source IP-KVM device by Sipeed (LicheeRV Nano, RISC-V).
    The API exposes everything the web UI can do: video streaming (MJPEG / H.264 / WebRTC),
    keyboard/mouse injection, HDMI and USB emulation, storage image mounting, Wi-Fi and
    network configuration, application updates, Tailscale, MCP and the PicoClaw local AI agent.

    ### Base URL
    The device serves this API on port 80 (HTTP) or 443 (HTTPS) at its IP address or mDNS
    hostname (for example `http://nanokvm.local`). When TLS is enabled, plain-HTTP requests are
    answered with a `307` redirect to HTTPS.

    ### Authentication
    Sessions use a signed JWT stored in the `nano-kvm-token` cookie (HttpOnly, `SameSite=Strict`,
    `Secure` when HTTPS). Obtain it with `POST /api/auth/login`; the API answers with the standard
    response envelope and sets the cookie. Multi-user firmware (2.5.0+) has two roles:
    - `admin` — full access, including terminal, scripts, storage, network, updates, MCP, PicoClaw and Tailscale;
    - `user` — video, keyboard, mouse, paste, wake-on-LAN and power controls only.

    Endpoints marked "Requires the admin role" answer `403` for `user` sessions and `401` when not
    logged in. Login attempts are throttled: every failed attempt is delayed by 2–3 seconds, and
    after `security.loginMaxFailures` consecutive failures (default 5) the client is locked out for
    `security.loginLockoutDuration` seconds — a lockout is only enforced when that duration is
    configured above 0 (the shipped default of 0 keeps lockout disabled). If the server is
    configured with `authentication: disable`, all endpoints are reachable without a cookie.

    **Password transport** — password fields in login/user-management requests are encrypted with
    AES-256 in the browser before being sent. The ciphertext uses the shared key
    `nanokvm-sipeed-2024` (CryptoJS `AES.encrypt`, OpenSSL-compatible `Salted__` format), then
    URL-encodes the result. Send the URL-encoded ciphertext, not the plaintext password.
    Server-side password policy: 8–72 bytes; usernames: 1–32 chars of `[A-Za-z0-9._-]`.

    ### Response envelope
    Nearly every endpoint answers **HTTP 200** with:

    ```json
    { "code": 0, "msg": "success", "data": { } }
    ```

    `code` is `0` on success; on failure it is negative (for example `-1` invalid parameters,
    `-2` invalid username or password) and `msg` describes the error. Transport-level failures are
    `401` (JSON string `"unauthorized"`) and `403` (JSON string `"forbidden"`).

    ### Internal (loopback) API
    Sub-routes under `/api/internal/*` and `/api/picoclaw/*` marked with the `X-NanoKVM-Internal-Token`
    header are reserved for NanoKVM-internal automation (the local PicoClaw agent). They are only
    accepted from loopback (`127.0.0.1`/`::1`); the token is generated on first boot and stored in
    `/etc/kvm/.picoclaw_internal_token`.

    ### Other resources
    - `GET /` and any other unmatched path serves the web UI (static SPA files).
    - Version-specific behavior is noted per endpoint; this document describes application version
      **2.5.1**.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  contact:
    name: Sipeed NanoKVM
    url: https://github.com/sipeed/NanoKVM
servers:
- url: http://{host}
  description: Plain HTTP (default; port 80 unless configured otherwise)
  variables:
    host:
      default: nanokvm.local
      description: Device IP address or mDNS hostname (default hostname `nanokvm` → `nanokvm.local`)
- url: https://{host}
  description: HTTPS (port 443) — used when TLS is enabled in device settings
  variables:
    host:
      default: nanokvm.local
      description: Device IP address or mDNS hostname
tags:
- name: Authentication
  description: Login/logout, session cookie, account and multi-user management.
- name: Application
  description: Firmware/application version, online and offline updates, update server configuration.
- name: Download
  description: Remote image downloader (download a disk image URL onto the device, with progress).
- name: Extensions
  description: Optional third-party extensions — currently Tailscale.
- name: VM
  description: Device and virtual-machine management — info, GPIO, screen, HDMI, SSH, swap, scripts, OLED, TLS, hostname, autostart, reboot, web terminal.
- name: Stream
  description: Video streams — MJPEG, WebRTC H.264 signaling, direct H.264 WebSocket.
- name: WebSocket
  description: Real-time control channel (keyboard/mouse/HID events and status notifications).
- name: Storage
  description: Virtual storage images (ISO/IMG) and CD-ROM mounting.
- name: Network
  description: Wi-Fi onboarding and management, DNS configuration, Wake-on-LAN.
- name: HID
  description: Human-interface-device control — keyboard shortcuts, paste, HID mode, keyboard LEDs.
- name: AI Control
  description: Exclusive control mode arbitration between human (manual), MCP and PicoClaw automation.
- name: MCP
  description: Model Context Protocol server management and the MCP endpoint itself.
- name: PicoClaw
  description: PicoClaw — the on-device AI agent — model/agent configuration, sessions, runtime lifecycle and gateway.
- name: PicoClaw Internal
  description: Loopback-only endpoints used by the PicoClaw runtime to capture the screen and inject input.
x-tagGroups:
- name: Core
  tags:
  - Authentication
  - Application
  - Download
  - Extensions
- name: Device
  tags:
  - VM
  - Stream
  - WebSocket
  - Storage
  - Network
- name: Control & AI
  tags:
  - HID
  - AI Control
  - MCP
  - PicoClaw
  - PicoClaw Internal
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nano-kvm-token
      description: |
        Session JWT issued by `POST /api/auth/login` as an HttpOnly cookie. Every request carrying
        the cookie is authenticated; revoking or disabling the user invalidates open sessions,
        including WebSocket connections (closed with code `4401`).
    internalToken:
      type: apiKey
      in: header
      name: X-NanoKVM-Internal-Token
      description: |
        Loopback-only shared secret for NanoKVM-internal automation, stored on the device in
        `/etc/kvm/.picoclaw_internal_token`. Requests are additionally rejected unless they
        originate from `127.0.0.1`/`::1`.
    mcpApiKey:
      type: http
      scheme: bearer
      description: |
        MCP API key (`nag_mcp_...`), generated and read through `/api/mcp/config`. Sent as
        `Authorization: Bearer <apiKey>`.
  schemas:
    Envelope:
      type: object
      description: |
        Standard response envelope shared by all endpoints: `code` is `0` on success and
        negative on failure. The status text key is `msg` on most endpoints; the AI-control
        router (`/api/ai/control/*`) and PicoClaw endpoints use `message` for failures.
      required:
      - code
      properties:
        code:
          type: integer
          description: 'Status code: 0 on success, negative on failure.'
          example: 0
        msg:
          type: string
          description: Human-readable status message (key `message` on AI-control/PicoClaw failures).
          example: success
        data:
          description: |
            Response payload; omitted or `null` for endpoints that return no data. Its type is
            defined per endpoint (object, array or plain string).
    AuthLoginRequest:
      type: object
      description: Login credentials; the password is transported encrypted.
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: Account name.
          example: admin
        password:
          type: string
          description: |
            URL-encoded AES-256 ciphertext of the password, encrypted in the browser with the
            shared key `nanokvm-sipeed-2024` (CryptoJS `AES.encrypt(...).toString()` followed by
            `encodeURIComponent`).
          example: U2FsdGVkX1%2B7l0K3z%2FqXeVw1sTn2mQy8kQ%3D%3D
    AuthAccount:
      type: object
      description: Identity of the authenticated user.
      properties:
        username:
          type: string
          example: admin
        role:
          type: string
          enum:
          - admin
          - user
          description: |
            `admin` has full access; `user` may use video, keyboard, mouse, paste, wake-on-LAN and
            power controls only.
          example: admin
    AuthPasswordState:
      type: object
      description: Whether the user still has to change the password.
      properties:
        isUpdated:
          type: boolean
          description: |
            `true` when the password is up to date; `false` for the device owner account that still
            uses the default password and must change it before using the web UI.
          example: true
    AuthChangePasswordRequest:
      type: object
      description: Password change request; both fields are transported encrypted.
      required:
      - password
      properties:
        currentPassword:
          type: string
          description: |
            Current password as URL-encoded AES-256 ciphertext (shared key `nanokvm-sipeed-2024`).
            Verified before the change; empty or undecryptable values yield code `-3`.
          example: U2FsdGVkX1%2B7l0K3z%2FqXeVw1sTn2mQy8kQ%3D%3D
        password:
          type: string
          description: |
            New password as URL-encoded AES-256 ciphertext (shared key `nanokvm-sipeed-2024`); the
            decrypted plaintext must be 8–72 bytes. Required.
          example: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
    AuthCreateUserRequest:
      type: object
      required:
      - username
      - password
      - role
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$
          example: alice
        password:
          type: string
          description: |
            URL-encoded AES-256 ciphertext (shared key `nanokvm-sipeed-2024`); the decrypted
            plaintext must be 8–72 bytes.
          example: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
        role:
          type: string
          enum:
          - admin
          - user
          example: user
    AuthUpdateUserRequest:
      type: object
      description: |
        Partial patch of an account; at least one of `role` and `enabled` must be present
        (omitted fields keep their current value).
      properties:
        role:
          type: string
          enum:
          - admin
          - user
          description: New role.
          example: user
        enabled:
          type: boolean
          description: Whether the account may log in.
          example: true
    AuthResetUserPasswordRequest:
      type: object
      description: |
        New password for another user. `currentPassword` is accepted but ignored on this endpoint.
      required:
      - password
      properties:
        password:
          type: string
          description: |
            URL-encoded AES-256 ciphertext (shared key `nanokvm-sipeed-2024`); the decrypted
            plaintext must be 8–72 bytes.
          example: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
    AuthUser:
      type: object
      properties:
        username:
          type: string
          example: alice
        role:
          type: string
          enum:
          - admin
          - user
          example: user
        enabled:
          type: boolean
          description: Disabled accounts cannot log in; existing sessions stop being valid.
          example: true
        systemAccount:
          type: boolean
          description: |
            Present (and `true`) only for the device owner account, which must remain an enabled
            admin and whose password is mirrored to the Linux root password.
          example: true
    AuthUsers:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AuthUser'
    AppVersion:
      type: object
      properties:
        current:
          type: string
          description: Version of the running application (contents of `/kvmapp/version`).
          example: 2.5.1
        latest:
          type: string
          description: Newest version advertised by the configured update source.
          example: 2.5.1
    AppPreviewState:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the preview update channel is enabled.
          example: false
    AppPreviewRequest:
      type: object
      description: |
        The Go field has no `json` tag, so `enable` and `Enable` are both accepted
        (JSON binding is case-insensitive); the official web UI sends `enable`.
      properties:
        enable:
          type: boolean
          description: Desired state of the preview update channel.
          example: true
    AppUpdateServerConfig:
      type: object
      properties:
        enabled:
          type: boolean
          description: |
            Whether the custom update server is used. When `false`, the preview channel is used if
            preview updates are enabled, otherwise the stable channel
            `https://cdn.sipeed.com/nanokvm`.
          example: false
        url:
          type: string
          description: |
            Base URL of the update directory (the one containing `latest.json`). May embed
            credentials (`https://user:password@host/path`), which the device sends as an HTTP
            Basic `Authorization` header when fetching.
          example: https://cdn.sipeed.com/nanokvm
    AppUpdateServerRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: Required. Enable or disable the custom update server.
          example: true
        url:
          type: string
          description: |
            Optional. Absolute `http`/`https` URL of the update directory, max 2048 characters, no
            query and no fragment, may embed credentials. Empty resets it to
            `https://cdn.sipeed.com/nanokvm`. Required when `enabled` is `true`.
          example: https://mirror.example.com/nanokvm
    DlDownloadImageRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          description: Absolute `http`/`https` URL of the image to download onto the device.
          example: https://downloads.example.com/ubuntu-24.04.iso
        sha256sum:
          type: string
          description: |
            Optional hex-encoded SHA-256 of the image (64 hex characters). When present the image
            is verified while downloading and a mismatch sets the status to `checksum_failed`.
          example: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
    DlDownloadStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - idle
          - in_progress
          - success
          - failed
          - checksum_failed
          description: State of the image transfer.
          example: in_progress
        file:
          type: string
          description: |
            Source URL of a running remote download, uploaded filename of a running ISO upload, or
            empty when nothing is running.
          example: https://downloads.example.com/ubuntu-24.04.iso
        percentage:
          type: string
          description: |
            Progress as a formatted percentage (`42.13%`), refreshed every 2.5 s; empty while the
            total size is unknown.
          example: 42.13%
    DlImageEnabled:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the `/data` partition is writable and can store images.
          example: true
    TsStatus:
      type: object
      properties:
        state:
          type: string
          enum:
          - notInstall
          - notRunning
          - notLogin
          - stopped
          - running
          description: |
            Tailscale state: binaries missing, daemon not running, not authenticated, backend
            stopped, or running/connected.
          example: running
        name:
          type: string
          description: Tailscale host name of this device (empty unless running).
          example: nanokvm
        ip:
          type: string
          description: IPv4 address assigned by Tailscale (last IPv4 entry; empty unless running).
          example: 100.101.102.103
        account:
          type: string
          description: Name of the current tailnet (empty unless running).
          example: example.com
    TsLogin:
      type: object
      properties:
        url:
          type: string
          description: |
            Authentication URL to open in a browser. Empty when the node is already logged in and
            running.
          example: https://login.tailscale.com/a/1a2b3c4d5e6f
    Control_Mode:
      type: string
      enum:
      - 'off'
      - mcp
      - picoclaw
      description: |
        Exclusive owner of HID input:
        - `off` — no AI controller; only the web UI (manual input) writes HID.
        - `mcp` — an external MCP client may capture screenshots and inject HID input via `/api/mcp`.
        - `picoclaw` — the on-device PicoClaw agent owns control.
      example: mcp
    Control_Status:
      type: object
      description: |
        Control-mode status of the AI control manager (persisted mode file `/etc/kvm/ai-control.mode`,
        default `picoclaw` when the file is absent).
      required:
      - mode
      - transitioning
      properties:
        mode:
          $ref: '#/components/schemas/Control_Mode'
        transitioning:
          type: boolean
          description: |
            `true` while a mode switch is in progress; control operations that require the current
            mode (including all `/api/mcp` tool calls) are rejected or wait during that window.
          example: false
        last_error:
          type: string
          description: Last transition error, cleared after a successful switch. Omitted when empty.
          example: 'AI control mode conflict: current=off expected=mcp'
        changed_at:
          type: string
          format: date-time
          description: |
            When the mode last changed (or when the mode file was last observed to change; also set
            to the load time while the default is in effect). Omitted when unknown/zero.
          example: '2026-10-01T12:04:11.482913341+08:00'
    Control_SetModeRequest:
      type: object
      description: Target control mode. The body is bound with `ShouldBindJSON`, so only `application/json` is accepted.
      required:
      - mode
      properties:
        mode:
          $ref: '#/components/schemas/Control_Mode'
    Control_PicoRuntimeStatus:
      type: object
      description: |
        PicoClaw runtime status as embedded in the `mode: off` response of `ctrl_setMode`
        (mirrors the `runtime` payload of the PicoClaw endpoints). Only the stable fields are
        listed; optional fields are omitted when empty.
      required:
      - ready
      - installed
      - installing
      - model_configured
      - status
      - runtime_intent
      - control_mode
      - control
      - capabilities
      properties:
        ready:
          type: boolean
          description: Runtime (gateway) is running and usable.
        installed:
          type: boolean
          description: PicoClaw binary is installed.
        installing:
          type: boolean
          description: An installation is currently running.
        install_progress:
          type: integer
          description: Installation progress percentage. Omitted when not installing.
        install_stage:
          type: string
          description: Human-readable installation stage.
        install_path:
          type: string
          description: Path of the installed PicoClaw binary.
        agent_profile:
          type: string
          description: Active agent profile name.
        model_configured:
          type: boolean
          description: Whether a model/endpoint has been configured.
        model_name:
          type: string
          description: Configured model name.
        status:
          type: string
          description: Lifecycle status string, e.g. `ready`, `stopped`, `stopping`, `installing`, `unavailable`.
          example: ready
        config_error:
          type: string
          description: Configuration error reported by the runtime.
        last_error:
          type: string
          description: Last runtime error.
        checked_at:
          type: string
          format: date-time
          description: When the status was last refreshed.
        current_session:
          type: string
          description: Session id currently in control, if any.
        restoring:
          type: boolean
          description: A runtime restore is in progress.
        runtime_intent:
          type: object
          description: Desired runtime state (should the runtime be running) and how it was last changed.
          required:
          - desired_running
          properties:
            desired_running:
              type: boolean
            updated_at:
              type: string
            updated_by:
              type: string
              description: Origin of the intent, e.g. `control_release_chat_only`, `mcp_preempt`.
            last_started_at:
              type: string
            last_stopped_at:
              type: string
            last_error:
              type: string
        control_mode:
          type: string
          description: Control mode as seen by the PicoClaw service.
          example: 'off'
        transitioning:
          type: boolean
          description: Control mode is transitioning.
        control:
          type: object
          description: PicoClaw's own control view.
          required:
          - mode
          - transitioning
          - can_control
          properties:
            mode:
              type: string
            transitioning:
              type: boolean
            can_control:
              type: boolean
            last_error:
              type: string
            changed_at:
              type: string
              format: date-time
        capabilities:
          type: object
          description: Input capabilities currently granted to the PicoClaw runtime.
          required:
          - chat
          - read_only_tools
          - device_write
          properties:
            chat:
              type: boolean
            read_only_tools:
              type: boolean
            device_write:
              type: boolean
              description: Whether PicoClaw may write HID input (only in `picoclaw` mode).
    Control_ReleaseData:
      type: object
      description: |
        Success payload of `ctrl_setMode` when the requested mode is `off` (different shape from
        the plain `Control_Status` returned for `mcp`/`picoclaw`).
      required:
      - control
      - runtime
      - released
      - closed_sessions
      - cleanup_warning
      properties:
        control:
          $ref: '#/components/schemas/Control_Status'
        runtime:
          $ref: '#/components/schemas/Control_PicoRuntimeStatus'
        released:
          type: boolean
          description: Control was released; always `true` in this payload.
          example: true
        closed_sessions:
          type: integer
          description: |
            Number of PicoClaw gateway sessions closed by the release. Always `0` in this version —
            releasing control keeps the runtime alive for chat-only use, so no sessions are closed.
          example: 0
        cleanup_warning:
          type: string
          description: |
            Empty on a clean release. When the target mode was reached despite an error during
            cleanup/rollback, this carries the error text and the request still answers `code: 0`.
          example: ''
    Mcp_Config:
      type: object
      description: MCP service state as returned by `GET /api/mcp/config`, `POST /api/mcp/config` and `POST /api/mcp/key/regenerate`.
      required:
      - enabled
      - apiKey
      - controlMode
      - transitioning
      properties:
        enabled:
          type: boolean
          description: 'Derived value: `true` only when the AI control mode is `mcp` and no transition is running.'
          example: true
        apiKey:
          type: string
          description: |
            MCP API key (`nag_mcp_` + 32 random bytes, base64url without padding) used as
            `Authorization: Bearer <apiKey>` on `/api/mcp`. Empty until generated (first enable or
            key regeneration).
          example: nag_mcp_9Fh2s0K3vTQ7c1yqZbXa8rLdUeWm4JgNpVtRkCs
        controlMode:
          type: string
          description: Current AI control mode (`off`, `mcp` or `picoclaw`).
          example: mcp
        transitioning:
          type: boolean
          description: A control-mode transition is in progress.
          example: false
    Mcp_SetConfigRequest:
      type: object
      description: Enable or disable the MCP service (drives the AI control mode).
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: '`true` switches the control mode to `mcp`; `false` switches `mcp` → `off` and leaves other modes untouched.'
          example: true
    Mcp_EndpointError:
      type: object
      description: Error body emitted by the `/api/mcp` endpoint layers (not the standard HTTP API envelope).
      required:
      - error
      properties:
        error:
          type: string
          example: MCP service is disabled
    Mcp_JsonRpcRequest:
      type: object
      description: |
        JSON-RPC 2.0 request (or notification) sent to the MCP endpoint. The endpoint accepts a
        single object or an array of objects (batching only for protocol versions before
        `2025-06-18`).
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
          example: '2.0'
        id:
          description: Request id; omitted for notifications (no response is produced for them).
          oneOf:
          - type: string
          - type: integer
          example: 1
        method:
          type: string
          description: |
            MCP method name. Served: `initialize`, `ping`, `tools/list`, `tools/call`,
            `prompts/list`, `resources/list`, `resources/templates/list`, `logging/setLevel`
            (notifications: `notifications/initialized`, `notifications/cancelled`,
            `notifications/progress`, `notifications/roots/list_changed`). Other methods are
            answered with JSON-RPC error `-32601`.
          example: tools/call
        params:
          type: object
          description: |
            Method parameters, e.g. `{"name": "cube_screenshot", "arguments": {"quality": 60}}`
            for `tools/call`.
          nullable: true
    Mcp_JsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 response; exactly one of `result` or `error` is present.
      required:
      - jsonrpc
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: string
            nullable: true
          - type: integer
            nullable: true
          description: Id of the request being answered (absent when the input could not be parsed).
          example: 2
        result:
          type: object
          description: Method result (e.g. `Mcp_InitializeResult`, tools list or tool call result), absent on error.
          nullable: true
        error:
          type: object
          description: JSON-RPC error object, absent on success.
          required:
          - code
          - message
          properties:
            code:
              type: integer
              description: JSON-RPC error code, e.g. `-32601` method not found, `-32602` invalid params / unknown tool, `-32700` parse error.
            message:
              type: string
            data:
              type: object
              nullable: true
    Mcp_InitializeResult:
      type: object
      description: Result of the `initialize` request (written by the MCP Go SDK).
      required:
      - protocolVersion
      - capabilities
      - serverInfo
      properties:
        protocolVersion:
          type: string
          description: 'Negotiated protocol version: the client version when supported, otherwise `2025-11-25`.'
          example: '2025-03-26'
        capabilities:
          type: object
          description: 'Advertised capabilities of this server: `{"logging": {}, "tools": {"listChanged": true}}`.'
        serverInfo:
          type: object
          required:
          - name
          - version
          properties:
            name:
              type: string
              example: nanokvm-cube-remote-control
            version:
              type: string
              example: v1.0.0
        instructions:
          type: string
          description: Not set by this server.
    Mcp_Tool:
      type: object
      description: Tool descriptor as returned by `tools/list`.
      required:
      - name
      - description
      - inputSchema
      properties:
        name:
          type: string
          enum:
          - cube_type_text
          - cube_press_keys
          - cube_move_mouse
          - cube_click_mouse
          - cube_scroll_mouse
          - cube_screenshot
        description:
          type: string
          example: Type short text into the remote host
        inputSchema:
          type: object
          description: |
            JSON Schema of the tool arguments (see the tool catalog in the operation description).
            Unknown properties are rejected; required properties are enforced before the tool runs.
          example:
            type: object
            properties:
              text:
                type: string
                description: Text to type on the remote host
                maxLength: 1000
              delayMs:
                type: integer
                description: Delay between typed characters in milliseconds; defaults to 30 when omitted, and 0 disables the delay
                minimum: 0
                maximum: 1000
            required:
            - text
    Mcp_ToolCallResult:
      type: object
      description: Result object of a `tools/call` request.
      required:
      - content
      properties:
        content:
          type: array
          description: Unstructured result blocks. Text tools return one `text` block with the JSON result; `cube_screenshot` returns one `image` block.
          items:
            type: object
            required:
            - type
            properties:
              type:
                type: string
                enum:
                - text
                - image
              text:
                type: string
                description: Present for `text` blocks.
              data:
                type: string
                description: Base64-encoded payload for `image` blocks (JPEG).
              mimeType:
                type: string
                description: Media type of an `image` block (`image/jpeg`).
                example: image/jpeg
        structuredContent:
          type: object
          nullable: true
          description: |
            Structured result of the tool: `{"typed": <int>, "skipped": "<chars>", "skippedCount": <int>}`
            for `cube_type_text`, `{"ok": <bool>}` for the other tools except `cube_screenshot`,
            and `{"ok": <bool>, "retCode": <int>, "message": "<text>", "width": <int>, "height": <int>, "size": <int>}`
            for `cube_screenshot`.
          example:
            ok: true
        isError:
          type: boolean
          description: |
            `true` when the tool rejected the call or failed (validation error, control-mode
            conflict, busy/manual-input conflict, capture failure). The message is carried in
            `content[].text`. Absent (assumed `false`) on success.
          example: false
    Mcp_KeyboardKeyName:
      type: string
      description: |
        Keyboard key name using `KeyboardEvent.code` spellings. Modifiers:
        `ControlLeft`, `ShiftLeft`, `AltLeft`, `MetaLeft`, `ControlRight`, `ShiftRight`,
        `AltRight`, `MetaRight`. Non-modifier keys:
        `KeyA`–`KeyZ`, `Digit0`–`Digit9`, `Enter`, `Escape`, `Backspace`, `Tab`, `Space`, `Minus`,
        `Equal`, `BracketLeft`, `BracketRight`, `Backslash`, `IntlHash`, `Semicolon`, `Quote`,
        `Backquote`, `Comma`, `Period`, `Slash`, `CapsLock`, `F1`–`F12`, `PrintScreen`,
        `ScrollLock`, `Pause`, `Insert`, `Home`, `PageUp`, `Delete`, `End`, `PageDown`,
        `ArrowRight`, `ArrowLeft`, `ArrowDown`, `ArrowUp`, `NumLock`, `NumpadDivide`,
        `NumpadMultiply`, `NumpadSubtract`, `NumpadAdd`, `NumpadEnter`, `Numpad1`–`Numpad9`,
        `Numpad0`, `NumpadDecimal`, `IntlBackslash`, `ContextMenu`.
        Unknown names (e.g. `MediaPlayPause`) are rejected. At most 6 non-modifier keys may be
        combined; modifiers are collected into the HID modifier byte and exempt from that limit.
      example: ControlLeft
    PicoLocalError:
      type: object
      description: |
        Structured error body of the loopback-only `/api/picoclaw/*` endpoints. It does **not**
        use the shared envelope: `code` is a string constant, the human-readable text is in
        `message` (not `msg`), and it is returned with **HTTP 200**. Requests with a missing or
        invalid internal token are rejected earlier with HTTP `401` (`"unauthorized"`).
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
          - AI_LOCK_HELD
          - SCREENSHOT_FAILED
          - SCREENSHOT_NO_SIGNAL
          - INVALID_ACTION
          - RUNTIME_UNAVAILABLE
          - SESSION_ID_MISSING
          - SESSION_ID_INVALID
          - AI_MODE_CONFLICT
          - CONTROL_REQUIRED
          - CONTROL_OWNED_BY_MCP
          - CONTROL_TRANSITIONING
          example: INVALID_ACTION
        message:
          type: string
          description: Human-readable error message.
          example: unknown or invalid action
        session_id:
          type: string
          description: |
            Present when the error refers to a session — e.g. the owner of a held session lock,
            or the session whose gateway connection is missing.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        index:
          type: integer
          description: 0-based index of the failing action inside a batch.
          example: 2
    PicoLocalPoint:
      type: object
      description: Normalized point used by the `drag` action.
      required:
      - x
      - y
      properties:
        x:
          type: number
          description: X coordinate in `[0,1]` (fraction of the screen width).
          example: 0.2
        y:
          type: number
          description: Y coordinate in `[0,1]` (fraction of the screen height).
          example: 0.8
    PicoLocalAction:
      type: object
      description: |
        One HID action. Only `action` is required at the schema level; the fields required by
        each action name are enforced by the server and reported as `INVALID_ACTION`.
      required:
      - action
      properties:
        action:
          type: string
          description: |
            Action name, matched case-insensitively after trimming: `click`, `move`, `drag`,
            `scroll`, `type`, `hotkey` or `wait`. An empty or unknown name fails with "unknown
            or invalid action".
          example: click
        x:
          type: number
          description: |
            Normalized X coordinate in `[0,1]`. Required by `click` and `move`; optional for
            `scroll` (default 0.5).
          example: 0.5
        y:
          type: number
          description: |
            Normalized Y coordinate in `[0,1]`. Required by `click` and `move`; optional for
            `scroll` (default 0.5).
          example: 0.5
        from:
          allOf:
          - $ref: '#/components/schemas/PicoLocalPoint'
          description: Start point of a `drag` (both `x` and `y` required).
        to:
          allOf:
          - $ref: '#/components/schemas/PicoLocalPoint'
          description: End point of a `drag` (both `x` and `y` required).
        button:
          type: string
          description: |
            Mouse button for `click` and `drag`, case-insensitive: `left` (default when empty),
            `right`, `middle`, `back` or `forward`.
          example: left
        text:
          type: string
          description: Text to type for the `type` action; must be non-empty.
          example: notepad
        keys:
          type: array
          items:
            type: string
          description: |
            Key combination for the `hotkey` action: an array of key names, or a single
            comma-separated string (e.g. `"CTRL,ALT,Delete"`). KeyboardEvent-style names and
            aliases are accepted; modifiers are OR'ed into the report and up to 6 non-modifier
            keys are combined.
          example:
          - CTRL
          - ALT
          - Delete
        direction:
          type: string
          description: |
            Scroll direction for `scroll`, case-insensitive: empty or `up` scrolls up (wheel
            +1), `down` scrolls down (wheel -1); any other value is "invalid scroll direction".
          example: down
        amount:
          type: integer
          minimum: 0
          description: |
            Number of wheel ticks for `scroll`; `0` or absent means 1. Negative values fail
            with "scroll amount must be > 0".
          example: 3
        duration_ms:
          type: integer
          minimum: 0
          maximum: 30000
          description: Pause length of the `wait` action in milliseconds (0–30000; default 0).
          example: 500
    PicoLocalActionBatch:
      type: object
      description: Batch form of the actions request; executed in order within one call.
      required:
      - actions
      properties:
        actions:
          type: array
          items:
            $ref: '#/components/schemas/PicoLocalAction'
          minItems: 1
    PicoLocalActionResult:
      type: object
      description: Aggregated result of one actions request (all actions share it).
      required:
      - action
      - duration_ms
      - hid_writes
      properties:
        action:
          type: string
          description: |
            Executed action name, or `"batch"` when more than one action was executed.
          example: batch
        duration_ms:
          type: integer
          description: Wall-clock duration of the whole request in milliseconds.
          example: 742
        hid_writes:
          type: integer
          description: |
            Number of USB HID reports written (keyboard reports on HID0, absolute mouse reports
            on HID2).
          example: 12
        executed_actions:
          type: integer
          description: Number of actions executed; omitted when it is 0.
          example: 5
    PicoLocalScreenshotMeta:
      type: object
      description: Metadata returned by `GET /api/picoclaw/screenshot?format=base64`.
      required:
      - source_width
      - source_height
      - capture_width
      - capture_height
      - format
      properties:
        image_base64:
          type: string
          description: Standard base64 encoding of the captured JPEG (only for `format=base64`).
        source_width:
          type: integer
          description: Configured screen (stream) width at capture time; 0 when unset.
          example: 1280
        source_height:
          type: integer
          description: Configured screen (stream) height at capture time; 0 when unset.
          example: 720
        capture_width:
          type: integer
          description: Width requested from the capture pipeline (after `width`/`height` overrides).
          example: 960
        capture_height:
          type: integer
          description: Height requested from the capture pipeline (after `width`/`height` overrides).
          example: 540
        format:
          type: string
          description: Encoding of the payload.
          example: jpeg
    PicoLocalRuntimeSession:
      type: object
      description: PicoClaw session-lock state.
      required:
      - current_session
      - checked_at
      properties:
        current_session:
          type: string
          description: |
            Session id that currently owns the PicoClaw session lock, or an empty string when no
            session owns it (never `null`). The lock expires after 30 minutes without activity.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        checked_at:
          type: string
          format: date-time
          description: Server time when the lock state was read (RFC 3339 with nanosecond precision).
          example: '2026-10-01T13:34:12.123456789+08:00'
    PicoLocalLoadImageRequest:
      type: object
      description: Body of the internal load-image endpoint.
      required:
      - path
      properties:
        path:
          type: string
          description: |
            Path of the image the agent must load. Sent to the agent verbatim (only trimmed and
            required to be non-empty); the server does not read or validate the file.
          example: /tmp/picoclaw_media/upload-1.png
        prompt:
          type: string
          description: |
            Task the agent must continue with after loading the image. Whitespace-only or absent
            defaults to `Describe the image briefly.`
          example: What error message is shown in the dialog?
        filename:
          type: string
          description: Accepted for forward compatibility but ignored by the server.
          example: upload-1.png
    PicoLocalLoadImageResult:
      type: object
      description: Result of a delivered load-image instruction.
      required:
      - accepted
      - session_id
      - message_id
      - path
      - user_prompt
      - instructed_at
      properties:
        accepted:
          type: boolean
          example: true
        session_id:
          type: string
          description: Gateway session that received the instruction.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        message_id:
          type: string
          description: UUID of the `message.send` frame written to the agent gateway WebSocket.
          example: 3b0c8f4e-1d2a-4c6b-8e9f-0a1b2c3d4e5f
        path:
          type: string
          description: Trimmed path as embedded in the instruction.
          example: /tmp/picoclaw_media/upload-1.png
        user_prompt:
          type: string
          description: Prompt after normalization (default applied).
          example: What error message is shown in the dialog?
        instructed_at:
          type: string
          format: date-time
          example: '2026-10-01T13:34:12.123456789+08:00'
    PicoLocalJsonRpcRequest:
      type: object
      description: JSON-RPC 2.0 request accepted by the internal MCP endpoint.
      required:
      - jsonrpc
      - method
      properties:
        jsonrpc:
          type: string
          description: Protocol version; must be `2.0`.
          example: '2.0'
        id:
          type: integer
          nullable: true
          description: |
            Request id, echoed back in the response; any JSON value (numbers are typical). `null`
            or absent echoes as `null`.
          example: 1
        method:
          type: string
          description: |
            One of `initialize`, `ping`, `tools/list`, `tools/call`; anything else answers
            `-32601` "method not found".
          example: tools/call
        params:
          type: object
          nullable: true
          description: |
            Method parameters. For `tools/call`: `{"name": "<tool>", "arguments": {...}}`.
          example:
            name: kvm_screenshot
            arguments:
              width: 960
              quality: 60
    PicoLocalJsonRpcResponse:
      type: object
      description: JSON-RPC 2.0 response of the internal MCP endpoint.
      required:
      - jsonrpc
      - id
      properties:
        jsonrpc:
          type: string
          description: Always `2.0`.
          example: '2.0'
        id:
          type: integer
          nullable: true
          description: Echo of the request `id` (`null` when the request had none).
          example: 1
        result:
          type: object
          nullable: true
          description: |
            Method result, present on success. For `tools/call` it matches
            `PicoLocalMcpToolCallResult`; for `tools/list` it is
            `{"tools": [PicoLocalMcpTool, ...]}`; `initialize` and `ping` return the objects
            described on the operation.
        error:
          allOf:
          - $ref: '#/components/schemas/PicoLocalJsonRpcError'
          description: JSON-RPC error, present instead of `result` when the RPC itself failed.
    PicoLocalJsonRpcError:
      type: object
      description: JSON-RPC error object of the internal MCP endpoint.
      required:
      - code
      - message
      properties:
        code:
          type: integer
          description: |
            `-32700` parse error (HTTP 400), `-32600` invalid request (jsonrpc not `2.0`),
            `-32601` method not found, `-32602` invalid params / unknown tool, `-32003` PicoClaw
            control mode conflict.
          example: -32003
        message:
          type: string
          example: PicoClaw control mode is not active
        data:
          type: object
          nullable: true
          description: |
            Extra data; for `-32003` it is `{"reason": <CODE>, "control_mode": <mode>,
            "transitioning": <bool>}`.
          example: &id007
            reason: CONTROL_OWNED_BY_MCP
            control_mode: mcp
            transitioning: false
    PicoLocalMcpTool:
      type: object
      description: Tool definition returned by `tools/list`.
      required:
      - name
      - description
      - inputSchema
      properties:
        name:
          type: string
          example: kvm_screenshot
        description:
          type: string
          example: Capture the current HDMI frame from the downstream remote host as a base64-encoded JPEG image.
        inputSchema:
          type: object
          description: JSON Schema of the tool arguments.
          example:
            type: object
            properties:
              width:
                type: integer
                description: 'Target width in pixels (optional, default: 960)'
              height:
                type: integer
                description: Target height in pixels (optional)
              quality:
                type: integer
                description: 'JPEG quality 1-100 (optional, default: 60)'
    PicoLocalMcpContentBlock:
      type: object
      description: One content block of an MCP tool result.
      required:
      - type
      properties:
        type:
          type: string
          description: '`text` or `image`.'
          example: image
        text:
          type: string
          description: Text of a `text` block.
          example: screenshot captured
        data:
          type: string
          description: Base64 JPEG payload of an `image` block.
        mimeType:
          type: string
          description: MIME type of an `image` block.
          example: image/jpeg
    PicoLocalMcpToolCallResult:
      type: object
      description: |
        `result` of a `tools/call`. Tool-level failures are reported as a normal result with
        `isError: true` and one text block; a JSON-RPC `error` is used instead only when the
        call cannot be dispatched (invalid params, unknown tool, control-mode conflict).
      required:
      - content
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PicoLocalMcpContentBlock'
        isError:
          type: boolean
          description: Present and `true` when the tool failed; the message is in the text block.
          example: true
        meta:
          type: object
          description: Only for `kvm_screenshot`.
          properties:
            source_width:
              type: integer
              example: 1280
            source_height:
              type: integer
              example: 720
            capture_width:
              type: integer
              example: 960
            capture_height:
              type: integer
              example: 540
    PicoError:
      type: object
      description: |
        Structured error body used by the `/api/picoclaw` frontend routes. It does **not** use
        the shared envelope: `code` is a string constant (not an integer) and the human-readable
        text is in `message` (not `msg`). It is normally returned with **HTTP 200**; missing
        sessions use **HTTP 404** and pre-upgrade gateway rejections use **HTTP 409**.
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
          enum:
          - AI_LOCK_HELD
          - SCREENSHOT_FAILED
          - SCREENSHOT_NO_SIGNAL
          - HID_WRITE_FAILED
          - INVALID_ACTION
          - RUNTIME_UNAVAILABLE
          - RUNTIME_START_FAILED
          - SESSION_ID_MISSING
          - SESSION_ID_INVALID
          - AI_MODE_CONFLICT
          - CONTROL_REQUIRED
          - CONTROL_OWNED_BY_MCP
          - CONTROL_TRANSITIONING
          example: RUNTIME_UNAVAILABLE
        message:
          type: string
          description: Human-readable error message.
          example: session not found
        data:
          type: object
          nullable: true
          description: |
            Optional extra payload. Runtime/control failures carry `{"status": <runtime
            status>}`; runtime start/stop failures may also carry `{"command": "...", "output":
            "...", "status": ...}`.
        session_id:
          type: string
          description: |
            Present when the error refers to another session — for example the owner of a held
            session lock.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        index:
          type: integer
          description: Present for per-item failures inside a batch.
      example:
        code: RUNTIME_UNAVAILABLE
        message: session not found
    PicoModelConfigRequest:
      type: object
      description: |
        Model configuration of the PicoClaw runtime. All three fields are required; the handler
        binds JSON only (`Content-Type: application/json`).
      required:
      - model
      - api_base
      - api_key
      properties:
        model:
          type: string
          description: |
            `provider/model` identifier. The provider segment must be one of the providers known
            to this integration (openai, anthropic, deepseek, gemini, ollama, openrouter, qwen,
            ... — see the route description for the full list). The stored `model_name` is the
            segment after the last `/`.
          example: openai/gpt-5.4
        api_base:
          type: string
          format: uri
          description: Base URL of the provider API (written to `model_list[].api_base`).
          example: https://api.example.com/v1
        api_key:
          type: string
          description: |
            API key. It is stored only in `~/.picoclaw/.security.yml`
            (`model_list.<model_name>.api_keys`) and removed from `config.json`.
          example: sk-proj-example-key
      example:
        model: openai/gpt-5.4
        api_base: https://api.example.com/v1
        api_key: sk-proj-example-key
    PicoModelConfigResult:
      type: object
      required:
      - model_name
      - status
      properties:
        model_name:
          type: string
          description: Model name that was written to `agents.defaults.model_name`.
          example: gpt-5.4
        status:
          $ref: '#/components/schemas/PicoRuntimeStatus'
    PicoAgentProfileRequest:
      type: object
      description: Agent profile selection (JSON body only).
      required:
      - profile
      properties:
        profile:
          type: string
          enum:
          - default
          - kvm
          description: |
            `default` copies `AGENT.md` (persona `pico`, general assistant); `kvm` copies
            `AGENT_KVM.md` (persona `pico-kvm`, NanoKVM device operator).
          example: kvm
      example:
        profile: kvm
    PicoAgentProfileResult:
      type: object
      required:
      - profile
      - status
      properties:
        profile:
          type: string
          enum:
          - default
          - kvm
          description: The profile that was applied.
          example: kvm
        status:
          $ref: '#/components/schemas/PicoRuntimeStatus'
    PicoSessionMessage:
      type: object
      description: Stored chat message. Only `user` and `assistant` messages with non-empty content are returned.
      required:
      - role
      - content
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          example: user
        content:
          type: string
          example: Take a screenshot of the remote screen.
    PicoSessionListItem:
      type: object
      required:
      - id
      - title
      - preview
      - message_count
      - created
      - updated
      properties:
        id:
          type: string
          description: Session id (gateway `session_id`, normally a UUID; `sk_v1_...` for opaque store keys).
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        title:
          type: string
          description: Stored summary, else the first user message, truncated to 60 runes.
          example: Power on the server and open the BIOS
        preview:
          type: string
          description: First user message truncated to 60 runes, or `(empty)`.
          example: Power on the server and open the BIOS
        message_count:
          type: integer
          description: Number of user/assistant messages with non-empty content.
          example: 12
        created:
          type: string
          format: date-time
          description: RFC 3339 creation time (meta sidecar, else transcript file mtime).
          example: '2026-09-28T09:12:44Z'
        updated:
          type: string
          format: date-time
          description: RFC 3339 last-update time.
          example: '2026-09-28T09:31:07Z'
    PicoSessionDetail:
      type: object
      required:
      - id
      - messages
      - created
      - updated
      properties:
        id:
          type: string
          description: Session id as requested.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PicoSessionMessage'
        summary:
          type: string
          description: Stored summary (omitted when empty).
          example: Powered on the host and opened the BIOS menu.
        created:
          type: string
          format: date-time
          example: '2026-09-28T09:12:44Z'
        updated:
          type: string
          format: date-time
          example: '2026-09-28T09:31:07Z'
    PicoSessionDeleteResult:
      type: object
      required:
      - id
      - deleted
      properties:
        id:
          type: string
          description: Session id that was deleted.
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        deleted:
          type: boolean
          description: Always `true` on success.
          example: true
    PicoRuntimeSessionReleaseResult:
      type: object
      required:
      - released
      - current_session
      properties:
        released:
          type: boolean
          description: Always `true` once the request carried a session id header.
          example: true
        current_session:
          type: string
          description: Session id that currently owns the PicoClaw session lock (`""` when nobody does).
          example: ''
    PicoRuntimeIntentStatus:
      type: object
      description: Persisted desired-running intent of the PicoClaw runtime (`/etc/kvm/picoclaw-runtime.json`).
      required:
      - desired_running
      properties:
        desired_running:
          type: boolean
          description: Whether the runtime should be running (restored after boot / control-mode changes).
          example: true
        updated_at:
          type: string
          format: date-time
          description: RFC 3339 (UTC) time of the last intent update.
          example: '2026-10-01T05:30:25Z'
        updated_by:
          type: string
          description: |
            Origin of the last change: `web` (start/stop/uninstall from the UI), `model_config`
            (restart during a model save), `mcp_preempt`, `restore` or `system`.
          example: web
        last_started_at:
          type: string
          format: date-time
          example: '2026-10-01T05:30:25Z'
        last_stopped_at:
          type: string
          format: date-time
        last_error:
          type: string
          description: Last error recorded while applying the intent.
          example: ''
    PicoControlStatus:
      type: object
      description: Device-control arbitration state for PicoClaw.
      required:
      - mode
      - transitioning
      - can_control
      properties:
        mode:
          type: string
          enum:
          - 'off'
          - mcp
          - picoclaw
          description: Current owner of device control.
          example: picoclaw
        transitioning:
          type: boolean
          description: A mode switch is in progress.
          example: false
        can_control:
          type: boolean
          description: True when `mode == "picoclaw"` and no transition is running.
          example: true
        last_error:
          type: string
          description: Last control-mode error (omitted when empty).
        changed_at:
          type: string
          format: date-time
          example: '2026-10-01T05:29:58Z'
    PicoRuntimeCapabilities:
      type: object
      description: What the PicoClaw session may currently do.
      required:
      - chat
      - read_only_tools
      - device_write
      properties:
        chat:
          type: boolean
          description: Runtime usable (ready/installed/model configured, not installing) and mode not `mcp`/transitioning.
          example: true
        read_only_tools:
          type: boolean
          description: Same condition as `chat`.
          example: true
        device_write:
          type: boolean
          description: True only while PicoClaw owns device control and no transition is running.
          example: true
    PicoRuntimeStatus:
      type: object
      description: Consolidated PicoClaw runtime status returned by `GET /api/picoclaw/runtime/status` and embedded in other responses.
      required:
      - ready
      - installed
      - installing
      - model_configured
      - status
      - runtime_intent
      - control_mode
      - control
      - capabilities
      properties:
        ready:
          type: boolean
          description: Runtime process running and the gateway WebSocket answering.
          example: true
        installed:
          type: boolean
          description: '`/usr/bin/picoclaw` exists.'
          example: true
        installing:
          type: boolean
          description: An installation is in progress.
          example: false
        install_progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Installation progress in percent (omitted when 0).
          example: 100
        install_stage:
          type: string
          description: |
            Installation stage — `preparing`, `downloading`, `verifying`, `extracting`,
            `installing`, `installed`, or a failure stage `install_failed` / `install_timeout`.
          example: installed
        install_path:
          type: string
          description: Installation path of the binary (always `/usr/bin/picoclaw` in practice).
          example: /usr/bin/picoclaw
        agent_profile:
          type: string
          enum:
          - default
          - kvm
          description: |
            Agent profile read back from the workspace `AGENT.md` (`name: pico` → `default`,
            otherwise `kvm`).
          example: kvm
        model_configured:
          type: boolean
          description: A model from `model_list` is selected in `agents.defaults.model_name`, has an `api_base` and has API keys.
          example: true
        model_name:
          type: string
          description: Configured model name (target model name when not yet fully configured).
          example: gpt-5.4
        status:
          type: string
          description: |
            Lifecycle status — `checking`, `not_installed`, `installing`, `installed`,
            `model_not_configured`, `config_error`, `unavailable`, `stopped`, `starting`,
            `stopping`, `restoring`, `ready`, `blocked_by_mcp`, `install_failed`,
            `install_timeout` or `error`.
          example: ready
        config_error:
          type: string
          description: Configuration error text (gateway URL/token, config parse). Omitted when empty.
        last_error:
          type: string
          description: Last lifecycle error. Omitted when empty.
        checked_at:
          type: string
          format: date-time
          description: Time of the last runtime probe (omitted before the first probe).
          example: '2026-10-01T05:30:25Z'
        current_session:
          type: string
          description: Session id currently owning the PicoClaw session lock (`""` when free).
          example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
        restoring:
          type: boolean
          description: True while the runtime is being restored from the persisted intent.
          example: false
        runtime_intent:
          $ref: '#/components/schemas/PicoRuntimeIntentStatus'
        control_mode:
          type: string
          enum:
          - 'off'
          - mcp
          - picoclaw
          description: Flat copy of `control.mode`.
          example: picoclaw
        transitioning:
          type: boolean
          description: A control-mode switch is running (omitted when false).
          example: false
        control:
          $ref: '#/components/schemas/PicoControlStatus'
        capabilities:
          $ref: '#/components/schemas/PicoRuntimeCapabilities'
    PicoRuntimeStartResult:
      type: object
      description: Result of `POST /api/picoclaw/runtime/start` and `POST /api/picoclaw/runtime/stop`.
      required:
      - started
      properties:
        started:
          type: boolean
          description: '`true` after a successful start, `false` after a successful stop.'
          example: true
        command:
          type: string
          description: Shell command that was executed (`<init.d>/S96picoclaw start`). Empty for stop and for start-when-already-ready.
          example: /kvmapp/system/init.d/S96picoclaw start
        output:
          type: string
          description: Combined stdout/stderr of the command. Omitted when empty.
          example: PicoClaw gateway started
        status:
          $ref: '#/components/schemas/PicoRuntimeStatus'
    PicoRuntimeInstallResult:
      type: object
      description: Result of `POST /api/picoclaw/runtime/install` and `POST /api/picoclaw/runtime/uninstall`.
      required:
      - installed
      properties:
        installed:
          type: boolean
          description: |
            For install: only `true` when the binary was already present and no install is
            running. For uninstall: always `false`.
          example: false
        binary:
          type: string
          description: Install path of the binary.
          example: /usr/bin/picoclaw
        download:
          type: string
          format: uri
          description: Download URL of the release tarball.
          example: https://cdn.sipeed.com/nanokvm/resources/picoclaw/v0.2.8/picoclaw_Linux_riscv64.tar.gz
        output:
          type: string
          description: |
            Human-readable note, e.g. "picoclaw installation started", "picoclaw is already
            installed", "picoclaw installation is already in progress", "picoclaw uninstalled
            successfully". Omitted when empty.
          example: picoclaw installation started
        status:
          $ref: '#/components/schemas/PicoRuntimeStatus'
    StorageImageList:
      type: object
      description: Disk images found under `/data` (absolute paths, `.iso`/`.img`, case-insensitive).
      required:
      - files
      properties:
        files:
          type: array
          description: Absolute path of every image file. Empty when no image is present.
          items:
            type: string
          example: &id008
          - /data/ubuntu-24.04.2-live-server-amd64.iso
          - /data/images/win11.img
    StorageMountImageRequest:
      type: object
      description: |
        Mount or unmount request. Either field may be omitted: an absent/empty `file` unmounts
        (the raw `/data` partition is attached to the host as a writable disk).
      properties:
        file:
          type: string
          description: |
            Absolute path of the image to mount (as returned by `GET /api/storage/image`).
            Empty string or absent field = unmount.
          example: /data/ubuntu-24.04.2-live-server-amd64.iso
        cdrom:
          type: boolean
          default: false
          description: |
            Present the medium as a CD/DVD-ROM (LUN `cdrom` flag = 1). Only honoured when `file`
            is non-empty; forced to `false` when unmounting.
          example: true
    StorageMountedImage:
      type: object
      description: Image currently attached to the virtual mass-storage LUN.
      required:
      - file
      properties:
        file:
          type: string
          description: |
            Absolute path of the mounted image. Empty string when no image is mounted (the LUN
            serves the raw `/data` partition, or the device is in `hid-only` mode).
          example: /data/ubuntu-24.04.2-live-server-amd64.iso
    StorageCdromFlag:
      type: object
      description: State of the mass-storage LUN `cdrom` attribute.
      required:
      - cdrom
      properties:
        cdrom:
          type: integer
          format: int64
          enum:
          - 0
          - 1
          description: '`1` when the mounted medium is presented as a CD/DVD-ROM, otherwise `0`.'
          example: 0
    StorageDeleteImageRequest:
      type: object
      required:
      - file
      properties:
        file:
          type: string
          description: |
            Path of the image to delete. Must start with `/data` and end with `.iso` or `.img`
            (checked case-insensitively), otherwise the request is rejected with `-2`.
          example: /data/old-backup.img
    NetWifiConnectRequest:
      type: object
      description: Wi-Fi credentials (used by both the onboarding and the authenticated endpoint).
      required:
      - ssid
      - password
      properties:
        ssid:
          type: string
          description: SSID of the network to join. Only "non-empty" is validated.
          example: HomeNet
        password:
          type: string
          description: WPA passphrase. Only "non-empty" is validated.
          example: my-wifi-password
    NetWifiStatus:
      type: object
      description: Wi-Fi state of the device.
      required:
      - supported
      - apMode
      - connected
      - ssid
      properties:
        supported:
          type: boolean
          description: Wi-Fi hardware detected (`/etc/kvm/wifi_exist` exists).
          example: true
        apMode:
          type: boolean
          description: |
            The device currently runs as an access point (`/tmp/wifiap` exists). Only in this state
            do `POST /api/network/wifi` and `POST /api/network/wifi/verify` work.
          example: false
        connected:
          type: boolean
          description: The Wi-Fi client is connected (`/kvmapp/kvm/wifi_state` contains `1`).
          example: true
        ssid:
          type: string
          description: |
            SSID of the joined network (`/etc/kvm/wifi.ssid`), or the literal `Wi-Fi` when connected
            but that file is empty. Empty string when not connected or not supported.
          example: HomeNet
    NetWolRequest:
      type: object
      required:
      - mac
      properties:
        mac:
          type: string
          description: |
            Target MAC address: 12 hex digits, optionally separated by `:`, `-` or `.`
            (case-insensitive). Normalized to `AA:BB:CC:DD:EE:FF`.
          example: AA:BB:CC:DD:EE:FF
    NetWolMacRequest:
      type: object
      required:
      - mac
      properties:
        mac:
          type: string
          description: MAC address to remove from the history (same accepted spellings as above).
          example: AA:BB:CC:DD:EE:FF
    NetWolMacNameRequest:
      type: object
      required:
      - mac
      - name
      properties:
        mac:
          type: string
          description: MAC address of an **existing** history entry (normalized before lookup).
          example: AA:BB:CC:DD:EE:FF
        name:
          type: string
          description: |
            Display name. Whitespace runs are collapsed to single spaces; a name that becomes empty
            is rejected with `-1`.
          example: Office PC
    NetWolMacList:
      type: object
      description: Wake-on-LAN history.
      required:
      - macs
      properties:
        macs:
          type: array
          description: |
            One string per stored entry: `AA:BB:CC:DD:EE:FF` or `AA:BB:CC:DD:EE:FF <name>`.
          items:
            type: string
          example: &id006
          - AA:BB:CC:DD:EE:FF Office PC
          - 11:22:33:44:55:66
    NetDnsConfig:
      type: object
      description: DNS configuration and current network details.
      required:
      - mode
      - servers
      - effective
      - dhcp
      - info
      properties:
        mode:
          type: string
          enum:
          - manual
          - dhcp
          description: Configured DNS mode.
          example: manual
        servers:
          type: array
          description: |
            Manual DNS servers (`/etc/kvm/network/dns.servers`, falling back to the boot resolv
            files). Normalized and deduplicated.
          items:
            type: string
          example: &id002
          - 1.1.1.1
          - 8.8.8.8
        effective:
          type: array
          description: Nameservers currently in `/etc/resolv.conf` (what the device uses).
          items:
            type: string
          example: &id003
          - 1.1.1.1
        dhcp:
          type: array
          description: Nameservers learned from DHCP (may be empty).
          items:
            type: string
          example: &id004 []
        info:
          $ref: '#/components/schemas/NetDnsInfo'
    NetDnsInfo:
      type: object
      description: Network details of the default IPv4 interface.
      required:
      - interface
      - type
      - address
      - subnetMask
      - gateway
      - searchDomains
      properties:
        interface:
          type: string
          description: Interface name of the default IPv4 route, e.g. `eth0` or `wlan0`. Empty when unknown.
          example: eth0
        type:
          type: string
          enum:
          - Wired
          - Wireless
          - ''
          description: |
            `Wired` for names starting with `eth`/`en`, `Wireless` for `wlan`/`wl`, empty string for
            other interfaces.
          example: Wired
        address:
          type: string
          description: IPv4 address with prefix length, e.g. `192.168.1.42/24`. Empty when unknown.
          example: 192.168.1.42/24
        subnetMask:
          type: string
          description: Dotted IPv4 netmask. Empty when unknown.
          example: 255.255.255.0
        gateway:
          type: string
          description: Default IPv4 gateway. Empty when there is no default route.
          example: 192.168.1.1
        searchDomains:
          type: array
          description: Search domains from the DHCP resolv configuration (may be empty).
          items:
            type: string
          example: &id005
          - lan
    NetDnsSetRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - manual
          - dhcp
          description: |
            `manual` writes the given server list and renders it into the resolv files; `dhcp`
            switches to DHCP-provided servers (which must currently be known).
          example: manual
        servers:
          type: array
          description: |
            DNS servers for `manual` mode. At most 6 entries after normalization; each entry may
            contain a trailing `#` comment; duplicates are removed; IPv4 and IPv6 are accepted and
            stored in canonical form.
          maxItems: 6
          items:
            type: string
          example:
          - 1.1.1.1
          - 8.8.8.8
    HidPasteRequest:
      type: object
      required:
      - content
      properties:
        content:
          type: string
          maxLength: 833
          description: |
            Text to type on the controlled host. Counted in Unicode code points; more than 833
            runes is rejected with `-2 content too long`. Characters without a mapping are skipped.
          example: |
            echo hello
        langue:
          type: string
          default: en
          description: |
            Keyboard layout used to translate characters into HID reports: `de` (German), `fr`
            (French), anything else (including `en` and `ru`) uses the built-in US layout.
          example: en
    HidShortcutList:
      type: object
      required:
      - shortcuts
      properties:
        shortcuts:
          type: array
          description: User-defined shortcuts (the built-in ones live in the frontend).
          items:
            $ref: '#/components/schemas/HidShortcut'
          example: &id001
          - id: 3f1c2b8e-1f4a-4c2e-9d5a-8b7c6d5e4f3a
            keys:
            - code: ControlLeft
              label: Ctrl
            - code: AltLeft
              label: Alt
            - code: Delete
              label: ⌫
    HidShortcut:
      type: object
      required:
      - id
      - keys
      properties:
        id:
          type: string
          format: uuid
          description: Server-generated identifier, used for deletion.
          example: 3f1c2b8e-1f4a-4c2e-9d5a-8b7c6d5e4f3a
        keys:
          type: array
          description: Keys of the shortcut, in press order.
          items:
            $ref: '#/components/schemas/HidShortcutKey'
    HidShortcutKey:
      type: object
      required:
      - code
      - label
      properties:
        code:
          type: string
          description: |
            Key identifier, a `KeyboardEvent.code` name handled by the web UI (the server stores it
            verbatim).
          example: ControlLeft
        label:
          type: string
          description: Display label shown in the UI.
          example: Ctrl
    HidAddShortcutRequest:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          description: Keys of the new shortcut, in press order. Only presence is validated.
          items:
            $ref: '#/components/schemas/HidShortcutKey'
          example:
          - code: MetaLeft
            label: Win
          - code: Tab
            label: Tab
    HidDeleteShortcutRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Id of the shortcut to delete (unknown ids fail with `-2`).
          example: 3f1c2b8e-1f4a-4c2e-9d5a-8b7c6d5e4f3a
    HidLeaderKey:
      type: object
      required:
      - key
      properties:
        key:
          type: string
          description: |
            Leader key (`KeyboardEvent.code` name), or the empty string when the feature is not
            configured.
          example: MetaRight
    HidSetLeaderKeyRequest:
      type: object
      properties:
        key:
          type: string
          default: ''
          description: |
            New leader key. Any non-empty string is stored verbatim; an empty or absent value
            deletes the stored key and disables the feature.
          example: MetaRight
    HidMode:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - normal
          - hid-only
          description: |
            `normal` — full USB gadget (keyboard, mouse, virtual disk, virtual network);
            `hid-only` — only the HID interfaces (no virtual disk/network, image mounting disabled).
          example: normal
    HidSetModeRequest:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - normal
          - hid-only
          description: Target mode. Switching modes reboots the device.
          example: hid-only
    HidKeyboardLedStatus:
      type: object
      description: Lock-key LED state reported by the controlled host through the keyboard HID output report.
      required:
      - numLock
      - capsLock
      - scrollLock
      - known
      - updatedAt
      properties:
        numLock:
          type: boolean
          description: Num Lock LED (report bit 0). Only meaningful when `known` is `true`.
          example: true
        capsLock:
          type: boolean
          description: Caps Lock LED (report bit 1). Only meaningful when `known` is `true`.
          example: false
        scrollLock:
          type: boolean
          description: Scroll Lock LED (report bit 2). Only meaningful when `known` is `true`.
          example: false
        known:
          type: boolean
          description: |
            `false` until the host has sent at least one keyboard HID output report (e.g. right
            after boot or a USB re-enumeration); the LED flags must then be ignored.
          example: true
        updatedAt:
          type: string
          description: |
            RFC 3339 timestamp with nanoseconds, UTC, of the last received report. Empty string
            while `known` is `false`.
          example: '2026-10-01T05:21:52.123456789Z'
    Stream_UpdateFrameDetectReq:
      type: object
      description: |
        Frame-detection switch. The Go struct has no `json` tag, so the field is matched
        case-insensitively; the official web UI sends `enabled`.
      properties:
        enabled:
          type: boolean
          description: |
            `true` enables frame detection (interval `60`), `false` disables it (interval `0`).
            When omitted, the zero value `false` disables frame detection.
          example: true
    Stream_StopFrameDetectReq:
      type: object
      description: |
        Temporary frame-detection pause. The Go struct has no `json` tag, so the field is matched
        case-insensitively; the official web UI sends `duration`.
      properties:
        duration:
          type: integer
          description: |
            Pause length in seconds. Values `<= 0` (and an omitted field) fall back to the default
            of `10` seconds.
          default: 10
          example: 10
    Stream_SignalingMessage:
      type: object
      description: |
        JSON message exchanged over the `GET /api/stream/h264` WebSocket in both directions.
        `data` is always a string and contains JSON for the SDP/ICE events.

        Client → server events: `video-offer`, `video-candidate`, `heartbeat`.
        Server → client events: `ice-servers`, `video-answer`, `video-candidate`, `heartbeat`.

        Unknown events are ignored and malformed JSON is dropped without closing the socket.
      required:
      - event
      - data
      properties:
        event:
          type: string
          description: Event name.
          enum:
          - ice-servers
          - video-offer
          - video-answer
          - video-candidate
          - heartbeat
        data:
          type: string
          description: |
            String payload. `""` for `heartbeat`; a JSON-encoded `RTCSessionDescription`,
            `RTCIceCandidateInit` or ICE-server array for the other events.
    Stream_IceServer:
      type: object
      description: |
        One entry of the ICE server list in the `data` array of the `ice-servers` message
        (a subset of the WebRTC `RTCIceServer` dictionary). The list is built from the device
        configuration: `stun` (default `stun.l.google.com:19302`, skipped when empty or
        `disable`) and, when `turnAddr`, `turnUser` and `turnCred` are all set, `turn:<turnAddr>`.
      properties:
        urls:
          type: array
          items:
            type: string
          description: ICE server URL, e.g. `stun:stun.l.google.com:19302` or `turn:turn.example.com`.
          example:
          - stun:stun.l.google.com:19302
        username:
          type: string
          description: TURN username; omitted for STUN entries.
        credential:
          type: string
          description: TURN credential; omitted for STUN entries.
    Stream_CaptureStatus:
      type: object
      description: |
        Payload of a `capture-status` notification on `GET /api/ws` (JSON-encoded in the
        message's `data` field). Describes the latest capture state of one streaming mode.
      properties:
        ok:
          type: boolean
          description: '`true` when `result >= 0` (the streamer produced an image), `false` on capture errors.'
        result:
          type: integer
          description: |
            Raw capture result code. `-7` HDMI input resolution error, `-6` unsupported HDMI
            resolution, `-5` retrieving image, `-4` changing image resolution, `-3` image buffer
            full, `-2` encoder error, `-1` no image captured, `0` MJPEG image, `3` H.264 I-frame,
            `4` H.264 P-frame, `5` image not changed (frame detection, suppressed by the MJPEG
            streamer). Other negative values map to `Capture failed`.
          example: 0
        message:
          type: string
          description: Human-readable meaning of `result`; empty for non-negative results.
          example: ''
        mode:
          type: string
          description: 'Streaming mode the status belongs to: `mjpeg`, `h264` (WebRTC) or `direct`.'
          enum:
          - mjpeg
          - h264
          - direct
        severity:
          type: string
          description: '`error`, `warning`, or empty for non-negative results.'
          enum:
          - error
          - warning
          - ''
        updatedAt:
          type: string
          format: date-time
          description: Time the status was last updated.
          example: '2026-10-01T13:09:23.482115712+08:00'
    Stream_H264ModeStatus:
      type: object
      description: |
        Payload of an `h264-mode-status` notification on `GET /api/ws` (JSON-encoded in the
        message's `data` field). Reports how many H.264 viewers use each mode and whether both
        modes are active at the same time.
      properties:
        generation:
          type: string
          format: uuid
          description: Identifier of the H.264 mode store instance (new UUID per server run).
          example: 5f0dbe1a-9c9e-4c0b-8f3a-4a1e5e6d7c8b
        revision:
          type: integer
          description: Monotonically increasing counter, incremented on every viewer registration/unregistration.
          example: 7
        direct:
          type: integer
          description: Number of connected `GET /api/stream/h264/direct` viewers.
          example: 1
        webrtc:
          type: integer
          description: Number of WebRTC viewers whose ICE connection is established (connected/completed).
          example: 0
        mixed:
          type: boolean
          description: '`true` while both `direct` and `webrtc` are greater than zero; direct and WebRTC H.264 at the same time can cause screen tearing.'
          example: false
    Ws_KeyboardLedStatus:
      type: object
      description: |
        Payload of a `hid-led-status` notification on `GET /api/ws` (JSON-encoded in the message's
        `data` field). Reflects the keyboard lock-key LEDs last reported by the remote host through
        the keyboard HID output report.
      properties:
        numLock:
          type: boolean
          description: Num Lock LED state (bit 0 of the host output report).
          example: true
        capsLock:
          type: boolean
          description: Caps Lock LED state (bit 1).
          example: false
        scrollLock:
          type: boolean
          description: Scroll Lock LED state (bit 2).
          example: false
        known:
          type: boolean
          description: '`false` until the host has sent at least one keyboard HID output report (all LED fields are `false` then).'
          example: true
        updatedAt:
          type: string
          format: date-time
          description: Time the LED state was last updated.
          example: '2026-10-01T13:09:23.482115712+08:00'
    Ws_Notification:
      type: object
      description: |
        JSON text message sent by the server on `GET /api/ws`. `data` is a JSON-encoded string
        whose shape depends on `type`: `Stream_CaptureStatus` for `capture-status`,
        `Stream_H264ModeStatus` for `h264-mode-status` and `Ws_KeyboardLedStatus` for
        `hid-led-status`.
      required:
      - type
      - data
      properties:
        type:
          type: string
          description: Notification type.
          enum:
          - capture-status
          - h264-mode-status
          - hid-led-status
        data:
          type: string
          description: JSON-encoded payload (see the referenced schema for the type).
    VmInfo:
      type: object
      description: Device information returned by `GET /api/vm/info`.
      properties:
        ips:
          type: array
          description: |
            IPv4 addresses of the up wired/wireless interfaces; empty when no interface
            qualifies.
          items:
            $ref: '#/components/schemas/VmIp'
        mdns:
          type: string
          description: |
            `<hostname>.local` when the avahi daemon is running, otherwise `""`.
          example: nanokvm.local
        image:
          type: string
          description: |
            OS image version (mapped from the image file name in `/boot/ver`), the raw file name
            when unknown, or `""` when unreadable.
          example: v1.4.2
        application:
          type: string
          description: Server application version (`/kvmapp/version`; `1.0.0` when missing).
          example: 2.5.1
        deviceKey:
          type: string
          description: Device key read from `/device_key`; `""` when the file is missing.
          example: 0a1b2c3d4e5f
    VmIp:
      type: object
      description: One IPv4 address of the device.
      properties:
        name:
          type: string
          description: Network interface name.
          example: eth0
        addr:
          type: string
          description: IPv4 address.
          example: 192.168.1.42
        version:
          type: string
          description: Address family; always `IPv4`.
          example: IPv4
        type:
          type: string
          description: Interface classification derived from the name prefix.
          enum:
          - Wired
          - Wireless
          example: Wired
    VmHardware:
      type: object
      description: Hardware revision of the device.
      properties:
        version:
          type: string
          description: |
            Hardware version read from `/etc/kvm/hw`; unknown content falls back to `Alpha`.
          enum:
          - Alpha
          - Beta
          - PCIE
          - Unknown
          example: PCIE
    VmGpioRequest:
      type: object
      description: GPIO pulse request (ATX power/reset button).
      required:
      - type
      properties:
        type:
          type: string
          description: Button to press.
          enum:
          - power
          - reset
          example: power
        duration:
          type: integer
          minimum: 0
          description: |
            Press time in milliseconds. `0`, `null` or omitted means the default **800 ms**. The
            request blocks for the whole pulse because the handler sleeps for the duration.
          example: 800
    VmGpioState:
      type: object
      description: Front-panel LED states.
      properties:
        pwr:
          type: boolean
          description: Power LED is lit (the active-low GPIO value is `0`).
          example: true
        hdd:
          type: boolean
          description: HDD activity LED is lit; only ever `true` on Alpha hardware.
          example: false
    VmScreenRequest:
      type: object
      description: One video-capture parameter to change.
      required:
      - type
      properties:
        type:
          type: string
          description: Parameter to change.
          enum:
          - type
          - resolution
          - fps
          - quality
          - gop
          example: resolution
        value:
          type: integer
          description: |
            New value; see the endpoint description for the meaning per `type`. For `type` the
            value is a code (`0` = MJPEG, non-zero = H.264); for `resolution` it is the target
            **height** (`0` = auto).
          example: 720
    VmOriginalResolution:
      type: object
      description: An original (host) resolution preset used for automatic mouse calibration.
      required:
      - width
      - height
      properties:
        width:
          type: integer
          minimum: 1
          example: 1920
        height:
          type: integer
          minimum: 1
          example: 1080
    VmManualRegion:
      type: object
      description: |
        A manually selected calibration region: `width`×`height` pixels at (`left`,`top`) inside a
        `frameWidth`×`frameHeight` video frame.
      properties:
        frameWidth:
          type: integer
          example: 1280
        frameHeight:
          type: integer
          example: 720
        left:
          type: integer
          example: 0
        top:
          type: integer
          example: 0
        width:
          type: integer
          example: 640
        height:
          type: integer
          example: 480
    VmInputRegion:
      type: object
      description: Mouse calibration ("control region") configuration.
      properties:
        mode:
          type: string
          description: Calibration mode; `off` when no valid configuration is stored.
          enum:
          - 'off'
          - auto
          - manual
          example: auto
        frameWidth:
          type: integer
          description: Legacy single-region frame width (0 when unused).
          example: 1280
        frameHeight:
          type: integer
          description: Legacy single-region frame height (0 when unused).
          example: 720
        left:
          type: integer
          example: 0
        top:
          type: integer
          example: 0
        width:
          type: integer
          example: 640
        height:
          type: integer
          example: 480
        resolutions:
          type: array
          description: Known original host resolutions; omitted when empty.
          items:
            $ref: '#/components/schemas/VmOriginalResolution'
        selectedResolution:
          type: string
          description: |
            Selected original resolution as `WIDTHxHEIGHT`; `""` when unused.
          example: 1920x1080
        regions:
          type: array
          description: Stored manual regions; omitted when empty.
          items:
            $ref: '#/components/schemas/VmManualRegion'
        selectedRegion:
          type: string
          description: |
            Selected manual region as `WIDTHxHEIGHT` (of the region size); `""` when unused.
          example: 640x480
    VmInputRegionRequest:
      type: object
      description: |
        Partial update of the calibration configuration. Fields that are omitted keep their
        stored value; only one of `selectedResolution` / `selectedRegion` may be set.
      required:
      - mode
      properties:
        mode:
          type: string
          description: Calibration mode to store.
          enum:
          - 'off'
          - auto
          - manual
          example: manual
        frameWidth:
          type: integer
          description: Legacy manual region frame width (part of the six-field manual form).
          example: 1280
        frameHeight:
          type: integer
          example: 720
        left:
          type: integer
          example: 0
        top:
          type: integer
          example: 0
        width:
          type: integer
          example: 640
        height:
          type: integer
          example: 480
        resolutions:
          type: array
          description: Replacement list of original resolutions (must be positive and unique).
          items:
            $ref: '#/components/schemas/VmOriginalResolution'
        selectedResolution:
          type: string
          description: |
            `WIDTHxHEIGHT` key of the selected original resolution; empty string clears the
            selection. Must exist in `resolutions`.
          example: 1920x1080
        regions:
          type: array
          description: |
            Replacement list of manual regions (positive, inside the frame, no duplicates). An
            empty array clears the legacy manual region fields.
          items:
            $ref: '#/components/schemas/VmManualRegion'
        selectedRegion:
          type: string
          description: |
            `WIDTHxHEIGHT` key (region size) of the selected manual region; empty string clears
            the selection. Must exist in `regions`.
          example: 640x480
    VmInputResolution:
      type: object
      description: Resolution of the currently captured video signal.
      properties:
        width:
          type: integer
          example: 1920
        height:
          type: integer
          example: 1080
    VmScriptList:
      type: object
      description: Scripts stored on the device.
      properties:
        files:
          type: array
          description: File names of the `.sh`/`.py` scripts in `/etc/kvm/scripts`.
          items:
            type: string
          example: &id010
          - backup.sh
          - monitor.py
    VmUploadedFile:
      type: object
      description: Result of a script upload.
      properties:
        file:
          type: string
          description: File name the upload was stored under.
          example: backup.sh
    VmScriptRunRequest:
      type: object
      description: Script to execute and execution mode.
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: |
            File name inside `/etc/kvm/scripts`; names ending in `.py` (case-insensitive) are run
            with `python`, everything else is executed directly.
          example: backup.sh
        type:
          type: string
          description: |
            `foreground` waits for the script and returns its combined output; any other value
            (the UI uses `background`) starts it detached and returns immediately.
          enum:
          - foreground
          - background
          example: foreground
    VmScriptRun:
      type: object
      description: Output of a script run.
      properties:
        log:
          type: string
          description: |
            Combined stdout+stderr of a foreground run; `""` for background runs (the process is
            not waited for).
          example: |
            backup finished
    VmScriptDeleteRequest:
      type: object
      description: Script to delete.
      required:
      - name
      properties:
        name:
          type: string
          description: File name inside `/etc/kvm/scripts` (no extension restriction).
          example: backup.sh
    VmVirtualDeviceState:
      type: object
      description: Virtual USB devices currently exposed to the host.
      properties:
        network:
          type: boolean
          description: RNDIS USB network adapter attached (`/boot/usb.rndis0` exists).
          example: true
        media:
          type: boolean
          description: Always `false`; the field is never populated by the handler.
          example: false
        disk:
          type: boolean
          description: |
            Virtual USB disk attached: `/boot/usb.disk0` exists **and** the mass-storage gadget
            currently serves the `/data` partition (an attached image or no device reports
            `false`).
          example: false
    VmVirtualDeviceRequest:
      type: object
      description: Virtual device to toggle.
      required:
      - device
      properties:
        device:
          type: string
          description: Device to toggle; any other value answers `-2`.
          enum:
          - network
          - disk
          example: network
    VmVirtualDeviceOn:
      type: object
      description: State of the toggled virtual device after the operation.
      properties:
        true:
          type: boolean
          description: |
            New state: for `network` whether `/boot/usb.rndis0` exists, for `disk` whether the
            device is attached after the operation.
          example: true
    VmMemoryLimit:
      type: object
      description: Go runtime memory limit configuration.
      properties:
        enabled:
          type: boolean
          description: The limit file `/etc/kvm/GOMEMLIMIT` exists.
          example: true
        limit:
          type: integer
          format: int64
          description: Persisted limit in MB; `0` when disabled.
          example: 75
    VmMemoryLimitRequest:
      type: object
      description: Memory limit to apply.
      properties:
        enabled:
          type: boolean
          description: |
            `true` applies and persists `limit`; `false` removes the limit (runtime back to
            1 GiB).
          example: true
        limit:
          type: integer
          format: int64
          description: |
            Soft memory limit in MB. Only used when `enabled` is true; values below 50 are
            clamped to 50 MB in the running process.
          example: 75
    VmOledState:
      type: object
      description: OLED display configuration.
      properties:
        exist:
          type: boolean
          description: The device has an OLED display (`/etc/kvm/oled_exist` exists).
          example: true
        sleep:
          type: integer
          description: Seconds of inactivity before the OLED is switched off; `0` = never.
          example: 60
    VmOledRequest:
      type: object
      description: OLED screen-off timeout.
      properties:
        sleep:
          type: integer
          description: Seconds of inactivity before the OLED is switched off; `0` = never.
          example: 60
    VmHdmiState:
      type: object
      description: HDMI capture state (PCIE hardware revision only).
      properties:
        enabled:
          type: boolean
          description: Capture is enabled (`/etc/kvm/hdmi_disable` does not exist).
          example: true
        signal:
          type: boolean
          description: A signal is present on the HDMI input; always `false` while disabled.
          example: true
        idleTimeout:
          type: integer
          description: |
            Minutes without viewers after which capture is stopped; `0` = never (accepted range
            0–10080).
          example: 30
    VmHdmiTimeoutRequest:
      type: object
      description: HDMI capture idle timeout.
      required:
      - minutes
      properties:
        minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: Minutes without viewers before capture is stopped; `0` disables the timeout.
          example: 30
    VmSshState:
      type: object
      description: SSH server state.
      properties:
        enabled:
          type: boolean
          description: SSH is running (the stop flag `/etc/kvm/ssh_stop` is absent).
          example: true
    VmSwap:
      type: object
      description: Swap file configuration.
      properties:
        size:
          type: integer
          format: int64
          description: Size of `/swapfile` in MB; `0` means swap is disabled.
          example: 256
    VmSwapRequest:
      type: object
      description: Swap file size to apply.
      properties:
        size:
          type: integer
          format: int64
          description: |
            Desired swap file size in MB; `0` disables swap and removes `/swapfile`. No upper
            bound is enforced by the server.
          example: 256
    VmMouseJiggler:
      type: object
      description: Mouse-jiggler state.
      properties:
        enabled:
          type: boolean
          description: The jiggler is active (configuration file `/etc/kvm/mouse-jiggler` exists).
          example: true
        mode:
          type: string
          description: Movement mode used by the jiggler.
          enum:
          - relative
          - absolute
          example: relative
    VmMouseJigglerRequest:
      type: object
      description: Mouse-jiggler configuration.
      properties:
        enabled:
          type: boolean
          description: Enable or disable the jiggler.
          example: true
        mode:
          type: string
          description: |
            `relative` (default) or `absolute`; only `absolute` selects the absolute-pointer
            wiggle, any other string behaves like `relative`.
          enum:
          - relative
          - absolute
          example: relative
    VmHostname:
      type: object
      description: Device hostname.
      properties:
        hostname:
          type: string
          example: nanokvm
    VmHostnameRequest:
      type: object
      description: New device hostname.
      required:
      - hostname
      properties:
        hostname:
          type: string
          description: New hostname; not validated by the server.
          example: my-nanokvm
    VmWebTitle:
      type: object
      description: Custom web-UI title.
      properties:
        title:
          type: string
          example: Rack 3 KVM
    VmWebTitleRequest:
      type: object
      description: Web-UI title to set.
      properties:
        title:
          type: string
          description: |
            New title; empty or `NanoKVM` resets to the default title (the file is deleted).
          example: Rack 3 KVM
    VmMdnsState:
      type: object
      description: mDNS (avahi) state.
      properties:
        enabled:
          type: boolean
          description: The avahi daemon is running (its pid file exists).
          example: true
    VmTlsRequest:
      type: object
      description: TLS switch.
      properties:
        enabled:
          type: boolean
          description: |
            `true` serves HTTPS with a self-signed certificate; `false` serves plain HTTP. The
            server restarts itself afterwards.
          example: true
    VmAutostartList:
      type: object
      description: Autostart scripts stored on the device.
      properties:
        files:
          type: array
          description: File names in `/etc/kvm/autostart` (no extension filter).
          items:
            type: string
          example: &id009
          - start-camera.sh
          - on-boot.py
    VmAutostartUploadRequest:
      type: object
      description: Content of the autostart script to create/overwrite.
      properties:
        content:
          type: string
          description: Script content written verbatim to the file (mode 0755 when created).
          example: |
            #!/bin/sh
            echo "autostart" >> /tmp/boot.log
  responses:
    Unauthorized:
      description: |
        Not authenticated — the `nano-kvm-token` cookie is missing, expired, revoked, or invalid.
        The body is the JSON string `"unauthorized"` (plain text for loopback-token endpoints).
      content:
        application/json:
          schema:
            type: string
            example: unauthorized
    Forbidden:
      description: |
        Authenticated but not allowed — the account does not have the required role (admin only).
        The body is the JSON string `"forbidden"`.
      content:
        application/json:
          schema:
            type: string
            example: forbidden
paths:
  /api/ai/control/mode:
    put:
      tags:
      - AI Control
      summary: Switch the AI control mode
      operationId: ctrl_setMode
      description: |
        Switches the exclusive control owner between `off`, `mcp` and `picoclaw`. The request body
        must be JSON (`c.ShouldBindJSON`); `application/x-www-form-urlencoded` is **not** accepted.

        Requires the **admin** role. The switch is serialized: only one transition runs at a time,
        and `transitioning` is `true` in the status while it is in progress. Requesting the mode
        that is already active is a no-op success — no preemption, no cleanup and no
        `transitioning` phase is triggered.

        **Validation errors** (HTTP 200, note the key `message`, not `msg`):

        - missing/unparsable body → `{"code": -1, "message": "invalid arguments"}`
        - `mode` not one of `off|mcp|picoclaw` → `{"code": -1, "message": "invalid control mode"}`

        **Failure code `-2`** — the status could not be read before the switch, or the switch failed.
        `message` carries the raw Go error, e.g.
        `AI control mode conflict: current=off expected=mcp`,
        `wait for active control operations: timed out waiting for active control operations`
        (the transition waits up to 30 s for in-flight control operations to finish) or
        `stop PicoClaw runtime for MCP: ...`. When a cleanup hook fails, the manager rolls the mode
        file back to `off` before returning the error.

        **Transition sequence** (`SwitchWithCleanup`): set `transitioning` → run the preemption hook
        → acquire the exclusive activity slot (bounded 30 s wait) → run the cleanup hook → persist
        the new mode. Semantics per target mode:

        - `mcp`
          - preempt: `Coordinator.CancelMCP()` (cancels the running MCP HID operation, if any) and
            `PreemptControlLeasesForMCP()` — cancels active PicoClaw control operations and closes
            the PicoClaw gateway sessions with close code *control mode switched* / reason
            `external MCP enabled`.
          - cleanup: `StopRuntimeForMCP()` — stops the PicoClaw runtime and verifies it is gone —
            followed by `hid.ReleaseAllHIDStateBestEffort()` (keyboard + relative + absolute mouse
            release reports). A failure of the runtime stop is returned to the caller (code `-2`).
        - `picoclaw`
          - preempt: `Coordinator.CancelMCP()` + `CancelActiveControlOperations()` (cancels PicoClaw
            control operations so the runtime takes over cleanly).
          - cleanup: `hid.ReleaseAllHIDStateBestEffort()`.
        - `off`
          - preempt: `Coordinator.CancelMCP()` + `CancelActiveControlOperations()`.
          - cleanup: `hid.ReleaseAllHIDStateBestEffort()` (`hid.ReleaseAllHIDStateBestEffort` logs
            and swallows HID write errors, so it never fails).
          - after a successful switch: PicoClaw keeps its runtime for chat-only use
            (`PreserveRuntimeForChatOnly("control_release_chat_only")`) and the new state is
            broadcast to connected PicoClaw gateway sessions as a `control.mode_changed` message
            with `source: ai_control_mode`.

        **Response data shape differs by target mode**:

        - `mode: off` → an object with `control`, `runtime`, `released`, `closed_sessions` and
          `cleanup_warning` (see `Control_ReleaseData`). If the switch returned an error but the
          mode ended up as `off` anyway (rollback), the endpoint still answers `code: 0` with
          `cleanup_warning` set to that error text.
        - `mode: mcp` / `mode: picoclaw` → the plain `Control_Status` object.

        The official web UI calls this endpoint to take over (`picoclaw`) and to release control
        (`off`).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        description: Target control mode (JSON only).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Control_SetModeRequest'
            examples:
              enableMcp:
                summary: Hand control to an external MCP client
                value:
                  mode: mcp
              release:
                summary: Release control (chat-only PicoClaw)
                value:
                  mode: 'off'
      responses:
        '200':
          description: |
            `code: 0` with either `Control_Status` (mode `mcp`/`picoclaw`) or
            `Control_ReleaseData` (mode `off`); `code: -1` for validation errors
            (`invalid arguments`, `invalid control mode`); `code: -2` when the switch failed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      description: |
                        Plain `Control_Status` for `mode: mcp`/`mode: picoclaw`;
                        `Control_ReleaseData` for `mode: off`.
                      oneOf:
                      - $ref: '#/components/schemas/Control_Status'
                      - $ref: '#/components/schemas/Control_ReleaseData'
              examples:
                switchedToMcp:
                  summary: Switched to mcp
                  value:
                    code: 0
                    msg: success
                    data:
                      mode: mcp
                      transitioning: false
                      changed_at: '2026-10-01T12:04:11.482913341+08:00'
                released:
                  summary: Released control (mode off)
                  value:
                    code: 0
                    msg: success
                    data:
                      control:
                        mode: 'off'
                        transitioning: false
                        changed_at: '2026-10-01T12:07:55.117203119+08:00'
                      runtime:
                        ready: true
                        installed: true
                        installing: false
                        model_configured: true
                        status: ready
                        checked_at: '2026-10-01T12:07:55.117520071+08:00'
                        runtime_intent:
                          desired_running: true
                          updated_by: control_release_chat_only
                        control_mode: 'off'
                        control:
                          mode: 'off'
                          transitioning: false
                          can_control: false
                        capabilities:
                          chat: true
                          read_only_tools: true
                          device_write: false
                      released: true
                      closed_sessions: 0
                      cleanup_warning: ''
                invalidMode:
                  summary: Unknown mode value
                  value:
                    code: -1
                    message: invalid control mode
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/ai/control/status:
    get:
      tags:
      - AI Control
      summary: Get AI control mode status
      operationId: ctrl_getStatus
      description: |
        Returns the current state of the AI control mode manager, the arbiter that decides which
        actor owns HID input (the web UI / a human, an external MCP client, or the on-device
        PicoClaw agent). The state is persisted in the file `/etc/kvm/ai-control.mode`; when that
        file does not exist the manager reports the built-in default mode `picoclaw`.

        Requires the **admin** role (authenticated session cookie).

        The response never fails with a negative `code` under normal operation; a `-1` answer means
        the mode file could not be stat/read. Note that this handler uses the key **`message`**
        (not `msg`) for its error text:

        ```json
        { "code": -1, "message": "stat AI control mode: permission denied" }
        ```
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Current control-mode status. `code` is `0` and `data` carries the status object, or
            `code` is `-1` with `message` when the mode file cannot be read.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Control_Status'
              examples:
                mcp:
                  summary: MCP owns control
                  value:
                    code: 0
                    msg: success
                    data:
                      mode: mcp
                      transitioning: false
                      changed_at: '2026-10-01T12:04:11.482913341+08:00'
                failed:
                  summary: Mode file unreadable
                  value:
                    code: -1
                    message: 'stat AI control mode: permission denied'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/application/preview:
    get:
      operationId: app_getPreview
      tags:
      - Application
      summary: Get preview updates state
      description: |
        Reports whether preview (pre-release) updates are enabled. Requires the **admin** role.
        The state is the presence of the flag file `/etc/kvm/preview_updates`. When enabled and no
        custom update server is configured, version checks and updates use the preview channel
        `https://cdn.sipeed.com/nanokvm/preview`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppPreviewState'
              example:
                code: 0
                msg: success
                data:
                  enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: app_setPreview
      tags:
      - Application
      summary: Set preview updates state
      description: |
        Enables or disables the preview update channel. Requires the **admin** role. Body field
        `enable` (boolean; the Go field has no `json` tag, so the binding is case-insensitive and
        `Enable` also works). The setting is persisted by creating or removing the flag file
        `/etc/kvm/preview_updates`.

        Requesting the state the device is already in is a no-op that still answers success.

        Error codes: `-1` `invalid arguments` (body could not be bound); `-2` `enable failed`
        (flag file could not be written); `-3` `disable failed` (flag file could not be removed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppPreviewRequest'
            example:
              enable: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/application/update:
    post:
      operationId: app_update
      tags:
      - Application
      summary: Update application
      description: |
        Downloads and installs the latest application package from the configured update source.
        Requires the **admin** role.

        This is a **blocking, long-running request**: the handler does not answer until the package
        has been downloaded, SHA-512 verified, unpacked and moved into `/kvmapp` (the previous
        installation is moved to `/root/old`). The web UI allows 15 minutes for it. About one second
        after the successful response the server restarts the NanoKVM services
        (`/kvmapp/system/init.d/S95nanokvm restart`), so the connection may be reset and the request
        may surface as a proxy `502` even though the update succeeded. No request body.

        Only one update may run at a time (an in-process lock plus an on-disk transfer sentinel also
        used by the image downloader); a concurrent call fails with `-1`
        `update already in progress`. Free-space preconditions are checked before and during the
        download (a reserve of max(5% of the filesystem, 128 MiB) is kept free), the package must be
        at most 1 GiB and expand to at most 2 GiB.

        Error code: `-1` `update failed: <reason>` — e.g. `update server is inaccessible`,
        `status code <n>`, `invalid latest version`, `invalid update package name`,
        `invalid update package sha512`, `invalid sha512 <hash>`,
        `insufficient storage: need <n> MiB including reserve, <m> MiB available on <path>`,
        `inspect update package: ...`, `extract update package: ...`,
        `invalid update package layout: ...`, or `failed to backup app: ...`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/application/update-server:
    get:
      operationId: app_getUpdateServer
      tags:
      - Application
      summary: Get custom update server
      description: |
        Returns the custom update server configuration. Requires the **admin** role. Stored in
        `/etc/kvm/application-update.json`; when that file does not exist the defaults
        `{"enabled": false, "url": "https://cdn.sipeed.com/nanokvm"}` are returned. `url` is
        normalized on read (trailing slashes trimmed). The URL may embed credentials
        (`https://user:password@host/path`); they are stored and returned as part of the URL.

        Error code: `-1` `failed to load update server config` (unreadable or invalid config file).

        When `enabled` is `false`, the source actually used is the preview channel if preview
        updates are enabled, otherwise the stable channel above.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppUpdateServerConfig'
              example:
                code: 0
                msg: success
                data:
                  enabled: false
                  url: https://cdn.sipeed.com/nanokvm
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: app_setUpdateServer
      tags:
      - Application
      summary: Set custom update server
      description: |
        Enables/disables and configures the custom update server and answers with the stored
        configuration. Requires the **admin** role.

        Body fields: `enabled` (boolean, **required** — the field is a pointer, so it must be
        present) and `url` (string, optional). Validation of `url`: at most 2048 characters, an
        absolute `http`/`https` URL with a host, no query string and no fragment, and it must point
        at the directory containing `latest.json`, not at `latest.json` itself. Credentials may be
        embedded in the URL (`https://user:password@host/path`); the server sends them as an HTTP
        Basic `Authorization` header when it later fetches the manifest and the package, keeps them
        out of the request line, and only forwards them across redirects to the same host (never on
        an HTTPS→HTTP downgrade). Because the URL can contain credentials, the request is not
        written to the shared request log.

        If `url` is empty, the default `https://cdn.sipeed.com/nanokvm` is stored. If `enabled` is
        `true`, `url` must not be empty.

        Error codes: `-1` `invalid arguments` (bind error or missing `enabled`); `-2` —
        `invalid update server URL`, `update server URL is too long`,
        `update server URL must not contain a query or fragment`,
        `enter the update server directory, not latest.json`,
        `update server URL is required`; `-3` `failed to save update server config`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppUpdateServerRequest'
            example:
              enabled: true
              url: https://mirror.example.com/nanokvm
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppUpdateServerConfig'
              example:
                code: 0
                msg: success
                data:
                  enabled: false
                  url: https://cdn.sipeed.com/nanokvm
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/application/update/offline:
    post:
      operationId: app_offlineUpdate
      tags:
      - Application
      summary: Update application offline
      description: |
        Installs an application package uploaded from the local machine, without contacting the
        update server. Requires the **admin** role.

        Body: `multipart/form-data` with exactly one file part named `file`. The filename must match
        `^nanokvm_[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz$` and may contain only `[A-Za-z0-9._-]` (path
        separators and `..` are rejected); the archive must contain a top-level directory of the
        same name (minus `.tar.gz`) with a `version` file, `server/NanoKVM-Server`,
        `kvm_system/kvm_system` and `system/init.d/S95nanokvm`. The request body is capped at the
        maximum package size (1 GiB) + 1 MiB, and free space (payload + max(5%, 128 MiB) reserve) is
        checked before the upload is accepted.

        Optional header `X-SHA256-Checksum`: lowercase/uppercase hex SHA-256 of the uploaded file;
        when present the upload is verified and a mismatch fails the request before installation.
        (The web UI computes it with `crypto.subtle.digest('SHA-256', ...)` over the whole file.)

        The request is synchronous — it answers only after the package has been verified, unpacked
        and installed over `/kvmapp` (the previous installation is moved to `/root/old`). About one
        second after a successful response the services restart, so the connection may be reset /
        answer `502` through a proxy. The same update lock and on-disk sentinel as
        `POST /api/application/update` are used, so an upload and an online update — or two uploads —
        cannot overlap.

        Error code: `-1` `update failed: <reason>` — e.g. `update already in progress`,
        `invalid sha256 checksum`, `offline update request exceeds <n> bytes`,
        `insufficient storage: ...`, `download already in progress`, `invalid multipart data: ...`,
        `no file uploaded`, `multiple files uploaded`, `no filename provided`,
        `invalid filename: contains invalid characters`, `invalid update package name`,
        `uploaded package exceeds <n> bytes`, `sha256 checksum mismatch`,
        `inspect update package: ...`, `extract update package: ...`,
        `invalid update package layout: ...`.

        **Example** (upload a local package with checksum verification):

        ```sh
        curl -b 'nano-kvm-token=<jwt>' \
             -H 'X-SHA256-Checksum: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d' \
             -F 'file=@nanokvm_2.5.1.tar.gz' \
             http://nanokvm.local/api/application/update/offline
        ```
      security:
      - cookieAuth: []
      parameters:
      - name: X-SHA256-Checksum
        in: header
        required: false
        description: |
          Hex-encoded SHA-256 of the uploaded package. When omitted, no checksum verification is
          performed.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          example: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
        example: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    The `nanokvm_<major>.<minor>.<patch>.tar.gz` package.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/application/version:
    get:
      operationId: app_getVersion
      tags:
      - Application
      summary: Get application version
      description: |
        Returns the running application version (contents of `/kvmapp/version`) and the newest
        version advertised by the update source. Requires the **admin** role.

        The update source is the custom server if `POST /api/application/update-server` enabled one,
        otherwise the preview channel `https://cdn.sipeed.com/nanokvm/preview` when preview updates
        are on, otherwise `https://cdn.sipeed.com/nanokvm`. The server fetches `<source>/latest.json`
        (with a cache-busting `now=<unix>` query parameter, 15 s timeout, max 64 KiB) and validates
        the manifest (version pattern, package name `nanokvm_<x.y.z>.tar.gz`, base64 SHA-512 digest,
        sizes) before answering.

        Blocking network call; no parameters. Error code: `-1`
        `failed to query latest version` — the update server is unreachable, answered non-200, or
        returned a manifest that failed validation.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AppVersion'
              example:
                code: 0
                msg: success
                data:
                  current: 2.5.1
                  latest: 2.5.1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/account:
    get:
      operationId: auth_getAccount
      tags:
      - Authentication
      summary: Get account
      description: |
        Returns the username and role of the authenticated user. Requires an authenticated session
        (any role); this is how the web UI decides whether to show admin-only features.

        Error code: `-1` `get account failed` (no principal in the context).

        With `authentication: disable` this reports the implicit `admin` principal.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthAccount'
              example:
                code: 0
                msg: success
                data:
                  username: admin
                  role: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/login:
    post:
      operationId: auth_login
      tags:
      - Authentication
      summary: Login
      security: []
      description: |
        Authenticates a user and starts a session. Public endpoint (no cookie required).

        On success the server sets the session cookie `nano-kvm-token` and answers
        `{"code":0,"msg":"success"}` (no `data`). Cookie attributes:
        `HttpOnly`, `SameSite=Strict`, `Path=/`, host-only (no `Domain`),
        `Max-Age=<jwt.refreshTokenDuration>` (default `2678400` seconds = 31 days) and
        `Secure` when the device serves HTTPS or the request arrives with
        `X-Forwarded-Proto: https`. The JWT inside has the same lifetime.

        Request fields (the handler binds with `c.ShouldBind`, so `application/json` — what the
        official web UI sends — and `application/x-www-form-urlencoded` are both accepted):

        - `username` — account name (required).
        - `password` — required, and **not** the plaintext password: it is the URL-encoded AES-256
          ciphertext produced by the browser with the shared key `nanokvm-sipeed-2024`
          (CryptoJS `AES.encrypt(...).toString()`, OpenSSL `Salted__` format, then
          `encodeURIComponent`). The server URL-decodes and decrypts it; an empty or
          undecryptable value is treated as a failed login.

        Failures are HTTP 200 with a negative `code` and are deliberately rate-limited:

        - `-1` `invalid parameters` — the body is missing `username`/`password` or fails validation;
          answered after a 3 second delay.
        - `-2` `invalid username or password` — unknown user, wrong password, or a disabled account;
          answered after a 2 second delay. The message does not distinguish the cases.
        - `-3` `authentication unavailable` — the account file `/etc/kvm/pwd` could not be read
          (2 s delay); `generate token failed` — JWT signing error (1 s delay).
        - `-5` `Account locked due to too many failed attempts, please try again later` — the client
          IP is currently locked out; answered after a 3 second delay.

        Brute-force protection is per client IP (`RemoteIP`) and is only active while
        `security.loginLockoutDuration > 0` in `/etc/kvm/server.yaml` (the shipped default is `0`,
        i.e. lockout disabled; `security.loginMaxFailures` defaults to `5`). Failures are counted
        within a window of `loginLockoutDuration` seconds; when the count reaches
        `loginMaxFailures` the IP is locked for `loginLockoutDuration` seconds. The request that
        reaches the threshold still answers `-2`; the lock is observed by the next request, which
        answers `-5`. A successful login clears the counter. Attempts are kept in memory (max 3000
        IPs, records cleaned every 6 hours); the lockout survives neither a restart nor a
        successful login from the same IP.

        With `authentication: disable` in `/etc/kvm/server.yaml` the endpoint returns success
        immediately, sets no cookie, and the whole API is reachable without credentials through an
        implicit `admin` principal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            example:
              username: admin
              password: U2FsdGVkX1%2B7l0K3z%2FqXeVw1sTn2mQy8kQ%3D%3D
      responses:
        '200':
          description: Successful response
          headers:
            Set-Cookie:
              description: |
                Session cookie, set only when authentication is enabled and the credentials are
                valid. `Secure` is present when the device is served over HTTPS.
              schema:
                type: string
                example: nano-kvm-token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; Path=/; Max-Age=2678400; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
  /api/auth/logout:
    post:
      operationId: auth_logout
      tags:
      - Authentication
      summary: Logout
      description: |
        Ends the session. Requires an authenticated session (any role). The session cookie is
        always cleared (`nano-kvm-token`, `Max-Age=0`).

        When authentication is enabled and `jwt.revokeTokensOnLogout` is `true` (the default, and
        forced to `true` when the JWT secret was generated rather than configured), the user record
        is additionally revoked: the JWT token version is incremented, so every cookie previously
        issued to that user becomes invalid (including sessions on other browsers), in-flight
        requests are cancelled and open WebSockets are closed with code `4401`.

        Error code: `-1` `failed to revoke session` (the account store could not be written).

        With `authentication: disable` the endpoint only clears the cookie and returns success.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          headers:
            Set-Cookie:
              description: Clears the session cookie (`nano-kvm-token`, `Max-Age=0`).
              schema:
                type: string
                example: nano-kvm-token=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password:
    get:
      operationId: auth_isPasswordUpdated
      tags:
      - Authentication
      summary: Is password updated
      description: |
        Reports whether the authenticated user still has to change the password. Requires an
        authenticated session (any role).

        The device owner account created on first boot (`admin`/`admin`, or the account migrated
        from an older release when its password still equals the default) is flagged
        `mustChangePassword`; the web UI uses this endpoint to force the password dialog.

        Error codes: `-1` `invalid session` (no principal in the context), `-2`
        `failed to get password state` (account file unreadable).

        With `authentication: disable` the endpoint answers `true` without consulting the store.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthPasswordState'
              example:
                code: 0
                msg: success
                data:
                  isUpdated: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: auth_changePassword
      tags:
      - Authentication
      summary: Change password
      description: |
        Changes the password of the authenticated user. Requires an authenticated session
        (any role); users may only change their own password (the account is taken from the session,
        not from the body).

        Both fields are URL-encoded AES-256 ciphertext with the shared key
        `nanokvm-sipeed-2024` (see `POST /api/auth/login`):

        - `currentPassword` — the user's current password; verified against the account store.
        - `password` — the new password; required, 8–72 **bytes**.

        On success all of the user's sessions are revoked (the JWT token version is bumped, so
        existing cookies stop working, in-flight requests are cancelled and WebSockets are closed
        with code `4401`) and the session cookie is cleared in the response. If the account is the
        device owner (`systemAccount`, enabled admin) the Linux root password is changed as well
        (`passwd root`); should that fail the account record is rolled back and the endpoint fails.

        Error codes: `-1` `invalid parameters`; `-2` `invalid session`; `-3`
        `current password is required` (empty or undecryptable `currentPassword`) or
        `current password is incorrect`; `-4` `authentication unavailable` (account store
        unreadable); `-5` the reason the new password was rejected — `invalid password`,
        `password must be between 8 and 72 bytes`, `user not found`, or the system password update
        error.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthChangePasswordRequest'
            example:
              currentPassword: U2FsdGVkX1%2B7l0K3z%2FqXeVw1sTn2mQy8kQ%3D%3D
              password: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
      responses:
        '200':
          description: Successful response
          headers:
            Set-Cookie:
              description: Clears the session cookie (`nano-kvm-token`, `Max-Age=0`).
              schema:
                type: string
                example: nano-kvm-token=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/users:
    get:
      operationId: auth_listUsers
      tags:
      - Authentication
      summary: List users
      description: |
        Lists the accounts stored in `/etc/kvm/pwd`. Requires the **admin** role. Every account is
        returned, including disabled ones; `systemAccount` marks the device owner account (the one
        also mirrored to the Linux root password), which is always an enabled admin.

        Error code: `-1` `failed to load users`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthUsers'
              example:
                code: 0
                msg: success
                data:
                  users:
                  - username: alice
                    role: user
                    enabled: true
                    systemAccount: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: auth_createUser
      tags:
      - Authentication
      summary: Create user
      description: |
        Creates an account. Requires the **admin** role. New accounts are enabled immediately with
        a fresh JWT token version (existing sessions of other users are unaffected).

        Body fields:

        - `username` — required; must match `^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$`, i.e. 1–32
          characters, first character alphanumeric, the rest letters/digits/`.`/`_`/`-`.
        - `password` — required; URL-encoded AES-256 ciphertext with the shared key
          `nanokvm-sipeed-2024` (see `POST /api/auth/login`); the decrypted plaintext must be
          8–72 bytes.
        - `role` — required; `admin` or `user`.

        Error codes: `-1` `invalid parameters`; `-2` `invalid password` (empty/undecryptable
        ciphertext) or `password must be between 8 and 72 bytes`; `-3` the reason creation failed —
        `username must be 1-32 characters and contain only letters, numbers, '.', '_' or '-'`,
        `username already exists`, `invalid role`, or an account-file write error.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCreateUserRequest'
            example:
              username: alice
              password: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
              role: user
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/users/{username}:
    put:
      operationId: auth_updateUser
      tags:
      - Authentication
      summary: Update user
      description: |
        Partially updates an account. Requires the **admin** role. The body is a patch: send
        `role`, `enabled`, or both — at least one of them must be present (`null` for both is
        rejected with `-1`). Fields that are omitted keep their current value. Only the `admin`
        and `user` roles exist; `user` accounts may use video, keyboard, mouse, paste, wake-on-LAN
        and power controls only.

        Guard rails enforced by the account store (in this order):

        - an admin may not disable or demote **themselves** (`-2`
          `administrators cannot disable or demote themselves`);
        - the device owner (`systemAccount`) must stay an enabled admin (`-2`
          `the device owner account must remain an enabled administrator`);
        - the last remaining enabled admin cannot be demoted or disabled (`-2`
          `at least one enabled admin is required`).

        On a change the target user's session is revoked immediately (token version bump,
        in-flight requests cancelled, WebSockets closed with `4401`); existing cookies of that user
        stop working at once. If the patch does not actually change anything the endpoint still
        answers success, but no token version bump happens.

        Error codes: `-1` `invalid parameters`; `-2` — `user not found`, `invalid role`,
        `administrators cannot disable or demote themselves`,
        `the device owner account must remain an enabled administrator`,
        `at least one enabled admin is required`, or an account-file write error.
      security:
      - cookieAuth: []
      parameters:
      - name: username
        in: path
        required: true
        description: Account name; 1–32 characters, `^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$`.
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$
          example: alice
        example: alice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthUpdateUserRequest'
            example:
              role: user
              enabled: true
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: auth_deleteUser
      tags:
      - Authentication
      summary: Delete user
      description: |
        Deletes an account. Requires the **admin** role. Sessions of the deleted user are revoked
        at once (token version bump, in-flight requests cancelled, WebSockets closed with `4401`).

        Guard rails: an admin cannot delete themselves, the device owner (`systemAccount`) cannot be
        deleted, and the last enabled admin cannot be removed (single-account installs can therefore
        never lock themselves out).

        Error codes (all `-1`): `administrators cannot delete themselves`, `user not found`,
        `the device owner account must remain an enabled administrator`,
        `at least one enabled admin is required`, or an account-file write error.
      security:
      - cookieAuth: []
      parameters:
      - name: username
        in: path
        required: true
        description: Account name; 1–32 characters, `^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$`.
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$
          example: alice
        example: alice
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/auth/users/{username}/password:
    post:
      operationId: auth_resetUserPassword
      tags:
      - Authentication
      summary: Change user password
      description: |
        Sets a new password for another account. Requires the **admin** role. `currentPassword` is
        accepted for schema compatibility but ignored — only `password` matters, as a URL-encoded
        AES-256 ciphertext with the shared key `nanokvm-sipeed-2024` (see `POST /api/auth/login`);
        the decrypted plaintext must be 8–72 bytes.

        The device owner account (`systemAccount`) cannot be reset by another admin — it must
        change its own password through `POST /api/auth/password` (because the Linux root password
        is bound to it). A successful reset revokes the target user's sessions immediately (token
        version bump, in-flight requests cancelled, WebSockets closed with `4401`).

        Error codes: `-1` `invalid parameters`; `-2` `user not found`; `-3`
        `the device owner must change its own password`; `-4` the reason the password was rejected —
        `invalid password`, `password must be between 8 and 72 bytes`, or the system password
        update error.
      security:
      - cookieAuth: []
      parameters:
      - name: username
        in: path
        required: true
        description: Account name; 1–32 characters, `^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$`.
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$
          example: alice
        example: alice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthResetUserPasswordRequest'
            example:
              password: U2FsdGVkX19hVb3n4Q0lT2pR8sYdW1kXmZ%2F6aQ%3D%3D
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/download/file:
    post:
      operationId: dl_uploadImageFile
      tags:
      - Download
      summary: Upload image file
      description: |
        Uploads a disk image from the browser to the device. Requires the **admin** role.

        Body: `multipart/form-data` with a file part named `file` (the part after the first one is
        ignored; the first `file` part wins). The filename must be a base name (no path separators,
        no `..`), may contain only `[A-Za-z0-9._-]` and must end in `.iso` (case-insensitive). Free
        space is checked before the first byte is accepted: the payload plus a 128 MiB reserve must
        fit into `/data`.

        Optional header `X-SHA256-Sum`: hex-encoded SHA-256 of the uploaded file. Note that, unlike
        the offline update endpoint, this one reads `X-SHA256-Sum`, not `X-SHA256-Checksum`.

        The handler is **synchronous**: the response arrives only after the whole image has been
        received and renamed to `/data/<filename>`. While it runs, the shared transfer status is
        `in_progress` (so `GET /api/download/image/status` shows the filename) and other transfers
        are rejected; cancelling is not possible. The first bytes are inspected while streaming and
        the upload is aborted early if the image is not bootable: the volume-descriptor sector must
        contain `CD001` (ISO 9660) or `BEA01` (UDF), or the data must look like a raw disk image
        (GPT `EFI PART`, APFS `NXSB`, HFS+ `H+`/`BD` or an MBR `0x55AA` signature).

        On success the response repeats the idle state — `data.status` `idle`, empty `file` and
        `percentage`.

        **Example** (upload a local ISO image with checksum verification):

        ```sh
        curl -b 'nano-kvm-token=<jwt>' \
             -H 'X-SHA256-Sum: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d' \
             -F 'file=@debian-12.9.0-amd64-netinst.iso' \
             http://nanokvm.local/api/download/file
        ```

        Error codes (all `-1`): `invalid sha256sum`;
        `not enough space in /data: need <n> MiB including reserve, <m> MiB available`;
        `download in progress` (another transfer or update is running);
        `invalid multipart data`; `no filename`; `invalid filename`;
        `only .iso files allowed`; `cannot create temporary file`; `write failed`;
        `unsupported image format: expected an ISO 9660/UDF image or a raw disk image`;
        `sha256 mismatch`; `cannot install uploaded image`; `file is required` (no `file` part).
      security:
      - cookieAuth: []
      parameters:
      - name: X-SHA256-Sum
        in: header
        required: false
        description: Hex-encoded SHA-256 of the uploaded ISO. When omitted, no verification is done.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
          example: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
        example: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: The `.iso` disk image to store in `/data`.
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DlDownloadStatus'
              example:
                code: 0
                msg: success
                data:
                  status: in_progress
                  file: https://downloads.example.com/ubuntu-24.04.iso
                  percentage: 42.13%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/download/image:
    post:
      operationId: dl_downloadImage
      tags:
      - Download
      summary: Download image
      description: |
        Starts downloading a disk image from a remote URL onto the device. Requires the **admin**
        role.

        **Asynchronous**: the handler validates the request, starts a background goroutine and
        returns immediately with status `in_progress`. Progress is polled through
        `GET /api/download/image/status`; the finished image is written to `/data/<basename>` on the
        exFAT data partition, which is exported to the target machine as a USB mass-storage device.

        Body fields:

        - `file` — required; absolute `http`/`https` URL. The URL must have a host and a path; the
          stored filename is the last path segment.
        - `sha256sum` — optional, hex-encoded SHA-256 of the image; verified while downloading (MIME
          type of the source is not inspected).

        Only one transfer (remote download or `POST /api/download/file` upload) may run at a time;
        the lock is also the on-disk sentinel `/run/nanokvm-transfer-in-progress`.

        Error codes (all `-1`): `invalid arguments` (bind/validation),
        `invalid sha256sum` (not 64 hex characters), `invalid url`,
        `download in progress` (another transfer is running).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlDownloadImageRequest'
            example:
              file: https://downloads.example.com/ubuntu-24.04.iso
              sha256sum: 9f2c5d1b7a4e0c8d3f6b1a2e9c4d7f0b5a8e1c3d6f9b2a4c7e0d3f5a8b1c4e6d
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DlDownloadStatus'
              example:
                code: 0
                msg: success
                data:
                  status: in_progress
                  file: https://downloads.example.com/ubuntu-24.04.iso
                  percentage: 42.13%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/download/image/cancel:
    post:
      operationId: dl_cancelDownloadImage
      tags:
      - Download
      summary: Cancel download image
      description: |
        Cancels the running remote image download started by `POST /api/download/image`. Requires
        the **admin** role. No request body.

        The cancellation is asynchronous internally but the handler waits (up to 10 s) for the
        background goroutine to stop before answering; the download status then becomes `idle` and
        the partially written temporary file is deleted.

        A `POST /api/download/file` upload in progress is **not** cancellable (it runs synchronously
        and registers no cancel function), so this endpoint answers `-1` while an upload is running.

        Error codes (both `-1`): `no cancellable download in progress`,
        `cancel download timed out`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/download/image/enabled:
    get:
      operationId: dl_getImageEnabled
      tags:
      - Download
      summary: Get image download enabled
      description: |
        Reports whether images can be stored on the device. Requires the **admin** role. The check
        is a writability probe of `/data` (the server creates and deletes `/data/.testfile`), so it
        answers `false` when the data partition is missing, read-only or full — in that state both
        download endpoints will fail.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DlImageEnabled'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/download/image/status:
    get:
      operationId: dl_getDownloadStatus
      tags:
      - Download
      summary: Get image download status
      description: |
        Reports the state of the image transfer. Requires the **admin** role. The state is kept in
        memory only, so it resets to `idle` after a server restart.

        `status` is one of:

        - `idle` — no transfer running (and nothing has failed since the last one);
        - `in_progress` — a remote download or an ISO upload is running;
        - `success` — the last remote download finished and the image was installed in `/data`;
        - `failed` — the last transfer failed (network error, non-200 response, write error);
        - `checksum_failed` — the last transfer failed the SHA-256 check.

        `file` is the source URL while a remote download is running, the original filename while an
        ISO upload is running, and empty otherwise. `percentage` is a formatted string such as
        `42.13%`, updated every 2.5 s and empty when the total size is unknown (no
        `Content-Length`).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/DlDownloadStatus'
              example:
                code: 0
                msg: success
                data:
                  status: in_progress
                  file: https://downloads.example.com/ubuntu-24.04.iso
                  percentage: 42.13%
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/down:
    post:
      operationId: ts_down
      tags:
      - Extensions
      summary: Run tailscale down
      description: |
        Runs `tailscale down`, disconnecting the node from the tailnet without logging it out.
        Requires the **admin** role. No request body. The daemon must be installed and running.

        Blocking (waits for the CLI). Error code: `-1` `tailscale down failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/install:
    post:
      operationId: ts_install
      tags:
      - Extensions
      summary: Install tailscale
      description: |
        Installs Tailscale on the device. Requires the **admin** role. No request body.

        The server downloads the current RISC-V 64 build from
        `https://pkgs.tailscale.com/stable/tailscale_latest_riscv64.tgz` (following redirects),
        unpacks it into `/root/.tailscale`, installs `tailscale` to `/usr/bin/tailscale` and
        `tailscaled` to `/usr/sbin/tailscaled`, then starts the daemon. Requires Internet access
        from the device and free space under `/root`. Idempotent: if both binaries already exist the
        endpoint returns success without downloading.

        Blocking: the download happens inside the request. Error code: `-1` `install failed`
        (download, unpack or install error). Failures of the daemon start are ignored — the
        endpoint still answers success.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/login:
    post:
      operationId: ts_login
      tags:
      - Extensions
      summary: Tailscale login
      description: |
        Starts the Tailscale authentication flow and returns the URL the user must open. Requires
        the **admin** role. No request body.

        The server runs `tailscale login --accept-dns=false --timeout=10m` and parses the
        authentication URL from the CLI output; the returned URL points at the Tailscale control
        server (`https://login.tailscale.com/...`) and has a limited lifetime. If the CLI reports the
        backend is already `Running`, the endpoint answers success with an **empty** `url` — check
        `GET /api/extensions/tailscale/status` in that case. Tailscale must be installed; if the
        status cannot be read the handler first tries to start the daemon.

        Blocking until the URL is printed or the CLI fails. Error codes: `-1` `unknown status`
        (status could not be read even after starting the daemon), `-2` `login failed` (no URL
        produced).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TsLogin'
              example:
                code: 0
                msg: success
                data:
                  url: https://login.tailscale.com/a/1a2b3c4d5e6f
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/logout:
    post:
      operationId: ts_logout
      tags:
      - Extensions
      summary: Tailscale logout
      description: |
        Runs `tailscale logout`, removing the node's authentication (the machine keeps its identity
        in the tailnet but must log in again). Requires the **admin** role. No request body. The
        daemon must be installed and running.

        Blocking (waits for the CLI). Error code: `-1` `logout failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/restart:
    post:
      operationId: ts_restart
      tags:
      - Extensions
      summary: Tailscale restart
      description: |
        Restarts the Tailscale daemon: copies `/kvmapp/system/init.d/S98tailscaled` to
        `/etc/init.d/S98tailscaled` and runs it with `restart`. Requires the **admin** role. No
        request body. The binaries must exist.

        Blocking (waits for the init script). Error code: `-1` `restart failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/start:
    post:
      operationId: ts_start
      tags:
      - Extensions
      summary: Tailscale start
      description: |
        Starts the Tailscale daemon. Requires the **admin** role. No request body.

        The server copies the init script from `/kvmapp/system/init.d/S98tailscaled` to
        `/etc/init.d/S98tailscaled` and runs it with `start`, then sets `GOMEMLIMIT` to 75 MiB for
        the daemon. The binaries must exist (`POST /api/extensions/tailscale/install` first).

        Blocking (waits for the init script). Error code: `-1` `start failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/status:
    get:
      operationId: ts_getStatus
      tags:
      - Extensions
      summary: Get tailscale status
      description: |
        Returns the Tailscale state of the device. Requires the **admin** role. No parameters.

        `state` values (mapped from `tailscale status --json`):

        - `notInstall` — `/usr/bin/tailscale` or `/usr/sbin/tailscaled` is missing (name/ip/account
          are empty; the CLI is not run);
        - `notRunning` — the CLI failed to run, or the backend state is `NoState`/`Starting`;
        - `notLogin` — the backend state is `NeedsLogin`, `NeedsMachineAuth` or `InUseOtherUser`;
        - `stopped` — backend state `Stopped`;
        - `running` — backend state `Running`.

        `name` is the Tailscale host name, `ip` the IPv4 address of this node (the last IPv4 entry
        reported by the CLI) and `account` the current tailnet name (all empty while not logged
        in).

        Error code: `-1` `unknown state` — the CLI reported a backend state that this server version
        does not map.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/TsStatus'
              example:
                code: 0
                msg: success
                data:
                  state: running
                  name: nanokvm
                  ip: 100.101.102.103
                  account: example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/stop:
    post:
      operationId: ts_stop
      tags:
      - Extensions
      summary: Tailscale stop
      description: |
        Stops the Tailscale daemon: runs `/etc/init.d/S98tailscaled stop` and removes the init
        script, then clears the `GOMEMLIMIT` tuning. Requires the **admin** role. No request body.

        Blocking (waits for the init script). Error code: `-1` `stop failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/uninstall:
    post:
      operationId: ts_uninstall
      tags:
      - Extensions
      summary: Uninstall tailscale
      description: |
        Removes Tailscale from the device. Requires the **admin** role. No request body.

        Stops the daemon (`/etc/init.d/S98tailscaled stop` and deletes that init script), removes
        the `GOMEMLIMIT` tuning, and deletes `/usr/bin/tailscale` and `/usr/sbin/tailscaled`. The
        endpoint always answers success — errors of the individual steps are ignored — so call
        `GET /api/extensions/tailscale/status` to confirm the resulting `notInstall` state.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/extensions/tailscale/up:
    post:
      operationId: ts_up
      tags:
      - Extensions
      summary: Run tailscale up
      description: |
        Runs `tailscale up --accept-dns=false` on the device, bringing the node up on the tailnet.
        Requires the **admin** role. No request body. The daemon must be installed and running and
        the node must already be authenticated — otherwise the CLI fails.

        Blocking (waits for the CLI). Error code: `-1` `tailscale up failed`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hid/leds:
    get:
      operationId: hid_getKeyboardLedStatus
      tags:
      - HID
      summary: Get remote keyboard lock LED status
      description: |
        Returns the lock-key LED state of the controlled host. Requires an authenticated session
        (any role).

        The state is taken from the keyboard HID **output** report the host sends over `/dev/hidg0`
        (one byte: bits 0–2 are Num/Caps/Scroll LED, the upper bits are padding):

        * `numLock` — bit 0 (`0x01`)
        * `capsLock` — bit 1 (`0x02`)
        * `scrollLock` — bit 2 (`0x04`)
        * `known` — `false` until the host has sent at least one such report. Right after boot, after
          a USB reset/re-enumeration (`POST /api/hid/reset`,
          `POST /api/internal/usb/recover`, `POST /api/storage/image/mount`, mode switch) or with a
          host that never updates the LEDs, the flags are all `false` and must be ignored.
        * `updatedAt` — RFC 3339 with nanoseconds in UTC of the last received report; the empty
          string while `known` is `false`.

        The same data is also pushed to WebSocket clients as the `hid-led-status` event as soon as
        the state changes. The endpoint never fails (it answers `code 0` with the current snapshot).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HidKeyboardLedStatus'
              example:
                code: 0
                msg: success
                data:
                  numLock: true
                  capsLock: false
                  scrollLock: false
                  known: true
                  updatedAt: '2026-10-01T05:21:52.123456789Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/mode:
    get:
      operationId: hid_getMode
      tags:
      - HID
      summary: Get HID mode
      description: |
        Returns the USB device mode of the KVM. Requires an authenticated session (any role).

        The mode is derived from the USB gadget attribute
        `/sys/kernel/config/usb_gadget/g0/bcdDevice`: `0x0510` → `normal`, `0x0623` → `hid-only`.
        The init scripts `/etc/init.d/S03usbdev` (normal) and `/etc/init.d/S03usbhid` (HID-only) set
        these values.

        * `normal` — the full gadget: keyboard, relative and absolute mouse, the virtual mass-storage
          disk and the virtual network adapter.
        * `hid-only` — only the three HID interfaces (no virtual disk, no virtual network, image
          mounting disabled); intended as a compatibility fallback when the host does not work with
          the composite device.

        Error codes: `-1` `get HID mode failed` (the attribute is missing or holds an unknown value).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HidMode'
              example:
                code: 0
                msg: success
                data:
                  mode: normal
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: hid_setMode
      tags:
      - HID
      summary: Set HID mode
      description: |
        Switches the device between `normal` and `hid-only` mode. Requires the **admin** role.

        Body (bound with `ShouldBind`, JSON or urlencoded form): `mode`, required, either `normal`
        or `hid-only`; any other value is rejected with `-2 invalid arguments`.

        If the requested mode equals the current one (`GET /api/hid/mode`) the handler answers
        `code 0` immediately and does nothing.

        Otherwise the matching init script is copied over `/etc/init.d/S03usbdev`
        (`/kvmapp/system/init.d/S03usbdev` for `normal`, `/kvmapp/system/init.d/S03usbhid` for
        `hid-only`; atomically via a temporary file in `/etc/init.d/`), the success response is
        sent, and about 500 ms later the device is **rebooted**.

        **The device reboots.** Despite the `code 0` answer the KVM goes down: the web UI, streams,
        the WebSocket channel and the USB gadget all disappear for the duration of the boot, and the
        controlled host sees the USB device disappear/reappear — possibly with a different set of
        interfaces (HID-only removes the virtual disk and network). The official web UI schedules a
        page reload 30 seconds after this call.

        Error codes: `-1` `invalid arguments` (binding/validation failed), `-2`
        `invalid arguments` (mode not `normal`/`hid-only`; no reboot happens), `-3`
        `operation failed` (copying the init script failed; no reboot happens).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidSetModeRequest'
            example:
              mode: hid-only
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hid/paste:
    post:
      operationId: hid_paste
      tags:
      - HID
      summary: Paste
      description: |
        Types a text string on the controlled host ("clipboard → keystrokes"). Requires an
        authenticated session (any role).

        The body is bound with `ShouldBind` (`application/json` is what the official web UI sends;
        urlencoded form also works):

        * `content` — required. The text to type. At most **833 Unicode code points** (runes).
        * `langue` — optional keyboard layout. The server maps characters to HID usage ids through a
          built-in **US** layout table; `de` and `fr` apply German/French remappings, any other value
          (including `en` and `ru`, both sent by the official web UI — Russian text is transliterated
          in the browser) uses the US table.

        How the text is sent: each mapped character becomes an 8-byte keyboard report
        `[modifiers, 0, keycode, 0, 0, 0, 0, 0]` written to `/dev/hidg0`, immediately followed by an
        all-zero key-up report; the loop then sleeps **30 ms** before the next character. Characters
        that are not in the table (e.g. CJK, emoji) are **skipped silently**. If a report write
        fails or the request context is cancelled the loop stops, a final key-up report is sent and
        the request fails with `-3 HID paste failed`.

        Control arbitration: the handler first acquires the manual HID session. If automation (MCP
        or PicoClaw, i.e. AI control mode `mcp`/`picoclaw`) currently owns the HID lane, or the
        control mode is transitioning, it answers `-3 HID control is busy`.

        Errors: `-1` `invalid arguments` (binding failed), `-2` `content too long`
        (more than 833 runes), `-2` `paste duration exceeds 25s` (internal typed-length guard;
        unreachable in practice because 833 × 30 ms = 24.99 s), `-3` `HID control is busy`,
        `-3` `HID paste failed`.

        Latency: the request blocks for ~30 ms per typed character (up to ~25 s for the maximum
        length), so clients should use a generous timeout.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidPasteRequest'
            example:
              content: |
                echo hello
              langue: en
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/reset:
    post:
      operationId: hid_reset
      tags:
      - HID
      summary: Reset hid
      description: |
        Resets the USB PHY of the KVM to recover a stuck keyboard/mouse (or virtual disk) connection
        without rebooting the device. Requires the **admin** role. No request body.

        The handler runs `/etc/init.d/S03usbdev restart_phy` and then reopens `/dev/hidg0`,
        `/dev/hidg1` and `/dev/hidg2`, retrying for up to **2 seconds** (100 ms between attempts).
        It first takes the manual HID session: if AI control (MCP/PicoClaw) owns the HID lane or the
        control mode is transitioning, the call fails with `-1 HID control is busy`.

        Side effects: the controlled host sees the USB device disconnect and re-enumerate; keyboard,
        mouse, the virtual disk and the virtual network adapter are briefly unavailable and any key
        or button currently held is released. A live video stream is not restarted by this endpoint,
        but the control channel may need a moment to recover.

        Error codes: `-1` `HID control is busy` (manual control could not be acquired), `-1`
        `failed to reset hid` (the `restart_phy` command failed, or the HID devices could not be
        reopened within the retry window).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hid/shortcut:
    post:
      operationId: hid_addShortcut
      tags:
      - HID
      summary: Add shortcut
      description: |
        Adds a user-defined keyboard shortcut. Requires the **admin** role.

        Body (bound with `ShouldBind`, JSON or urlencoded form): `keys`, required — an array of
        `{code, label}` objects in press order, e.g.
        `[{"code":"ControlLeft","label":"Ctrl"},{"code":"AltLeft","label":"Alt"}]`. `code` is a
        `KeyboardEvent.code` name, `label` is display-only. The server validates only that the field
        is present (the `required` tag) — it does not check the number or content of the keys.

        The shortcut is appended to `/etc/kvm/shortcuts.json` with a freshly generated UUID as `id`.
        The new `id` is **not** returned: call `GET /api/hid/shortcuts` to obtain the list with ids
        (that is what the official web UI does).

        Error codes: `-1` `invalid arguments` (binding/validation failed), `-2`
        `add shortcut failed` (the file could not be read, parsed or written).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidAddShortcutRequest'
            example:
              keys:
              - code: ControlLeft
                label: Ctrl
              - code: AltLeft
                label: Alt
              - code: Delete
                label: ⌫
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: hid_deleteShortcut
      tags:
      - HID
      summary: Delete shortcut
      description: |
        Deletes a user-defined keyboard shortcut by id. Requires the **admin** role.

        Body (bound with `ShouldBind`; the official web UI sends a JSON body): `id`, required — the
        UUID returned by `GET /api/hid/shortcuts`. The shortcut is removed from
        `/etc/kvm/shortcuts.json`; all other entries are kept.

        Error codes: `-1` `invalid arguments` (binding/validation failed), `-2`
        `delete shortcut failed` (no shortcut with that id exists, or the file could not be read or
        written).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidDeleteShortcutRequest'
            example:
              id: 3f1c2b8e-1f4a-4c2e-9d5a-8b7c6d5e4f3a
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hid/shortcut/leader-key:
    get:
      operationId: hid_getLeaderKey
      tags:
      - HID
      summary: Get shortcut leader key
      description: |
        Returns the leader key used by the shortcut feature. Requires an authenticated session
        (any role).

        The value is the content of `/etc/kvm/leader-key` with newlines removed; it is a
        `KeyboardEvent.code` name such as `ShiftRight`, `ControlRight` or `MetaRight`. When the file
        does not exist (feature disabled) the endpoint answers `code 0` with `key` set to the empty
        string.

        Error codes: `-1` `read leader key failed` (the file exists but cannot be read).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HidLeaderKey'
              example:
                code: 0
                msg: success
                data:
                  key: MetaRight
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: hid_setLeaderKey
      tags:
      - HID
      summary: Set shortcut leader key
      description: |
        Sets or clears the leader key used by the shortcut feature. Requires the **admin** role.

        Body (bound with `ShouldBind`; the official web UI sends JSON): `key` — a string, may be
        empty and may be absent (both are treated as "clear").

        * non-empty value: written verbatim to `/etc/kvm/leader-key`. The server performs **no
          validation**: the official web UI sends `KeyboardEvent.code` names (`ShiftRight`,
          `ControlRight`, `MetaRight` are offered as presets, but any name recorded from the user's
          keyboard is accepted; the matching happens in the browser).
        * empty value: the file is deleted, which disables the leader-key feature
          (`GET /api/hid/shortcut/leader-key` then returns `""`).

        Error codes: `-1` `invalid arguments` (binding failed), `-2` `reset failed` (deleting the
        file failed for a reason other than "does not exist"), `-3` `write failed` (persisting the
        key failed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HidSetLeaderKeyRequest'
            example:
              key: MetaRight
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/hid/shortcuts:
    get:
      operationId: hid_getShortcuts
      tags:
      - HID
      summary: Get shortcuts
      description: |
        Returns the user-defined keyboard shortcuts. Requires an authenticated session (any role).

        Shortcuts are stored in `/etc/kvm/shortcuts.json`
        (`{"shortcuts":[{"id":"<uuid>","keys":[{"code":"ControlLeft","label":"Ctrl"}, …]}]}`).
        `code` is a `KeyboardEvent.code`-style key name that the official web UI matches against key
        events; `label` is purely a display string. The server stores both verbatim and does not
        interpret them.

        A missing file (no shortcuts added yet) or an empty file yields an empty array with code `0`.

        Note: the two built-in shortcuts shown by the web UI (Win+Tab, Ctrl+Alt+Del) are hard-coded
        in the frontend and are not returned here.

        Error codes: `-1` `get shortcuts failed` (the file exists but cannot be read or parsed).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/HidShortcutList'
              example:
                code: 0
                msg: success
                data:
                  shortcuts: *id001
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/internal/usb/recover:
    post:
      operationId: usb_recover
      tags:
      - HID
      summary: Recover USB (internal)
      description: |
        Internal USB recovery hook for NanoKVM-internal automation — the equivalent of
        `POST /api/hid/reset` for the local PicoClaw runtime. No request body.

        Access: only accepted from **loopback** (`127.0.0.1`/`::1`) with a valid
        `X-NanoKVM-Internal-Token` header (the shared secret in
        `/etc/kvm/.picoclaw_internal_token`, generated on first boot). Anything else answers `401`
        with the body `"unauthorized"` (JSON string from the HTTP server; the dedicated plain-HTTP
        listener answers the plain text `unauthorized`). No session cookie, no role is involved.

        Unlike `/api/hid/reset` it does **not** take the manual HID-control lane, so it can be used
        while AI control (MCP/PicoClaw) is active: it restarts the USB PHY
        (`/etc/init.d/S03usbdev restart_phy`) and reopens `/dev/hidg0`–`/dev/hidg2` with a 2-second
        retry window.

        Side effects: the controlled host sees the USB device disconnect and re-enumerate; keyboard,
        mouse and the virtual disk/network are briefly unavailable and held keys are released.

        When the device serves HTTPS, this path is additionally allow-listed on the plain-HTTP
        listener (which otherwise answers `307` to the HTTPS URL), so the runtime can call it at
        `http://127.0.0.1:<http-port>/api/internal/usb/recover`.

        Error codes: `-1` `failed to recover usb` (the `restart_phy` command failed or the HID
        devices could not be reopened within the retry window). Success is `code 0` with no payload.
      security:
      - internalToken: []
      responses:
        '200':
          description: Successful response (loopback + valid internal token)
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/mcp:
    get:
      tags:
      - MCP
      summary: MCP endpoint — open the standalone SSE stream (not offered)
      operationId: mcp_endpointGet
      description: |
        Transport-level `GET` of the MCP Streamable HTTP endpoint (same URL/auth as
        `mcp_endpointPost`, which carries the full endpoint description: bearer-key
        authentication, the `mcp` control-mode prerequisite, cross-origin protection, JSON-RPC
        methods and the tool catalog; read it before using this operation).

        The handler is configured with `Stateless: true`, and a stateless MCP server offers no
        standalone SSE stream, so this method never returns an event stream:

        - `Accept: text/event-stream` (required for `GET`) → HTTP **405 Method Not Allowed** with
          header `Allow: POST`;
        - `Accept` without `text/event-stream` → HTTP **400**
          `Accept must contain 'text/event-stream' for GET requests`.

        Cross-origin checks do not apply to safe methods, so browser-originated `GET`s reach this
        point (but still need the bearer key).
      security:
      - mcpApiKey: []
      responses:
        '400':
          description: The `Accept` header does not contain `text/event-stream` (plain-text body).
          content:
            text/plain:
              schema:
                type: string
              example: Accept must contain 'text/event-stream' for GET requests
        '401':
          description: Missing or invalid bearer key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: invalid MCP API key
        '403':
          description: |
            HTTP 403 from one of two layers: the key middleware when the AI control mode is not
            `mcp` (JSON `{"error": "MCP service is disabled"}`, also emitted while a mode
            transition is running), or the DNS-rebinding check of the MCP transport when the
            connection arrived over a loopback address with a non-loopback `Host` header
            (plain text `Forbidden: invalid Host header "..."`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP service is disabled
        '405':
          description: 'The streamable transport is stateless: no standalone SSE stream (header `Allow: POST`).'
          content:
            text/plain:
              schema:
                type: string
              example: Method Not Allowed
        '500':
          description: The MCP config file could not be read while authenticating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP auth unavailable
    post:
      tags:
      - MCP
      summary: MCP endpoint — send JSON-RPC messages (Streamable HTTP)
      operationId: mcp_endpointPost
      description: |
        The Model Context Protocol endpoint of the device. It implements the MCP **Streamable HTTP**
        transport through the official Go SDK (`github.com/modelcontextprotocol/go-sdk` v1.6.1,
        mounted as `r.Any("/api/mcp", ...)`, so every HTTP method reaches the transport; only
        `GET`, `POST` and `DELETE` are meaningful for the MCP Streamable HTTP transport)
        configured with `Stateless: true` and
        `JSONResponse: true`. The same endpoint is documented as `mcp_endpointGet` and
        `mcp_endpointDelete`; this operation is the canonical description.

        ### Prerequisite — AI control mode
        The MCP service only works while the AI control mode is `mcp` and not `transitioning`
        (`PUT /api/ai/control/mode` or `POST /api/mcp/config`). Otherwise the key middleware
        answers immediately with HTTP **403** and body `{"error": "MCP service is disabled"}` —
        before any MCP processing, for every method.

        ### Authentication
        `Authorization: Bearer nag_mcp_...` with the key from `GET /api/mcp/config`
        (`/etc/kvm/mcp.json`, mode `0600`); the comparison is constant-time. Missing/malformed
        header or wrong key → HTTP **401** `{"error": "invalid MCP API key"}`; key file unreadable →
        HTTP **500** `{"error": "MCP auth unavailable"}`. No session cookie is accepted here, and
        the endpoint is **not loopback-only**: the server binds all interfaces by default
        (`host: ""` → `:80` / `:443`), so LAN/remote MCP clients can use it. Reading and rotating
        the key requires an admin session on the management endpoints above.

        ### Cross-origin protection
        The handler is wrapped in Go's `http.NewCrossOriginProtection()`. Safe methods
        (`GET`, `HEAD`, `OPTIONS`) always pass; for `POST`, a request with
        `Sec-Fetch-Site: cross-site` is rejected with HTTP **403**, and a request whose `Origin`
        host differs from the `Host` header is rejected with HTTP **403** (plain-text body such as
        `cross-origin request detected from Sec-Fetch-Site header`). Requests carrying neither
        `Origin` nor `Sec-Fetch-Site` (non-browser clients) are allowed. No CORS response headers
        are emitted — CORS is only enabled when the server runs with `authentication: disable`.
        In addition the SDK rejects, with HTTP **403** `Forbidden: invalid Host header "..."`
        (plain text), requests that arrived on a loopback TCP address while sending a non-loopback
        `Host` header (DNS-rebinding protection).

        ### HTTP rules
        - `Content-Type: application/json` is required for POST requests (else HTTP **415**
          `Content-Type must be 'application/json'`).
        - `Accept` must list **both** `application/json` and `text/event-stream` on POST (else
          HTTP **400** `Accept must contain both 'application/json' and 'text/event-stream'`).
          Because the handler runs in JSON response mode, responses are nevertheless plain
          `application/json` — no `text/event-stream` body is ever produced by this endpoint.
        - Request bodies are capped at 1 MiB (`http.MaxBytesHandler`); a larger body fails with
          HTTP **400** `failed to read body` (and the connection is closed).
        - `Mcp-Protocol-Version` is optional; supported values are `2024-11-05`, `2025-03-26`,
          `2025-06-18` and `2025-11-25` (when absent, `2025-03-26` is assumed). Any other value →
          HTTP **400** `Bad Request: Unsupported protocol version (...)`.
        - `Mcp-Session-Id` is optional and **not validated** in stateless mode: any value (or none)
          is accepted, `404 session not found` is never returned, and the server does not track
          sessions. The response to an `initialize` request nevertheless carries a randomly
          generated `Mcp-Session-Id` header that clients may echo on subsequent requests.

        ### JSON-RPC
        The body is a JSON-RPC 2.0 request object (or an array — batching is accepted only for
        protocol versions before `2025-06-18`). With JSON response mode enabled, a single request
        is answered with a single JSON-RPC response object and `Content-Type: application/json`
        (an array of responses when batching), HTTP **200**. A POST that contains only
        notifications/responses is answered with HTTP **202 Accepted** and an empty body.

        MCP methods served by the server (`tools` capability is advertised; prompts/resources are
        not registered, so their list methods answer with empty lists, and unimplemented methods
        answer a JSON-RPC error `-32601` "method not found"):

        - `initialize` → result with `protocolVersion` (client version if supported, else
          `2025-11-25`), `capabilities` = `{"logging": {}, "tools": {"listChanged": true}}` and
          `serverInfo` = `{"name": "nanokvm-cube-remote-control", "version": "v1.0.0"}`.
        - `ping` → `{}`.
        - `tools/list` → the six `cube_*` tools (see below), each with `name`, `description` and
          `inputSchema`.
        - `tools/call` → executes one tool. An unknown tool name is a JSON-RPC error `-32602`
          (`unknown tool "..."`); argument-validation failures and tool failures are returned as a
          normal result with `isError: true` and the message in `content` (not as JSON-RPC errors).
        - `prompts/list`, `resources/list`, `resources/templates/list` → empty lists (nothing is
          registered); `prompts/get`, `resources/read` → error for the unknown name/URI.
        - `logging/setLevel` → accepted (records the level), `completion/complete`,
          `resources/subscribe`, `resources/unsubscribe` → JSON-RPC error `-32601`.
        - Notifications accepted on POST: `notifications/initialized`, `notifications/cancelled`,
          `notifications/progress`, `notifications/roots/list_changed`.

        ### Execution / concurrency rules for tool calls
        - HID tools (`cube_type_text`, `cube_press_keys`, `cube_move_mouse`, `cube_click_mouse`,
          `cube_scroll_mouse`) re-check the control mode and take the coordinator's HID lane: only
          one HID operation at a time (a concurrent call fails with `MCP remote control is busy`),
          and a switch away from `mcp` cancels a running operation (`MCP control mode changed`).
        - Manual input from the web UI (WebSocket keyboard/mouse) preempts a running HID tool and
          blocks new HID calls for a 2 s cooldown (`manual control is active`); afterwards the mode
          is still `mcp`.
        - `cube_screenshot` is a read-only operation: it is not blocked by manual input but shares
          a single capture slot with the device's other screenshot consumers, and HDMI capture is
          only possible while an HDMI signal is present.

        ### Tool catalog
        `tools/list` returns exactly these six tools (argument schemas as sent by the device;
        all input objects use `additionalProperties` disallowed):

        - **`cube_type_text`** — "Type short text into the remote host". Types text character by
          character using the HID keyboard; characters without a US-layout mapping are skipped and
          reported. `text` (string, required, maxLength 1000 runes), `delayMs` (integer 0–1000,
          default 30, `0` disables the delay; the whole call must stay under 30 s of typing, which
          is also what caps `text` at 1000 runes with the default delay).
          Structured result: `{"typed": <int>, "skipped": "<skipped chars>", "skippedCount": <int>}`.
        - **`cube_press_keys`** — "Press one keyboard shortcut on the remote host". Presses one
          combo and releases it. `keys` (array of `KeyboardEvent.code` names, required, 1–14 items;
          allowed values are the eight modifier names and the key-code names listed in
          `Mcp_KeyboardKeyName`; at most 6 non-modifier keys), `holdMs` (integer 0–1000, default 50,
          `0` releases immediately).
          Structured result: `{"ok": true}`.
        - **`cube_move_mouse`** — "Move the remote mouse pointer". `mode` (`absolute` | `relative`,
          default `absolute`); with `absolute`: `x` and `y` (number 0–1, required, no deltas
          allowed); with `relative`: `deltaX` and/or `deltaY` (integer, −130048–130048, at least one
          required, no `x`/`y` allowed). Structured result: `{"ok": true}`.
        - **`cube_click_mouse`** — "Click a remote mouse button". `button`
          (`left` | `right` | `middle`, default `left`), `clicks` (integer 1–5, default 1), `mode`
          (`absolute` | `relative`, default `relative`). In `absolute` mode `x` and `y`
          (number 0–1, required) are used and only `left`/`right` are accepted; in `relative` mode
          `x`/`y` must be absent and all three buttons are allowed. Structured result:
          `{"ok": true}`.
        - **`cube_scroll_mouse`** — "Scroll the remote mouse wheel". `deltaY` (integer, required,
          −130048–130048; positive scrolls up, negative down; internally emitted as wheel reports
          of ±127). Structured result: `{"ok": true}`.
        - **`cube_screenshot`** — "Capture a JPEG screenshot from the remote display". Optional
          `quality` (integer 1–100, default 60; the device clamps it to 51–60) and `timeoutMs`
          (integer 0–30000, default 3000). Result content is a single `image/jpeg` block with the
          raw JPEG bytes base64-encoded (captures larger than 1 MiB are refused), plus structured
          result `{"ok": <bool>, "retCode": <int>, "message": "<text>", "width": <int>,
          "height": <int>, "size": <int>}` (`retCode` 5 = no HDMI signal, negative values = capture
          unavailable; failures set `isError: true`).

        ### Example exchange

        ```http
        POST /api/mcp HTTP/1.1
        Authorization: Bearer nag_mcp_9Fh2s0K3vTQ7c1yqZbXa8rLdUeWm4JgNpVtRkCs
        Content-Type: application/json
        Accept: application/json, text/event-stream

        {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"my-agent","version":"1.0"}}}
        ```

        ```http
        HTTP/1.1 200 OK
        Content-Type: application/json
        Mcp-Session-Id: 3f9m0qk8sv2jd7h1pz6xw4yn5t

        {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2025-03-26","capabilities":{"logging":{},"tools":{"listChanged":true}},"serverInfo":{"name":"nanokvm-cube-remote-control","version":"v1.0.0"}}}
        ```

        A tool call:

        ```json
        {"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"cube_move_mouse","arguments":{"mode":"absolute","x":0.5,"y":0.5}}}
        ```

        ```json
        {"jsonrpc":"2.0","id":2,"result":{"content":[{"type":"text","text":"{\"ok\":true}"}],"structuredContent":{"ok":true}}}
        ```
      security:
      - mcpApiKey: []
      parameters:
      - name: Mcp-Protocol-Version
        in: header
        required: false
        description: |
          Protocol version used for this message. Supported: `2024-11-05`, `2025-03-26`,
          `2025-06-18`, `2025-11-25`. Absent → treated as `2025-03-26`. Anything else → 400.
        schema:
          type: string
          enum:
          - '2024-11-05'
          - '2025-03-26'
          - '2025-06-18'
          - '2025-11-25'
          default: '2025-03-26'
        example: '2025-03-26'
      - name: Mcp-Session-Id
        in: header
        required: false
        description: |
          Session identifier. Optional and not validated (stateless transport); any value is
          accepted and ignored.
        schema:
          type: string
        example: 3f9m0qk8sv2jd7h1pz6xw4yn5t
      - name: Accept
        in: header
        required: true
        description: |
          Must contain both `application/json` and `text/event-stream`; otherwise HTTP 400.
          Responses are always `application/json` on this endpoint.
        schema:
          type: string
        example: application/json, text/event-stream
      requestBody:
        required: true
        description: JSON-RPC 2.0 request object (or array of them, protocol < 2025-06-18).
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mcp_JsonRpcRequest'
            examples:
              initialize:
                summary: initialize
                value:
                  jsonrpc: '2.0'
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: '2025-03-26'
                    capabilities: {}
                    clientInfo:
                      name: my-agent
                      version: '1.0'
              toolsList:
                summary: tools/list
                value:
                  jsonrpc: '2.0'
                  id: 2
                  method: tools/list
                  params: {}
              toolCall:
                summary: tools/call (screenshot)
                value:
                  jsonrpc: '2.0'
                  id: 3
                  method: tools/call
                  params:
                    name: cube_screenshot
                    arguments:
                      quality: 60
                      timeoutMs: 3000
              initializedNotification:
                summary: notifications/initialized (answered with 202)
                value:
                  jsonrpc: '2.0'
                  method: notifications/initialized
                  params: {}
      responses:
        '200':
          description: |
            JSON-RPC response (HTTP 200, `Content-Type: application/json`); an array when the
            request was batched. JSON-RPC-level errors (`-32601` method not found, `-32602` unknown
            tool / invalid params) are transported inside this body, not as HTTP statuses.
          headers:
            Mcp-Session-Id:
              description: Random session id, set on `initialize` responses (client may echo it).
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Mcp_JsonRpcResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/Mcp_JsonRpcResponse'
              examples:
                toolsList:
                  summary: tools/list response
                  value:
                    jsonrpc: '2.0'
                    id: 2
                    result:
                      tools:
                      - name: cube_type_text
                        description: Type short text into the remote host
                        inputSchema:
                          type: object
                          properties:
                            text:
                              type: string
                              description: Text to type on the remote host
                              maxLength: 1000
                            delayMs:
                              type: integer
                              description: Delay between typed characters in milliseconds; defaults to 30 when omitted, and 0 disables the delay
                              minimum: 0
                              maximum: 1000
                          required:
                          - text
                          additionalProperties: false
                toolCallError:
                  summary: Tool failure (isError)
                  value:
                    jsonrpc: '2.0'
                    id: 3
                    result:
                      content:
                      - type: text
                        text: manual control is active
                      structuredContent:
                        ok: false
                      isError: true
        '202':
          description: |
            Accepted — the POST contained only notifications (or responses) and produced no reply
            body, e.g. `notifications/initialized`.
        '400':
          description: |
            Malformed body, missing required headers, unsupported protocol version or oversized
            body. Plain-text or JSON-RPC error body depending on the stage, e.g.
            `Accept must contain both 'application/json' and 'text/event-stream'`,
            `failed to read body`, `malformed payload: ...`,
            `Bad Request: Unsupported protocol version (supported versions: 2025-11-25,2025-06-18,2025-03-26,2024-11-05)`.
          content:
            text/plain:
              schema:
                type: string
              example: 'Bad Request: Unsupported protocol version (supported versions: 2025-11-25,2025-06-18,2025-03-26,2024-11-05)'
        '401':
          description: Missing or invalid bearer key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: invalid MCP API key
        '403':
          description: |
            Either the AI control mode is not `mcp` (JSON `{"error": "MCP service is disabled"}`,
            also while a transition is running), a cross-origin browser request was detected
            (plain text `cross-origin request detected ...`), or the SDK's DNS-rebinding check
            rejected a loopback connection with a non-loopback `Host` header
            (`Forbidden: invalid Host header "..."`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP service is disabled
        '415':
          description: 'POST without `Content-Type: application/json`.'
          content:
            text/plain:
              schema:
                type: string
              example: Content-Type must be 'application/json'
        '500':
          description: The MCP config file could not be read while authenticating, or the session could not be established.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP auth unavailable
    delete:
      tags:
      - MCP
      summary: MCP endpoint — terminate the MCP session
      operationId: mcp_endpointDelete
      description: |
        Session termination of the MCP Streamable HTTP transport (same URL/auth as
        `mcp_endpointPost`, which carries the full endpoint description).

        The transport runs in stateless mode, so the server keeps no session state: a DELETE with
        any `Mcp-Session-Id` header is answered with HTTP **204 No Content** (nothing is closed,
        and the value is not validated), while a DELETE without the header is answered with HTTP
        **400** `Bad Request: DELETE requires an Mcp-Session-Id header`. The `Accept` header is not
        checked and no `Content-Type` is required for this method.
      security:
      - mcpApiKey: []
      parameters:
      - name: Mcp-Session-Id
        in: header
        required: true
        description: Session id to terminate; required, any value accepted (no validation in stateless mode).
        schema:
          type: string
        example: 3f9m0qk8sv2jd7h1pz6xw4yn5t
      responses:
        '204':
          description: Session terminated (no body). In stateless mode this is always the outcome when the header is present.
        '400':
          description: Missing `Mcp-Session-Id` header.
          content:
            text/plain:
              schema:
                type: string
              example: 'Bad Request: DELETE requires an Mcp-Session-Id header'
        '401':
          description: Missing or invalid bearer key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: invalid MCP API key
        '403':
          description: |
            The AI control mode is not `mcp` (JSON `{"error": "MCP service is disabled"}`), a
            cross-origin browser request was detected (plain text
            `cross-origin request detected ...` — `DELETE` is not a safe method, so the
            `Sec-Fetch-Site`/`Origin` checks apply to it), or the SDK's DNS-rebinding check
            rejected the request (plain text `Forbidden: invalid Host header "..."`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP service is disabled
        '500':
          description: The MCP config file could not be read while authenticating.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mcp_EndpointError'
              example:
                error: MCP auth unavailable
  /api/mcp/config:
    get:
      tags:
      - MCP
      summary: Get MCP configuration and key
      operationId: mcp_getConfig
      description: |
        Returns the MCP API key and the derived MCP state. Requires the **admin** role.

        Note that there is no stored `enabled` flag: `enabled` is derived from the AI control mode
        (`controlMode == "mcp" && !transitioning`), and the key itself lives in `/etc/kvm/mcp.json`
        (file mode `0600`). `apiKey` is empty until the key has been generated — it is created the
        first time MCP is enabled (`POST /api/mcp/config` with `enabled: true`) or by
        `POST /api/mcp/key/regenerate`; clients use it as `Authorization: Bearer <apiKey>` against
        `ANY /api/mcp`.

        The response carries `Cache-Control: no-store` because it contains a secret.

        Application-level failures (config file unreadable, control mode unreadable) answer HTTP 200
        with `{"code": -1, "msg": "get MCP config failed"}`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: MCP configuration and current control mode.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Mcp_Config'
              examples:
                enabled:
                  summary: MCP enabled with a generated key
                  value:
                    code: 0
                    msg: success
                    data:
                      enabled: true
                      apiKey: nag_mcp_9Fh2s0K3vTQ7c1yqZbXa8rLdUeWm4JgNpVtRkCs
                      controlMode: mcp
                      transitioning: false
                disabled:
                  summary: MCP not enabled and no key generated yet
                  value:
                    code: 0
                    msg: success
                    data:
                      enabled: false
                      apiKey: ''
                      controlMode: picoclaw
                      transitioning: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - MCP
      summary: Enable or disable the MCP service
      operationId: mcp_setConfig
      description: |
        Enables or disables the external MCP service. Requires the **admin** role.

        Body: `{"enabled": <boolean>}` — accepted as JSON or `application/x-www-form-urlencoded`
        (`proto.ParseFormRequest` / `c.ShouldBind`). The field is required; omitting it answers
        `{"code": -1, "msg": "invalid arguments"}` (note: `enabled: false` is valid, only its
        absence is not).

        This endpoint does not store a flag — it drives the AI control mode:

        - `enabled: true`
          - ensures an API key exists (generates one with prefix `nag_mcp_` if the config has none)
            and persists `/etc/kvm/mcp.json` **before** switching;
          - switches the control mode to `mcp` with preemption of MCP/PicoClaw activity and cleanup:
            `CancelMCP()`, `PreemptControlLeasesForMCP()` (cancels PicoClaw control operations,
            closes PicoClaw gateway sessions with reason `external MCP enabled`), then
            `StopRuntimeForMCP()` + `hid.ReleaseAllHIDStateBestEffort()`;
          - no-op if the control mode is already `mcp`.
        - `enabled: false`
          - switches `mcp` → `off` with `CancelMCP()` as preemption and HID state release as cleanup
            (`SwitchIfWithCleanup`): the switch only happens when the current mode is exactly `mcp`,
            otherwise it is skipped and the current mode is reported unchanged. The config file is
            not rewritten, so the API key is preserved.
          - The PicoClaw runtime is **not** stopped; sessions keep working chat-only.

        On success the new state is broadcast to PicoClaw gateway sessions as `control.mode_changed`
        with `source: mcp_config`.

        Failures other than a bad body answer HTTP 200 with
        `{"code": -2, "msg": "operation failed: <error>"}` — for example
        `operation failed: stop PicoClaw runtime for MCP: ...` or
        `operation failed: wait for active control operations: timed out waiting for active control operations`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mcp_SetConfigRequest'
            examples:
              enable:
                summary: Enable MCP and start using the API key
                value:
                  enabled: true
              disable:
                summary: Disable MCP (control mode back to off)
                value:
                  enabled: false
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Mcp_SetConfigRequest'
            example:
              enabled: true
      responses:
        '200':
          description: |
            Updated configuration (`code: 0`), or `code: -1` / `code: -2` with `msg` describing the
            failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Mcp_Config'
              examples:
                enabled:
                  summary: MCP enabled
                  value:
                    code: 0
                    msg: success
                    data:
                      enabled: true
                      apiKey: nag_mcp_9Fh2s0K3vTQ7c1yqZbXa8rLdUeWm4JgNpVtRkCs
                      controlMode: mcp
                      transitioning: false
                failed:
                  summary: Switch failed
                  value:
                    code: -2
                    msg: 'operation failed: stop PicoClaw runtime for MCP: PicoClaw runtime is still running'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/mcp/key/regenerate:
    post:
      tags:
      - MCP
      summary: Regenerate the MCP API key
      operationId: mcp_regenerateApiKey
      description: |
        Generates a new random MCP API key (`nag_mcp_` + 32 random bytes, base64url without
        padding) and replaces the one in `/etc/kvm/mcp.json` (file mode `0600`). Requires the
        **admin** role. No request body is used.

        Effects on existing clients: the previous key is invalid immediately, so any MCP client
        still using it receives HTTP 401 `{"error": "invalid MCP API key"}` on its next request.
        The AI control mode is **not** changed — if MCP is enabled it stays enabled and the new key
        is usable right away. Clients must be reconfigured with the key returned here (or read it
        again with `GET /api/mcp/config`).

        On failure (key generation or config write error, or control mode unreadable) the endpoint
        answers HTTP 200 with `{"code": -1, "msg": "operation failed"}`; the old key remains valid
        in that case. The response carries `Cache-Control: no-store`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Configuration containing the newly generated API key.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Mcp_Config'
              examples:
                regenerated:
                  summary: New key issued
                  value:
                    code: 0
                    msg: success
                    data:
                      enabled: true
                      apiKey: nag_mcp_Q1wE8rT5yU2iO7pA4sD6fG9hJ3kL0zX8cV5bN1mM
                      controlMode: mcp
                      transitioning: false
                failed:
                  summary: Write failure
                  value:
                    code: -1
                    msg: operation failed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/network/dns:
    get:
      operationId: net_getDns
      tags:
      - Network
      summary: Get DNS configuration
      description: |
        Returns the DNS configuration. Requires the **admin** role.

        * `mode` — `manual` or `dhcp`. Read from `/etc/kvm/network/dns.mode`; when the file is
          missing/invalid the default is `manual` if `/boot/resolv.conf` exists, otherwise `dhcp`.
        * `servers` — the configured manual servers: `/etc/kvm/network/dns.servers` (normalized,
          deduplicated, `#` comments stripped), falling back to the nameservers in
          `/boot/resolv.conf` and then to `/boot/resolv.conf.manual.bak`. Empty when unknown.
        * `effective` — nameservers actually in `/etc/resolv.conf`, i.e. what the system currently
          uses.
        * `dhcp` — nameservers learned from DHCP with their search domains: read from
          `/etc/resolv.conf.dhcp`, falling back to `/tmp/resolv.conf` and (when the mode is `dhcp`
          or no `/boot/resolv.conf` exists) to `/etc/resolv.conf`.
        * `info` — network details of the default IPv4 interface, see `NetDnsInfo`.

        `info.interface` comes from the default IPv4 route of `/proc/net/route`, or from the first
        **up** interface whose name starts with `eth`/`en`/`wlan`/`wl` and that has an IPv4 address;
        `type` is `Wired` for `eth*`/`en*` and `Wireless` for `wlan*`/`wl*`; `address` is
        `IP/prefix-length` (e.g. `192.168.1.42/24`); `subnetMask` the dotted netmask; `gateway` the
        default route gateway (empty when there is none); `searchDomains` from the DHCP resolv
        config.

        The endpoint never fails: unreadable files/absent interfaces yield empty strings and arrays
        with `code 0`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NetDnsConfig'
              example:
                code: 0
                msg: success
                data:
                  mode: manual
                  servers: *id002
                  effective: *id003
                  dhcp: *id004
                  info:
                    interface: eth0
                    type: Wired
                    address: 192.168.1.42/24
                    subnetMask: 255.255.255.0
                    gateway: 192.168.1.1
                    searchDomains: *id005
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: net_setDns
      tags:
      - Network
      summary: Set DNS configuration
      description: |
        Switches the DNS mode and, in manual mode, updates the server list. Requires the **admin**
        role. `sync` is executed after a successful change.

        Body (bound with `ShouldBind`; JSON or urlencoded form — the array field needs JSON):

        * `mode` — required, one of `manual` or `dhcp` (`oneof` validation; any other value fails
          binding and yields `-1 invalid arguments`).
        * `servers` — optional array of DNS servers, used by `manual` mode. Each entry may contain a
          trailing `#` comment; values are trimmed, deduplicated and validated with an IP parser
          (IPv4 **and** IPv6 accepted), then stored in canonical form. At most **6** servers after
          normalization.

        `manual` mode: at least one valid server is required (`dns servers are required`). The mode
        file `/etc/kvm/network/dns.mode` and `/etc/kvm/network/dns.servers` are written, the same
        list is rendered into `/boot/resolv.conf` and `/etc/resolv.conf`, and the udhcpc hook
        `/usr/share/udhcpc/default.script.d/99-nanokvm-dns` is (re)installed.

        `dhcp` mode: the currently learned DHCP servers must be available, otherwise
        `-3 no dhcp dns is currently available`. The learned config (servers and search domains) is
        cached to `/etc/resolv.conf.dhcp`, `/boot/resolv.conf` is backed up to
        `/boot/resolv.conf.manual.bak` and removed (so it cannot override the mode on the next
        boot), the manual server list is preserved in `dns.servers`, and `/etc/resolv.conf` is
        rewritten from the DHCP data.

        Error codes: `-1` `invalid arguments` (binding/validation failed); `-2` followed by the
        **raw Go error text** for manual-mode failures (`invalid dns server: <value>`,
        `too many dns servers`, `dns servers are required`, file errors); `-3` followed by the raw
        error text for dhcp-mode failures (`no dhcp dns is currently available`, file errors).
        Unlike most endpoints the `msg` field carries implementation detail, so clients should not
        parse it.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetDnsSetRequest'
            example:
              mode: manual
              servers:
              - 1.1.1.1
              - 8.8.8.8
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/network/wifi:
    get:
      operationId: net_getWifi
      tags:
      - Network
      summary: Get Wi-Fi information
      description: |
        Returns the current Wi-Fi state. Requires the **admin** role.

        * `supported` — Wi-Fi hardware present. `/etc/kvm/wifi_exist` exists; the file is created
          (and removed) by the on-device `kvm_system` process when a Wi-Fi module is detected.
        * `apMode` — the device currently runs as an access point. `/tmp/wifiap` exists; the flag is
          created by `/etc/init.d/S30wifi` when hostapd starts and removed when Wi-Fi is stopped.
        * `connected` — `/kvmapp/kvm/wifi_state` contains `1`.
        * `ssid` — content of `/etc/kvm/wifi.ssid`; when connected but that file is empty/missing the
          literal string `Wi-Fi` is returned.

        The handler short-circuits: when `supported` is `false` the other fields are returned
        zeroed (`apMode`/`connected` false, `ssid` `""`); when `connected` is `false`, `ssid` is
        `""` while `supported` and `apMode` are reported.

        This endpoint never fails — every read error degrades to a zero value and the code is `0`.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NetWifiStatus'
              example:
                code: 0
                msg: success
                data:
                  supported: true
                  apMode: false
                  connected: true
                  ssid: HomeNet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: net_connectWifiNoAuth
      tags:
      - Network
      summary: Connect Wi-Fi without auth
      security: []
      description: |
        Wi-Fi onboarding endpoint behind the setup page `/wifi`. **Public**: no session cookie is
        required (this is the endpoint used while the device is still unconfigured).

        Availability and authentication:

        * **AP-mode only.** The device must run as a Wi-Fi access point: `/etc/kvm/wifi_exist` must
          exist (a Wi-Fi module was detected) **and** `/tmp/wifiap` must exist (created by
          `/etc/init.d/S30wifi` when hostapd/udhcpd are started in AP mode). Otherwise the handler
          sleeps 2 seconds and answers `-1` `invalid mode`.
        * The AP passphrase (stored in `/kvmapp/kvm/ap.pass`, the same value hostapd uses for the
          device's own AP) must be supplied in the `X-AP-Key` request header. It is compared in
          constant time; a missing/empty header, an empty stored password or a mismatch answers
          `-4` `unauthorized` after a 2-second delay.

        Rate limiting / abuse protection: these public endpoints implement no counter or lockout.
        Each rejected request is deliberately delayed (2 s for a wrong key or a wrong mode, 1 s for
        a body that fails to bind) and the attacker must already be associated with the device's own
        AP, which is what limits guessing.

        Request body (JSON, what the web UI sends, or urlencoded form): `ssid` and `password`, both
        required (simply "not empty" — no length or charset validation is applied).

        Effects on success: the credentials are written to `/etc/kvm/wifi.ssid` and
        `/etc/kvm/wifi.pass`, then `/kvmapp/kvm/wifi_try_connect` is touched, which makes the Wi-Fi
        script switch the module from AP mode to station mode and join the network. The handler
        then **sleeps 5 seconds** before answering, so the current AP association (and this
        connection) normally drops before the response arrives.

        Error codes: `-1` `invalid mode` (not AP mode / no Wi-Fi hardware), `-4` `unauthorized`
        (bad or missing `X-AP-Key`), `-2` `invalid parameters` (body could not be bound/validated),
        `-3` `failed to connect wifi` (writing the credentials or the trigger file failed).
        Success is `code 0` with no payload.
      parameters:
      - name: X-AP-Key
        in: header
        required: true
        description: |
          Passphrase of the device's own Wi-Fi access point (content of `/kvmapp/kvm/ap.pass`).
          Compared in constant time; the header is required, an empty value is rejected.
        schema:
          type: string
          example: kvm123456
        example: kvm123456
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetWifiConnectRequest'
            example:
              ssid: HomeNet
              password: my-wifi-password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
  /api/network/wifi/connect:
    post:
      operationId: net_connectWifi
      tags:
      - Network
      summary: Connect Wi-Fi
      description: |
        Joins a Wi-Fi network from the settings page. Requires the **admin** role.

        Body (bound with `ShouldBind`, JSON or urlencoded form): `ssid` and `password`, both
        required (only presence is validated).

        The handler writes `/etc/kvm/wifi.ssid` and `/etc/kvm/wifi.pass` and touches
        `/kvmapp/kvm/wifi_try_connect`, which makes the Wi-Fi script (re)connect in station mode.
        It then waits for the connection:

        * already connected: sleeps 12 seconds, then polls up to 3 times;
        * not connected: polls up to 7 times;

        polling sleeps 2 seconds per attempt and succeeds as soon as `/kvmapp/kvm/wifi_state`
        contains `1` **and** the SSID file is non-empty. The call is therefore **blocking**
        (typically ~14 s, up to ~18 s); if the connection cannot be confirmed within that window it
        answers `-3 failed to get wifi status`.

        Note: if this endpoint is called over the Wi-Fi link the device is currently using, that
        link (and the request itself) may be interrupted before the response is delivered.

        Error codes: `-1` `invalid parameters` (binding/validation failed), `-2`
        `failed to connect wifi` (writing the SSID/password/trigger file failed), `-3`
        `failed to get wifi status` (no confirmed connection within the polling window).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetWifiConnectRequest'
            example:
              ssid: HomeNet
              password: my-wifi-password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/network/wifi/disconnect:
    post:
      operationId: net_disconnectWifi
      tags:
      - Network
      summary: Disconnect Wi-Fi
      description: |
        Disconnects the Wi-Fi client and clears the stored credentials. Requires the **admin**
        role. No request body.

        The handler runs `/etc/init.d/S30wifi stop` (kills hostapd/udhcpd/wpa_supplicant/udhcpc),
        waits 5 seconds and then deletes `/etc/kvm/wifi.ssid` and `/etc/kvm/wifi.pass`, so the device
        does not reconnect on the next boot.

        Warning: if the caller reached the device over Wi-Fi, that connection is lost — the device
        must then be reached over Ethernet or by using its AP mode again.

        Error codes: `-1` `failed to stop wifi` (the init script exited non-zero; the network is
        left untouched). Success is `code 0` with no payload.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/network/wifi/verify:
    post:
      operationId: net_verifyApLogin
      tags:
      - Network
      summary: Verify AP login
      security: []
      description: |
        Verifies the AP passphrase before the onboarding form is shown. **Public**: no session
        cookie is required.

        There is no request body — the candidate password is sent in the `X-AP-Key` header. The
        handler applies the same guard as `POST /api/network/wifi`:

        * not in AP mode (Wi-Fi module missing, `/tmp/wifiap` absent) → sleeps 2 seconds and answers
          `-1` `invalid mode`;
        * missing/incorrect `X-AP-Key`, or no password stored in `/kvmapp/kvm/ap.pass` → sleeps
          2 seconds and answers `-4` `unauthorized` (constant-time comparison);
        * correct password → `code 0` with no payload, which the web UI uses to unlock the SSID /
          password form.

        No counter-based rate limiting or lockout is implemented for this endpoint: every failed
        attempt merely costs a fixed 2-second delay (and the client must be associated to the
        device's AP). The official web UI additionally disables the submit button while a request is
        pending.
      parameters:
      - name: X-AP-Key
        in: header
        required: true
        description: |
          Passphrase of the device's own Wi-Fi access point (content of `/kvmapp/kvm/ap.pass`).
        schema:
          type: string
          example: kvm123456
        example: kvm123456
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
  /api/network/wol:
    post:
      operationId: net_wakeOnLan
      tags:
      - Network
      summary: Wake on LAN
      description: |
        Sends a Wake-on-LAN magic packet to the given MAC address. Requires an authenticated
        session (any role).

        The body is bound with `ShouldBind` (`application/json` or urlencoded form); `mac` is
        required. Accepted spellings: 12 hex digits with or without `:`, `-` or `.` separators
        (case-insensitive); the value is upper-cased and normalized to `AA:BB:CC:DD:EE:FF` before
        use. Invalid values are rejected with `-2` `invalid MAC address`.

        The packet is sent by running `ether-wake -b <mac>` (broadcast). On success the MAC is
        appended to the Wake-on-LAN history file `/etc/kvm/cache/wol` if it is not already in the
        list (the file keeps `MAC` or `MAC name` lines; no name is set here).
        On failure the **raw combined output of the command** is returned as `msg`.

        Error codes: `-1` `invalid arguments` (binding/validation failed), `-2`
        `invalid MAC address`, `-3` `<command output>` (ether-wake failed).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetWolRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wol/mac:
    get:
      operationId: net_getWolMacs
      tags:
      - Network
      summary: Get mac list
      description: |
        Returns the saved Wake-on-LAN MAC history. Requires an authenticated session (any role).

        One entry per line of `/etc/kvm/cache/wol`:

        * `AA:BB:CC:DD:EE:FF` — MAC only, or
        * `AA:BB:CC:DD:EE:FF <name>` — MAC followed by a single space and the display name (the name
          may itself contain spaces; the split is done at the first whitespace).

        Blank lines are skipped. A missing history file is not an error — `data.macs` is an empty
        array and the code is `0`. Any other read error is reported as `-2` `open file error`.

        Note the entries are plain strings; the client is expected to split MAC and name itself
        (the official web UI splits at the first whitespace run).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/NetWolMacList'
              example:
                code: 0
                msg: success
                data:
                  macs: *id006
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: net_deleteWolMac
      tags:
      - Network
      summary: Delete mac
      description: |
        Removes a MAC address from the Wake-on-LAN history. Requires the **admin** role.

        The body is bound with `ShouldBind`; the official web UI sends a JSON body with `mac` (a
        urlencoded form body is also accepted). The MAC is normalized like everywhere else
        (`AA:BB:CC:DD:EE:FF`), malformed values give `-2` `invalid MAC address`.

        All lines whose normalized MAC equals the requested one are dropped; other lines keep their
        names. Deleting a MAC that is not in the list is **not** an error (the code is `0`, nothing
        changes). A read failure on the history file gives `-2` `read failed`, a write failure
        `-3` `write failed`.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetWolMacRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/network/wol/mac/name:
    post:
      operationId: net_setWolMacName
      tags:
      - Network
      summary: Set mac name
      description: |
        Sets or replaces the display name of an entry in the Wake-on-LAN history. Requires the
        **admin** role.

        Body (bound with `ShouldBind`, JSON or urlencoded form): `mac` and `name`, both required.
        The name is sanitized by collapsing every run of whitespace to a single space and trimming;
        if the result is empty the request fails with `-1` `invalid arguments`.

        The MAC (normalized to `AA:BB:CC:DD:EE:FF`) must already exist in `/etc/kvm/cache/wol`:
        otherwise the handler answers `-3` `write failed` — the message is about the write, but the
        actual cause is "mac not found". On success the line becomes `MAC Name`.

        Error codes: `-1` `invalid arguments` (binding failed or the sanitized name is empty),
        `-2` `invalid MAC address`, `-2` `read failed` (history unreadable),
        `-3` `write failed` (MAC not found or the file could not be written).
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NetWolMacNameRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
              name: Office PC
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                code: 0
                msg: success
                data: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/actions:
    post:
      tags:
      - PicoClaw Internal
      summary: Execute HID keyboard/mouse actions
      operationId: picol_executeActions
      description: |
        Executes HID (keyboard/mouse) input actions on the controlled host. Reserved for the
        on-device PicoClaw runtime — **not for remote clients**.

        **Security** — loopback only (`127.0.0.1`/`::1`) plus the shared secret in the
        `X-NanoKVM-Internal-Token` header (read from `/etc/kvm/.picoclaw_internal_token`,
        constant-time compared). Anything else is HTTP `401` (`"unauthorized"`). When the device
        runs HTTPS, this path is allow-listed on the plain-HTTP listener for loopback callers
        holding a valid token.

        **Session** — `X-PicoClaw-Session-ID` is required. The call holds the shared PicoClaw
        session lock for that session while it runs (renewed before every action); when another
        session owns the lock, the request fails with `AI_LOCK_HELD` and the owner id in
        `session_id`.

        **Control mode** — PicoClaw must own device control (`picoclaw` mode, no transition in
        progress) for the whole request. Otherwise: `CONTROL_REQUIRED` ("PicoClaw device control
        is not enabled" when the mode is `off`), `CONTROL_OWNED_BY_MCP` ("external MCP owns
        device control"), `CONTROL_TRANSITIONING` ("device control is switching"),
        `AI_MODE_CONFLICT`, or `RUNTIME_UNAVAILABLE` when the control status cannot be read. The
        whole call is bounded to **35 seconds**; exceeding it fails with `INVALID_ACTION`
        "PicoClaw control operation exceeded the 35 second limit", and switching the control mode
        during the call cancels it with `AI_MODE_CONFLICT` "PicoClaw control operation canceled
        because the control mode is switching".

        **Request body** — raw JSON in one of two shapes: a single action object
        (`{"action": "...", ...}`) or a batch (`{"actions": [ ... ]}`) executed in order within
        the same request. An empty body is `INVALID_ACTION` "empty action payload"; a JSON parse
        failure or a body that is neither shape (including an empty batch) is "invalid action
        payload".

        **Actions** (name matched case-insensitively after trimming; there are no separate
        press/hold/release or paste actions — key strokes are expressed through `hotkey`/`type`,
        and screenshots use `GET /api/picoclaw/screenshot` or the `kvm_screenshot` MCP tool):

        | action | required fields | optional fields | behaviour |
        |--------|-----------------|-----------------|-----------|
        | `click` | `x`, `y` | `button` (default `left`) | Move to (x,y), press the button, hold ~40 ms, release. |
        | `move` | `x`, `y` | — | Move to (x,y) without pressing any button. |
        | `drag` | `from`, `to` (objects with `x`,`y`) | `button` (default `left`) | Move to `from`, press, 10 interpolated moves to `to`, release. |
        | `scroll` | — | `x`, `y` (default 0.5/0.5), `direction` (`up` default or `down`), `amount` (default 1; `0` also means 1) | Wheel one notch × `amount` at that position, ~20 ms apart. |
        | `type` | `text` (non-empty) | — | Type the text: for each character a key-down + key-up report from the US HID map, ~30 ms apart. |
        | `hotkey` | `keys` | — | Press a combination: modifiers are OR'ed into the report, up to 6 non-modifier keys; hold ~40 ms, then release. |
        | `wait` | — | `duration_ms` (0–30000, default 0) | Pause without any HID writes. |

        `x`/`y` are normalized floats in `[0,1]` (fraction of the screen) mapped to 16-bit
        absolute HID coordinates; missing values are rejected ("action requires x and y" /
        "action requires point coordinates") and out-of-range values with "coordinates must be
        within [0,1]". `button` accepts `left` (default), `right`, `middle`, `back`, `forward`;
        anything else is "invalid mouse button". `keys` accepts a JSON array or a comma-separated
        string; entries are KeyboardEvent-style names (`KeyA`, `Digit1`, `Enter`, `F1`,
        `ArrowUp`, `AudioVolumeUp`, ...) or aliases (`CTRL`, `SHIFT`, `ALT`, `OPTION`, `META`,
        `WIN`, `CMD`, `SUPER`, `ESC`, `RETURN`, `DEL`, `UP`, ...); errors: "hotkey requires at
        least one key", "hotkey supports at most 6 non-modifier keys", "unsupported key: <key>".
        `type` supports the characters of the US layout (letters, digits, punctuation and
        `\n`/`\t`/space); other characters fail with "unsupported character in type action".
        `wait` validates `duration_ms` ("wait duration must be >= 0", "wait duration must be <=
        30000 milliseconds"). `scroll` validates `amount` ("scroll amount must be > 0" for
        negative values) and `direction` ("invalid scroll direction"). An unknown action name is
        "unknown or invalid action". When an execution or action-validation failure occurs
        inside the execution loop (including per-action validation like bad coordinates), the
        server first zeroes all HID state (releases keys and buttons).

        **Response** — `{"code":0,"msg":"success","data":{...}}` with the aggregated result:
        `action` is `"batch"` when more than one action ran, otherwise the executed action name;
        `hid_writes` counts the USB HID reports written (keyboard reports on HID0, absolute mouse
        reports on HID2).

        **Errors** — structured body `{"code": "<CODE>", "message": "..."}` with HTTP 200;
        failures inside a batch add the 0-based `index` of the failing action, and lock errors
        add the owning `session_id`. Codes: `INVALID_ACTION`, `AI_LOCK_HELD`,
        `SESSION_ID_MISSING`, `CONTROL_REQUIRED`, `CONTROL_OWNED_BY_MCP`,
        `CONTROL_TRANSITIONING`, `AI_MODE_CONFLICT`, `RUNTIME_UNAVAILABLE`.
      security:
      - internalToken: []
      parameters:
      - in: header
        name: X-PicoClaw-Session-ID
        required: true
        schema:
          type: string
        description: |
          Id of the PicoClaw gateway session executing the actions (also the session that holds
          the device-control lock while the request runs).
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/PicoLocalAction'
              - $ref: '#/components/schemas/PicoLocalActionBatch'
            examples:
              batch:
                summary: Click, type and confirm
                value:
                  actions:
                  - action: click
                    x: 0.5
                    y: 0.5
                    button: left
                  - action: type
                    text: notepad
                  - action: wait
                    duration_ms: 200
                  - action: hotkey
                    keys:
                    - ENTER
              single:
                summary: Single mouse move
                value:
                  action: move
                  x: 0.2
                  y: 0.8
      responses:
        '200':
          description: |
            Result envelope on success; structured `{"code", "message"}` error body (HTTP 200)
            on application failure.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PicoLocalActionResult'
                - $ref: '#/components/schemas/PicoLocalError'
              example:
                code: 0
                msg: success
                data:
                  action: batch
                  duration_ms: 742
                  hid_writes: 12
                  executed_actions: 5
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/picoclaw/agent/profile:
    post:
      tags:
      - PicoClaw
      summary: Switch the PicoClaw agent profile
      operationId: pico_updateAgentProfile
      description: |
        Copies the selected agent profile file over the PicoClaw workspace `AGENT.md` and
        re-evaluates the runtime state, so the next chat turn uses the new persona.

        **Requires the admin role.**

        Accepted values for `profile` (exact, case-sensitive):

        | value | source file copied | persona (`name:` in the file) |
        |-------|--------------------|-------------------------------|
        | `default` | `picoclaw/AGENT.md` | `pico` — general assistant |
        | `kvm` | `picoclaw/AGENT_KVM.md` | `pico-kvm` — NanoKVM device operator |

        The source file is searched relative to the server working directory (`picoclaw/` or
        `docs/`), under `/kvmapp/picoclaw/`, and next to the server binary
        (`<binary dir>/../picoclaw/`). The destination is the `AGENT.md` inside the
        PicoClaw workspace (`agents.defaults.workspace` from `config.json`, otherwise
        `<picoclaw home>/workspace`). Runtime status field `agent_profile` is derived by reading
        that file back (`pico` is reported as `default`, anything else as `kvm`).

        The request reloads the gateway configuration and re-checks the runtime after the copy
        (errors of that re-check are ignored). It holds the runtime lifecycle lock, but does
        **not** require PicoClaw to own device control and does not restart the runtime or close a
        connected gateway session. (The web UI opens a gateway connection afterwards when none is
        open.)

        Application failures use the structured `PicoError` body `{code, message}` returned with
        **HTTP 200**: `INVALID_ACTION` "invalid agent profile payload" (body is not valid JSON) or
        "invalid agent profile" (value is not `default`/`kvm`); `RUNTIME_UNAVAILABLE` with the
        underlying message, e.g. "agent profile source not found: AGENT_KVM.md", "failed to create
        picoclaw workspace: ...", "failed to read agent profile source: ..." or "failed to write
        picoclaw AGENT.md: ...".
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicoAgentProfileRequest'
            example:
              profile: kvm
      responses:
        '200':
          description: |
            Profile applied. `data` contains the applied profile and the refreshed runtime status
            (including `agent_profile`). Application failures also use HTTP 200 with a
            `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoAgentProfileResult'
              example:
                code: 0
                msg: success
                data:
                  profile: kvm
                  status:
                    ready: true
                    installed: true
                    installing: false
                    install_progress: 100
                    install_stage: installed
                    install_path: /usr/bin/picoclaw
                    agent_profile: kvm
                    model_configured: true
                    model_name: gpt-5.4
                    status: ready
                    config_error: ''
                    last_error: ''
                    checked_at: '2026-10-01T05:30:25Z'
                    current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                    restoring: false
                    runtime_intent:
                      desired_running: true
                      updated_at: '2026-10-01T05:30:25Z'
                      updated_by: web
                      last_started_at: '2026-10-01T05:30:25Z'
                      last_stopped_at: '2026-10-01T12:00:00Z'
                      last_error: ''
                    control_mode: picoclaw
                    transitioning: false
                    control:
                      mode: picoclaw
                      transitioning: false
                      can_control: true
                      last_error: ''
                      changed_at: '2026-10-01T05:29:58Z'
                    capabilities:
                      chat: true
                      read_only_tools: true
                      device_write: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/gateway/ws:
    get:
      tags:
      - PicoClaw
      summary: Connect to the PicoClaw gateway (WebSocket proxy)
      operationId: pico_connectGateway
      description: |
        Browser-facing WebSocket that relays the chat/tool protocol to the PicoClaw gateway
        process on the device. **Requires the admin role** (`nano-kvm-token` cookie; browsers
        send the cookie on the WebSocket handshake automatically).

        ## Connection

        ```
        ws(s)://<device>/api/picoclaw/gateway/ws?session_id=<uuid>
        ```

        `session_id` is optional: when missing or empty the server generates a UUIDv4 and uses it
        for the whole connection. The official web UI generates a UUIDv4 in the browser, stores it
        and reuses it (`rotateSession()` starts a new one for "new conversation"). The session id
        is the key under which the PicoClaw runtime stores the transcript
        (`agent:main:pico:direct:pico:<session_id>`), so it is also the id used by the sessions
        endpoints.

        The server then dials the upstream PicoClaw gateway (see *Upstream* below) and only
        upgrades the browser connection afterwards. Server-side prerequisites checked before the
        upgrade, in order:

        1. Control-mode status readable, otherwise **HTTP 200** with
           `{"code": "RUNTIME_UNAVAILABLE", "message": "<error>"}`.
        2. The control mode must not be `mcp` and must not be transitioning — mode `off` is
           allowed (chat without device writes). Otherwise the request is rejected with **HTTP
           409** and `{"code": "CONTROL_TRANSITIONING"|"CONTROL_OWNED_BY_MCP", "message":
           "device control is switching"|"external MCP owns device control"}`.
        3. The session lock must be free or already owned by this `session_id`; otherwise **HTTP
           409** `{"code": "AI_LOCK_HELD", "message": "another PicoClaw session is running"}`.
           (The lock is a 30-minute lease; it is renewed by traffic and by the server's ping
           ticks.) A session id whose gateway session is already open is rejected with **HTTP
           409** `{"code": "AI_LOCK_HELD", "message": "session is already connected"}`.
        4. The PicoClaw config must be loadable and the upstream WebSocket must connect; on
           failure the handler returns without upgrading, so the browser sees a failed handshake
           (WebSocket close code 1006) rather than a close frame.

        On success the server answers **101 Switching Protocols** and the relay starts. While a
        session is active the server enables the latest-frame cache of the MJPEG stream so the
        agent's screenshots are cheap, and it cleans the `<tmp>/picoclaw_media` directory when the
        last session closes.

        ## Frame relay

        After the upgrade the connection is a **transparent, symmetric relay of text frames**:
        every message the browser sends is forwarded verbatim to the upstream gateway and every
        text message from the gateway is forwarded verbatim to the browser. The proxy only parses
        frames to manage capture leases (see below); it does not otherwise transform them.

        - **Browser → server → gateway**: JSON text frames. The web UI sends
          `{"id": "<uuid>", "session_id": "<uuid>", "type": "message.send", "payload":
          {"content": "<text>", "max_steps": 20, "max_runtime_ms": 120000}}` to start a task and
          `{"type": "message.cancel", "session_id": "<uuid>", "payload": {}}` to cancel the
          running task. Binary frames from the browser are relayed as well.
        - **Gateway → server → browser**: JSON text frames, e.g. `typing.start`, `typing.stop`,
          `pong`, `error`, `message.create` / `message.update` (assistant output; text is taken
          from `payload.content`, `content`, `payload.text` or `text` and may be a string or an
          array of `{text}` parts), observation frames carrying `payload.data.image_base64`, and
          tool-action frames carrying `payload.action` / `tool_name` (optionally `x`, `y`).
          A **binary** message from the gateway is treated as a protocol error: the server
          closes the browser connection with code **4005** ("upstream sent unsupported binary
          message").

        Message size: both connections have a read limit of `max_message_bytes` (default
        **1048576** bytes / 1 MiB) and a write deadline of `write_timeout_ms` (default 10 s);
        a peer exceeding the limit is closed.

        ## Heartbeat and timeouts

        The server sends WebSocket **ping control frames** (`payload` = `"downstream"` /
        `"upstream"`) every `ping_interval_ms` (default **30000 ms**; overridable via the PicoClaw
        pico-channel setting `ping_interval` in seconds). Each connection's read deadline is
        `read_timeout_ms` (default **60000 ms**; overridable via the pico-channel `read_timeout`
        setting in seconds) and is reset on every pong received. Browsers answer ping frames
        automatically, so a healthy browser connection is kept alive indefinitely; if the browser
        (or the gateway) stops answering pings, its read fails and the relay closes.

        Every relayed frame and every ping tick renews the session lock for this session id. If
        the lock has been taken over (or released) in the meantime, the connection is closed with
        code **4004** ("session lock lost").

        ## Server-injected messages

        Besides the relayed frames, the server itself may push text frames to the browser:

        - `control.mode_changed` — `{"type": "control.mode_changed", "timestamp": <ms>,
          "payload": {"mode": "off"|"mcp"|"picoclaw", "transitioning": <bool>, "can_control":
          <bool>, "last_error": "<text>", "changed_at": "<RFC3339>", "source": "<text>"}}`.
          Sent to every active session when device control changes, e.g. when the runtime is
          stopped (`source: "runtime_stop"`) or uninstalled (`source: "runtime_uninstall"`), or
          when another endpoint grants control to MCP.
        - `observation` — `{"type": "observation", "id": "<uuid>", "session_id": "<uuid>",
          "timestamp": <ms>, "payload": {"content": "<text>", "image_base64": "<jpeg>",
          "mime_type": "image/jpeg"}}`. Injected when the (separately documented) MCP endpoint
          captures a screenshot for the active PicoClaw session.

        Capture leases: on `message.send` the server takes an HDMI capture lease for
        `payload.max_runtime_ms` (default 2 minutes, clamped to 30 minutes) keyed by the message
        `id`; it is released on `message.cancel`, on the matching `typing.stop` /
        `message.create` / `message.update` / `error` frame from the gateway, or when the session
        closes. This keeps the agent's screen-read path warm during a task.

        ## Upstream (informative)

        The server connects to the gateway address from the PicoClaw config
        (`gateway.host`/`gateway.port`, defaults `127.0.0.1:18790`), always appending
        `session_id=<id>` and, when `allow_token_query` is enabled for the pico channel, the pico
        channel token as `?token=...`. When a pico channel token is configured it is also sent as
        `Authorization: Bearer <token>`; connect/handshake timeout is `connect_timeout_ms`
        (default 10 s). A handshake answered with 401 marks the runtime status as `config_error`
        ("gateway authentication failed"); 404 means the pico channel is unavailable.

        ## Close codes

        | Code | Meaning |
        |------|---------|
        | `1000` | Normal closure — browser closed the socket (`close()` sends `NORMAL_CLOSURE`), the session was released via `DELETE /api/picoclaw/runtime/session`, or the peer closed normally. |
        | `1006` | Handshake failed before the upgrade (runtime unavailable, gateway unreachable) — reported by the browser, never sent as a frame. |
        | `4001` | `AI_LOCK_HELD` — defined for lock conflicts (the pre-upgrade rejection uses HTTP 409 instead). |
        | `4002` | `RUNTIME_UNAVAILABLE` — defined for runtime/gateway failures before the relay starts. |
        | `4003` | `AUTH_FAILED` — mapped by the web UI; the server authenticates on the handshake and reports revoked sessions as `4401`. |
        | `4004` | `AI_TAKEN_OVER` — "session lock lost" (another PicoClaw session took over). |
        | `4005` | `UPSTREAM_CLOSED` — the gateway connection closed unexpectedly or sent a binary frame. |
        | `4006` | `AI_MODE_CONFLICT` — device control switched away from PicoClaw with reason "external MCP enabled" (used by the control-mode switching endpoints; `/runtime/stop` and `/runtime/uninstall` use `4007`). |
        | `4007` | `RUNTIME_STOPPED` — "PicoClaw runtime stopped" (runtime stop/uninstall, or the persisted intent was disabled). |
        | `4401` | Session expired or revoked — the admin session was invalidated (logout, password change, user disabled); the server closes with reason "session expired or revoked". |

        The official web UI treats `1000`, `4006` and `4007` as normal termination (no reconnect)
        and auto-reconnects after other codes with an increasing delay (1-5 s).
      security:
      - cookieAuth: []
      parameters:
      - in: query
        name: session_id
        required: false
        schema:
          type: string
          format: uuid
        description: |
          PicoClaw session id. Omit to let the server generate one (UUIDv4). Reusing an id
          re-attaches to the same stored transcript; an id already connected is rejected with
          HTTP 409.
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols) — the relay described above.
        '200':
          description: |
            The handshake was not upgraded because the control-mode status could not be read (or
            the pre-upgrade gateway/config step failed and the handler returned without writing a
            response). Body: `PicoError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoError'
              example:
                code: RUNTIME_UNAVAILABLE
                message: gateway is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            Device control cannot be granted to PicoClaw right now (`CONTROL_TRANSITIONING`,
            `CONTROL_OWNED_BY_MCP`) or the session is already in use (`AI_LOCK_HELD`). Body:
            `PicoError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoError'
              example:
                code: AI_LOCK_HELD
                message: another PicoClaw session is running
  /api/picoclaw/load-image:
    post:
      tags:
      - PicoClaw Internal
      summary: Send an image file to the PicoClaw agent
      operationId: picol_loadImage
      description: |
        Hands the connected PicoClaw agent an image file to work on: the server writes a
        `message.send` text frame on the agent gateway WebSocket whose payload is an instruction
        telling the agent to call its `load_image` tool with exactly `{"path": "<path>"}`, not to
        ask the user to re-upload the image, not to modify the path, not to inspect the file with
        `read_file` or any other tool, and then to continue with the user prompt. The server
        never reads the file — `path` is only trimmed and embedded into the instruction.
        Reserved for the on-device runtime; **not for remote clients**.

        **Security** — loopback only (`127.0.0.1`/`::1`) plus the shared secret in the
        `X-NanoKVM-Internal-Token` header (read from `/etc/kvm/.picoclaw_internal_token`,
        constant-time compared); anything else is HTTP `401` (`"unauthorized"`). When the device
        runs HTTPS, this path is allow-listed on the plain-HTTP listener for loopback callers
        holding a valid token.

        **Session** — the `X-PicoClaw-Session-ID` header names the gateway session; when absent,
        the current session-lock owner is used. The session must be registered and active with a
        live agent (upstream) connection, otherwise `RUNTIME_UNAVAILABLE` "picoclaw session is
        not connected" / "picoclaw session is not active" (with `session_id`); when neither the
        header nor a lock owner exists, `SESSION_ID_MISSING`.

        **Body** — `path` (required, non-empty after trimming; no further validation), `prompt`
        (optional; defaults to `"Describe the image briefly."`), `filename` (accepted but
        currently unused by the server; reserved for forward compatibility). A malformed JSON
        body is `INVALID_ACTION` "invalid load image payload"; a missing path is `INVALID_ACTION`
        "image path is required".

        The instruction delivered to the agent is:

        ```
        Call `load_image` first with this exact argument object:
        ```json
        {"path":"<path>"}
        ```

        Do not ask the user to re-upload the image. Do not modify the path. Do not use
        `read_file` or any other tool to inspect this image directly.

        After `load_image` succeeds, treat the loaded image as the current task input and
        continue with this request:
        <prompt>
        ```

        **Response** — `{"accepted": true, "session_id": ..., "message_id": <uuid of the
        message.send frame>, "path": <trimmed path>, "user_prompt": <prompt after
        normalization>, "instructed_at": <RFC 3339 time>}`. A write failure to the agent reports
        `RUNTIME_UNAVAILABLE` "failed to deliver image instruction to picoclaw".
      security:
      - internalToken: []
      parameters:
      - in: header
        name: X-PicoClaw-Session-ID
        required: false
        schema:
          type: string
        description: |
          Optional. Gateway session that receives the instruction; when empty, the current
          session-lock owner is used.
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicoLocalLoadImageRequest'
            example:
              path: /tmp/picoclaw_media/upload-1.png
              prompt: What error message is shown in the dialog?
      responses:
        '200':
          description: |
            Result envelope on success; structured `{"code", "message"}` error body (HTTP 200)
            on application failure.
          content:
            application/json:
              schema:
                oneOf:
                - allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PicoLocalLoadImageResult'
                - $ref: '#/components/schemas/PicoLocalError'
              example:
                code: 0
                msg: success
                data:
                  accepted: true
                  session_id: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  message_id: 3b0c8f4e-1d2a-4c6b-8e9f-0a1b2c3d4e5f
                  path: /tmp/picoclaw_media/upload-1.png
                  user_prompt: What error message is shown in the dialog?
                  instructed_at: '2026-10-01T13:34:12.123456789+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/picoclaw/mcp:
    post:
      tags:
      - PicoClaw Internal
      summary: Internal MCP endpoint (JSON-RPC 2.0) for the PicoClaw runtime
      operationId: picol_mcpRequest
      description: |
        Internal Model Context Protocol endpoint used by the on-device PicoClaw runtime: MCP
        JSON-RPC 2.0 over a single HTTP `POST`. This is **not** the public `/api/mcp` endpoint
        (that one is the multi-client MCP server authenticated with an `Authorization: Bearer
        nag_mcp_...` key and gated by the MCP enabled/disabled switch); this internal endpoint is
        loopback-only, uses the `X-NanoKVM-Internal-Token` secret from
        `/etc/kvm/.picoclaw_internal_token`, ignores the MCP API key, is not affected by the MCP
        service switch, speaks plain JSON-RPC per request (no SSE, no handshake required before
        other methods) and is **not intended for remote clients**.

        **Security** — accepted only from loopback (`127.0.0.1`/`::1`) with a valid
        `X-NanoKVM-Internal-Token` header (constant-time compared); anything else is HTTP `401`
        (`"unauthorized"`). When the device runs HTTPS, this path is allow-listed on the
        plain-HTTP listener for loopback callers holding a valid token.

        **Transport** — one JSON-RPC request object per HTTP request, body `application/json`.
        A body that is not valid JSON is answered with HTTP `400` and JSON-RPC error `-32700`
        "parse error"; a `jsonrpc` field other than `"2.0"` gets `-32600` "invalid request:
        jsonrpc must be 2.0". The response echoes `id` verbatim (`null` when the request had
        none) and carries either `result` or `error`. The optional `X-PicoClaw-Session-ID`
        header is used for the observation side effect of `kvm_screenshot` (and as the session
        for `kvm_actions` when present).

        **Methods**:

        | method | result |
        |--------|--------|
        | `initialize` | `{"protocolVersion":"2024-11-05","capabilities":{"tools":{}},"serverInfo":{"name":"nanokvm","version":"1.0.0"}}` |
        | `ping` | `{}` |
        | `tools/list` | `{"tools":[...]}` — the two tool definitions (`kvm_screenshot`, `kvm_actions`), each with `name`, `description` and `inputSchema` (see `PicoLocalMcpTool`) |
        | `tools/call` | params `{"name": "...", "arguments": {...}}`; see the tools below |

        Unknown methods get `-32601` "method not found: <method>". `tools/call` whose `params`
        cannot be parsed or that names another tool gets `-32602` ("invalid params" / "unknown
        tool: <name>"). Tool failures are *not* JSON-RPC errors: they are normal results with
        `"isError": true` and a text block holding the message (see
        `PicoLocalMcpToolCallResult`).

        **Tool `kvm_screenshot`** — optional arguments `width` (integer, target width in pixels,
        default 960), `height` (integer, target height; the size is fitted to the screen
        resolution when unset) and `quality` (integer, JPEG quality 1–100, default 60). Captures
        through the same pipeline as `GET /api/picoclaw/screenshot` in base64 form. Result:

        ```json
        {"content":[{"type":"text","text":"screenshot captured"},
                    {"type":"image","data":"<base64 JPEG>","mimeType":"image/jpeg"}],
         "meta":{"source_width":1280,"source_height":720,"capture_width":960,"capture_height":540}}
        ```

        Capture failures produce `"isError": true` with one text block (`"no HDMI signal or
        frame unavailable"`, `"failed to capture screenshot"` or `"screenshot capture
        canceled"`). A successful capture is additionally forwarded to the active gateway
        WebSocket (if one exists) as a `{"type":"observation", "payload":{"content",
        "image_base64", "mime_type"}}` text frame.

        **Tool `kvm_actions`** — arguments `actions` (required array; each element is one of the
        action objects accepted by `POST /api/picoclaw/actions`, with `action` required).
        Requires PicoClaw to own device control; otherwise the JSON-RPC **error** `-32003` is
        returned with `data: {"reason": <CODE>, "control_mode": ..., "transitioning": ...}`
        where `<CODE>` is `CONTROL_REQUIRED`, `CONTROL_OWNED_BY_MCP`, `CONTROL_TRANSITIONING`,
        `AI_MODE_CONFLICT` or `RUNTIME_UNAVAILABLE`. On success the result is a single text block
        holding the `ActionResult` JSON (see `PicoLocalActionResult`). Execution problems
        ("empty actions array", "invalid actions payload", "invalid PicoClaw session", per-action
        errors, control-mode loss mid-call) are returned as `"isError": true` text results. The
        session used for the lock/state is the `X-PicoClaw-Session-ID` header when present,
        otherwise the current session-lock owner.
      security:
      - internalToken: []
      parameters:
      - in: header
        name: X-PicoClaw-Session-ID
        required: false
        schema:
          type: string
        description: |
          Optional. Used to publish the `kvm_screenshot` observation to that session's gateway
          WebSocket and, for `kvm_actions`, as the session executing the actions.
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicoLocalJsonRpcRequest'
            example:
              jsonrpc: '2.0'
              id: 1
              method: tools/call
              params:
                name: kvm_screenshot
                arguments:
                  width: 960
                  height: 540
                  quality: 60
      responses:
        '200':
          description: |
            JSON-RPC response. HTTP `200` is used both for successful results and for JSON-RPC
            errors (`-32600`, `-32601`, `-32602`, `-32003`); only a body that fails to parse as
            JSON uses HTTP `400`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoLocalJsonRpcResponse'
              example:
                jsonrpc: '2.0'
                id: 1
                result: {}
                error:
                  code: -32003
                  message: PicoClaw control mode is not active
                  data: *id007
        '400':
          description: |
            The request body is not valid JSON; the body is a JSON-RPC error response with code
            `-32700` ("parse error") and `id` echoing whatever could be parsed (`null` usually).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PicoLocalJsonRpcResponse'
              example:
                jsonrpc: '2.0'
                id: 1
                result: {}
                error:
                  code: -32003
                  message: PicoClaw control mode is not active
                  data: *id007
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/picoclaw/model/config:
    post:
      tags:
      - PicoClaw
      summary: Save the PicoClaw model configuration
      operationId: pico_updateModelConfig
      description: |
        Persists the LLM provider configuration used by the PicoClaw runtime and, when the
        runtime is currently ready, restarts it so the new model takes effect. The request blocks
        for that stop/start cycle (up to about 45 s in the worst case: 15 s stop, 15 s start plus
        the readiness polling).

        **Requires the admin role.**

        What is written on disk:

        - `~/.picoclaw/config.json` (the runtime home; `PICOCLAW_HOME` overrides it): an entry in
          `model_list` with `model_name` (the segment after the last `/` of `model`), `model` and
          `api_base`; `agents.defaults.model_name` is set to that model name, `agents.defaults.model`
          is removed, the top-level `version` is set to `3` and unknown fields are preserved.
        - `~/.picoclaw/.security.yml`: `model_list.<model_name>[:<duplicate-index>].api_keys: [api_key]`.
          The API key is never written to `config.json`.

        If `config.json` does not exist yet, PicoClaw's onboard script (`S96picoclaw onboard`) is
        run first (up to 60 s) to create it. NanoKVM startup defaults and the PicoClaw "pico"
        channel token are (re)applied on every save.

        **Restart semantics** — if the runtime was `ready` (or its status was `ready`), PicoClaw
        must own device control for the save to proceed and the runtime is stopped and started
        inside the request; the desired-running intent is persisted with `updated_by:
        "model_config"`. If the runtime was not ready, the configuration is written without
        restarting and the runtime state is re-evaluated.

        **Validation of `model`** — the value must use `provider/model` format. `provider` is
        trimmed and lower-cased and must match `^[a-z][a-z0-9_-]*$` (the literal `openao` is
        rejected with a "did you mean openai?" hint) and must be one of the providers known to
        this integration: anthropic, azure, azure_openai, baichuan, bedrock, cerebras, cohere,
        dashscope, deepseek, fireworks_ai, gemini, google, groq, lmstudio, mistral, moonshot,
        ollama, openai, openai_compatible, openrouter, qwen, siliconflow, together_ai, vertex_ai,
        vllm, volcengine, xai, zhipu. Any other provider is rejected as unsupported. The stored
        model name is the part after the **last** `/` (`openai/foo/bar` becomes `bar`).

        Application failures use the structured `PicoError` body `{code, message}` (see
        `#/components/schemas/PicoError`) returned with **HTTP 200**; the codes and messages are:
        `INVALID_ACTION` "invalid model config payload" (body is not valid JSON), or
        `RUNTIME_UNAVAILABLE` with "model api_base is required", "model api_key is required",
        "model identifier is required", "model identifier must use provider/model format",
        "model provider \"x\" is invalid", "model provider \"openao\" is invalid; did you mean
        openai?", "model provider \"x\" is not supported by this PicoClaw integration",
        "model identifier must include a model name", "failed to initialize PicoClaw config
        before saving model config: ...", "model config saved, but failed to persist picoclaw
        defaults: ...", or "model config saved, but failed to restart picoclaw runtime: ...".
        Control-mode failures (`CONTROL_REQUIRED`, `CONTROL_OWNED_BY_MCP`,
        `CONTROL_TRANSITIONING`, `AI_MODE_CONFLICT`) additionally carry
        `data.status` with the current runtime status.
      security:
      - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PicoModelConfigRequest'
            example:
              model: openai/gpt-5.4
              api_base: https://api.example.com/v1
              api_key: sk-proj-example-key
      responses:
        '200':
          description: |
            Successful save. Returns `{code: 0, msg: "success", data: {...}}` with the resolved
            model name and the runtime status after the (optional) restart. On application
            failure the same HTTP 200 status is used with a `PicoError` body instead of the
            envelope.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoModelConfigResult'
              example:
                code: 0
                msg: success
                data:
                  model_name: gpt-5.4
                  status:
                    ready: true
                    installed: true
                    installing: false
                    install_progress: 100
                    install_stage: installed
                    install_path: /usr/bin/picoclaw
                    agent_profile: kvm
                    model_configured: true
                    model_name: gpt-5.4
                    status: ready
                    config_error: ''
                    last_error: ''
                    checked_at: '2026-10-01T05:30:25Z'
                    current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                    restoring: false
                    runtime_intent:
                      desired_running: true
                      updated_at: '2026-10-01T05:30:25Z'
                      updated_by: web
                      last_started_at: '2026-10-01T05:30:25Z'
                      last_stopped_at: '2026-10-01T12:00:00Z'
                      last_error: ''
                    control_mode: picoclaw
                    transitioning: false
                    control:
                      mode: picoclaw
                      transitioning: false
                      can_control: true
                      last_error: ''
                      changed_at: '2026-10-01T05:29:58Z'
                    capabilities:
                      chat: true
                      read_only_tools: true
                      device_write: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/runtime/install:
    post:
      tags:
      - PicoClaw
      summary: Install the PicoClaw runtime
      operationId: pico_installRuntime
      description: |
        Downloads and installs the PicoClaw binary. **Asynchronous**: the request returns
        immediately after the download/install goroutine is started; progress must be polled via
        `GET /api/picoclaw/runtime/status` (`installing`, `install_progress`, `install_stage`).

        **Requires the admin role.**

        Implementation details: the tarball is fetched from
        `https://cdn.sipeed.com/nanokvm/resources/picoclaw/v0.2.8/picoclaw_Linux_riscv64.tar.gz`,
        its SHA-512 is verified against the matching `sha512.txt` from the same CDN directory, the
        `picoclaw` member is extracted and atomically installed as `/usr/bin/picoclaw` (mode 0755);
        the staging directory `/root/.picoclaw-cache` is removed afterwards. The whole operation
        has a 12-minute timeout (download sub-timeout 10 minutes).

        Stages reported through `install_stage`: `preparing` (0%), `downloading` (5-80%),
        `verifying` (82%), `extracting` (85%), `installing` (95%), `installed` (100%). Failures
        set `status` to `install_failed` or `install_timeout` and fill `last_error`.

        Idempotency: if the binary already exists the call answers immediately with
        `output: "picoclaw is already installed"` and status `installed`; if an install is already
        running it answers with `output: "picoclaw installation is already in progress"` and the
        current (installing) status. The endpoint does not require any particular control mode.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Install started (`installed` is only `true` when the binary was already present and
            no install is running; otherwise the nested `status` shows `installing: true`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeInstallResult'
              example:
                code: 0
                msg: success
                data:
                  installed: false
                  binary: /usr/bin/picoclaw
                  download: https://cdn.sipeed.com/nanokvm/resources/picoclaw/v0.2.8/picoclaw_Linux_riscv64.tar.gz
                  output: picoclaw installation started
                  status:
                    ready: true
                    installed: true
                    installing: false
                    install_progress: 100
                    install_stage: installed
                    install_path: /usr/bin/picoclaw
                    agent_profile: kvm
                    model_configured: true
                    model_name: gpt-5.4
                    status: ready
                    config_error: ''
                    last_error: ''
                    checked_at: '2026-10-01T05:30:25Z'
                    current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                    restoring: false
                    runtime_intent:
                      desired_running: true
                      updated_at: '2026-10-01T05:30:25Z'
                      updated_by: web
                      last_started_at: '2026-10-01T05:30:25Z'
                      last_stopped_at: '2026-10-01T12:00:00Z'
                      last_error: ''
                    control_mode: picoclaw
                    transitioning: false
                    control:
                      mode: picoclaw
                      transitioning: false
                      can_control: true
                      last_error: ''
                      changed_at: '2026-10-01T05:29:58Z'
                    capabilities:
                      chat: true
                      read_only_tools: true
                      device_write: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/runtime/session:
    get:
      tags:
      - PicoClaw Internal
      summary: Read the current PicoClaw session-lock owner
      operationId: picol_getRuntimeSession
      description: |
        Returns the current PicoClaw session state: which session id owns the shared session
        lock (the cross-cutting "who is driving the device" marker used by the internal
        automation endpoints). This is the endpoint the local bridge uses to discover the session
        id before calling `/actions`, `/screenshot` or `/load-image`.

        **Security** — loopback only (`127.0.0.1`/`::1`) plus the shared secret in the
        `X-NanoKVM-Internal-Token` header (read from `/etc/kvm/.picoclaw_internal_token`,
        constant-time compared); anything else is HTTP `401` (`"unauthorized"`). When the device
        runs HTTPS, this path is allow-listed on the plain-HTTP listener for loopback callers
        holding a valid token. It does **not** require the `X-PicoClaw-Session-ID` header.

        **Semantics** — `current_session` is the owner of the session lock: it is created when
        `POST /actions` or `GET /screenshot` first runs for a session, renewed on every such
        call, and cleared after **30 minutes** without activity. When no session owns the lock —
        the normal state before the agent connects or after the session was released — the field
        is an **empty string**; it is always present and is never `null`. An expired owner is
        cleared before being reported, so a value here always reflects a live session.
      security:
      - internalToken: []
      responses:
        '200':
          description: Current session-lock owner.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoLocalRuntimeSession'
              example:
                code: 0
                msg: success
                data:
                  current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  checked_at: '2026-10-01T13:34:12.123456789+08:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - PicoClaw
      summary: Release a PicoClaw runtime session
      operationId: pico_releaseRuntimeSession
      description: |
        Releases the session identified by the `X-PicoClaw-Session-ID` header so that another
        PicoClaw session can take over the device.

        **Requires the admin role.**

        Behaviour, in order:

        1. If a live PicoClaw gateway WebSocket is registered for that session id it is closed
           with a **normal closure (code 1000, reason "session released")**. Closing the gateway
           session also releases the session lock (only when that session owns it) and the HID
           state, and updates `current_session`.
        2. Capture/HDMI leases held for that session id are released unconditionally.
        3. The response reports the resulting lock owner.

        The endpoint is deliberately tolerant: it works in any control mode (including `mcp` and
        when the runtime was stopped) and `released` is always `true` once the header is present,
        even if no such session existed. It never stops the runtime.

        Errors: `{"code": "SESSION_ID_MISSING", "message": "missing X-PicoClaw-Session-ID"}` with
        HTTP 200 when the header is absent or empty.
      security:
      - cookieAuth: []
      parameters:
      - in: header
        name: X-PicoClaw-Session-ID
        required: true
        schema:
          type: string
        description: Session id to release (the same id used as `session_id` on the gateway WebSocket).
        example: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
      responses:
        '200':
          description: |
            Session released (or `SESSION_ID_MISSING`, HTTP 200, `PicoError` body).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeSessionReleaseResult'
              example:
                code: 0
                msg: success
                data:
                  released: true
                  current_session: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/runtime/start:
    post:
      tags:
      - PicoClaw
      summary: Start the PicoClaw runtime
      operationId: pico_startRuntime
      description: |
        Starts the PicoClaw gateway process (`<init.d>/S96picoclaw start`) and waits until the
        gateway WebSocket answers. **Synchronous and long-running**: the start script has a 15 s
        timeout, followed by a 1.5 s settle delay and up to 15 s of ready-polling — expect up to
        ~30 s before the response.

        **Requires the admin role.**

        **Preconditions** — PicoClaw must own device control and the control mode must not be
        transitioning; this is enforced by taking a PicoClaw control lease first. Failures use
        the `PicoclawError` control codes with the runtime status in `data.status`:
        `CONTROL_REQUIRED` "PicoClaw device control is not enabled" (mode `off`),
        `CONTROL_OWNED_BY_MCP` "external MCP owns device control" (mode `mcp`),
        `CONTROL_TRANSITIONING` "device control is switching", or `AI_MODE_CONFLICT`.

        If the runtime is already usable the call is a no-op: it persists the desired-running
        intent (`updated_by: "web"`) and returns `{started: true}` without a command.

        Other failures (HTTP 200, `PicoError` body, most of them with `data.command`,
        `data.output` and `data.status` when a start was attempted):
        `RUNTIME_UNAVAILABLE` "picoclaw installation is in progress", "PicoClaw runtime lifecycle
        timed out", "PicoClaw runtime lifecycle was canceled",
        `RUNTIME_START_FAILED` "picoclaw is not installed", "picoclaw start script not found:
        /etc/init.d/S96picoclaw or /kvmapp/system/init.d/S96picoclaw", "gateway port
        <host:port> is already in use by another process", "failed to start picoclaw runtime",
        or the gateway probe message ("gateway is unavailable", "gateway is not reachable",
        "gateway websocket is unavailable", "gateway pico channel is unavailable", "gateway
        authentication failed", "gateway config is invalid", "picoclaw model is not
        configured"), and `AI_MODE_CONFLICT` "PicoClaw runtime lifecycle canceled because the
        control mode is switching".

        On success the desired-running intent is persisted with `updated_by: "web"` so the
        runtime can be restored after a reboot.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Runtime started (or already ready) — `{started: true, command, output, status}`.
            Application failures also use HTTP 200 with a `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeStartResult'
              example:
                code: 0
                msg: success
                data:
                  started: true
                  command: /kvmapp/system/init.d/S96picoclaw start
                  output: PicoClaw gateway started
                  status:
                    ready: true
                    installed: true
                    installing: false
                    install_progress: 100
                    install_stage: installed
                    install_path: /usr/bin/picoclaw
                    agent_profile: kvm
                    model_configured: true
                    model_name: gpt-5.4
                    status: ready
                    config_error: ''
                    last_error: ''
                    checked_at: '2026-10-01T05:30:25Z'
                    current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                    restoring: false
                    runtime_intent:
                      desired_running: true
                      updated_at: '2026-10-01T05:30:25Z'
                      updated_by: web
                      last_started_at: '2026-10-01T05:30:25Z'
                      last_stopped_at: '2026-10-01T12:00:00Z'
                      last_error: ''
                    control_mode: picoclaw
                    transitioning: false
                    control:
                      mode: picoclaw
                      transitioning: false
                      can_control: true
                      last_error: ''
                      changed_at: '2026-10-01T05:29:58Z'
                    capabilities:
                      chat: true
                      read_only_tools: true
                      device_write: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/runtime/status:
    get:
      tags:
      - PicoClaw
      summary: Get the PicoClaw runtime status
      operationId: pico_getRuntimeStatus
      description: |
        Returns the consolidated PicoClaw runtime status: installation, model configuration,
        process/readiness, gateway probing, persisted runtime intent, control-mode arbitration and
        per-session capabilities. This is the endpoint the web UI polls while the assistant panel
        is open.

        **Requires the admin role.**

        The handler may refresh the cached status inline: if the cached status is older than 2 s
        (and no installation is in progress) it re-checks the binary, the model config, the
        gateway process and performs a WebSocket probe against the PicoClaw gateway (dial +
        immediate close). A background probe also runs every 30 s. The stored `checked_at`
        timestamp indicates when the last probe ran; the response can therefore be slightly slow
        on a cold cache.

        Key fields: `installed`, `installing`/`install_progress` (0-100) / `install_stage`,
        `model_configured`/`model_name`, `status` (`checking`, `not_installed`, `installing`,
        `installed`, `model_not_configured`, `config_error`, `unavailable`, `stopped`, `starting`,
        `stopping`, `restoring`, `ready`, `blocked_by_mcp`, `install_failed`, `install_timeout`,
        `error`), `ready`, `agent_profile` (`default`/`kvm`), `current_session` (owner of the
        PicoClaw session lock), `restoring`, `runtime_intent` (persisted `desired_running`
        intent), `control_mode` (`off`/`mcp`/`picoclaw`) plus the nested `control` object with
        `can_control`, and `capabilities` flags:

        - `chat` / `read_only_tools` are true when the runtime is usable (`ready && installed &&
          model_configured && !installing`) and the control mode is not `mcp` and not transitioning;
        - `device_write` is true only while PicoClaw owns device control (`control_mode ==
          "picoclaw"` and not transitioning).

        Application failures use the structured `PicoError` body `{code, message}` returned with
        **HTTP 200** — `RUNTIME_UNAVAILABLE` with the control-mode error text.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Runtime status object. Application failures also use HTTP 200 with a `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeStatus'
              example:
                code: 0
                msg: success
                data:
                  ready: true
                  installed: true
                  installing: false
                  install_progress: 100
                  install_stage: installed
                  install_path: /usr/bin/picoclaw
                  agent_profile: kvm
                  model_configured: true
                  model_name: gpt-5.4
                  status: ready
                  config_error: ''
                  last_error: ''
                  checked_at: '2026-10-01T05:30:25Z'
                  current_session: 7f9c2b1e-6a4d-4b8f-9c2e-1f0a3d5e7b90
                  restoring: false
                  runtime_intent:
                    desired_running: true
                    updated_at: '2026-10-01T05:30:25Z'
                    updated_by: web
                    last_started_at: '2026-10-01T05:30:25Z'
                    last_stopped_at: '2026-10-01T12:00:00Z'
                    last_error: ''
                  control_mode: picoclaw
                  transitioning: false
                  control:
                    mode: picoclaw
                    transitioning: false
                    can_control: true
                    last_error: ''
                    changed_at: '2026-10-01T05:29:58Z'
                  capabilities:
                    chat: true
                    read_only_tools: true
                    device_write: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/picoclaw/runtime/stop:
    post:
      tags:
      - PicoClaw
      summary: Stop the PicoClaw runtime
      operationId: pico_stopRuntime
      description: |
        Stops the PicoClaw gateway process and releases device control. **Synchronous** (the stop
        script has a 15 s timeout and the process exit is verified).

        **Requires the admin role.**

        Behaviour:

        1. If PicoClaw owns device control, the mode is switched to `off` (active control
           operations are canceled and HID state is released). If the mode is already `off` or
           currently `mcp` the switch is skipped without error. A failed switch yields
           `RUNTIME_START_FAILED` with the underlying error and `data.status`.
        2. The runtime status is set to `stopping`, the desired-running intent is persisted as
           `false` (`updated_by: "web"`).
        3. `<init.d>/S96picoclaw stop` is executed, the process exit is verified, all remaining
           gateway WebSockets are closed with **code 4007** ("PicoClaw runtime stopped") and the
           session lock is cleared; the status ends as `stopped`.

        Calling stop while the runtime is not running is not an error: the intent is still
        persisted as `false` and the response reports `started: false`.

        Errors: `RUNTIME_START_FAILED` "failed to stop picoclaw runtime", "picoclaw start script
        not found: ...", "PicoClaw runtime is still running" or the control-switch error, all
        with `data.status` (HTTP 200, `PicoError` body).
      security:
      - cookieAuth: []
      responses:
        '200':
          description: |
            Runtime stopped — `{started: false, status}`. Application failures also use HTTP 200
            with a `PicoError` body.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/PicoRuntimeStartResult'
              example:
                code: 0
                msg: success
                data:
                  started: true
                  command: /kvmapp/system/init.d/S96picoclaw start
                  output: PicoClaw gateway started
                  status:
                    ready: true
                    installed: true
                    installing: false
                    install_progress: 100
