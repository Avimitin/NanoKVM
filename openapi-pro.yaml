# NanoKVM-Pro API — generated from server source; see /workspace/experiments/nanokvm-pro-openapi
openapi: 3.0.3
info:
  title: NanoKVM-Pro API
  version: 1.0.0
  description: |
    HTTP API of **NanoKVM-Pro**, the high-performance 4K IP-KVM device by Sipeed (AX630C, ARM
    dual-core A53). It comes in two forms — **NanoKVM-Desk** (desktop, 1.47-inch touchscreen)
    and **NanoKVM-ATX** (internal, with ATX brackets) — both serving the same API.

    The API exposes everything the web UI can do: 4K video streaming (MJPEG / H.264 / H.265,
    direct and WebRTC), HDMI capture and passthrough, EDID management, keyboard/mouse injection,
    virtual USB devices, storage image mounting, Wi-Fi and network configuration, application
    updates (including staged manual updates), Tailscale, the smart assistant extension,
    kvmadmin, a speed test and a dual-boot switch to PiKVM.

    ### Base URL
    The device serves this API on port 80 (HTTP) or 443 (HTTPS) at its IP address or mDNS
    hostname (for example `http://nanokvm.local`). `GET /kvm` redirects to `/`.

    ### Authentication
    Login with `POST /api/auth/login` returns a JWT in the response body (`data.token`); the
    web UI stores it in the `nano-kvm-token` cookie and sends it with every request
    (`withCredentials`). The server accepts the token from the `nano-kvm-token` cookie **or**
    an `Authorization: Bearer <token>` header. Requests originating from loopback
    (`127.0.0.1` / `::1`) bypass authentication entirely. When `authentication: disable` is set
    in the server config, every endpoint is open and login answers `data.token: "disabled"`.

    There is a **single account** (default `admin`/`admin`, stored hashed in `/etc/kvm/pwd`);
    there are no roles — every authenticated session has full access. Failed logins are delayed
    2–3 seconds but there is no lockout. Logout regenerates the JWT secret key, invalidating
    every issued token, when `jwt.revokeTokensOnLogout` is enabled.

    **Password transport** — the Pro server compares the password directly (bcrypt on the
    server side); the login request carries the plaintext password over the channel (use
    HTTPS in production).

    ### Response envelope
    Nearly every endpoint answers **HTTP 200** with:

    ```json
    { "code": 0, "msg": "success", "data": { } }
    ```

    `code` is `0` on success; on failure it is negative (for example `-1` invalid parameters,
    `-2` invalid username or password) and `msg` describes the error. Authentication failures
    are HTTP **401** with the JSON string `"unauthorized"`.

    ### Version
    This document describes the NanoKVM-Pro server at repository commit `3b013bb`
    (application version 1.0.0 line).
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  contact:
    name: Sipeed NanoKVM-Pro
    url: https://github.com/sipeed/NanoKVM-Pro
servers:
- url: http://{host}
  description: Plain HTTP (default; port 80 unless configured otherwise)
  variables:
    host:
      default: nanokvm.local
      description: Device IP address or mDNS hostname
- url: https://{host}
  description: HTTPS (port 443) — used when TLS is enabled
  variables:
    host:
      default: nanokvm.local
      description: Device IP address or mDNS hostname
tags:
- name: Authentication
  description: Login/logout, session token, account and password management.
- name: Application
  description: Application version, online updates, staged manual updates, update source.
- name: Extensions
  description: Optional extensions — Tailscale, smart assistant, kvmadmin.
- name: VM
  description: Device management — info, GPIO, scripts, virtual devices, OLED/LCD, HDMI, EDID, SSH, time, hostname, mDNS, low power, LED strip, PiKVM switch, reboot, web terminal.
- name: Stream
  description: Video streams — MJPEG, H.264/H.265 (direct and WebRTC) and encoder settings.
- name: WebSocket
  description: Real-time keyboard/mouse input channel.
- name: Storage
  description: Virtual storage images (ISO/IMG), CD-ROM mounting and the image downloader.
- name: Network
  description: Wi-Fi, static IP, Wake-on-LAN.
- name: HID
  description: Human-interface-device control — paste, shortcuts, leader key, HID mode.
- name: Speed Test
  description: Network throughput test (ping, download, upload).
- name: Local
  description: Loopback-authenticated endpoints used by the on-device streamer UI.
x-tagGroups:
- name: Core
  tags:
  - Authentication
  - Application
  - Extensions
- name: Device
  tags:
  - VM
  - Stream
  - WebSocket
  - Storage
  - Network
- name: Peripheral
  tags:
  - HID
  - Speed Test
  - Local
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: nano-kvm-token
      description: |
        JWT issued by `POST /api/auth/login` (returned in `data.token`). The official web UI
        stores it in a JS cookie named `nano-kvm-token` and sends it with `withCredentials`.
        Logout regenerates the signing key, invalidating all tokens.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        The same JWT sent as `Authorization: Bearer <token>`; accepted as an alternative to
        the cookie.
    localAuth:
      type: apiKey
      in: header
      name: X-KVM-Local
      description: |
        Local-auth header for `/api/streamer/local`. Requests from loopback
        (127.0.0.1/::1) are accepted without any token; non-loopback requests require the
        header to match the value of `/etc/kvm/local_token` (if that file exists).
  schemas:
    Envelope:
      type: object
      description: |
        Standard response envelope shared by all endpoints: `code` is `0` on success and
        negative on failure.
      required:
      - code
      properties:
        code:
          type: integer
          description: 'Status code: 0 on success, negative on failure.'
          example: 0
        msg:
          type: string
          description: Human-readable status message.
          example: success
        data:
          description: |
            Response payload; omitted or `null` for endpoints that return no data. Its type
            is defined per endpoint (object, array or plain string).
    Auth_LoginRequest:
      type: object
      description: |
        Credentials for `POST /api/auth/login`. Both fields are required. JSON keys are
        matched case-insensitively (the Go struct has no `json` tags); the official web
        UI sends lowercase `username` / `password`.
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: Account username (default `admin`).
          example: admin
        password:
          type: string
          description: Plaintext password (compared against the stored bcrypt hash).
          example: admin
    Auth_LoginResult:
      type: object
      description: |
        Login result. `count` is a reserved field that the current server never sets,
        so it is always `0`. When authentication is disabled the token is the literal
        string `"disabled"`.
      required:
      - token
      - count
      properties:
        token:
          type: string
          description: |
            Signed JWT (HS256) to send as the `nano-kvm-token` cookie or as
            `Authorization: Bearer <token>`, or the literal `"disabled"` when the
            server runs with `authentication: disable`.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwiZXhwIjoxNzU5MzQ1NjAwfQ.4Ad4Vp5X9n2Y7bC1dE8fGh3JkLm6N0pQrS2TtUvWxYz
        count:
          type: integer
          description: Reserved; always `0` in the current implementation.
          example: 0
    Auth_Account:
      type: object
      description: The web account's username.
      required:
      - username
      properties:
        username:
          type: string
          description: Account username (default `admin` when no account file exists).
          example: admin
    Auth_PasswordUpdated:
      type: object
      description: Whether the factory-default password has been changed.
      required:
      - isUpdated
      properties:
        isUpdated:
          type: boolean
          description: |
            `true` when the stored bcrypt hash does not match the plaintext `admin`
            (i.e. the password has been changed); `false` when it still matches or no
            account file exists.
          example: false
    Auth_ChangePasswordRequest:
      type: object
      description: |
        New credentials for `POST /api/auth/password`. Both fields are required. JSON
        keys are matched case-insensitively (the Go struct has no `json` tags); the
        official web UI sends lowercase `username` / `password`.
      required:
      - username
      - password
      properties:
        username:
          type: string
          description: New username (also renames the login account).
          example: admin
        password:
          type: string
          description: |
            New plaintext password. It is bcrypt-hashed for the web account and also
            applied to the system root user.
          example: N@noKVM-2026!
    App_Version:
      type: object
      description: Installed and latest application versions.
      required:
      - current
      - latest
      properties:
        current:
          type: string
          description: |
            Installed application version, read from `/kvmapp/version`
            (default `v1.0.0` when absent).
          example: 1.2.14
        latest:
          type: string
          description: |
            Latest version advertised by the active update source. Falls back to
            `current` when the official/preview source is unreachable.
          example: 1.2.15
    App_UpdateSource:
      type: object
      description: |
        The update-source configuration. `url` is the common root used by both the
        application updater (`<url>/nanokvm_pro_latest.json`) and the firmware
        updater.
      required:
      - url
      - isOfficial
      - enabled
      properties:
        url:
          type: string
          description: |
            Update-server root URL. The official root is
            `https://cdn.sipeed.com/nanokvm`; a custom root is stored normalized
            (trimmed, no trailing slash, no credentials/query/fragment).
          example: https://cdn.sipeed.com/nanokvm
        isOfficial:
          type: boolean
          description: '`true` when no custom source is active.'
          example: true
        enabled:
          type: boolean
          description: '`true` when the custom source is in use.'
          example: false
    App_SetUpdateSourceRequest:
      type: object
      description: |
        Request body for `POST /api/application/update-source`. JSON only — this
        endpoint does not accept form encoding. The field carries no `validate`
        tag, so it may be omitted; an absent, empty or official URL resets the
        source.
      properties:
        url:
          type: string
          description: |
            HTTP(S) update-server **directory** root. At most 2048 characters; no
            credentials, query or fragment; must not end in `.json`. An empty string
            or the official URL resets the source.
          example: https://mirror.example.com/nanokvm-releases
    App_PreviewState:
      type: object
      description: Preview-updates state.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` when preview (pre-release) updates are enabled, i.e. the flag file
            `/etc/kvm/preview_updates` exists.
          example: false
    App_SetPreviewRequest:
      type: object
      description: |
        Request body for `POST /api/application/preview`. The Go field has no `json`
        tag and is marked `omitempty`, so JSON keys are matched case-insensitively and
        the field is optional — the official web UI sends `{"enable": true}`; an
        omitted field binds to `false`.
      properties:
        enable:
          type: boolean
          description: Desired preview-updates state.
          example: true
    App_ManualUpdateConfirmRequest:
      type: object
      description: Request body for `POST /api/application/update/manual/confirm`.
      required:
      - id
      properties:
        id:
          type: string
          format: uuid
          description: UUID of the staged job returned by the inspect call.
          example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
    App_ManualUpdateUploadRequest:
      type: object
      description: |
        Multipart body for `POST /api/application/update/manual/inspect`. Exactly one
        part named `file` carrying the update package (`.tar.gz`, `.tar.xz` or plain
        `.tar`); at most 512 MiB.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: |
            The update archive. The filename must be a plain base name (no path
            separators), at most 255 characters. `.axp` and `.img` files are rejected
            as are ZIP archives.
    App_ManualUpdateJob:
      type: object
      description: |
        A staged or in-flight manual update job. Returned by the inspect, confirm and
        poll endpoints.
      required:
      - id
      - version
      - size
      - state
      properties:
        id:
          type: string
          format: uuid
          description: Job identifier, generated by the server at upload time.
          example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
        version:
          type: string
          description: |
            Package version detected by the server during inspection (for example
            `1.2.15` for an application package, `v1.0.15` for firmware).
          example: 1.2.15
        size:
          type: integer
          format: int64
          description: Size of the uploaded package in bytes.
          example: 104857600
        state:
          type: string
          enum:
          - staged
          - installing
          - succeeded
          - failed
          - reboot_scheduled
          description: |
            Job state:

            - `staged` — uploaded and validated, awaiting confirmation (expires after
              24 hours).
            - `installing` — confirmation accepted; a background worker is installing.
            - `succeeded` — installation completed (application packages).
            - `failed` — installation failed; see `error`.
            - `reboot_scheduled` — firmware written and a reboot was scheduled
              (firmware packages only).
          example: staged
        error:
          type: string
          description: |
            Failure reason, present only in state `failed` (omitted otherwise).
            Truncated to 512 characters.
          example: application checksum mismatch for nanokvmpro
    Ext_TailscaleStatus:
      type: object
      description: Tailscale daemon state and node identity.
      required:
      - state
      - name
      - ip
      - account
      properties:
        state:
          type: string
          enum:
          - notInstall
          - notRunning
          - notLogin
          - stopped
          - running
          description: |
            Tailscale state:

            - `notInstall` — the `tailscale` / `tailscaled` binaries are missing.
            - `notRunning` — daemon not running, still starting, or status unreadable.
            - `notLogin` — daemon up but the node is not logged in.
            - `stopped` — logged in but disconnected (`tailscale down`).
            - `running` — connected to the tailnet.
          example: running
        name:
          type: string
          description: Node's Tailscale hostname (empty unless running).
          example: nanokvm-pro
        ip:
          type: string
          description: Node's IPv4 Tailscale address (empty unless running).
          example: 100.101.102.103
        account:
          type: string
          description: Current tailnet name (empty unless running).
          example: example.ts.net
    Ext_TailscaleLoginResult:
      type: object
      description: Result of the Tailscale login request.
      required:
      - url
      properties:
        url:
          type: string
          description: |
            Authentication URL to open in a browser; empty when the node is already
            logged in (`BackendState: Running`). Valid for 10 minutes.
          example: https://login.tailscale.com/a/1f2e3d4c5b6a
    Ext_KvmadminStatus:
      type: object
      description: kvmadmin extension state.
      required:
      - state
      properties:
        state:
          type: string
          enum:
          - notInstall
          - notRunning
          - running
          description: |
            kvmadmin state: `notInstall` (no `/kvmadmin/NanoKVM-Admin`), `running`
            (service active) or `notRunning` (installed but stopped).
          example: running
    Ext_AssistantStartResult:
      type: object
      description: Result of starting the AI assistant web app.
      required:
      - status
      - code
      properties:
        status:
          type: string
          enum:
          - running
          - starting
          description: |
            `running` when a `cua_webapp.py` process was already active;
            `starting` when the process was just launched and reported its
            authentication token.
          example: starting
        code:
          type: integer
          description: Mirrors the envelope `code`; always `0` when present.
          example: 0
    Hid_PasteRequest:
      type: object
      description: |
        Request body for `POST /api/hid/paste`. The struct is defined in
        `service/hid/paste.go` with a `form:"content"` tag and no `json` tag, so JSON
        keys are matched case-insensitively; the official web UI sends `content`.
      required:
      - content
      properties:
        content:
          type: string
          description: |
            Text to type on the target machine. At most 1024 **bytes** after decoding;
            characters outside the server's ASCII `CharMap` (non-ASCII letters, most
            control characters) are silently skipped. Newlines are typed as Enter and
            tabs as Tab. Unlike the non-Pro NanoKVM there is no language/layout field.
          example: Hello, world! It's 100% typed.
          maxLength: 1024
    Hid_ShortcutKey:
      type: object
      description: |
        One key of a shortcut. `code` is a browser `KeyboardEvent.code` value and
        `label` is a display string; both are stored verbatim — the server performs no
        validation. The web UI always sends both fields.
      required:
      - code
      - label
      properties:
        code:
          type: string
          description: |
            `KeyboardEvent.code` identifier of the key, for example `ControlLeft`,
            `ShiftLeft`, `AltLeft`, `MetaLeft`, `KeyA`, `Digit5`, `F5`, `Enter`, `Tab`,
            `Space`, `Delete`, `ArrowUp`.
          example: ControlLeft
        label:
          type: string
          description: |
            Human-readable label shown in the UI, for example `Ctrl`, `Shift`, `Win`,
            `R`, `⌫`, `↑`.
          example: Ctrl
    Hid_Shortcut:
      type: object
      description: |
        A stored shortcut, as returned by `GET /api/hid/shortcuts`. `id` is generated by
        the server when the shortcut is added and is the value accepted by
        `DELETE /api/hid/shortcut`.
      required:
      - id
      - keys
      properties:
        id:
          type: string
          description: Server-assigned UUID v4 identifying the shortcut.
          example: 6f1d2b34-9c8e-4a7f-b2d3-1e5a8c9f0b2d
        keys:
          type: array
          description: |
            The key combination, in press order. The web UI replays it as a single HID
            report (all keys held, then released) over the `/api/ws` WebSocket; the HID
            report format holds at most 6 non-modifier keycodes, which is the limit the
            UI enforces when recording.
          items:
            $ref: '#/components/schemas/Hid_ShortcutKey'
    Hid_ShortcutList:
      type: object
      description: Response payload of `GET /api/hid/shortcuts`.
      required:
      - shortcuts
      properties:
        shortcuts:
          type: array
          description: |
            All user-defined shortcuts. An empty array (never `null`) when the store file
            `/etc/kvm/shortcuts.json` is missing or empty.
          items:
            $ref: '#/components/schemas/Hid_Shortcut'
    Hid_ShortcutAddRequest:
      type: object
      description: |
        Request body for `POST /api/hid/shortcut`. The Go struct has no `json` tags, so
        JSON keys are matched case-insensitively; the official web UI sends `keys` with
        `code` / `label` members. The server generates the `id`; it is not returned in
        the response.
      required:
      - keys
      properties:
        keys:
          type: array
          description: |
            Key combination to store; a missing or `null` field is rejected by the
            validator (an empty array is technically accepted and would be stored as a
            keyless shortcut — the web UI always records at least one key). The server
            enforces no upper bound (the web UI records at most 6 keys) and does not
            validate the members.
          items:
            $ref: '#/components/schemas/Hid_ShortcutKey'
    Hid_ShortcutDeleteRequest:
      type: object
      description: |
        Request body for `DELETE /api/hid/shortcut`. The official web UI sends it as a
        JSON body with the DELETE request; the key is matched case-insensitively.
      required:
      - id
      properties:
        id:
          type: string
          description: |
            UUID of the shortcut to delete, exactly as returned by
            `GET /api/hid/shortcuts` (case-sensitive comparison).
          example: 6f1d2b34-9c8e-4a7f-b2d3-1e5a8c9f0b2d
    Hid_LeaderKeyRequest:
      type: object
      description: |
        Request body for `POST /api/hid/shortcut/leader-key`. The Go struct has no
        `json` tag, so the key is matched case-insensitively; the official web UI sends
        `key`. An empty value disables the leader key.
      properties:
        key:
          type: string
          description: |
            `KeyboardEvent.code` of the leader key (`ShiftRight`, `ControlRight`,
            `MetaRight`, …), or an empty string / omitted field to disable the feature.
          example: ControlRight
    Hid_LeaderKey:
      type: object
      description: Response payload of `GET /api/hid/shortcut/leader-key`.
      required:
      - key
      properties:
        key:
          type: string
          description: |
            The configured leader key as a `KeyboardEvent.code` value, with newlines
            stripped. An empty string when no leader key is configured.
          example: ShiftRight
    Hid_Mode:
      type: object
      description: Response payload of `GET /api/hid/mode`.
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - normal
          - hid-only
          description: |
            Current USB gadget mode. `normal` exposes the full composite gadget
            (keyboard, mouse, mass storage, network); `hid-only` exposes only the HID
            functions. Derived from the presence of `/dev/shm/tmp/hid_only`.
          example: normal
    Hid_ModeRequest:
      type: object
      description: |
        Request body for `POST /api/hid/mode`. The Go struct has no `json` tag, so the
        key is matched case-insensitively; the official web UI sends `mode`.
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - normal
          - hid-only
          description: |
            Target USB gadget mode. `normal` restores the full composite gadget
            (re-running the script with `restart`); `hid-only` reconfigures it to expose
            only the keyboard/mouse HID functions. Any other value fails with
            `code: -2`.
          example: hid-only
    Storage_ImageList:
      type: object
      description: |
        Response of `GET /api/storage/image`: the mountable image files found under
        `/data` and `/sdcard`.
      required:
      - files
      properties:
        files:
          type: array
          nullable: true
          description: |
            Absolute paths of `.iso` / `.img` files (extension matched
            case-insensitively). `null` when no image was found — the Go slice is never
            initialised, so an empty result is serialised as `null` rather than `[]`.
          items:
            type: string
          example:
          - /data/debian-12.5.0-amd64-netinst.iso
          - /data/ubuntu-22.04.img
          - /sdcard/alpine-virt-3.19.iso
    Storage_MountRequest:
      type: object
      description: |
        Request body for `POST /api/storage/image/mount`. An empty (or omitted) `file`
        unmounts the current image; a non-empty `file` mounts it. The struct is bound with
        `form:` tags, so the JSON keys are the Go field names (`file`, `cdrom`,
        `readOnly`).
      properties:
        file:
          type: string
          description: |
            Absolute path of the image to mount (as returned by
            `GET /api/storage/image`), or an empty string to unmount. The value is
            written to the USB gadget LUN attribute without validation.
          example: /data/debian-12.5.0-amd64-netinst.iso
        cdrom:
          type: boolean
          description: |
            Expose the image as a CD-ROM instead of a mass-storage disk. Enabling this
            forces the LUN read-only regardless of `readOnly`. Defaults to `false`.
          example: false
        readOnly:
          type: boolean
          description: |
            Mount the image read-only. Ignored (treated as `true`) when `cdrom` is set.
            Defaults to `false`.
          example: true
    Storage_MountedImage:
      type: object
      description: Response of `GET /api/storage/image/mounted`.
      required:
      - file
      - cdrom
      - readOnly
      properties:
        file:
          type: string
          description: |
            Path of the mounted image; empty string when nothing is mounted or the gadget
            is not configured.
          example: /data/debian-12.5.0-amd64-netinst.iso
        cdrom:
          type: boolean
          description: Whether the LUN is exposed as a CD-ROM.
          example: false
        readOnly:
          type: boolean
          description: Whether the LUN is read-only.
          example: true
    Storage_UploadChunkRequest:
      type: object
      description: |
        Multipart body for `POST /api/storage/image/upload`. Exactly one part named `file`
        carries the chunk data; `chunkIndex`, `chunkSize` and `totalChunks` are sent as
        form fields (integer values as strings). Each chunk is written at byte offset
        `chunkSize * chunkIndex` of `/data/<filename>`.
      required:
      - file
      - chunkIndex
      - chunkSize
      - totalChunks
      properties:
        file:
          type: string
          format: binary
          description: |
            The chunk data. The part's filename determines the stored name (sanitised:
            every character that is not a letter, digit, space, `-`, `_` or `.` becomes
            `_`). Only the first part named `file` is used.
        chunkIndex:
          type: integer
          description: Zero-based index of this chunk; must satisfy `0 <= chunkIndex < totalChunks`.
          example: 0
        chunkSize:
          type: integer
          description: |
            Chunk size in bytes, must be greater than 0. The official web UI uses 8 MiB
            (8388608).
          example: 8388608
        totalChunks:
          type: integer
          description: Total number of chunks the file was split into; must be greater than 0.
          example: 125
    Storage_UploadChunkResult:
      type: object
      description: Response data of `POST /api/storage/image/upload`.
      required:
      - status
      - filename
      - chunkIndex
      - totalChunks
      - written
      properties:
        status:
          type: string
          description: Always the literal `chunk_uploaded` on success.
          example: chunk_uploaded
        filename:
          type: string
          description: Sanitised file name the chunk was written to (under `/data`).
          example: debian-12.5.0-amd64-netinst.iso
        chunkIndex:
          type: integer
          description: Zero-based index of the stored chunk.
          example: 0
        totalChunks:
          type: integer
          description: Total chunk count as supplied by the client.
          example: 125
        written:
          type: integer
          description: Number of bytes written by this request.
          example: 8388608
    Storage_DeleteRequest:
      type: object
      description: |
        Request body for `POST /api/storage/image/delete`. The path must be under `/data`
        or `/sdcard` and end with `.iso` or `.img` (checked on the lowercased path).
      required:
      - file
      properties:
        file:
          type: string
          description: Absolute path of the image to delete.
          example: /data/ubuntu-22.04.img
    Storage_ChecksumRequest:
      type: object
      description: |
        Request body for `POST /api/storage/image/checksum`. The path must resolve to a
        regular `.iso`/`.img` file inside `/data` or `/sdcard`.
      required:
      - file
      - algorithm
      properties:
        file:
          type: string
          description: Absolute path of the image to hash.
          example: /data/debian-12.5.0-amd64-netinst.iso
        algorithm:
          type: string
          enum:
          - md5
          - sha1
          - sha256
          description: Hash algorithm (validator `oneof=md5 sha1 sha256`).
          example: sha256
    Storage_ChecksumResult:
      type: object
      description: Response data of `POST /api/storage/image/checksum`.
      required:
      - file
      - algorithm
      - checksum
      properties:
        file:
          type: string
          description: The image path as requested (echoed back, not the resolved path).
          example: /data/debian-12.5.0-amd64-netinst.iso
        algorithm:
          type: string
          enum:
          - md5
          - sha1
          - sha256
          description: The algorithm that was used.
          example: sha256
        checksum:
          type: string
          description: Lowercase hexadecimal digest of the file.
          example: 9e5d3f1c7a2b8e04d6f0a1c3b5d7e9f2a4c6b8d0e2f4a6c8b0d2e4f6a8c0b2d4
    Storage_DownloadRequest:
      type: object
      description: |
        Request body for `POST /api/storage/download/image`. The handler binds the shared
        mount request struct, so `cdrom` / `readOnly` are also accepted but ignored; only
        `file` is used, and it must be an HTTP/HTTPS URL.
      required:
      - file
      properties:
        file:
          type: string
          description: |
            Absolute HTTP or HTTPS URL of the image to download. It must parse as a URL
            with a scheme and host, and a `HEAD` request against it must return HTTP 200.
            The file is stored as `/data/<basename of the URL path>`.
          example: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
    Storage_DownloadStatus:
      type: object
      description: |
        Response data of `POST /api/storage/download/image` and
        `GET /api/storage/download/image/status`.
      required:
      - status
      - file
      - percentage
      properties:
        status:
          type: string
          enum:
          - idle
          - in_progress
          description: |
            Download state. The server only ever emits `idle` (no download running) or
            `in_progress`; background download failures are logged server-side and the
            state falls back to `idle`.
          example: in_progress
        file:
          type: string
          description: |
            URL being downloaded while `in_progress` (the value submitted to the download
            endpoint); empty string when `idle`.
          example: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
        percentage:
          type: string
          description: |
            Progress as a string with a percent sign and two decimals (updated every
            2.5 seconds), or an empty string before the first update or when `idle`.
          example: 45.67%
    Storage_DownloadEnabled:
      type: object
      description: Response data of `GET /api/storage/download/image/enabled`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` when `/data` is writable (the handler probes it by creating and
            removing `/data/.testfile`), `false` otherwise.
          example: true
    Net_WakeOnLanRequest:
      type: object
      description: |
        Request body for `POST /api/network/wol`. The MAC is normalised (trimmed,
        uppercased, `-`/`:`/`.` stripped) and must then be 12 hexadecimal digits.
      required:
      - mac
      properties:
        mac:
          type: string
          description: |
            Target MAC address. Accepts `AA:BB:CC:DD:EE:FF`, `aabbccddeeff` and
            `AA-BB-CC-DD-EE-FF` style input; the packet is sent for the canonical
            colon-separated uppercase form.
          example: AA:BB:CC:DD:EE:FF
    Net_MacList:
      type: object
      description: |
        Response of `GET /api/network/wol/mac`: the raw lines of the Wake-on-LAN history
        file `/etc/kvm/cache/wol`.
      required:
      - macs
      properties:
        macs:
          type: array
          description: |
            History entries. Each entry is either a bare MAC address
            (`AA:BB:CC:DD:EE:FF`, uppercase, colon-separated) or `"<MAC> <name>"` when a
            name was set. The file is newline-terminated, so a trailing empty string is
            normally present — clients should ignore empty entries.
          items:
            type: string
          example:
          - AA:BB:CC:DD:EE:FF
          - 11:22:33:44:55:66 workstation
          - ''
    Net_DeleteMacRequest:
      type: object
      description: |
        Request body for `DELETE /api/network/wol/mac` (sent as JSON by the official web
        UI). The MAC must match the canonical spelling stored in the history file.
      required:
      - mac
      properties:
        mac:
          type: string
          description: MAC address to remove from the history (exact, case-sensitive match).
          example: AA:BB:CC:DD:EE:FF
    Net_SetMacNameRequest:
      type: object
      description: |
        Request body for `POST /api/network/wol/mac/name`. The MAC must already be listed
        in the history file.
      required:
      - mac
      - name
      properties:
        mac:
          type: string
          description: MAC address to name (exact, case-sensitive match on the stored entry).
          example: 11:22:33:44:55:66
        name:
          type: string
          description: Human-readable name stored after the MAC (single line, no validation).
          example: workstation
    Net_StaticIp:
      type: object
      description: Response of `GET /api/network/static-ip`.
      required:
      - enabled
      - ip
      properties:
        enabled:
          type: boolean
          description: '`true` when `/boot/eth.nodhcp` exists (static IP mode on).'
          example: true
        ip:
          type: string
          description: |
            Raw content of `/boot/eth.nodhcp` (may be multi-line; the web UI edits
            newline-separated IPv4 CIDR entries). Empty string when disabled.
          example: 192.168.1.100/24
    Net_SetStaticIpRequest:
      type: object
      description: |
        Request body for `POST /api/network/static-ip`. `enabled: true` requires a
        non-empty `ip`; `enabled: false` requires an empty `ip`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` writes `ip` to `/boot/eth.nodhcp` (static IP on); `false` removes the
            file (DHCP on).
          example: true
        ip:
          type: string
          description: |
            Static IP configuration written verbatim to the file. The web UI sends
            newline-separated IPv4 CIDR text (for example `192.168.1.100/24`). Must be
            empty when `enabled` is `false`.
          example: 192.168.1.100/24
    Net_Wifi:
      type: object
      description: |
        One Wi-Fi network. In scan results all fields are populated by the scan script; in
        the connected-network object of `GET /api/network/wifi` the `signal` and
        `frequency` fields are always `0`.
      required:
      - ssid
      - bssid
      - signal
      - frequency
      - security
      properties:
        ssid:
          type: string
          description: Network name (SSID).
          example: HomeNet
        bssid:
          type: string
          description: BSSID of the access point.
          example: aa:bb:cc:11:22:33
        signal:
          type: integer
          description: |
            Signal strength in dBm (negative). Always `0` in the connected-network object
            returned by `GET /api/network/wifi`.
          example: -52
        frequency:
          type: integer
          description: |
            Channel frequency in MHz. Always `0` in the connected-network object returned
            by `GET /api/network/wifi`.
          example: 2437
        security:
          type: string
          description: |
            Security of the network. In scan results, values such as `WPA-PSK` or `open`
            (the web UI treats a case-insensitive `open` match as no password required);
            in the connected-network object it is the `wpa_cli` `key_mgmt` value (for
            example `WPA-PSK`, `NONE` for open networks).
          example: WPA-PSK
    Net_WifiStatus:
      type: object
      description: |
        Response of `GET /api/network/wifi`. Note the nested `wifi` object — the Pro
        firmware returns the connected network as an object, unlike the non-Pro
        firmware's flat `ssid` field.
      required:
      - supported
      - apMode
      - connected
      - wifi
      properties:
        supported:
          type: boolean
          description: '`true` when a wireless interface is present on the device.'
          example: true
        apMode:
          type: boolean
          description: '`true` when `hostapd` is running (device acts as an access point).'
          example: false
        connected:
          type: boolean
          description: '`true` when the WPA state is `COMPLETED` (associated and authenticated).'
          example: true
        wifi:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Net_Wifi'
          description: |
            Details of the connected network; `null` when not connected or when Wi-Fi is
            not supported.
    Net_WifiScanResult:
      type: object
      description: Response of `GET /api/network/wifi/scan`.
      required:
      - wifiList
      properties:
        wifiList:
          type: array
          nullable: true
          description: |
            Nearby networks, excluding the currently connected one (matched by BSSID).
            `null` when the scan script produced no list.
          items:
            $ref: '#/components/schemas/Net_Wifi'
    Net_ConnectWifiRequest:
      type: object
      description: |
        Request body for `POST /api/network/wifi` (AP-mode onboarding) and
        `POST /api/network/wifi/connect`. The struct has no `form:` tags, so form-encoded
        clients must use the Go field names (`ssid`, `password`); JSON keys are the same.
      required:
      - ssid
      properties:
        ssid:
          type: string
          description: Network name to connect to (must not be empty).
          example: HomeNet
        password:
          type: string
          description: |
            Network password. Optional — omit or send an empty string for open networks.
            Must not exceed 128 characters.
          example: correct-horse-battery-staple
    Stream_SetRateControlModeReq:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - cbr
          - vbr
          description: Constant bit-rate (`cbr`) or variable bit-rate (`vbr`).
          example: vbr
    Stream_SetModeReq:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - mjpeg
          - h264-webrtc
          - h264-direct
          - h265-webrtc
          - h265-direct
          description: Stream type to activate.
          example: h264-webrtc
    Stream_SetQualityReq:
      type: object
      required:
      - quality
      properties:
        quality:
          type: integer
          minimum: 1
          maximum: 20000
          description: |
            `1`–`100` sets the quality factor; `101`–`20000` sets the encoder bit-rate in
            kbps.
          example: 80
    Stream_SetGopReq:
      type: object
      required:
      - gop
      properties:
        gop:
          type: integer
          minimum: 1
          maximum: 200
          description: Keyframe interval in frames.
          example: 50
    Stream_SetFpsReq:
      type: object
      required:
      - fps
      properties:
        fps:
          type: integer
          minimum: 0
          maximum: 120
          description: Target frame rate; `0` lets the encoder decide.
          example: 30
    Speed_PingResult:
      type: object
      description: Response of `GET /api/speed/ping`.
      required:
      - success
      - timestamp
      - server_time
      - client_time
      properties:
        success:
          type: boolean
          description: Always `true` on HTTP 200.
          example: true
        timestamp:
          type: integer
          description: Server Unix time (seconds).
          example: 1727779200
        server_time:
          type: integer
          format: int64
          description: Server receive time (nanoseconds).
          example: 1727779200123456789
        client_time:
          type: integer
          format: int64
          description: Echo of the `X-Time` request header.
          example: 1727779200000000000
    Speed_UploadResult:
      type: object
      description: Response of `POST /api/speed/upload`.
      required:
      - test_type
      - client_time
      - server_time
      - response_time
      - client_receive
      - latency
      - rtt
      - speed
      - data_size
      - timestamp
      properties:
        test_type:
          type: string
          enum:
          - upload
          example: upload
        client_time:
          type: integer
          format: int64
          description: Echo of the `X-Time` header (nanoseconds).
          example: 1727779200000000000
        server_time:
          type: integer
          format: int64
          description: Server receive time (nanoseconds).
          example: 1727779200123456789
        response_time:
          type: integer
          format: int64
          description: Server response time (nanoseconds).
          example: 1727779200987654321
        client_receive:
          type: integer
          format: int64
          description: Same as `response_time` (server-side completion).
          example: 1727779200987654321
        latency:
          type: number
          description: One-way latency in milliseconds (RTT / 2).
          example: 49.38
        rtt:
          type: number
          description: Round-trip time in milliseconds.
          example: 98.77
        speed:
          type: number
          description: Measured upload speed in Mbps.
          example: 810.03
        data_size:
          type: integer
          format: int64
          description: Number of bytes received.
          example: 10485760
        timestamp:
          type: integer
          description: Server Unix time (seconds).
          example: 1727779200
    Local_StreamerStatus:
      type: object
      description: Streamer status document returned by `GET /api/streamer/local` (no envelope).
      required:
      - ok
      - result
      properties:
        ok:
          type: boolean
          description: Always `true`.
          example: true
        result:
          $ref: '#/components/schemas/Local_StreamerResult'
    Local_StreamerResult:
      type: object
      properties:
        delay:
          type: integer
          description: Nominal pipeline delay in milliseconds.
          example: 130
        deprecated:
          type: array
          items:
            type: string
          description: Deprecated feature names (empty in current builds).
          example: []
        features:
          type: object
          properties:
            h264:
              type: boolean
              example: true
            quality:
              type: boolean
              example: true
            resolution:
              type: boolean
              example: true
        limits:
          type: object
          properties:
            available_resolutions:
              type: array
              items:
                type: string
              example:
              - 3840x2160
              - 2560x1440
              - 1920x1080
            desired_fps:
              $ref: '#/components/schemas/Local_MinMaxInt'
            h264_bitrate:
              $ref: '#/components/schemas/Local_MinMaxInt'
            h264_gop:
              $ref: '#/components/schemas/Local_MinMaxInt'
        params:
          type: object
          properties:
            desired_fps:
              type: integer
              example: 30
            h264_bitrate:
              type: integer
              example: 8000
            h264_gop:
              type: integer
              example: 50
            resolution:
              type: string
              example: 1920x1080
        snapshot:
          type: object
          properties:
            saved:
              description: Last saved screen snapshot (implementation detail; often null).
        streamer:
          type: object
          properties:
            encoder:
              type: object
              properties:
                quality:
                  type: integer
                  example: 80
                type:
                  type: string
                  description: Active stream type.
                  example: h264-webrtc
            h264:
              type: object
              properties:
                bitrate:
                  type: integer
                  example: 8000
                real_bitrate:
                  type: integer
                  example: 8000
                fps:
                  type: integer
                  example: 30
                gop:
                  type: integer
                  example: 50
                online:
                  type: boolean
                  example: true
            instance_id:
              type: string
              example: nanokvm-pro
            sinks:
              type: object
              properties:
                h264:
                  type: object
                  properties:
                    has_clients:
                      type: boolean
                      example: false
                jpeg:
                  type: object
                  properties:
                    has_clients:
                      type: boolean
                      example: false
            source:
              type: object
              properties:
                captured_fps:
                  type: integer
                  example: 30
                desired_fps:
                  type: integer
                  example: 30
                online:
                  type: boolean
                  example: true
                resolution:
                  type: object
                  properties:
                    height:
                      type: integer
                      example: 1080
                    width:
                      type: integer
                      example: 1920
            stream:
              type: object
              properties:
                clients:
                  type: integer
                  description: Connected stream clients (`0` = H.264 sink, `1` = MJPEG sink).
                  example: 0
                clients_stat:
                  type: object
                  description: Per-sink client statistics.
                  example: {}
                queued_fps:
                  type: integer
                  example: 30
    Local_MinMaxInt:
      type: object
      properties:
        max:
          type: integer
          example: 60
        min:
          type: integer
          example: 1
    Vm_IP:
      type: object
      description: One IPv4 address of the device.
      required:
      - name
      - addr
      - version
      - type
      properties:
        name:
          type: string
          description: Linux interface name (`eth0`, `wlan0`, …).
          example: eth0
        addr:
          type: string
          description: IPv4 address in dotted-quad form.
          example: 192.168.1.42
        version:
          type: string
          description: IP version; always `"IPv4"` (IPv6 addresses are not reported).
          example: IPv4
        type:
          type: string
          enum:
          - Wired
          - Wireless
          description: |
            Link type derived from the interface name: `Wired` for
            `eth*`/`en*`, `Wireless` for `wlan*`/`wl*`.
          example: Wired
    Vm_Info:
      type: object
      description: Device information returned by `GET /api/vm/info`.
      required:
      - ips
      - mdns
      - image
      - application
      - deviceKey
      - pn
      - arch
      properties:
        ips:
          type: array
          nullable: true
          description: |
            IPv4 addresses of up, wired/wireless interfaces. `null` when no
            suitable interface exists.
          items:
            $ref: '#/components/schemas/Vm_IP'
        mdns:
          type: string
          description: |
            `<hostname>.local` when the mDNS responder is running, otherwise
            an empty string.
          example: nanokvm.local
        image:
          type: string
          description: |
            System image version (last `-`-separated token of `/boot/ver`;
            `"v0.0.0"` when unknown).
          example: v1.0.4
        application:
          type: string
          description: Installed application version (`/kvmapp/version`).
          example: 1.2.14
        deviceKey:
          type: string
          description: Device key from `/device_key` (empty when missing).
          example: 5f2a9c31e8b7d4a0
        pn:
          type: string
          description: |
            Product/device number — the last space-separated token of
            `/proc/lt6911_info/version`; `"unknown"` when unreadable.
          example: '2410150032'
        arch:
          type: string
          description: Kernel architecture (for example `arm64`).
          example: arm64
    Vm_Hardware:
      type: object
      description: Hardware form name returned by `GET /api/vm/hardware`.
      required:
      - version
      properties:
        version:
          type: string
          enum:
          - Pro
          - Unknown
          description: |
            Hardware form name. Both the Desk and ATX variants map to
            `"Pro"`, so this endpoint always returns `"Pro"` in the current
            build; `"Unknown"` is the fallback for an unrecognised form.
          example: Pro
    Vm_GpioRequest:
      type: object
      description: |
        Request body for `POST /api/vm/gpio`. The Go struct has no `json`
        tags, so JSON keys are matched case-insensitively; the official web
        UI sends `type` / `duration`.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - power
          - reset
          description: Which ATX button to press.
          example: power
        duration:
          type: integer
          description: |
            Press time in milliseconds; `0`/omitted means the default of
            `800` ms.
          example: 800
    Vm_GpioState:
      type: object
      description: ATX LED states returned by `GET /api/vm/gpio`.
      required:
      - pwr
      - hdd
      properties:
        pwr:
          type: boolean
          description: |
            Power LED state (active-low GPIO: `true` when the raw value is
            `0`, i.e. the LED is lit).
          example: true
        hdd:
          type: boolean
          description: HDD LED placeholder; always `false` in the current build.
          example: false
    Vm_ScriptList:
      type: object
      description: Script file names returned by `GET /api/vm/script`.
      required:
      - files
      properties:
        files:
          type: array
          nullable: true
          description: |
            Names of `.sh`/`.py` files under `/etc/kvm/scripts` (empty/`null`
            when none).
          items:
            type: string
          example:
          - health-check.sh
          - flash-bios.py
    Vm_ScriptUploadRequest:
      type: object
      description: |
        Multipart body for `POST /api/vm/script/upload`. Exactly one part
        named `file`; its filename must end with `.sh` or `.py`
        (case-insensitive). No size limit or content validation.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: |
            The script file. Stored as `/etc/kvm/scripts/<filename>` and
            marked executable for its owner.
    Vm_ScriptUploadResult:
      type: object
      description: Result of `POST /api/vm/script/upload`.
      required:
      - file
      properties:
        file:
          type: string
          description: Name under which the script was stored.
          example: health-check.sh
    Vm_ScriptRunRequest:
      type: object
      description: |
        Request body for `POST /api/vm/script/run`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively.
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: |
            Script file name as returned by `GET /api/vm/script`. Used
            verbatim in `/etc/kvm/scripts/<name>` (no traversal
            sanitisation).
          example: health-check.sh
        type:
          type: string
          enum:
          - foreground
          - background
          description: |
            Execution mode: `foreground` waits and returns the combined
            output; `background` starts the script detached and returns
            immediately. Any value other than `foreground` behaves as
            `background`.
          example: foreground
    Vm_ScriptRunResult:
      type: object
      description: Result of `POST /api/vm/script/run`.
      required:
      - log
      properties:
        log:
          type: string
          description: |
            Combined stdout+stderr of a foreground run; empty for background
            runs (output is discarded).
          example: 'uptime: 03:14'
    Vm_ScriptDeleteRequest:
      type: object
      description: |
        Request body for `DELETE /api/vm/script`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively.
      required:
      - name
      properties:
        name:
          type: string
          description: Script file name to delete from `/etc/kvm/scripts`.
          example: health-check.sh
    Vm_VirtualDeviceState:
      type: object
      description: Virtual USB device state returned by `GET /api/vm/device/virtual`.
      required:
      - isNetworkEnabled
      - isMicEnabled
      - mountedDisk
      - isEmmcExist
      - isSdCardExist
      properties:
        isNetworkEnabled:
          type: boolean
          description: The virtual USB network card (NCM) is exposed to the target machine.
          example: true
        isMicEnabled:
          type: boolean
          description: The virtual USB microphone (UAC2) is exposed to the target machine.
          example: false
        mountedDisk:
          type: string
          enum:
          - sdcard
          - emmc
          - ''
          description: |
            Backing store of the virtual USB mass-storage device: `sdcard`,
            `emmc`, or an empty string when no virtual disk is mounted.
          example: sdcard
        isEmmcExist:
          type: boolean
          description: The eMMC backing image (`/exfat.img`) exists.
          example: true
        isSdCardExist:
          type: boolean
          description: An SD card device (`/dev/mmcblk1`) is present.
          example: true
    Vm_VirtualDeviceUpdateRequest:
      type: object
      description: |
        Request body for `POST /api/vm/device/virtual`. `network` and `mic`
        toggle their device; `disk` selects the backing store named by
        `type` (empty string unmounts).
      required:
      - device
      properties:
        device:
          type: string
          enum:
          - disk
          - network
          - mic
          description: Which virtual device to change.
          example: disk
        type:
          type: string
          enum:
          - sdcard
          - emmc
          - ''
          description: |
            Backing store for `device: "disk"` (`sdcard`, `emmc` or an empty
            string to unmount). Ignored for `network` and `mic`. The web UI
            sends an empty string to disable the disk. Mounting `emmc` for
            the first time wipes the NanoKVM `/data` partition.
          example: sdcard
    Vm_VirtualDeviceRefreshRequest:
      type: object
      description: Request body for `POST /api/vm/device/virtual/refresh`.
      required:
      - device
      properties:
        device:
          type: string
          enum:
          - emmc
          description: |
            Device to refresh. Only `emmc` is accepted; anything else fails
            with `code: -1`.
          example: emmc
    Vm_OledConfig:
      type: object
      description: OLED configuration returned by `GET /api/vm/oled`.
      required:
      - exist
      - type
      - sleep
      properties:
        exist:
          type: boolean
          description: Always `true` in the current implementation (hardcoded).
          example: true
        type:
          type: string
          enum:
          - ATX
          - DESK
          description: |
            Screen form read from `/proc/lt6911_info/version`. The OLED
            panel belongs to the ATX form (the web UI only shows the OLED
            setting for `ATX`).
          example: ATX
        sleep:
          type: integer
          description: |
            Seconds of inactivity before the OLED turns off; `0` = never.
            `0` is also reported when the `kvm_ui` service is unreachable.
          example: 60
    Vm_OledSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/oled`. The Go struct has no `json`
        tags, so JSON keys are matched case-insensitively.
      properties:
        sleep:
          type: integer
          description: |
            Inactivity timeout in seconds (`0` = never turn off). The web UI
            offers 0, 15, 30, 60, 180, 300, 600, 1800, 3600.
          example: 60
    Vm_LcdTimeFormat:
      type: object
      description: LCD clock format returned by `GET /api/vm/lcd/time/format`.
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - 12h
          - 24h
          description: |
            Clock format of the Desk touchscreen (lowercase on the wire; the
            web UI displays `12H`/`24H`).
          example: 24h
    Vm_LcdTimeFormatSetRequest:
      type: object
      description: Request body for `POST /api/vm/lcd/time/format`.
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - 12h
          - 24h
          description: |
            Desired clock format. The value is lower-cased before
            validation, so `12H`/`24H` (what the web UI sends) are accepted.
          example: 24h
    Vm_LcdScreenOffConfig:
      type: object
      description: |
        Scheduled screen-off window returned by `GET /api/vm/lcd/screen-off`.
      required:
      - supported
      - enabled
      - startMinute
      - endMinute
      properties:
        supported:
          type: boolean
          description: |
            `true` on the Desk form; `false` on ATX (all other fields are
            zeroed there).
          example: true
        enabled:
          type: boolean
          description: Whether the scheduled screen-off is active.
          example: true
        startMinute:
          type: integer
          description: |
            Start of the off window, minutes since local midnight (0–1439).
          example: 1320
        endMinute:
          type: integer
          description: |
            End of the off window, minutes since local midnight (0–1439).
            May be smaller than `startMinute` (a window wrapping past
            midnight).
          example: 360
    Vm_LcdScreenOffSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/lcd/screen-off`. All three fields are
        required — the handler dereferences them.
      required:
      - enabled
      - startMinute
      - endMinute
      properties:
        enabled:
          type: boolean
          description: Whether to enable the scheduled screen-off.
          example: true
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Start of the off window, minutes since local midnight.
          example: 1320
        endMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: |
            End of the off window, minutes since local midnight. Must differ
            from `startMinute` when `enabled` is `true`.
          example: 360
    Vm_LcdDisplaySchedule:
      type: object
      description: |
        Scheduled screen-off window embedded in the LCD display policy.
      required:
      - supported
      - enabled
      - startMinute
      - endMinute
      properties:
        supported:
          type: boolean
          description: Whether scheduled screen-off is supported on this screen.
          example: true
        enabled:
          type: boolean
          description: Whether the scheduled screen-off is active.
          example: true
        startMinute:
          type: integer
          description: Start of the off window, minutes since local midnight (0–1439).
          example: 1320
        endMinute:
          type: integer
          description: End of the off window, minutes since local midnight (0–1439).
          example: 360
        wakeTimeoutSeconds:
          type: integer
          description: |
            Seconds an idle screen takes to wake on interaction; omitted
            when the firmware does not report it.
          example: 15
    Vm_LcdDisplayPolicy:
      type: object
      description: |
        Desk touchscreen display policy returned by
        `GET /api/vm/lcd/display-policy`. On the ATX form only `screenType`
        is meaningful (the other fields are zero/null).
      required:
      - screenType
      - schedule
      properties:
        screenType:
          type: string
          enum:
          - ATX
          - DESK
          description: Screen form read from `/proc/lt6911_info/version`.
          example: DESK
        supportedModes:
          type: array
          nullable: true
          description: |
            Idle modes this firmware supports (a subset of `alwaysOn`,
            `idleClock`, `idleOff`); `null` on ATX.
          items:
            type: string
            enum:
            - alwaysOn
            - idleClock
            - idleOff
          example:
          - alwaysOn
          - idleClock
          - idleOff
        mode:
          type: string
          enum:
          - alwaysOn
          - idleClock
          - idleOff
          description: Active idle mode; omitted when the policy has none.
          example: idleClock
        modeTimeoutSeconds:
          type: object
          nullable: true
          description: |
            Per-mode idle timeout in seconds, keyed by mode name; omitted
            when the firmware does not report it.
          additionalProperties:
            type: integer
          example:
            idleClock: 30
            idleOff: 60
        schedule:
          $ref: '#/components/schemas/Vm_LcdDisplaySchedule'
    Vm_LcdDisplayScheduleSetRequest:
      type: object
      description: |
        Schedule block of `POST /api/vm/lcd/display-policy`. When present,
        all three fields are required.
      required:
      - enabled
      - startMinute
      - endMinute
      properties:
        enabled:
          type: boolean
          description: Whether to enable the scheduled screen-off.
          example: true
        startMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: Start of the off window, minutes since local midnight.
          example: 1320
        endMinute:
          type: integer
          minimum: 0
          maximum: 1439
          description: |
            End of the off window, minutes since local midnight. Must differ
            from `startMinute` when `enabled` is `true`.
          example: 360
    Vm_LcdDisplayPolicySetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/lcd/display-policy`. At least one of
        `mode` or `schedule` must be present.
      properties:
        mode:
          type: string
          enum:
          - alwaysOn
          - idleClock
          - idleOff
          description: Desired idle mode.
          example: idleClock
        schedule:
          $ref: '#/components/schemas/Vm_LcdDisplayScheduleSetRequest'
    Vm_HdmiCaptureState:
      type: object
      description: HDMI capture status returned by `GET /api/vm/hdmi/capture`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` when the LT6911 capture path is powered on
            (`/proc/lt6911_info/power` contains `'on'`).
          example: true
    Vm_HdmiCaptureSetRequest:
      type: object
      description: Request body for `POST /api/vm/hdmi/capture`.
      properties:
        enabled:
          type: boolean
          description: |
            Desired capture state. `false` is required for non-standard
            passthrough rates (4K40/4K60).
          example: false
    Vm_HdmiPassthroughState:
      type: object
      description: HDMI passthrough status returned by `GET /api/vm/hdmi/passthrough`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` when the HDMI loop-out is powered on
            (`/proc/lt6911_info/loopout_power` contains `'on'`).
          example: true
    Vm_HdmiPassthroughSetRequest:
      type: object
      description: Request body for `POST /api/vm/hdmi/passthrough`.
      properties:
        enabled:
          type: boolean
          description: Desired loop-out (passthrough) state.
          example: true
    Vm_SshState:
      type: object
      description: SSH server state returned by `GET /api/vm/ssh`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: |
            `true` when `ssh.service` or `ssh.socket` is active (running or
            listening).
          example: true
    Vm_EdidState:
      type: object
      description: Active EDID name returned by `GET /api/vm/edid`.
      required:
      - edid
      properties:
        edid:
          type: string
          description: |
            Built-in EDID name (`E18-4K30FPS`, `E48-4K39FPS`,
            `E54-1080P60FPS`, `E56-2K60FPS`, `E58-4K16-10`,
            `E63-Ultrawide`), the file name of the active custom EDID, or an
            empty string when unknown.
          example: E54-1080P60FPS
    Vm_EdidSwitchRequest:
      type: object
      description: |
        Request body for `POST /api/vm/edid`. The Go field carries a `form`
        tag; JSON keys are matched case-insensitively, so `edid` works.
      required:
      - edid
      properties:
        edid:
          type: string
          description: |
            Built-in EDID name (resolved as `/kvmcomm/edid/<name>.bin`) or
            the file name of a custom EDID in `/etc/kvm/edid`.
          example: E56-2K60FPS
    Vm_EdidUploadRequest:
      type: object
      description: |
        Multipart body for `POST /api/vm/edid/upload`. Exactly one part
        named `file`. Neither the filename nor the content is validated (no
        extension rule, size limit or EDID checksum check); name it with a
        `.bin` extension so it appears in the custom list.
      required:
      - file
      properties:
        file:
          type: string
          format: binary
          description: |
            Raw EDID binary (typically 128 or 256 bytes). Stored as
            `/etc/kvm/edid/<filename>` with mode 0644 and later copied
            verbatim to the HDMI converter.
    Vm_EdidUploadResult:
      type: object
      description: Result of `POST /api/vm/edid/upload`.
      required:
      - file
      properties:
        file:
          type: string
          description: Name under which the EDID was stored.
          example: my-edid.bin
    Vm_EdidCustomList:
      type: object
      description: Custom EDID names returned by `GET /api/vm/edid/custom`.
      required:
      - edidList
      properties:
        edidList:
          type: array
          nullable: true
          description: |
            `*.bin` file names in `/etc/kvm/edid` (empty/`null` when none).
          items:
            type: string
          example:
          - my-edid.bin
          - dell-u2720.bin
    Vm_EdidDeleteRequest:
      type: object
      description: |
        Request body for `POST /api/vm/edid/delete`. The Go field carries a
        `form` tag; JSON keys are matched case-insensitively, so `edid`
        works.
      required:
      - edid
      properties:
        edid:
          type: string
          description: File name of the custom EDID to delete.
          example: my-edid.bin
    Vm_MouseJigglerState:
      type: object
      description: Mouse jiggler state returned by `GET /api/vm/mouse-jiggler`.
      required:
      - enabled
      - mode
      properties:
        enabled:
          type: boolean
          description: |
            `true` when the persistence file `/etc/kvm/mouse-jiggler`
            exists (the jiggler then also auto-starts at boot).
          example: true
        mode:
          type: string
          enum:
          - relative
          - absolute
          description: How the pointer is moved every 15 seconds.
          example: relative
    Vm_MouseJigglerSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/mouse-jiggler/`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively. Both
        fields are optional; an omitted `enabled` binds to `false`.
      properties:
        enabled:
          type: boolean
          description: |
            `true` enables and persists the jiggler; `false` stops it and
            removes the persistence file.
          example: true
        mode:
          type: string
          enum:
          - relative
          - absolute
          description: Movement mode used while enabled.
          example: relative
    Vm_HostnameState:
      type: object
      description: Hostname returned by `GET /api/vm/hostname`.
      required:
      - hostname
      properties:
        hostname:
          type: string
          description: Current device hostname (from `/etc/hostname`).
          example: nanokvm
    Vm_HostnameSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/hostname`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively.
      required:
      - hostname
      properties:
        hostname:
          type: string
          description: |
            New hostname. Written to `/boot/hostname` and `/etc/hostname`;
            takes effect (kernel hostname, mDNS name) after a reboot.
          example: nanokvm-lab
    Vm_WebTitle:
      type: object
      description: Custom web title returned by `GET /api/vm/web-title`.
      required:
      - title
      properties:
        title:
          type: string
          description: Custom browser-tab title (from `/etc/kvm/web-title`).
          example: Lab KVM — rack 3
    Vm_WebTitleSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/web-title`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively.
      properties:
        title:
          type: string
          description: |
            New tab title. An empty string (or an omitted field) removes the
            title file and resets the title to the default.
          example: Lab KVM — rack 3
    Vm_MdnsState:
      type: object
      description: mDNS responder state returned by `GET /api/vm/mdns`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: true when avahi-daemon.service is active.
          example: true
    Vm_LowPowerState:
      type: object
      description: Low power mode status returned by `GET /api/vm/low-power`.
      required:
      - enabled
      properties:
        enabled:
          type: boolean
          description: true when kvm-sleep.service is running.
          example: false
    Vm_LowPowerSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/low-power`. The Go field carries a
        `form` tag; JSON keys are matched case-insensitively, so `enable`
        works.
      properties:
        enable:
          type: boolean
          description: |
            `true` enables (and enables at boot) `kvm-sleep.service`;
            `false` stops and disables it.
          example: true
    Vm_LedStripConfig:
      type: object
      description: |
        LED strip configuration returned by `GET /api/vm/ledstrip/get`
        (read from the on-device `kvm_ui` service).
      required:
      - brightness
      - hor
      - 'on'
      - ver
      properties:
        brightness:
          type: integer
          description: LED brightness (0–100 in the web UI slider).
          example: 40
        hor:
          type: integer
          description: Number of horizontal LEDs.
          example: 60
        'on':
          type: boolean
          description: Master switch for the strip.
          example: true
        ver:
          type: integer
          description: Number of vertical LEDs.
          example: 20
    Vm_LedStripSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/ledstrip/set`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively. All fields
        are optional but are forwarded even when zero, so send the complete
        configuration.
      properties:
        'on':
          type: boolean
          description: Master switch for the strip.
          example: true
        hor:
          type: integer
          description: |
            Number of horizontal LEDs. The web UI constrains it to
            `1 … 150 − 2·ver`; changes need the strip power-cycled.
          example: 60
        ver:
          type: integer
          description: |
            Number of vertical LEDs. The web UI constrains it to
            `1 … floor((150 − hor)/2)`; changes need the strip power-cycled.
          example: 20
        brightness:
          type: integer
          description: LED brightness (0–100 in the web UI slider).
          example: 40
    Vm_Timezone:
      type: object
      description: Time zone returned by `GET /api/vm/timezone`.
      required:
      - timezone
      properties:
        timezone:
          type: string
          description: Current IANA time zone name.
          example: Asia/Shanghai
    Vm_TimezoneSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/timezone`. The Go struct has no
        `json` tags, so JSON keys are matched case-insensitively.
      required:
      - timezone
      properties:
        timezone:
          type: string
          description: |
            IANA time zone name (validated with Go's zoneinfo database, then
            applied with `timedatectl set-timezone`).
          example: Asia/Shanghai
    Vm_TimeStatus:
      type: object
      description: NTP status returned by `GET /api/vm/time/status`.
      required:
      - isSynchronized
      - lastSyncTime
      properties:
        isSynchronized:
          type: boolean
          description: '`true` when chrony reports leap status `Normal`.'
          example: true
        lastSyncTime:
          type: integer
          format: int64
          description: |
            Time of the last successful NTP sync as Unix milliseconds
            (parsed from chrony's "Ref time (UTC)"); `0` when never
            synchronized.
          example: 1759345600123
    Vm_MenuBarConfig:
      type: object
      description: |
        Menu bar configuration returned by `GET /api/vm/menubar` (read from
        `/etc/kvm/menubar`).
      required:
      - disabledItems
      properties:
        disabledItems:
          type: array
          nullable: true
          description: |
            Menu bar item keys that are hidden in the web UI. Known keys:
            `volume`, `microphone`, `image`, `script`, `assistant`,
            `terminal`, `wol`, `power`, `fullscreen`, `collapse`. Empty or
            `null` when nothing is hidden.
          items:
            type: string
          example:
          - assistant
          - wol
    Vm_MenuBarConfigSetRequest:
      type: object
      description: |
        Request body for `POST /api/vm/menubar`. The list **replaces** the
        stored one; an empty array (or an omitted field) re-enables every
        item.
      properties:
        disabledItems:
          type: array
          description: Menu bar item keys to hide.
          items:
            type: string
          example: &id001
          - assistant
          - wol
    Vm_TerminalWindowSize:
      type: object
      description: |
        Payload of a **binary** WebSocket frame on
        `GET /api/vm/terminal` — a terminal resize request. Any binary
        frame that does not parse as this JSON shape is dropped.
      required:
      - rows
      - cols
      properties:
        rows:
          type: integer
          description: New terminal height in character rows.
          example: 24
        cols:
          type: integer
          description: New terminal width in character columns.
          example: 80
  responses:
    Unauthorized:
      description: |
        Not authenticated — the `nano-kvm-token` cookie / bearer token is missing, expired
        or invalid. The body is the JSON string `"unauthorized"`. (Requests from loopback
        never receive this.)
      content:
        application/json:
          schema:
            type: string
            example: unauthorized
paths:
  /api/application/preview:
    get:
      tags:
      - Application
      operationId: app_getPreview
      summary: Get the preview-updates state
      description: |
        Returns whether **preview** (pre-release) updates are enabled. The state is
        backed by the presence of the flag file `/etc/kvm/preview_updates`.

        Preview updates are only consulted when no custom update source is enabled;
        the preview root is `https://cdn.sipeed.com/nanokvm/preview`. The web UI
        disables the preview switch while a custom source is active.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Preview-updates state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_PreviewState'
              example:
                code: 0
                msg: success
                data:
                  enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Application
      operationId: app_setPreview
      summary: Enable or disable preview updates
      description: |
        Enables or disables preview (pre-release) updates. Enabling writes the flag
        file `/etc/kvm/preview_updates` containing `1`; disabling removes it.

        The call is **idempotent**: when the requested state already matches the
        current one, the handler returns success without touching the flag file.

        The Go struct field has no `json` tag, so JSON keys are matched
        case-insensitively — the official web UI sends `{"enable": true}`. The body
        is bound with `ShouldBind`, so `application/x-www-form-urlencoded` is also
        accepted (form clients must use the Go field name `Enable`).

        Failure codes (HTTP 200): `-1` `invalid arguments`, `-2` `enable failed`,
        `-3` `disable failed`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App_SetPreviewRequest'
            example:
              enable: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/App_SetPreviewRequest'
            example:
              enable: true
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update:
    post:
      tags:
      - Application
      operationId: app_update
      summary: Update the application from the update source
      description: |
        Runs the **online** application update to the latest version advertised by the
        active update source. Takes no request body.

        This call is **synchronous** and can take many minutes (download + three
        `dpkg -i` runs); the official web UI sets a 15-minute client timeout. It is
        serialized by a process-wide update lock that is shared with the manual update
        flow — a second call while one is running fails immediately with
        `code: -1`, `msg: "update already in progress"`.

        Steps performed:

        1. Read the manifest (`nanokvm_pro_latest.json`) and validate it.
        2. Download `nanokvm_pro_<version>.tar.gz` into a private workspace under
           `/root/.kvmcache`, retrying up to 3 times, enforcing a 512 MiB package cap
           and a free-space check (expanded size + 16 MiB).
        3. Verify the package's base64 SHA-512 against the manifest.
        4. Inspect the archive (same rules as the manual-update inspect endpoint) and
           require its kind and version to match the manifest.
        5. Extract only the validated members and install the three Debian packages
           `nanokvmpro`, `pikvm` and `kvmcomm` with `dpkg -i` (3 attempts each,
           `DEBIAN_FRONTEND=noninteractive`).
        6. Signal restart.

        Progress is pushed to every connected WebSocket client on `/api/ws` as
        text frames of the form:

        ```json
        {"type": "update", "data": "{\"step\":\"download\",\"progress\":42}"}
        ```

        where `step` is one of `download`, `install`, `restart` and `progress` is an
        integer percentage (0–100). The web UI renders a three-step progress bar from
        these events and reloads the page on `restart`.

        Failure: `code: -2`, `msg: "failed to update service"` for any error in the
        pipeline (unreachable source, checksum mismatch, invalid package layout,
        insufficient disk space, dpkg failure).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update-source:
    get:
      tags:
      - Application
      operationId: app_getUpdateSource
      summary: Get the configured update source
      description: |
        Returns the persisted update-source configuration **without probing the
        network**, so it answers quickly even when the source is unreachable.

        The source is a single root URL shared by the application updater (which
        derives `<url>/nanokvm_pro_latest.json`) and the firmware updater. When no
        custom source is saved, the official root `https://cdn.sipeed.com/nanokvm` is
        reported with `isOfficial: true` and `enabled: false`.

        The configuration lives in `/etc/kvm/update-source.json`; a missing or
        disabled entry always reports the official defaults.

        Failure: `code: -1`, `msg: "failed to load update source"` (unreadable or
        invalid configuration file).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Current update-source configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_UpdateSource'
              example:
                code: 0
                msg: success
                data:
                  url: https://cdn.sipeed.com/nanokvm
                  isOfficial: true
                  enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Application
      operationId: app_setUpdateSource
      summary: Set a custom update source
      description: |
        Validates, normalizes and atomically persists a custom update-server root.
        Takes a JSON body (this is the one endpoint in this group that binds with
        `ShouldBindJSON` — `application/x-www-form-urlencoded` is **not** accepted;
        the handler deliberately avoids the form parser because it logs request
        bodies in debug mode and update-source URLs must never contain credentials).

        Validation and normalization of `url`:

        - trimmed; an empty string (or the official URL) resets the source to the
          official root (`enabled: false`);
        - at most 2048 characters;
        - must be an `http` or `https` URL with a host (`file:` etc. are rejected);
        - must **not** contain credentials (`user:pass@host`);
        - must **not** contain a query or fragment;
        - must **not** end in `.json` — supply the update-server *directory*, not a
          manifest URL;
        - trailing slashes are stripped before saving.

        The result is written to `/etc/kvm/update-source.json` (mode 0600) through a
        temporary file + rename, so readers never see a partial configuration. The
        change takes effect immediately for subsequent version checks — no service
        restart is needed.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (malformed JSON body) |
        | `-2` | the specific validation message, e.g. `update server URL is too long`, `invalid update server URL`, `update server URL must not contain credentials`, `update server URL must not contain a query or fragment`, `enter the update server directory, not a manifest URL` |
        | `-3` | `failed to save update source` |

        The response `data` echoes the saved configuration (the same shape as
        `GET /api/application/update-source`).
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App_SetUpdateSourceRequest'
            example:
              url: https://mirror.example.com/nanokvm-releases
      responses:
        '200':
          description: The saved update-source configuration, or a negative `code`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_UpdateSource'
              example:
                code: 0
                msg: success
                data:
                  url: https://mirror.example.com/nanokvm-releases
                  isOfficial: false
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update-source/reset:
    post:
      tags:
      - Application
      operationId: app_resetUpdateSource
      summary: Restore the official update source
      description: |
        Discards any custom update source and restores the official root
        `https://cdn.sipeed.com/nanokvm` (`enabled: false`, `isOfficial: true`).
        Takes no request body. The configuration is rewritten atomically and takes
        effect immediately.

        Failure: `code: -1`, `msg: "failed to reset update source"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: The restored (official) update-source configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_UpdateSource'
              example:
                code: 0
                msg: success
                data:
                  url: https://cdn.sipeed.com/nanokvm
                  isOfficial: true
                  enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update/manual/confirm:
    post:
      tags:
      - Application
      operationId: app_confirmManualUpdate
      summary: Install a previously inspected update package
      description: |
        Second stage of the manual update flow: installs the staged package whose `id`
        was returned by `POST /api/application/update/manual/inspect`.

        The handler validates the id (must be a UUID), loads the job, checks that it
        is still within its 24-hour lifetime and is in state `staged`, then flips the
        state to `installing` **before** starting a background worker and returns
        immediately — only an explicitly reviewed package can reach the installer.

        The response returns the job already in state `installing`; poll
        `GET /api/application/update/manual/{id}` (the web UI polls every 2 seconds)
        until a terminal state is reached:

        - `succeeded` — application packages: the three `.deb` files were installed
          with `dpkg -i` and a restart was signalled.
        - `failed` — `error` carries the reason (truncated to 512 characters). For
          firmware, a special case is `"firmware installed; automatic reboot
          scheduling failed; reboot manually"`.
        - `reboot_scheduled` — firmware only: the image was written and
          `systemctl reboot` was started. The device reboots shortly afterwards.

        The installer re-hashes (SHA-256) and re-inspects the staged bytes and aborts
        with `"staged update package changed after inspection"` if they no longer
        match the inspection snapshot. Firmware installation is delegated to
        `/kvmcomm/scripts/firmware_update.sh`, the only component allowed to write
        boot media.

        Jobs left in `installing` by a service restart are recovered at startup and
        marked `failed` with `"update process was interrupted; installation state is
        unknown; check the current version before retrying"`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` / `invalid update job` (not a UUID) |
        | `-2` | `update job not found` |
        | `-3` | `update job expired; upload the package again` |
        | `-4` | `update job is not ready to install` (state is not `staged`) |
        | `-5` | `update already in progress` (shared with the online updater) |
        | `-6` | `failed to start update` |

        The body is bound with `ShouldBind`, so JSON (what the web UI sends) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/App_ManualUpdateConfirmRequest'
            example:
              id: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/App_ManualUpdateConfirmRequest'
            example:
              id: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
      responses:
        '200':
          description: The job, already in state `installing`, or a negative `code`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_ManualUpdateJob'
              example:
                code: 0
                msg: success
                data:
                  id: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
                  version: 1.2.15
                  size: 104857600
                  state: installing
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update/manual/inspect:
    post:
      tags:
      - Application
      operationId: app_inspectManualUpdate
      summary: Upload and inspect an update package without installing it
      description: |
        First stage of the **manual (offline) update** flow. Accepts an update package
        via `multipart/form-data`, validates it thoroughly, stages it on disk and
        returns a job descriptor in state `staged`. Nothing is installed until
        `POST /api/application/update/manual/confirm` is called with the returned id.

        Upload constraints:

        - exactly one multipart part named `file` (extra parts are ignored; a second
          `file` part is rejected with `multiple update files uploaded`);
        - the part's filename must be a plain base name (no `/`, `\` or NUL, at most
          255 characters);
        - the package body is capped at **512 MiB** (536 870 912 bytes) and the whole
          request at 512 MiB + 1 MiB of multipart overhead;
        - the device must have enough free disk space for the upload plus the
          archive's expanded size + 16 MiB;
        - before staging, expired jobs are garbage-collected and **any previously
          staged (unconfirmed) job is deleted** — only one staged upload exists at a
          time.

        Inspection rules (a single pass decides between an *application* and a
        *firmware* package):

        - Filenames ending in `.axp` or `.img` are rejected outright ("AXP images are
          not supported by in-device update" / "raw IMG images are not supported by
          in-device update"), as are ZIP archives (detected by the `PK\x03\x04` magic
          bytes).
        - Accepted containers: gzip (`.tar.gz`), xz (`.tar.xz`) and plain tar.
        - Archive limits: at most 1024 entries, at most 1 GiB expanded, at most
          512 MiB per member, member paths at most 512 characters, no absolute
          paths, `..`/`.` components, backslashes, control characters or duplicate
          entries; only regular files and directories are allowed.
        - **Application package**: exactly one top-level directory
          `nanokvm_pro_<version>` containing exactly the six files
          `<app>_<version>_arm64.deb` and `<app>_<version>.json` for each of
          `nanokvmpro`, `pikvm` and `kvmcomm`. Each JSON metadata file must declare a
          matching `version`, `name`, `size` and a base64 SHA-512 that matches the
          corresponding `.deb`. `dpkg-deb -f` is then used to verify each package's
          `Package` (the `nanokvmpro` archive member must declare the Debian package
          name `nanokvm`), `Version` and `Architecture` (`arm64`).
        - **Firmware package**: must contain `firmware/u-boot_signed.bin`,
          `firmware/boot_signed.bin`,
          `firmware/AX630C_emmc_arm64_k419_sipeed_nanokvm_signed.dtb`,
          `overlay/boot/ver` and `b2sum.txt`; `b2sum.txt` must list a BLAKE2b-512
          checksum for every regular member except itself and `firmware_update.sh`.
          The version is extracted from `overlay/boot/ver`.

        The staged job expires after **24 hours**. The response reports the
        server-detected `version` and package `size` (bytes) which the UI shows in a
        confirmation dialog.

        Failure: `code: -1` with the specific reason as `msg` (for example
        `uploaded package exceeds 536870912 bytes`, `no update file uploaded`,
        `unsupported update package layout: ...`, `insufficient free space for
        update: need N bytes`, `application checksum mismatch for nanokvmpro`).

        Example:

        ```sh
        curl -F "file=@nanokvm_pro_1.2.15.tar.gz" \
             -H "Authorization: Bearer $TOKEN" \
             http://nanokvm.local/api/application/update/manual/inspect
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/App_ManualUpdateUploadRequest'
      responses:
        '200':
          description: The staged job descriptor, or a negative `code` on failure.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_ManualUpdateJob'
              example:
                code: 0
                msg: success
                data:
                  id: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
                  version: 1.2.15
                  size: 104857600
                  state: staged
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/update/manual/{id}:
    get:
      tags:
      - Application
      operationId: app_getManualUpdate
      summary: Get the state of a manual update job
      description: |
        Returns the persisted state of a manual update job. Used for polling after
        `POST /api/application/update/manual/confirm`; the official web UI polls every
        2 seconds and treats `succeeded` and `reboot_scheduled` as terminal success,
        `failed` as terminal error, and transient API errors (for example while the
        service restarts mid-update) as retryable.

        Jobs live under `/var/lib/kvm/update-jobs/<id>/`. Staged and terminal jobs are
        garbage-collected once their 24-hour lifetime expires; `installing` jobs are
        preserved so a restart recovery pass can report their ambiguous state.

        Failure codes (HTTP 200): `-1` `invalid update job` (not a UUID), `-2`
        `update job not found`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: UUID of the manual update job returned by the inspect call.
        schema:
          type: string
          format: uuid
          example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
        example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
      responses:
        '200':
          description: The current manual update job state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_ManualUpdateJob'
              example:
                code: 0
                msg: success
                data:
                  id: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
                  version: 1.2.15
                  size: 104857600
                  state: succeeded
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Application
      operationId: app_deleteManualUpdate
      summary: Discard a staged update package
      description: |
        Deletes a staged (inspected but **not** confirmed) update package together
        with its job record. The official web UI calls this when the user cancels the
        confirmation dialog; the server also expires staged jobs on its own after
        24 hours, so a failed cleanup call is ignored by the UI.

        Once a job has been confirmed (state `installing` or later) it can no longer
        be removed — a client must not delete the bytes an installer is using.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid update job` (not a UUID) |
        | `-2` | `update job not found` |
        | `-3` | `only an unconfirmed update job can be removed` |
        | `-4` | `failed to remove update job` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: UUID of the staged manual update job to discard.
        schema:
          type: string
          format: uuid
          example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
        example: 03f2760e-0d79-497f-b9a1-13b64a8c4a06
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/application/version:
    get:
      tags:
      - Application
      operationId: app_getVersion
      summary: Get the installed and latest application versions
      description: |
        Returns the currently installed application version and the newest version
        advertised by the active update source.

        - `current` is read from `/kvmapp/version` (falls back to `v1.0.0` when the
          file is missing or empty).
        - `latest` is read from `<source-root>/nanokvm_pro_latest.json`, fetched with a
          cache-busting `?now=<unix-seconds>` query, capped at 64 KiB, with a 15-minute
          HTTP client timeout. The manifest must contain `version`, `name`, `sha512`
          (base64) and `size`; the package name must match
          `nanokvm_pro_<version>.tar.gz` and the version must match
          `^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$`.

        The source root is resolved per request, in this order:

        1. a custom update source if one is enabled (`POST /api/application/update-source`),
        2. the preview root `https://cdn.sipeed.com/nanokvm/preview` if preview
           updates are enabled,
        3. otherwise the stable root `https://cdn.sipeed.com/nanokvm`.

        If the manifest cannot be fetched **and** a custom source is enabled (or the
        source config cannot be loaded), the call fails with `code: -1`,
        `msg: "failed to query update source"`. If the official/preview source is
        unreachable the failure is tolerated and `latest` silently falls back to the
        value of `current`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Installed and latest application versions.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/App_Version'
              example:
                code: 0
                msg: success
                data:
                  current: 1.2.14
                  latest: 1.2.15
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/account:
    get:
      tags:
      - Authentication
      operationId: auth_getAccount
      summary: Get the account username
      description: |
        Returns the username of the single web account. The account is read from
        `/etc/kvm/pwd`; if that file does not exist the built-in default `admin` is
        reported. The password hash is never returned.

        Failure: `code: -1`, `msg: "get account failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Account username.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Auth_Account'
              example:
                code: 0
                msg: success
                data:
                  username: admin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/login:
    post:
      tags:
      - Authentication
      operationId: auth_login
      summary: Log in and obtain a session token
      description: |
        Public endpoint (no authentication required). Authenticates against the single
        built-in account and returns a signed JWT.

        The account is stored in `/etc/kvm/pwd` as `{username, password}` with the
        password bcrypt-hashed. The default account is `admin` / `admin`. The request
        carries the **plaintext** password (the server compares it against the bcrypt
        hash; the Pro web UI performs no client-side encryption) — use HTTPS in
        production.

        Behaviour:

        - When the server config has `authentication: disable`, no credentials are
          checked and the response contains the literal token string `"disabled"`
          (with `count: 0`). Every other endpoint is open in that mode.
        - On success a JWT (HS256) is generated with the account name as the
          `username` claim and an expiry of `jwt.refreshTokenDuration` seconds
          (default `2678400`, i.e. 31 days). Send it back either as the
          `nano-kvm-token` cookie or as `Authorization: Bearer <token>`.
        - `count` is a reserved field of the response struct; the current server never
          sets it, so it is always `0`.

        Failure responses use HTTP 200 with a negative `code`, each after an
        artificial delay to slow brute force:

        | `code` | `msg` | delay |
        |--------|-------|-------|
        | `-1` | `invalid parameters` | 3 s |
        | `-2` | `invalid username or password` | 2 s |
        | `-3` | `generate token failed` | 1 s |

        The body is bound with `ShouldBind`, so `application/json` (what the official
        web UI sends) and `application/x-www-form-urlencoded` are both accepted. The
        Go struct has no `json` tags; JSON keys are matched case-insensitively, so
        `username`/`password` (as sent by the UI) or `Username`/`Password` both bind.
        Form-urlencoded clients must use the Go field names `Username`/`Password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_LoginRequest'
            example:
              username: admin
              password: admin
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Auth_LoginRequest'
            example:
              username: admin
              password: admin
      responses:
        '200':
          description: |
            Successful login, or an application-level failure with a negative `code`.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Auth_LoginResult'
              example:
                code: 0
                msg: success
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VybmFtZSI6ImFkbWluIiwiZXhwIjoxNzU5MzQ1NjAwfQ.4Ad4Vp5X9n2Y7bC1dE8fGh3JkLm6N0pQrS2TtUvWxYz
                  count: 0
  /api/auth/logout:
    post:
      tags:
      - Authentication
      operationId: auth_logout
      summary: Log out and invalidate the session
      description: |
        Ends the session. Takes no request body.

        When `jwt.revokeTokensOnLogout` is enabled in the server config (the default),
        the handler regenerates the JWT signing secret, which immediately invalidates
        **every** token ever issued by the device — not just the caller's. All clients
        must log in again. When the option is disabled the call is a no-op and
        existing tokens keep working until they expire.

        The web UI additionally removes the `nano-kvm-token` cookie client-side.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload). This endpoint has no failure path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/password:
    get:
      tags:
      - Authentication
      operationId: auth_isPasswordUpdated
      summary: Check whether the default password has been changed
      description: |
        Returns whether the stored account password still equals the factory default
        `admin`. The web UI uses this to show the "please change your password"
        warning on first login.

        Logic: if `/etc/kvm/pwd` does not exist, `isUpdated` is `false`. Otherwise the
        stored bcrypt hash is compared against the plaintext `"admin"`; `isUpdated` is
        `true` only when they do **not** match.

        Failure: `code: -1`, `msg: "failed to get password"` (the account file exists
        but cannot be read or parsed).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Password-changed state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Auth_PasswordUpdated'
              example:
                code: 0
                msg: success
                data:
                  isUpdated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Authentication
      operationId: auth_changePassword
      summary: Change the account password
      description: |
        Replaces the web-account password and the root system password in one step.

        The handler:

        1. bcrypt-hashes the new password (default cost) and writes
           `{username, password}` to `/etc/kvm/pwd` (mode 0644) via a
           backup → write → restore sequence, so a failed write leaves the old
           account file intact.
        2. Runs `passwd root` and feeds the new password twice on stdin, changing the
           **system root password** to the same value.

        The username is written to the account file as given, so this call can also
        rename the login account. There is no old-password verification — any
        authenticated caller can change the credentials.

        After a successful change the official web UI deletes the `nano-kvm-token`
        cookie and returns to the login page. Note that already-issued JWTs remain
        valid until they expire; only `POST /api/auth/logout` (with
        `jwt.revokeTokensOnLogout` enabled) invalidates them.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid parameters` |
        | `-3` | `failed to hash password` |
        | `-4` | `failed to save password` |
        | `-5` | `failed to change password` |

        The body is bound with `ShouldBind`, so JSON (primary, what the web UI sends)
        and `application/x-www-form-urlencoded` are both accepted. JSON keys are
        matched case-insensitively (`username`/`password`); form clients must use
        `Username`/`Password`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_ChangePasswordRequest'
            example:
              username: admin
              password: N@noKVM-2026!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Auth_ChangePasswordRequest'
            example:
              username: admin
              password: N@noKVM-2026!
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/assistant/install:
    post:
      tags:
      - Extensions
      operationId: ext_installAssistant
      summary: Prepare the AI assistant dependencies
      description: |
        First step of the smart-assistant (CUA) extension. Writes the pinned Python
        dependency manifest to `/tmp/requirements.txt`:

        ```text
        Flask>=3.1.1
        flask-cors>=6.0.1
        Flask-SocketIO==5.6.1
        pillow>=11.3.0
        openai>=1.107.3
        requests>=2.32.3
        dashscope>=1.24.5
        ```

        **No packages are installed by this call.** The official web UI then opens the
        web terminal (`/#terminal?type=assistant&cmd=install`), which sends
        `pip install -r /tmp/requirements.txt` over the terminal WebSocket, so the
        (potentially long) installation runs interactively in the terminal.

        Takes no request body. Failure: `code: -1`,
        `msg: "failed to create requirements"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/assistant/start:
    post:
      tags:
      - Extensions
      operationId: ext_startAssistant
      summary: Start the AI assistant web app
      description: |
        Launches the assistant's Flask/SocketIO web application
        (`python /kvmapp/cua/cua_webapp.py --auth 1`, i.e. with its own token
        authentication enabled). Takes no request body.

        The handler first checks `ps -ef | grep cua`; if a `cua_webapp.py` process is
        already running it returns `{"status": "running", "code": 0}` immediately.
        Otherwise it starts the process, streams its stdout and returns
        `{"status": "starting", "code": 0}` as soon as a line containing
        `Authentication` appears (the app printing its auth token). The official web
        UI then opens `http://<device-host>:5000/` in a new tab.

        The inner `code` field mirrors the envelope code and is always `0` when the
        object is present.

        Failure: `code: -1` or `-2`, `msg: "Failed to start python server"` (the
        process could not be spawned, or it exited before printing the
        authentication line).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Assistant start status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Ext_AssistantStartResult'
              example:
                code: 0
                msg: success
                data:
                  status: starting
                  code: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/kvmadmin/install:
