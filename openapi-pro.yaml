      summary: Uninstall the kvmadmin extension
      description: |
        Stops and disables `kvmadmin.service`, deletes the application directory
        `/kvmadmin`, the configuration directory `/etc/kvmadmin` and the unit file
        `/etc/systemd/system/kvmadmin.service`, then runs `systemctl daemon-reload`.

        **All kvmadmin data is erased** — the web UI shows an explicit "this will
        clear data" confirmation before calling it. Takes no request body.

        No-op when kvmadmin is not installed (still returns success).

        Failure: `code: -1`, `msg: "uninstall failed"`.
      security:
