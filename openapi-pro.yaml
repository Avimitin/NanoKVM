      operationId: ext_installKvmadmin
      summary: Install the kvmadmin extension
      description: |
        Downloads `https://cdn.sipeed.com/nanokvm/resources/kvmadmin.tar.gz` into
        `/root/.kvmadmin`, unpacks it, installs its bundled
        `kvmadmin.service` unit to `/etc/systemd/system/kvmadmin.service` (made
        executable), moves the application tree to `/kvmadmin`, runs
        `systemctl daemon-reload` and enables + starts the service. The handler then
        sleeps **5 seconds** before responding.

        Idempotent: when `/kvmadmin/NanoKVM-Admin` already exists, nothing is
        downloaded and the service is just restarted. Takes no request body.

        After installation the web UI links to the admin panel at
        `http://<device-host>:8999/`.

        Failure: `code: -1`, `msg: "install failed"`.
      security:
