  /api/extensions/tailscale/down:
    post:
      tags:
      - Extensions
      operationId: ext_tailscaleDown
      summary: Take the Tailscale network down
      description: |
        Runs `tailscale down`, disconnecting the node from its tailnet without
        logging out (the web UI calls this when the state is `running`). Takes no
        request body.

        Failure: `code: -1`, `msg: "tailscale down failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
