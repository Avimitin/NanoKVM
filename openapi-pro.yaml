      operationId: ext_getKvmadminStatus
      summary: Get the kvmadmin status
      description: |
        Reports the kvmadmin extension state:

        - `notInstall` — `/kvmadmin/NanoKVM-Admin` does not exist.
        - `running` — installed and the `kvmadmin` systemd unit is active.
        - `notRunning` — installed but the service is not active.

        A failure to query systemd is treated as `notRunning`.
      security:
      - cookieAuth: []
