              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/install:
    post:
      tags:
      - Extensions
      operationId: ext_installTailscale
      summary: Install the Tailscale extension
      description: |
        Installs Tailscale from the official package repository. Takes no request body.

        The handler downloads `tailscale_latest_<arch>.tgz` from
        `https://pkgs.tailscale.com/stable/` (following the redirect; `arm64` on the
        NanoKVM-Pro's AX630C), unpacks it into `/root/.tailscale` and moves:

        - `tailscale` → `/usr/bin/tailscale`
        - `tailscaled` → `/usr/sbin/tailscaled`
        - the bundled `systemd/tailscaled.service` →
          `/etc/systemd/system/tailscaled.service` (made executable)

        It creates `/var/lib/tailscale` and `/run/tailscale`, writes
        `/etc/default/tailscaled` with `PORT=41641` and `FLAGS=""`, runs
        `systemctl daemon-reload` and enables + starts `tailscaled`.

        The call is **synchronous** and can take minutes on a slow link. It is
        idempotent: when the binaries already exist, no download happens and the
        service is merely (re)started.

        Failure: `code: -1`, `msg: "install failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/login:
    post:
      tags:
      - Extensions
      operationId: ext_tailscaleLogin
      summary: Start a Tailscale login and get the auth URL
      description: |
        Returns the URL the user must open in a browser to authenticate this node
        with a Tailscale account. Takes no request body.

        The handler first runs `tailscale status --json`; if that fails it tries to
        start the daemon, waits 3 seconds and retries. If the status still cannot be
        read, the call fails with `code: -1`, `msg: "unknown status"`.

        When the daemon already reports `BackendState: Running` the node is logged in
        and the response contains an **empty** `url` — the web UI treats that as
        immediate success.

        Otherwise it runs `tailscale login --accept-dns=false --timeout=10m` in the
        background and scrapes the first `https://…` line from its stderr; that URL is
        returned in `data.url` and stays valid for 10 minutes. Failure:
        `code: -2`, `msg: "login failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: The Tailscale login URL (empty when already logged in).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Ext_TailscaleLoginResult'
              example:
                code: 0
                msg: success
                data:
                  url: https://login.tailscale.com/a/1f2e3d4c5b6a
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/logout:
    post:
      tags:
      - Extensions
      operationId: ext_tailscaleLogout
      summary: Log out of Tailscale
      description: |
        Runs `tailscale logout`, removing the node's login (the device afterwards
        reports state `notLogin`). Takes no request body.

        Failure: `code: -1`, `msg: "logout failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/restart:
    post:
      tags:
      - Extensions
      operationId: ext_restartTailscale
      summary: Restart the tailscaled service
      description: |
        Restarts the `tailscaled` systemd unit and then sleeps **10 seconds** before
        responding, so the daemon has settled by the time the client refreshes the
        status. Takes no request body.

        Failure: `code: -1`, `msg: "restart failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/start:
    post:
      tags:
      - Extensions
      operationId: ext_startTailscale
      summary: Start the tailscaled service
      description: |
        Enables and (re)starts the `tailscaled` systemd unit — the equivalent of
        `systemctl enable --now tailscaled` followed by a restart. The web UI calls
        this when the status is `notRunning`. Takes no request body.

        Failure: `code: -1`, `msg: "start failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/status:
    get:
      tags:
      - Extensions
      operationId: ext_getTailscaleStatus
      summary: Get the Tailscale status
      description: |
        Reports the Tailscale daemon state plus the node's identity. The state is
        derived as follows:

        - `notInstall` — `/usr/bin/tailscale` or `/usr/sbin/tailscaled` is missing.
        - `notRunning` — the binaries exist but `tailscale status --json` could not be
          executed (daemon down), or the daemon reports `BackendState` `NoState` /
          `Starting`.
        - `notLogin` — `BackendState` is `NeedsLogin`.
        - `stopped` — `BackendState` is `Stopped`.
        - `running` — `BackendState` is `Running`.

        When running, `name` is the node's Tailscale hostname, `ip` is its IPv4
        Tailscale address (the last IPv4 entry of `Self.TailscaleIPs`, empty if none)
        and `account` is the current tailnet name. For non-running states these
        fields are empty strings.

        An unrecognised `BackendState` fails with `code: -1`, `msg: "unknown state"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Tailscale state and node identity.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Ext_TailscaleStatus'
              example:
                code: 0
                msg: success
                data:
                  state: running
                  name: nanokvm-pro
                  ip: 100.101.102.103
                  account: example.ts.net
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/stop:
    post:
      tags:
      - Extensions
      operationId: ext_stopTailscale
      summary: Stop the tailscaled service
      description: |
        Stops and disables the `tailscaled` systemd unit. Takes no request body.

        Failure: `code: -1`, `msg: "stop failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/uninstall:
    post:
      tags:
      - Extensions
      operationId: ext_uninstallTailscale
      summary: Uninstall the Tailscale extension
      description: |
        Removes Tailscale completely: stops and disables `tailscaled`, deletes
        `/usr/bin/tailscale`, `/usr/sbin/tailscaled`, `/etc/default/tailscaled` and
        `/etc/systemd/system/tailscaled.service`, then runs
        `systemctl daemon-reload`. Takes no request body.

        This does **not** remove `/var/lib/tailscale`, so the node's Tailscale
        identity and login survive a reinstall.

        No-op when Tailscale is not installed (still returns success).

        Failure: `code: -1`, `msg: "uninstall failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/extensions/tailscale/up:
    post:
      tags:
      - Extensions
      operationId: ext_tailscaleUp
      summary: Bring the Tailscale network up
      description: |
        Runs `tailscale up --accept-dns=false` on the device, connecting the node to
        its tailnet (the web UI calls this when the state is `stopped`). DNS settings
        of the device are deliberately left untouched. The handler waits 1 second
        after the command before responding.

        Takes no request body. Failure: `code: -1`, `msg: "tailscale up failed"`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/mode:
    get:
      tags:
      - HID
      operationId: hid_getMode
      summary: Get HID mode
      description: |
        Returns the current USB gadget mode.

        The mode is derived from the presence of the flag file `/dev/shm/tmp/hid_only`:
        when the file can be stat'ed the mode is `hid-only`, otherwise (missing file or
        any stat error) it is `normal`. The server never writes or removes the flag
        itself — it is maintained by the `/kvmapp/scripts/usbdev.sh` script that
        `POST /api/hid/mode` and `POST /api/hid/reset` execute.

        This endpoint has no failure path: it always answers `code: 0`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: The current HID mode.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Hid_Mode'
              example:
                code: 0
                msg: success
                data:
                  mode: normal
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - HID
      operationId: hid_setMode
      summary: Set HID mode
      description: |
        Switches the USB gadget between `normal` and `hid-only` mode. This is the
        endpoint behind the web UI "HID-Only mode" dialog.

        Binding: `proto.ParseFormRequest` — a JSON body (what the official web UI sends)
        or `application/x-www-form-urlencoded`. The Go struct `SetHidModeReq` has no
        `json` tag, so the key is matched case-insensitively; the UI sends `mode`.

        Behaviour:

        - `mode` is required and must be exactly `normal` or `hid-only`; anything else
          fails with `code: -2`.
        - If the requested mode already is the current mode, the endpoint returns success
          immediately without touching the gadget.
        - Otherwise the keyboard and mouse locks are taken, the three gadget device files
          are closed (`/dev/hidg0`/`/dev/hidg1`/`/dev/hidg2`), the script
          `bash /kvmapp/scripts/usbdev.sh restart` (for `normal`) or
          `bash /kvmapp/scripts/usbdev.sh hid-only` (for `hid-only`) is executed, the
          handler sleeps 3 seconds, then the device files are reopened and the locks
          released. While the locks are held, keyboard/mouse input over the `/api/ws`
          WebSocket is blocked.
        - The script is expected to create/remove the `/dev/shm/tmp/hid_only` flag that
          `GET /api/hid/mode` reads back.
        - In `hid-only` mode only the keyboard/mouse HID functions are exposed to the
          host: the virtual USB drive and the virtual network adapter are unmounted, and
          image mounting is disabled (the web UI shows a warning banner in this state).
          The mode is intended for target machines whose BIOS or firmware has
          compatibility problems with the full composite gadget.
        - The handler sleeps ~3 seconds before responding, so a real mode switch takes at
          least that long.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound, or `mode` empty) |
        | `-2` | `invalid arguments` (`mode` is neither `normal` nor `hid-only`) |
        | `-3` | `failed to set hid mode` (the `usbdev.sh` script could not be executed) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hid_ModeRequest'
            example:
              mode: hid-only
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Hid_ModeRequest'
            example:
              mode: hid-only
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/paste:
    post:
      tags:
      - HID
      operationId: hid_paste
      summary: Paste text as keystrokes
      description: |
        Types a string on the target machine by emitting one USB HID keyboard report per
        character. This is the endpoint behind the web UI "Paste" dialog.

        Binding: `proto.ParseFormRequest` — a JSON body (what the official web UI sends)
        or `application/x-www-form-urlencoded`. The Go struct `PasteReq` is defined in
        `service/hid/paste.go` (not in `proto/`) with a `form:"content"` tag and no
        `json` tag, so JSON keys are matched case-insensitively; the UI sends `content`.

        Behaviour:

        - `content` is required (an empty string fails validation with `code: -1`).
        - The length is checked **in bytes** after decoding (`len(req.Content) > 1024`);
          at most 1024 bytes are accepted.
        - Each character is looked up in the server's `CharMap`. Characters that are not
          in the map are **silently skipped** (logged at debug level); the endpoint still
          returns `code: 0`. Non-ASCII characters (accented letters, CJK, emoji) and
          control characters other than `\n` and `\t` are therefore dropped.
        - Every mapped character is sent as an 8-byte key-down report immediately followed
          by an all-zero key-up report, then the handler sleeps **50 ms** before the next
          character. Uppercase letters and shifted symbols are sent with the Left-Shift
          modifier (modifier byte `0x02`).
        - Reports are written to `/dev/hidg0` with an 8 ms write deadline; write failures
          are logged and ignored, so a stuck gadget does not turn into an error response.
        - Typing is **synchronous**: the HTTP response is only sent after the whole string
          has been typed. A full 1024-character paste takes roughly 51 seconds (the web
          UI's HTTP client uses a 60 second timeout).

        Supported characters (the `CharMap` in `service/hid/paste.go`):

        | input | HID encoding |
        |---|---|
        | `a`–`z` | plain letter key |
        | `A`–`Z` | Shift + letter key |
        | `0`–`9` | plain digit key |
        | `! @ # $ % ^ & * ( )` | Shift + digit key |
        | `` ` `` | grave-accent key |
        | `- = [ ] \ ; ' , . /` | plain punctuation key |
        | `_ + { } \| : " ~ < > ?` | Shift + punctuation key |
        | `\n` (newline) | Enter |
        | `\t` (tab) | Tab |
        | space | Space |

        Unlike the non-Pro NanoKVM firmware, the Pro request has **no language/keyboard
        layout field** — only `content`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound, or `content` empty) |
        | `-2` | `content too long` (more than 1024 bytes) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hid_PasteRequest'
            example:
              content: Hello, world! It's 100% typed.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Hid_PasteRequest'
            example:
              content: Hello, world! It's 100% typed.
      responses:
        '200':
          description: |
            Success (no `data` payload) — the response is sent only after every character
            has been typed — or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/reset:
    post:
      tags:
      - HID
      operationId: hid_reset
      summary: Reset HID
      description: |
        Re-initialises the USB HID gadget. This is the endpoint behind the web UI
        "Reset HID" menu entry, used when the target machine stops responding to the
        emulated keyboard/mouse.

        Behaviour (from `service/hid/status.go`):

        - The current HID mode is read (same logic as `GET /api/hid/mode`) and mapped to
          an argument of the gadget script `/kvmapp/scripts/usbdev.sh`:
          `normal` → `restart`, `hid-only` → `hid-only`. In other words the **current**
          gadget configuration is re-applied; the mode is not changed.
        - The keyboard and mouse locks are taken, the three gadget device files are closed
          (`/dev/hidg0` keyboard, `/dev/hidg1` mouse in relative mode, `/dev/hidg2`
          touchpad in absolute mode), the script is executed with `bash`, the handler
          sleeps 3 seconds, then the device files are reopened and the locks released.
        - While the locks are held, keyboard/mouse input arriving over the
          `/api/ws` WebSocket is blocked.
        - The handler sleeps ~3 seconds before responding, so the request takes at least
          that long.
        - No request body is read; an empty body is fine.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid hid mode` (unreachable in practice — the mode reader only returns the two known values) |
        | `-2` | `failed to reset` (the `usbdev.sh` script could not be executed) |

        The official web UI releases the mouse pointer, sends an all-zero keyboard report
        over the WebSocket and closes the WebSocket before calling this endpoint, then
        reconnects afterwards — that is client-side behaviour, not an API requirement.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/shortcut:
    post:
      tags:
      - HID
      operationId: hid_addShortcut
      summary: Add a shortcut
      description: |
        Appends a user-defined keyboard shortcut to the persistent store
        `/etc/kvm/shortcuts.json` (written with mode `0644`).

        Binding: `proto.ParseFormRequest` — the official web UI sends a JSON body. The Go
        struct `AddShortcutReq` has no `json` tags, so JSON keys are matched
        case-insensitively; the UI sends `keys` with `code` / `label` members.

        Behaviour:

        - `keys` is required: a missing or `null` field fails validation with `code: -1`.
          (The validator's `required` rule only rejects a nil slice, so an empty array is
          technically accepted and would be stored as a keyless shortcut — the web UI
          always records at least one key.)
        - The server generates the `id` (UUID v4) itself; any `id` sent by the client is
          ignored (the field is not even part of the request struct).
        - Neither `code` nor `label` is validated — both are stored verbatim. The web UI
          caps recording at 6 keys per shortcut (the HID report format holds at most 6
          non-modifier keycodes), but the server enforces no limit.
        - The new `id` is **not** returned; the client re-fetches the list with
          `GET /api/hid/shortcuts`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound, or `keys` missing/`null`) |
        | `-2` | `add shortcut failed` (store file unreadable, invalid JSON, or not writable) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hid_ShortcutAddRequest'
            example:
              keys:
              - code: ControlLeft
                label: Ctrl
              - code: AltLeft
                label: Alt
              - code: Delete
                label: ⌫
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - HID
      operationId: hid_deleteShortcut
      summary: Delete a shortcut
      description: |
        Removes one shortcut from the persistent store `/etc/kvm/shortcuts.json`.

        Binding: `proto.ParseFormRequest` — the official web UI sends a **JSON body with
        the DELETE request** (`{"id": "..."}`). The Go struct `DeleteShortcutReq` has no
        `json` tag, so the key is matched case-insensitively; the UI sends `id`.

        The `id` comparison is exact and case-sensitive; it must match a UUID returned by
        `GET /api/hid/shortcuts`. Deleting an unknown id fails with `code: -2`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound, or `id` empty) |
        | `-2` | `delete shortcut failed` (store unreadable, `id` not found, or the file could not be rewritten) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hid_ShortcutDeleteRequest'
            example:
              id: 6f1d2b34-9c8e-4a7f-b2d3-1e5a8c9f0b2d
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/shortcut/leader-key:
    get:
      tags:
      - HID
      operationId: hid_getLeaderKey
      summary: Get the shortcut leader key
      description: |
        Returns the configured "leader key".

        The value is stored in the file `/etc/kvm/leader-key` and is returned with all
        newline characters stripped. When the file does not exist (leader key disabled,
        the default), the endpoint succeeds with `key: ""`.

        The leader key is a **client-side** feature of the web UI: the browser intercepts
        the configured key and routes the following keystrokes straight to the
        `/api/ws` WebSocket, bypassing browser/OS shortcut handling. The server only
        persists the setting; it never interprets the key itself.

        Typical values are browser `KeyboardEvent.code` strings — the web UI offers
        `ShiftRight`, `ControlRight` and `MetaRight` as quick picks and can capture any
        other key.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `read leader key failed` (the file exists but cannot be read) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: The configured leader key (empty string when disabled).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Hid_LeaderKey'
              example:
                code: 0
                msg: success
                data:
                  key: ShiftRight
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - HID
      operationId: hid_setLeaderKey
      summary: Set the shortcut leader key
      description: |
        Sets or clears the "leader key" used by the web UI's shortcut feature.

        Binding: `proto.ParseFormRequest` — a JSON body (what the official web UI sends)
        or `application/x-www-form-urlencoded`. The Go struct `SetLeaderKeyReq` has no
        `json` tag, so the key is matched case-insensitively; the UI sends `key`.

        Behaviour:

        - `key` **empty or omitted** → the file `/etc/kvm/leader-key` is removed, i.e. the
          leader key is disabled. A missing file is not an error. This is what the web UI
          sends when the "Enable Leader Key" switch is turned off.
        - `key` non-empty → the value is written verbatim to `/etc/kvm/leader-key`
          (mode `0644`). No validation is performed; the intended values are browser
          `KeyboardEvent.code` strings such as `ShiftRight`, `ControlRight` or
          `MetaRight`.
        - The value is a client-side setting: the web UI reads it back with
          `GET /api/hid/shortcut/leader-key` and intercepts the key locally.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound) |
        | `-2` | `reset failed` (the file could not be removed on the disable path) |
        | `-3` | `write failed` (the file could not be written on the set path) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hid_LeaderKeyRequest'
            example:
              key: ControlRight
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Hid_LeaderKeyRequest'
            example:
              key: ControlRight
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/hid/shortcuts:
    get:
      tags:
      - HID
      operationId: hid_getShortcuts
      summary: Get shortcuts
      description: |
        Returns the user-defined keyboard shortcuts persisted on the device.

        The list is stored in `/etc/kvm/shortcuts.json` as
        `{"shortcuts": [{"id": "...", "keys": [{"code": "...", "label": "..."}]}]}` and is
        read under a read-write mutex. When the file does not exist or is empty, the
        endpoint returns an **empty array** (not `null`). A file that exists but contains
        invalid JSON produces `code: -1`.

        Notes:

        - `id` is a UUID v4 generated by the server when the shortcut was added.
        - `code` is a browser `KeyboardEvent.code` value (for example `ControlLeft`,
          `ShiftLeft`, `MetaLeft`, `KeyA`, `Digit5`, `F5`, `Enter`, `Delete`,
          `ArrowUp`), stored verbatim.
        - `label` is a display string chosen by the client when the shortcut was recorded
          (for example `Ctrl`, `Shift`, `Win`, `R`, `⌫`, `↑`).
        - The server never replays shortcuts: the web UI reads this list and re-plays the
          key combinations itself over the `/api/ws` WebSocket.
        - The web UI additionally shows two built-in shortcuts (Win+Tab and
          Ctrl+Alt+Delete) that are hard-coded in the client and are **not** part of this
          list.

        This endpoint has exactly one failure path (`code: -1`, unreadable/corrupt store
        file).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: The stored shortcut list.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Hid_ShortcutList'
              example:
                code: 0
                msg: success
                data:
                  shortcuts:
                  - id: 6f1d2b34-9c8e-4a7f-b2d3-1e5a8c9f0b2d
                    keys:
                    - code: ControlLeft
                      label: Ctrl
                    - code: ShiftLeft
                      label: Shift
                    - code: Escape
                      label: Esc
                  - id: 0a4c8e21-7b3d-4f5a-9e2b-8c1d0f3a5b7e
                    keys:
                    - code: MetaLeft
                      label: Win
                    - code: KeyR
                      label: R
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/static-ip:
    get:
      tags:
      - Network
      operationId: net_getStaticIp
      summary: Get static IP configuration
      description: |
        Returns whether a static (non-DHCP) Ethernet configuration is enabled and, if so,
        its content.

        The state is derived from the file `/boot/eth.nodhcp`:

        - File absent → `enabled: false`, `ip: ""` (the IP field is the Go zero value).
        - File present → `enabled: true`, `ip` is the **raw file content** (newlines
          included). The official web UI edits it as multi-line text where each
          non-comment line's first token is an IPv4 CIDR like `192.168.1.100/24`; the
          server performs no validation of its own.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `read static ip failed.` (the file exists but could not be read — note the trailing period in the message) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Static IP state and content.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Net_StaticIp'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
                  ip: 192.168.1.100/24
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Network
      operationId: net_setStaticIp
      summary: Set static IP configuration
      description: |
        Enables or disables the static (non-DHCP) Ethernet configuration by writing or
        removing `/boot/eth.nodhcp`, then restarts the Ethernet interface.

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. Both fields are optional individually but must
        agree:

        - `enabled: true` requires a non-empty `ip` (written verbatim to the file; the web
          UI sends multi-line CIDR text),
        - `enabled: false` requires an **empty** `ip`.

        Any other combination fails with `code: -2`, `msg: "invalid arguments"`.

        After writing/removing the file the handler returns success immediately and restarts
        the interface **asynchronously** (`ip link set eth0 down` then `up` in a goroutine).
        The network change therefore settles *after* the response — the official web UI
        waits 10 seconds before refreshing. Expect the connection to drop if the new
        configuration changes the device address.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound) |
        | `-2` | `invalid arguments` (`enabled`/`ip` combination is inconsistent) |
        | `-3` | `enable static ip failed` (file could not be written) |
        | `-4` | `disable static ip failed` (file could not be removed) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_SetStaticIpRequest'
            example:
              enabled: true
              ip: 192.168.1.100/24
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_SetStaticIpRequest'
            example:
              enabled: true
              ip: 192.168.1.100/24
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wifi:
    get:
      tags:
      - Network
      operationId: net_getWifi
      summary: Get Wi-Fi status
      description: |
        Returns the current Wi-Fi state: whether a Wi-Fi interface exists, whether the
        device runs in AP mode, and details of the connected network.

        - `supported` — `true` when at least one wireless interface is present (a
          `/sys/class/net/<iface>/wireless` entry exists). When `false`, all other fields
          stay at their zero values and `wifi` is `null`.
        - `apMode` — `true` when `hostapd` is running (the device acts as an access point).
        - `connected` — `true` when `wpa_cli -i wlan0 status` reports the WPA state
          `COMPLETED`. Otherwise `false` and `wifi` is `null`.
        - `wifi` — details of the connected network, **nested object** (unlike the flat
          `ssid`-only response of the non-Pro firmware): `ssid` and `bssid` from
          `wpa_cli`, `security` is the `wpa_cli` `key_mgmt` value (for example `WPA-PSK`,
          or `NONE` for an open network). `signal` and `frequency` are **always `0`** in
          this response — the handler never populates them; use
          `GET /api/network/wifi/scan` for real values.

        This endpoint always answers `code: 0` (interface detection and `wpa_cli` failures
        degrade to `supported: false` / `connected: false`).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Wi-Fi capability and connection state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Net_WifiStatus'
              example:
                code: 0
                msg: success
                data:
                  supported: true
                  apMode: false
                  connected: true
                  wifi:
                    ssid: HomeNet
                    bssid: aa:bb:cc:11:22:33
                    signal: 0
                    frequency: 0
                    security: WPA-PSK
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Network
      operationId: net_connectWifiNoAuth
      summary: Connect to a Wi-Fi network without authentication
      description: |
        Connects the device to a Wi-Fi network **without a session token**. This is the
        endpoint used by the standalone Wi-Fi onboarding page (`/wifi`) that is served while
        the device runs in access-point (AP) configuration mode, before any user is logged
        in.

        Guards, in order:

        1. The file `/tmp/wifi_config` must exist — it marks Wi-Fi configuration mode. If it
           is missing the request fails with `code: -1`, `msg: "invalid mode"`.
        2. The `X-AP-Key` request header must match the AP password stored in `/tmp/ap.pass`
           (compared in constant time). A missing header, a missing password file or a
           mismatch fails with `code: -4`, `msg: "unauthorized"` **after a deliberate 2
           second delay**.

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. `ssid` is required; `password` is optional
        (empty for open networks) and must not exceed 128 characters.

        Connection flow: any running connection and the AP itself are stopped
        (`wifi.sh connect_stop` / `ap_stop`), then `wifi.sh connect_start <ssid>
        [password]` is executed with a 30 second timeout, and afterwards the handler polls
        `wpa_cli status` up to 5 times (2 seconds apart) for the WPA state `COMPLETED` with
        an assigned IP address.

        Note that a successful connect takes the device out of AP mode, so the client may
        lose connectivity to the device's AP address while the request is still in flight —
        the official web UI simply treats a network error as success.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid mode` (not in Wi-Fi configuration mode) |
        | `-2` | `invalid parameters` (body could not be bound / `ssid` missing) |
        | `-3` | `set wifi failed` (empty SSID, password longer than 128 chars, connect timeout or failure) |
        | `-4` | `unauthorized` (bad or missing `X-AP-Key`) |
      security: []
      parameters:
      - name: X-AP-Key
        in: header
        required: true
        description: |
          AP-mode password (the content of `/tmp/ap.pass` on the device). The official
          onboarding UI obtains it from the user and sends it with every call.
        schema:
          type: string
        example: 8f2a1c9e
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_ConnectWifiRequest'
            example:
              ssid: HomeNet
              password: correct-horse-battery-staple
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_ConnectWifiRequest'
            example:
              ssid: HomeNet
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
  /api/network/wifi/connect:
    post:
      tags:
      - Network
      operationId: net_connectWifi
      summary: Connect to a Wi-Fi network
      description: |
        Connects the device to a Wi-Fi network. This is the authenticated variant used by
        the web UI settings page; the token-free variant used during AP-mode onboarding is
        `POST /api/network/wifi`.

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. `ssid` is required; `password` is optional
        (empty for open networks) and must not exceed 128 characters.

        Connection flow: any running connection and the AP itself are stopped
        (`wifi.sh connect_stop` / `ap_stop` — so this also leaves AP mode), then
        `wifi.sh connect_start <ssid> [password]` is executed with a 30 second timeout, and
        afterwards the handler polls `wpa_cli status` up to 5 times (2 seconds apart) for
        the WPA state `COMPLETED` with an assigned IP address. A successful request can
        therefore take up to ~40 seconds; the web UI shows a spinner meanwhile.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid parameters` (body could not be bound / `ssid` missing) |
        | `-2` | `set wifi failed` (empty SSID, password longer than 128 chars, connect timeout or failure) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_ConnectWifiRequest'
            example:
              ssid: HomeNet
              password: correct-horse-battery-staple
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_ConnectWifiRequest'
            example:
              ssid: HomeNet
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wifi/disconnect:
    post:
      tags:
      - Network
      operationId: net_disconnectWifi
      summary: Disconnect from the Wi-Fi network
      description: |
        Disconnects the device from the current Wi-Fi network by running
        `/kvmcomm/scripts/wifi.sh connect_stop`.

        The handler then polls `wpa_cli status` up to 5 times (2 seconds apart) waiting for
        the connection to actually drop, so the request can take about 10 seconds. If the
        device is still connected after that, the request fails with `code: -1`,
        `msg: "wifi disconnect failed"`.

        No request body is needed (the web UI sends none).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `wifi disconnect failed` (still connected after ~10 seconds) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wifi/scan:
    get:
      tags:
      - Network
      operationId: net_scanWifi
      summary: Scan for Wi-Fi networks
      description: |
        Scans for nearby Wi-Fi networks and returns them as a list. The web UI calls this
        when the Wi-Fi popover opens and then every 10 seconds while it stays open.

        The scan is performed by `/kvmcomm/scripts/wifi.sh try_scan`; its JSON output is
        parsed into the returned list. The server additionally:

        - rejects the request while the device runs in AP mode (`hostapd` running) with
          `code: -1`, `msg: "AP mode is enabled"`,
        - drops `null` entries from the script output,
        - removes the currently connected network (matched by BSSID) from the list,
        - repairs invalid `\xNN` escapes and non-UTF-8 bytes that some SSIDs produce.

        `signal` is the received signal strength in dBm (negative; the web UI renders
        `-60` and above as full strength, `-70` to `-60` as medium). `frequency` is the
        channel frequency in MHz. `security` is the network's security description, for
        example `WPA-PSK` or `open` (the web UI treats a case-insensitive `open` as an
        open network and skips the password prompt).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `AP mode is enabled` |
        | `-2` | `scan wifi failed` (the scan script failed) |
        | `-3` | `scan wifi failed` (the scan output could not be parsed) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Nearby Wi-Fi networks (the connected one excluded).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Net_WifiScanResult'
              example:
                code: 0
                msg: success
                data:
                  wifiList:
                  - ssid: HomeNet
                    bssid: aa:bb:cc:11:22:33
                    signal: -52
                    frequency: 2437
                    security: WPA-PSK
                  - ssid: CoffeeShop
                    bssid: dd:ee:ff:44:55:66
                    signal: -71
                    frequency: 2462
                    security: open
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wifi/verify:
    post:
      tags:
      - Network
      operationId: net_verifyApLogin
      summary: Verify the AP-mode login key
      description: |
        Checks an AP-mode password without performing any action. The standalone Wi-Fi
        onboarding page (`/wifi`) calls this first: the user types the AP password, and only
        when this endpoint answers `code: 0` is the SSID/password form shown.

        Guards, in order:

        1. The device must actually be in AP mode — the handler checks that `hostapd` is
           running (`pgrep -x hostapd`). If not, the request fails with `code: -1`,
           `msg: "invalid mode"` after a deliberate 2 second delay.
        2. The `X-AP-Key` request header must match the AP password stored in `/tmp/ap.pass`
           (compared in constant time). A missing header, a missing password file or a
           mismatch fails with `code: -4`, `msg: "unauthorized"` after a 2 second delay.

        The request body is ignored (the web UI sends an empty JSON object).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid mode` (not in AP mode) |
        | `-4` | `unauthorized` (bad or missing `X-AP-Key`) |
      security: []
      parameters:
      - name: X-AP-Key
        in: header
        required: true
        description: AP-mode password to verify (content of `/tmp/ap.pass`).
        schema:
          type: string
        example: 8f2a1c9e
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Ignored; sent as `{}` by the official web UI.
            example: {}
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
  /api/network/wol:
    post:
      tags:
      - Network
      operationId: net_wakeOnLan
      summary: Send a Wake-on-LAN magic packet
      description: |
        Sends a Wake-on-LAN magic packet for the given MAC address using
        `ether-wake -b <mac>` (broadcast).

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. `mac` is required.

        The MAC address is normalised before use: surrounding whitespace is trimmed, the
        string is uppercased, and the separators `-`, `:` and `.` are stripped. What remains
        must be exactly 12 hexadecimal digits, otherwise the request fails with
        `code: -2`, `msg: "invalid MAC address"`. Accepted input forms therefore include
        `AA:BB:CC:DD:EE:FF`, `aabbccddeeff` and `AA-BB-CC-DD-EE-FF`; the packet is always
        sent for the canonical `AA:BB:CC:DD:EE:FF` form.

        On success the MAC is also appended **asynchronously** (in a goroutine) to the
        Wake-on-LAN history file `/etc/kvm/cache/wol` if it is not already listed there —
        this is what `GET /api/network/wol/mac` later returns.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound / `mac` missing) |
        | `-2` | `invalid MAC address` |
        | `-3` | raw `ether-wake` command output (the command failed) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_WakeOnLanRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_WakeOnLanRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wol/mac:
    get:
      tags:
      - Network
      operationId: net_getWolMacs
      summary: Get Wake-on-LAN MAC history
      description: |
        Returns the list of MAC addresses that have been woken up previously (the
        Wake-on-LAN history), used by the web UI WoL menu to offer one-click repeats.

        The list is the raw content of `/etc/kvm/cache/wol` split on newlines. Entries have
        one of two shapes:

        - `"<MAC>"` — a bare MAC address (canonical `AA:BB:CC:DD:EE:FF` form, always
          uppercase with colon separators),
        - `"<MAC> <name>"` — a MAC followed by a space and a user-defined name set with
          `POST /api/network/wol/mac/name`.

        Because the file is newline-terminated, the array normally contains a trailing
        empty string; the official web UI filters empty entries out. Clients should ignore
        empty strings.

        If the history file does not exist yet (no Wake-on-LAN packet has ever been sent),
        the endpoint fails with `code: -2`, `msg: "open file error"`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-2` | `open file error` (history file missing or unreadable) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: MAC history entries.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Net_MacList'
              example:
                code: 0
                msg: success
                data:
                  macs:
                  - AA:BB:CC:DD:EE:FF
                  - 11:22:33:44:55:66 workstation
                  - ''
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Network
      operationId: net_deleteWolMac
      summary: Delete a MAC from the Wake-on-LAN history
      description: |
        Removes one MAC address from the Wake-on-LAN history file `/etc/kvm/cache/wol`.

        Binding: `proto.ParseFormRequest` — the official web UI sends a JSON body with a
        `DELETE` request; `application/x-www-form-urlencoded` is also accepted. `mac` is
        required.

        Every history line whose first space-separated token equals `mac` is dropped (the
        comparison is exact and case-sensitive, so use the canonical uppercase
        `AA:BB:CC:DD:EE:FF` spelling returned by `GET /api/network/wol/mac`); lines with
        other MACs, including their names, are kept. The file is then rewritten.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound / `mac` missing) |
        | `-2` | `read failed` (history file missing or unreadable) |
        | `-3` | `write failed` (history file could not be rewritten) |

        Deleting a MAC that is not listed is not an error — the file is simply rewritten
        unchanged and `code: 0` is returned.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_DeleteMacRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_DeleteMacRequest'
            example:
              mac: AA:BB:CC:DD:EE:FF
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/network/wol/mac/name:
    post:
      tags:
      - Network
      operationId: net_setWolMacName
      summary: Set the name of a Wake-on-LAN MAC
      description: |
        Assigns (or replaces) a human-readable name for a MAC address in the Wake-on-LAN
        history, turning its entry in `/etc/kvm/cache/wol` from `"<MAC>"` into
        `"<MAC> <name>"`.

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. Both `mac` and `name` are required.

        Every history line whose first space-separated token equals `mac` is rewritten as
        `"<mac> <name>"` (the comparison is exact and case-sensitive, so use the canonical
        uppercase `AA:BB:CC:DD:EE:FF` spelling returned by `GET /api/network/wol/mac`).
        If no line matches, the request fails with `code: -3`, `msg: "write failed"` and
        the file is left untouched.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound / `mac` or `name` missing) |
        | `-2` | `read failed` (history file missing or unreadable) |
        | `-3` | `write failed` (MAC not found in the history, or the file could not be rewritten) |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Net_SetMacNameRequest'
            example:
              mac: 11:22:33:44:55:66
              name: workstation
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Net_SetMacNameRequest'
            example:
              mac: 11:22:33:44:55:66
              name: workstation
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/speed/download:
    get:
      operationId: speed_download
      tags:
      - Speed Test
      summary: Download throughput test
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Streams random binary data so the client can measure download throughput. The
        response headers carry the timing data the client needs:

        - `X-Time` — the client timestamp echoed back,
        - `X-Server-Time` — server receive time (nanoseconds),
        - `Content-Size` — the number of bytes sent,
        - `X-Test-Type` — `download`.

        Query `size` selects the payload size in bytes (default `1048576` = 1 MiB; values
        above 50 MiB fall back to the default). The body is `application/octet-stream`.

        This endpoint does not use the `{code,msg,data}` envelope.
      parameters:
      - name: size
        in: query
        required: false
        description: Payload size in bytes (1–52428800; default 1048576).
        schema:
          type: integer
          default: 1048576
          example: 10485760
        example: 10485760
      - name: X-Time
        in: header
        required: true
        description: Client timestamp in nanoseconds.
        schema:
          type: integer
          format: int64
        example: 1727779200000000000
      responses:
        '200':
          description: Random binary payload with timing headers.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Missing or unparsable `X-Time` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Time header required
              example:
                success: false
                message: Time header required
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/speed/ping:
    get:
      operationId: speed_ping
      tags:
      - Speed Test
      summary: Latency test
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Round-trip latency probe. Send the client's nanosecond timestamp in the `X-Time`
        request header; the response echoes it and adds the server's receive time, so the
        client can compute RTT from `now - X-Time`.

        This endpoint does not use the `{code,msg,data}` envelope.
      parameters:
      - name: X-Time
        in: header
        required: true
        description: Client timestamp in nanoseconds (e.g. `Date.now() * 1e6`).
        schema:
          type: integer
          format: int64
        example: 1727779200000000000
      responses:
        '200':
          description: Latency probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speed_PingResult'
              example:
                success: true
                timestamp: 1727779200
                server_time: 1727779200123456789
                client_time: 1727779200000000000
        '400':
          description: Missing or unparsable `X-Time` header.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Invalid time header
              example:
                success: false
                message: Invalid time header
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/speed/upload:
    post:
      operationId: speed_upload
      tags:
      - Speed Test
      summary: Upload throughput test
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Accepts a raw body of any size, then reports the measured upload speed. Send the
        client's nanosecond timestamp in the `X-Time` header; the server reads the whole
        body, computes RTT/latency/speed and answers with a `Speed_UploadResult`.

        This endpoint does not use the `{code,msg,data}` envelope.
      parameters:
      - name: X-Time
        in: header
        required: true
        description: Client timestamp in nanoseconds (start of the upload).
        schema:
          type: integer
          format: int64
        example: 1727779200000000000
      requestBody:
        required: true
        description: Arbitrary bytes to measure throughput (e.g. 10 MiB of random data).
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Measured upload result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Speed_UploadResult'
              example:
                test_type: upload
                client_time: 1727779200000000000
                server_time: 1727779200123456789
                response_time: 1727779200987654321
                client_receive: 1727779200987654321
                latency: 49.38
                rtt: 98.77
                speed: 810.03
                data_size: 10485760
                timestamp: 1727779200
        '400':
          description: Missing `X-Time` header or unreadable body.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: Time header required
              example:
                success: false
                message: Time header required
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/download/image:
    post:
      tags:
      - Storage
      operationId: storage_downloadImage
      summary: Download image
      description: |
        Starts an **asynchronous** download of an image from an HTTP/HTTPS URL into `/data`
        and returns immediately. This backs the web UI "Download image" dialog.

        Binding: `proto.ParseFormRequest` on the shared mount request struct — JSON body
        (what the web UI sends) or `application/x-www-form-urlencoded`. Only `file` is used;
        it must be the image URL. (`cdrom` / `readOnly` are accepted because of the shared
        struct but ignored.)

        Processing:

        1. `file` must parse as a URL with a non-empty scheme and host, otherwise
           `code: -1`, `msg: "invalid url"`.
        2. A sentinel file `/tmp/.download_in_progress` prevents concurrent downloads —
           if it already exists the request fails with `code: -1`,
           `msg: "download in progress"`.
        3. A `HEAD` request is issued against the URL; it must return HTTP 200, otherwise
           `code: -1`, `msg: "failed when checking the url"` (the sentinel is removed).
        4. The download itself runs in a background goroutine: the body is streamed to
           `/data/<basename-of-URL-path>` while the sentinel file is rewritten every
           2.5 seconds as `"<url>;<percent>%"` so that
           `GET /api/storage/download/image/status` can report progress.

        The response is returned as soon as the background download starts; poll
        `GET /api/storage/download/image/status` for progress. Failures that happen inside
        the background goroutine are only logged server-side (they cannot reach the client),
        so a download that dies mid-way simply transitions from `in_progress` back to
        `idle`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` / `invalid url` / `download in progress` / `failed when checking the url` / `failed to create sentinel file` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage_DownloadRequest'
            example:
              file: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Storage_DownloadRequest'
            example:
              file: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
      responses:
        '200':
          description: Download started; poll the status endpoint.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_DownloadStatus'
              example:
                code: 0
                msg: success
                data:
                  status: in_progress
                  file: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
                  percentage: ''
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/download/image/enabled:
    get:
      tags:
      - Storage
      operationId: storage_isDownloadEnabled
      summary: Check whether image download is supported
      description: |
        Reports whether the image downloader can be used on this device.

        The check is a writability probe of the internal storage: the handler tries to
        create `/data/.testfile` (and removes it again). If the file can be created,
        `enabled` is `true`; if creation fails (for example a read-only `/data` mount —
        permission denied or any other error), `enabled` is `false`.

        The web UI hides the download input and shows a "download disabled" notice when
        this returns `false`.

        This endpoint always answers `code: 0` and has no request parameters.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Whether the downloader is usable.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_DownloadEnabled'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/download/image/status:
    get:
      tags:
      - Storage
      operationId: storage_getDownloadStatus
      summary: Get image download status
      description: |
        Reports the state of the image download started with
        `POST /api/storage/download/image`. The web UI polls this every 2.5 seconds while a
        download is running.

        The state is derived from the sentinel file `/tmp/.download_in_progress`:

        - File absent → `status: "idle"`, `file: ""`, `percentage: ""`.
        - File present → `status: "in_progress"`, `file` is the URL being downloaded and
          `percentage` is the last written progress value, a string like `"45.67%"`
          (percent sign included, two decimals) or `""` before the first progress update.

        `status` is therefore only ever `"idle"` or `"in_progress"`: the server never emits
        a `"failed"` status (the web UI checks for one, but download failures are only
        logged server-side and the state falls back to `"idle"`).

        This endpoint always answers `code: 0` and has no request parameters.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Download status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_DownloadStatus'
              example:
                code: 0
                msg: success
                data:
                  status: in_progress
                  file: https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.5.0-amd64-netinst.iso
                  percentage: 45.67%
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image:
    get:
      tags:
      - Storage
      operationId: storage_getImages
      summary: Get image list
      description: |
        Lists the storage images that can be mounted as a virtual USB drive.

        The handler walks `/data` (internal storage) and `/sdcard` (SD card) recursively and
        collects every regular file whose **lowercased** name ends in `.iso` or `.img`.
        Returned entries are absolute paths (for example `/data/debian-12.iso`) and are exactly
        the values expected by the `file` field of the mount, delete, checksum and download
        endpoints.

        Notes:

        - Subdirectories are searched; the extension check is case-insensitive
          (`Debian.ISO` matches).
        - Errors while walking a directory are logged and skipped, so the endpoint has no
          failure path and always answers `code: 0`.
        - When no image is found, `files` is `null` (the Go slice is never initialised), not
          an empty array.
        - The list is not filtered by what is currently mounted; use
          `GET /api/storage/image/mounted` for that.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Image list.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_ImageList'
              example:
                code: 0
                msg: success
                data:
                  files:
                  - /data/debian-12.5.0-amd64-netinst.iso
                  - /data/ubuntu-22.04.img
                  - /sdcard/alpine-virt-3.19.iso
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image/checksum:
    post:
      tags:
      - Storage
      operationId: storage_checksumImage
      summary: Calculate image checksum
      description: |
        Computes the MD5, SHA-1 or SHA-256 checksum of an image file and returns it as a
        lowercase hex string. This backs the MD5/SHA-1/SHA-256 buttons of the web UI image
        list.

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. Both `file` and `algorithm` are required;
        `algorithm` must be one of `md5`, `sha1`, `sha256` (validator `oneof`).

        Path resolution is strict (stricter than mount/delete): the path must be absolute,
        symlinks are resolved, the resolved path must stay inside `/data` or `/sdcard`, the
        extension must be `.iso` or `.img`, and the file must exist and be a regular file.
        The file is also re-checked after hashing — if it changed (size, mtime, inode) during
        the computation the request fails.

        Performance notes:

        - Results are cached in `/etc/kvm/cache/image-checksums.json`, keyed by resolved
          path and validated by size + modification time + device + inode, so repeated
          requests for an unchanged file return immediately.
        - Only **one** checksum may run at a time (process-wide mutex, non-blocking
          acquisition): a concurrent request fails immediately with `code: -4`.
        - Hashing a large image takes a while — the official web UI uses a 1 hour timeout
          for this request.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound, missing field, bad algorithm) |
        | `-2` | `invalid image` (path not absolute / outside `/data` or `/sdcard` / wrong extension / missing / not a regular file / changed during hashing) |
        | `-3` | `checksum image failed` (hashing or I/O failure) |
        | `-4` | `checksum in progress` (another checksum is already running) |

        The response `file` echoes the requested path (not the resolved one).
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage_ChecksumRequest'
            example:
              file: /data/debian-12.5.0-amd64-netinst.iso
              algorithm: sha256
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Storage_ChecksumRequest'
            example:
              file: /data/debian-12.5.0-amd64-netinst.iso
              algorithm: sha256
      responses:
        '200':
          description: Computed checksum.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_ChecksumResult'
              example:
                code: 0
                msg: success
                data:
                  file: /data/debian-12.5.0-amd64-netinst.iso
                  algorithm: sha256
                  checksum: 9e5d3f1c7a2b8e04d6f0a1c3b5d7e9f2a4c6b8d0e2f4a6c8b0d2e4f6a8c0b2d4
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image/delete:
    post:
      tags:
      - Storage
      operationId: storage_deleteImage
      summary: Delete image
      description: |
        Deletes an image file from the device storage (`os.Remove`).

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`. `file` is required.

        Validation (applied to the **lowercased** path):

        - must start with `/data` or `/sdcard`, **and**
        - must end with `.iso` or `.img`.

        Anything else is rejected with `code: -2`. The path is otherwise used verbatim for
        the removal; deleting a file that is currently mounted is not blocked by the server
        (the web UI disables the button in that case).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound / `file` missing) |
        | `-2` | `invalid arguments` (path outside `/data` or `/sdcard`, or wrong extension) |
        | `-3` | `remove file failed` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage_DeleteRequest'
            example:
              file: /data/ubuntu-22.04.img
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Storage_DeleteRequest'
            example:
              file: /data/ubuntu-22.04.img
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image/mount:
    post:
      tags:
      - Storage
      operationId: storage_mountImage
      summary: Mount image
      description: |
        Exposes an image file to the target machine as a virtual USB drive, or unmounts the
        current image. This is the endpoint behind the web UI "Mount image" dialog
        (mass-storage / CD-ROM modes and the read-only switch).

        Binding: `proto.ParseFormRequest` — JSON body (what the web UI sends) or
        `application/x-www-form-urlencoded`.

        Behaviour:

        - `file` **empty** (or omitted) → **unmount**. The handler writes a bare newline into
          the gadget LUN attribute, removes `/boot/usb.disk0`, restarts the USB gadget
          (`usbdev.sh restart`), sleeps 3 seconds and returns success.
        - `file` non-empty → **mount**. The handler creates `/boot/usb.disk0`, restarts the
          USB gadget, writes the `cdrom` and `ro` flags and then writes the path into the
          LUN attribute, sleeps 3 seconds and returns success.
        - `cdrom: true` exposes the image as a CD-ROM and **forces read-only**
          (`readOnly` is set to `1` regardless of the request). With `cdrom: false` the
          `readOnly` flag is honoured independently.
        - The handler sleeps ~3 seconds before responding, so the request takes at least
          that long.

        The `file` value is written to the gadget attribute **without any validation** (no
        path, existence or extension check) — use a path returned by
        `GET /api/storage/image`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (body could not be bound) |
        | `-2` | `mount image failed` (could not create `/boot/usb.disk0` or restart the USB gadget) |
        | `-3` | `unmount image failed` (unmount path only) |
        | `-4` | `set cdrom flag failed` |
        | `-5` | `set ro flag failed` |
        | `-6` | `mount image failed` (could not write the LUN file attribute) |

        Example:

        ```sh
        curl -b cookies.txt -H 'Content-Type: application/json' \
             -d '{"file":"/data/debian-12.5.0-amd64-netinst.iso","cdrom":false,"readOnly":true}' \
             http://nanokvm.local/api/storage/image/mount
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Storage_MountRequest'
            example:
              file: /data/debian-12.5.0-amd64-netinst.iso
              cdrom: false
              readOnly: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Storage_MountRequest'
            example:
              file: /data/debian-12.5.0-amd64-netinst.iso
              cdrom: false
              readOnly: true
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image/mounted:
    get:
      tags:
      - Storage
      operationId: storage_getMountedImage
      summary: Get mounted image
      description: |
        Returns the image currently exposed to the target machine through the USB mass-storage
        gadget LUN, together with its flags.

        Values are read from the USB gadget configfs attributes:

        - `file` — content of
          `/sys/kernel/config/usb_gadget/g0/configs/c.1/mass_storage.disk0/lun.0/file`
          with trailing newlines stripped. An **empty string** means nothing is mounted
          (unmounting writes a bare newline into that attribute).
        - `cdrom` — `.../lun.0/cdrom` equals `"1"` (image exposed as a CD-ROM).
        - `readOnly` — `.../lun.0/ro` equals `"1"` (LUN is read-only). Mounting with
          `cdrom: true` always forces `readOnly` to `true` as well.

        If the LUN attribute file does not exist (gadget not configured yet), the endpoint
        answers `code: 0` with all-zero data (`file: ""`, `cdrom: false`, `readOnly: false`).
        If the attribute exists but cannot be read, it answers `code: -2`,
        `msg: "read failed"`.

        This endpoint has no request parameters.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Currently mounted image and its flags.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_MountedImage'
              example:
                code: 0
                msg: success
                data:
                  file: /data/debian-12.5.0-amd64-netinst.iso
                  cdrom: false
                  readOnly: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/storage/image/upload:
    post:
      tags:
      - Storage
      operationId: storage_uploadImage
      summary: Upload image
      description: |
        Uploads one chunk of an image file into `/data` (internal storage). The client is
        responsible for splitting the file into chunks and sending them (typically in order)
        with the same `chunkSize` — each request writes its chunk at byte offset
        `chunkSize * chunkIndex` of `/data/<filename>`, so the file is assembled in place and
        there is no separate "finish" request and no completeness check.

        Multipart form fields:

        - `file` — the binary chunk (the part must be named `file`; if several parts carry
          that name only the first is used). The **filename** of the part determines the
          stored name: it is sanitised by replacing every character that is not a letter,
          digit, space, `-`, `_` or `.` with `_`. An empty sanitised name is rejected with
          `code: -6`.
        - `chunkIndex` — zero-based chunk number, `0 <= chunkIndex < totalChunks`
          (integer, sent as a string).
        - `chunkSize` — chunk size in bytes, `> 0`. The official web UI uses 8 MiB
          (8388608); the server copies with a buffer of at most 10 MiB per request.
        - `totalChunks` — total number of chunks, `> 0`.

        The server does **not** check the file extension on upload (the web UI file picker
        accepts `.img`, `.iso` and `.bin`, but only `.iso`/`.img` files are later listable,
        mountable, deletable or checksum-able). There is no size limit and no authentication
        of chunk ordering; a missing chunk simply leaves a hole of zeroes in the file.

        The official web UI appends a `?fid=<id>` query parameter and reads `data.id` from
        the response; the server ignores that parameter and never returns an `id` field.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `Failed to read form data` / `File operation failed` |
        | `-2` | `Invalid chunk index` / `File seek failed` |
        | `-3` | `Invalid chunk size` / `Failed to read uploaded file` |
        | `-4` | `Invalid total chunks count` / `File write failed` |
        | `-5` | `No file data found` |
        | `-6` | `Invalid filename` |

        Example:

        ```sh
        curl -c cookies.txt -F "file=@debian-12.5.0-amd64-netinst.iso" \
             -F "chunkIndex=0" -F "chunkSize=8388608" -F "totalChunks=125" \
             http://nanokvm.local/api/storage/image/upload
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Storage_UploadChunkRequest'
      responses:
        '200':
          description: Chunk stored; `data` reports the chunk bookkeeping.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Storage_UploadChunkResult'
              example:
                code: 0
                msg: success
                data:
                  status: chunk_uploaded
                  filename: debian-12.5.0-amd64-netinst.iso
                  chunkIndex: 0
                  totalChunks: 125
                  written: 8388608
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/fps:
    post:
      operationId: stream_setFps
      tags:
      - Stream
      summary: Set stream FPS
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Sets the target frame rate in frames per second. Range **0–120**; `0` lets the
        encoder decide (the shipped default).

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `invalid arguments`
        (value outside 0–120), `-3` `set FPS failed` (encoder rejected it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_SetFpsReq'
            example:
              fps: 30
      responses:
        '200':
          description: Successful response (no `data`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/gop:
    post:
      operationId: stream_setGop
      tags:
      - Stream
      summary: Set stream GOP
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Sets the encoder GOP (group of pictures — keyframe interval) in frames.
        Range **1–200**; the shipped default is `50`.

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `invalid arguments`
        (value outside 1–200), `-3` `failed to set GOP` (encoder rejected it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_SetGopReq'
            example:
              gop: 50
      responses:
        '200':
          description: Successful response (no `data`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/h264/direct:
    get:
      operationId: stream_h264Direct
      tags:
      - Stream
      summary: H.264 stream over WebSocket
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Raw **H.264** elementary stream delivered over a WebSocket (not plain HTTP). The
        endpoint upgrades the connection, then pushes binary frames; the client must keep
        reading (the server also reads — any incoming message is ignored, but a closed
        read side ends the session).

        ### Binary frame layout (server → client)

        | offset | size | field |
        |---|---|---|
        | 0 | 1 | keyframe flag — `1` when this frame is an IDR/keyframe, else `0` |
        | 1 | 8 | timestamp — microseconds since the streamer started, **little-endian** uint64 |
        9 | … | H.264 NAL data |

        The first client switches the capture pipeline to `h264-direct`; the loop stops when
        the last client disconnects. Frame pacing is up to 120 ticks/second; the encoder
        honors the configured width/height/bit-rate (`POST /api/stream/quality`).

        **Example** (Node.js):

        ```js
        const ws = new WebSocket('ws://nanokvm.local/api/stream/h264/direct', {
          headers: { Cookie: 'nano-kvm-token=<jwt>' }
        });
        ws.binaryType = 'arraybuffer';
        ws.onmessage = (e) => {
          const view = new DataView(e.data);
          const keyframe = view.getUint8(0) === 1;
          const timestamp = Number(view.getBigUint64(1, true)); // little-endian
          const nals = new Uint8Array(e.data, 9);
          // feed `nals` into your H.264 decoder; request a keyframe first
        };
        ```
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols) — binary H.264 frames follow.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/h264/webrtc:
    get:
      operationId: stream_h264WebRtc
      tags:
      - Stream
      summary: H.264 stream over WebRTC
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        **WebRTC** H.264 video (plus two-way audio) with signaling over this WebSocket.

        ### Signaling protocol (JSON text messages, both directions)

        Every message is `{"event": "<type>", "data": "<json-string>"}`.

        Client → server events:

        | event | `data` payload |
        |---|---|
        | `video-offer` | SDP offer (RTCSessionDescription JSON) for the video peer connection |
        | `video-candidate` | ICE candidate (RTCIceCandidateInit JSON) for video |
        | `audio-offer` | SDP offer for the audio peer connection |
        | `audio-candidate` | ICE candidate for audio |
        | `heartbeat` | keep-alive |

        Server → client events:

        | event | `data` payload |
        |---|---|
        | `video-answer` | SDP answer for video |
        | `video-candidate` | ICE candidate for video |
        | `audio-answer` | SDP answer for audio |
        | `audio-candidate` | ICE candidate for audio |

        Video and audio use **separate peer connections**. The server starts sending video
        when the video ICE connection reaches `connected`, and audio likewise. The audio
        connection also accepts an incoming microphone track (the browser may publish its
        mic). Video uses H.264; audio is Opus.

        The first client switches the capture pipeline to `h264-webrtc`.
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols) — JSON signaling messages follow.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/h265/direct:
    get:
      operationId: stream_h265Direct
      tags:
      - Stream
      summary: H.265 stream over WebSocket
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Raw **H.265/HEVC** elementary stream over a WebSocket — identical framing to
        `GET /api/stream/h264/direct`:

        | offset | size | field |
        |---|---|---|
        | 0 | 1 | keyframe flag (`1` = IDR/keyframe) |
        | 1 | 8 | timestamp, microseconds since start, little-endian uint64 |
        | 9 | … | H.265 NAL data |

        The first client switches the capture pipeline to `h265-direct`. H.265 halves the
        bit-rate of H.264 at equal quality but needs HEVC support in the decoder/browser
        (Safari ships it; most Chromium builds need to be enabled).
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols) — binary H.265 frames follow.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/h265/webrtc:
    get:
      operationId: stream_h265WebRtc
      tags:
      - Stream
      summary: H.265 stream over WebRTC
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        **WebRTC** H.265 video with the same JSON signaling protocol as
        `GET /api/stream/h264/webrtc` (`video-offer` / `video-answer` / `video-candidate`
        / `audio-*` / `heartbeat` messages, separate video and audio peer connections).

        The first client switches the capture pipeline to `h265-webrtc`. H.265 over WebRTC
        requires HEVC support in the browser (Safari; Chromium with HEVC enabled).
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols) — JSON signaling messages follow.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/mjpeg:
    get:
      operationId: stream_mjpegStream
      tags:
      - Stream
      summary: MJPEG video stream
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Continuous **MJPEG** (multipart JPEG) view of the captured screen.

        The first client switches the capture pipeline to MJPEG and starts a shared
        capture loop (one JPEG per tick, fanned out to every client); the loop stops when
        the last client disconnects. The response headers are
        `Content-Type: multipart/x-mixed-replace; boundary=frame`, `Cache-Control: no-cache`,
        `Connection: keep-alive`, `Pragma: no-cache` and `X-Server-Date` (RFC 1123).

        Each frame is one part:

        ```
        --frame\r\n
        Content-Type: image/jpeg\r\n
        Content-Length: <n>\r\n
        \r\n
        <n bytes of JPEG>\r\n
        ```

        Image size and quality come from the screen settings
        (`POST /api/stream/quality`), not from this request.

        This endpoint does not use the `{code,msg,data}` JSON envelope; the payload is the
        raw multipart stream.

        **Example**

        ```sh
        curl -N -b 'nano-kvm-token=<jwt>' http://nanokvm.local/api/stream/mjpeg
        ```
      responses:
        '200':
          description: |
            The multipart MJPEG stream — a sequence of `image/jpeg` parts introduced by the
            delimiter line `--frame`; there is no final closing delimiter while the stream
            runs.
          content:
            multipart/x-mixed-replace; boundary=frame:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/mode:
    post:
      operationId: stream_setMode
      tags:
      - Stream
      summary: Set stream mode
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Selects the active video stream type. Connecting to a stream endpoint also switches
        the type implicitly (each streamer calls `SetStreamType` on its first client), so this
        endpoint is mainly used to pre-configure or switch without connecting.

        Accepted `mode` values (from `StreamTypeMap`):

        | mode | stream |
        |---|---|
        | `mjpeg` | MJPEG over HTTP multipart |
        | `h264-webrtc` | H.264 over WebRTC |
        | `h264-direct` | H.264 over WebSocket |
        | `h265-webrtc` | H.265 over WebRTC |
        | `h265-direct` | H.265 over WebSocket |

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `invalid arguments`
        (unknown mode).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_SetModeReq'
            example:
              mode: h264-webrtc
      responses:
        '200':
          description: Successful response (no `data`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/quality:
    post:
      operationId: stream_setQuality
      tags:
      - Stream
      summary: Set stream quality or bit-rate
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        One endpoint for two settings, dispatched by value:

        * `quality` **1–100** — JPEG/H.264 quality factor (stored as `screen.Quality`).
        * `quality` **101–20000** — encoder target **bit-rate in kbps** (stored as
          `screen.BitRate`; the shipped default is `8000`).

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `invalid arguments`
        (value outside 1–20000).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_SetQualityReq'
            example:
              quality: 80
      responses:
        '200':
          description: Successful response (no `data`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/stream/rate-control:
    post:
      operationId: stream_setRateControlMode
      tags:
      - Stream
      summary: Set rate control mode
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        Sets the video encoder rate-control mode. The mode applies to the H.264/H.265
        encoders (it has no effect on MJPEG).

        Body binds with `ParseFormRequest` (JSON or `application/x-www-form-urlencoded`;
        the field name for form clients is `mode`).

        Error codes: `-1` `invalid arguments` (unbindable body), `-2` `invalid arguments`
        (mode not `cbr`/`vbr`), `-3` `set rate control failed` (encoder rejected it).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stream_SetRateControlModeReq'
            example:
              mode: vbr
      responses:
        '200':
          description: Successful response (no `data`).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/streamer/local:
    get:
      operationId: local_getStreamer
      tags:
      - Local
      summary: Streamer status for the local UI
      security:
      - localAuth: []
      description: |
        Status document consumed by the on-device streamer UI. **Loopback-only**: requests
        from `127.0.0.1`/`::1` are accepted without any token; any other source is rejected
        with `401 "unauthorized"` (the `X-KVM-Local` header is accepted by the middleware
        definition but the shipped handler only checks the client IP).

        The response is **not** wrapped in the `{code,msg,data}` envelope — it is the
        streamer status object itself (`ok`, `result` with encoder parameters, limits,
        source/stream statistics).
      responses:
        '200':
          description: Streamer status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Local_StreamerStatus'
              example:
                ok: true
                result:
                  delay: 130
                  deprecated: []
                  features:
                    h264: true
                    quality: true
                    resolution: true
                  limits:
                    available_resolutions:
                    - 3840x2160
                    - 2560x1440
                    - 1920x1080
                    desired_fps:
                      max: 60
                      min: 1
                    h264_bitrate:
                      max: 20000
                      min: 101
                    h264_gop:
                      max: 200
                      min: 1
                  params:
                    desired_fps: 30
                    h264_bitrate: 8000
                    h264_gop: 50
                    resolution: 1920x1080
                  snapshot:
                    saved: null
                  streamer:
                    encoder:
                      quality: 80
                      type: h264-webrtc
                    h264:
                      bitrate: 8000
                      real_bitrate: 8000
                      fps: 30
                      gop: 50
                      online: true
                    instance_id: nanokvm-pro
                    sinks:
                      h264:
                        has_clients: false
                      jpeg:
                        has_clients: false
                    source:
                      captured_fps: 30
                      desired_fps: 30
                      online: true
                      resolution:
                        height: 1080
                        width: 1920
                    stream:
                      clients: 0
                      clients_stat: {}
                      queued_fps: 30
        '401':
          description: Non-loopback request without local authorization.
          content:
            application/json:
              schema:
                type: string
                example: unauthorized
              example: unauthorized
  /api/vm/device/virtual:
    get:
      tags:
      - VM
      operationId: vm_getVirtualDevice
      summary: Get virtual device state
      description: |
        Reports which virtual USB devices are currently exposed to the
        target machine (the USB gadget configuration), plus the availability
        of the two mass-storage back-ends.

        - `isNetworkEnabled` — the virtual USB network card (NCM) is bound.
        - `isMicEnabled` — the virtual USB microphone (UAC2) is bound.
        - `mountedDisk` — `"sdcard"`, `"emmc"` or `""` (no virtual disk
          mounted), derived from the mass-storage LUN backing file.
        - `isSdCardExist` — an SD card device (`/dev/mmcblk1`) is present.
        - `isEmmcExist` — the eMMC backing image (`/exfat.img`) exists.

        This endpoint has no failure path (always `code: 0`).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Virtual device state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_VirtualDeviceState'
              example:
                code: 0
                msg: success
                data:
                  isNetworkEnabled: true
                  isMicEnabled: false
                  mountedDisk: sdcard
                  isEmmcExist: true
                  isSdCardExist: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_updateVirtualDevice
      summary: Update virtual device
      description: |
        Mounts/unmounts the virtual USB devices seen by the target machine.
        The change re-enumerates the USB gadget: the HID device is closed
        (and reopened) while the commands run, so keyboard/mouse input is
        briefly interrupted.

        `device` selects what to change; `type` qualifies the `disk` device:

        - `device: "network"` — **toggles** the virtual network card: mounts
          it if not mounted, unmounts it otherwise (there is no explicit
          on/off field).
        - `device: "mic"` — toggles the virtual microphone the same way.
        - `device: "disk"` — `type` is the desired backing store:
          `"sdcard"`, `"emmc"` or an empty string to unmount. Both disk flag
          files are removed first, then the requested one is created (only
          when it differs from the currently mounted type), and the gadget
          is restarted.

        Mounting `emmc` for the first time creates the backing image by
        running `/kvmcomm/scripts/mount_emmc.py start` — **this wipes all
        data in the NanoKVM's `/data` directory** (the web UI asks for a
        second confirmation before doing it). The official web UI sends
        `type: ""` to disable the disk.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid argument` (binding/validation error) |
        | `-2` | `invalid device: <device>` (unknown device, or the eMMC image could not be created) |
        | `-3` | `failed to mount device` (a gadget command failed) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_VirtualDeviceUpdateRequest'
            example:
              device: disk
              type: sdcard
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_VirtualDeviceUpdateRequest'
            example:
              device: disk
              type: sdcard
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/device/virtual/refresh:
    post:
      tags:
      - VM
      operationId: vm_refreshVirtualDevice
      summary: Refresh virtual device
      description: |
        Re-attaches the eMMC virtual disk: runs
        `/kvmcomm/scripts/mount_emmc.py restart`, which re-creates/re-attaches
        the `/exfat.img` backing image so the target machine sees the disk
        again. The web UI calls this from the "mount image" dialog after an
        image is written to the eMMC.

        Only `device: "emmc"` is accepted; any other value (or a binding
        error) fails with `code: -1`, `msg: "invalid argument"`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid argument` |
        | `-2` | `failed to refresh` (the helper script returned an error) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_VirtualDeviceRefreshRequest'
            example:
              device: emmc
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_VirtualDeviceRefreshRequest'
            example:
              device: emmc
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/edid:
    get:
      tags:
      - VM
      operationId: vm_getEdid
      summary: Get current EDID
      description: |
        Returns the name of the EDID currently presented to the target
        machine.

        The handler reads the EDID snapshot from
        `/proc/lt6911_info/edid_snapshot` and maps byte 12 through the
        built-in table:

        | byte 12 | name | resolution |
        |---------|------|------------|
        | `0x12` | `E18-4K30FPS` | 3840×2160 @ 30 Hz |
        | `0x30` | `E48-4K39FPS` | 3840×2160 @ 39 Hz |
        | `0x36` | `E54-1080P60FPS` | 1920×1080 @ 60 Hz |
        | `0x38` | `E56-2K60FPS` | 2560×1440 @ 60 Hz |
        | `0x3a` | `E58-4K16-10` | 3840×2400 @ 30 Hz |
        | `0x3f` | `E63-Ultrawide` | 3440×1440 @ 60 Hz |

        When byte 12 is not in the table, the name of the active **custom**
        EDID is read from `/etc/kvm/edid/edid_flag` (written when a custom
        EDID was switched to); `data.edid` is an empty string when neither
        source identifies the EDID.

        Failure: `code: -1`, `msg: "get edid failed"` (HTTP 200) when the
        snapshot cannot be read or is shorter than 13 bytes.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Name of the active EDID.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_EdidState'
              example:
                code: 0
                msg: success
                data:
                  edid: E54-1080P60FPS
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_switchEdid
      summary: Switch EDID
      description: |
        Switches the EDID presented to the target machine by copying the
        selected EDID binary over `/proc/lt6911_info/edid`.

        `edid` is either a built-in name (resolved as
        `/kvmcomm/edid/<name>.bin`) or the file name of a custom EDID
        previously uploaded to `/etc/kvm/edid/<name>` (see
        `POST /api/vm/edid/upload`). When a custom EDID is selected, its
        name is also written to `/etc/kvm/edid/edid_flag` so that
        `GET /api/vm/edid` reports it. The target machine re-reads the EDID
        the next time it re-enumerates the HDMI sink (a monitor reconnect or
        input switch may be needed).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-2` | `invalid EDID` (empty name) |
        | `-3` | `invalid EDID` (no such built-in or custom file) |
        | `-4` | `failed to switch EDID` (copy failed) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_EdidSwitchRequest'
            example:
              edid: E56-2K60FPS
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_EdidSwitchRequest'
            example:
              edid: E56-2K60FPS
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/edid/custom:
    get:
      tags:
      - VM
      operationId: vm_getCustomEdidList
      summary: Get custom EDID list
      description: |
        Lists the custom EDID files stored in `/etc/kvm/edid` (recursively).
        Only files whose name ends with `.bin` (case-insensitive) are
        returned; the internal `edid_flag` marker file is excluded. The
        returned names are the values accepted by `POST /api/vm/edid` for
        custom EDIDs and shown in the web UI's "custom" option group.

        Failure: `code: -1`, `msg: "get EDID failed"` (HTTP 200) when the
        directory walk fails.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Custom EDID file names.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_EdidCustomList'
              example:
                code: 0
                msg: success
                data:
                  edidList:
                  - my-edid.bin
                  - dell-u2720.bin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/edid/delete:
    post:
      tags:
      - VM
      operationId: vm_deleteEdid
      summary: Delete a custom EDID
      description: |
        Deletes a custom EDID file from `/etc/kvm/edid`. The name is used
        verbatim in the path (no traversal sanitisation).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-2` | `delete failed` (file missing or not removable) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_EdidDeleteRequest'
            example:
              edid: my-edid.bin
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_EdidDeleteRequest'
            example:
              edid: my-edid.bin
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/edid/upload:
    post:
      tags:
      - VM
      operationId: vm_uploadEdid
      summary: Upload a custom EDID
      description: |
        Uploads a custom EDID binary to `/etc/kvm/edid/<filename>` (the
        directory is created if needed) and sets mode 0644.

        The multipart part must be named `file`. **No validation is
        performed** — neither the filename nor the content is checked (no
        extension rule, no size limit, no EDID structure/checksum
        verification); whatever bytes are uploaded are later copied verbatim
        to the LT6911 when the EDID is switched. To be usable from the web
        UI the file should be named with a `.bin` extension, because
        `GET /api/vm/edid/custom` only lists `*.bin` files and
        `POST /api/vm/edid` looks the custom EDID up by that listed name.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `bad request` (no `file` part in the multipart body) |
        | `-2` | `create file failed` |
        | `-3` | `save failed` |

        Example:

        ```sh
        curl -c cookies.txt -F "file=@my-edid.bin" \
             http://nanokvm.local/api/vm/edid/upload
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vm_EdidUploadRequest'
      responses:
        '200':
          description: Stored file name.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_EdidUploadResult'
              example:
                code: 0
                msg: success
                data:
                  file: my-edid.bin
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/gpio:
    get:
      tags:
      - VM
      operationId: vm_getGpio
      summary: Get GPIO LED states
      description: |
        Reads the ATX front-panel LED states.

        - `pwr` — state of the power LED GPIO (`/sys/class/gpio/gpio75/value`).
          The line is active-low: the reported boolean is `true` when the raw
          GPIO value is `0` (LED lit) and `false` when it is `1`.
        - `hdd` — placeholder for the HDD LED; the current server always
          returns `false` (the HDD LED GPIO is never read).

        Failure: `code: -2`, `msg: "failed to read power led: …"` (HTTP 200)
        when the GPIO file cannot be read.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Power/HDD LED states.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_GpioState'
              example:
                code: 0
                msg: success
                data:
                  pwr: true
                  hdd: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setGpio
      summary: Press the power or reset button
      description: |
        Emulates pressing the ATX **power** or **reset** button: writes `1` to
        the corresponding GPIO value file, holds it for `duration`
        milliseconds, then writes `0`. The HTTP request blocks for the whole
        press duration.

        - `type: "power"` drives `/sys/class/gpio/gpio7/value` (the power
          button line), `type: "reset"` drives
          `/sys/class/gpio/gpio35/value`.
        - `duration` is the press time in **milliseconds**; when omitted or
          `0` it defaults to `800` (a short press). The web UI sends `800`
          for short presses and `seconds × 1000` for a configurable long
          power press (default 8 s).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments: …` (binding/validation error) |
        | `-2` | `invalid power event: <type>` (`type` is neither `power` nor `reset`) |
        | `-3` | `operation failed: …` (GPIO write error) |

        The body is bound with `ShouldBind`, so `application/json` (what the
        official web UI sends) and `application/x-www-form-urlencoded` are
        both accepted; JSON keys are matched case-insensitively
        (`type` / `duration`).
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_GpioRequest'
            example:
              type: power
              duration: 800
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_GpioRequest'
            example:
              type: power
              duration: 800
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hardware:
    get:
      tags:
      - VM
      operationId: vm_getHardware
      summary: Get hardware version
      description: |
        Returns the hardware form name of the device.

        The value comes from the server's hardcoded hardware table
        (`config.HWPro`, whose `Version` is the Desk variant). `HWVersion.String()`
        maps both the Desk and ATX variants to `"Pro"` and anything unknown to
        `"Unknown"` — so in the current build this endpoint always answers
        `{"version": "Pro"}`. It does **not** distinguish NanoKVM-Desk from
        NanoKVM-ATX; use the `type` field of `GET /api/vm/oled` or the
        `screenType` field of `GET /api/vm/lcd/display-policy` for that.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Hardware version string.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_Hardware'
              example:
                code: 0
                msg: success
                data:
                  version: Pro
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hdmi/capture:
    get:
      tags:
      - VM
      operationId: vm_getHdmiCapture
      summary: Get HDMI capture status
      description: |
        Returns whether the HDMI input capture (the LT6911 converter's main
        output) is powered on. The value is read from
        `/proc/lt6911_info/power` and is `true` when the file contains the
        string `'on'`.

        Failure: `code: -1`, `msg: "failed to get HDMI capture status"`
        (HTTP 200) when the proc file cannot be read.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: HDMI capture status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_HdmiCaptureState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setHdmiCapture
      summary: Set HDMI capture status
      description: |
        Powers the HDMI capture path on or off by writing `'on'`/`'off'` to
        `/proc/lt6911_info/power`.

        Turning capture off is what enables non-standard passthrough rates
        (for example 4K40/4K60): while capture is on, passthrough is limited
        to 4K30 (the web UI shows this hint on both HDMI switches).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `failed to set HDMI capture status` (write error) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_HdmiCaptureSetRequest'
            example:
              enabled: false
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_HdmiCaptureSetRequest'
            example:
              enabled: false
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hdmi/passthrough:
    get:
      tags:
      - VM
      operationId: vm_getHdmiPassthrough
      summary: Get HDMI passthrough status
      description: |
        Returns whether the HDMI loop-out (passthrough to the local monitor)
        is powered on. The value is read from
        `/proc/lt6911_info/loopout_power` and is `true` when the file
        contains the string `'on'`.

        Failure: `code: -1`, `msg: "failed to get HDMI passthrough status"`
        (HTTP 200) when the proc file cannot be read.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: HDMI passthrough status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_HdmiPassthroughState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setHdmiPassthrough
      summary: Set HDMI passthrough status
      description: |
        Powers the HDMI loop-out (passthrough to the local monitor) on or
        off, sequencing the LT6911 converter's power registers:

        - **enable** — `hdmi_power=0`, 10 ms wait, `loopout_power=1`,
          `hdmi_power=1`.
        - **disable** — `loopout_power=0`, `hdmi_power=0`, 10 ms wait,
          `hdmi_power=1`.

        The handler then sleeps another 10 ms before responding, so the
        request takes roughly 10–20 ms.

        Note: enabling passthrough limits the output to standard 4K30;
        disabling it allows non-standard rates like 4K40 (monitor
        compatibility may vary — the web UI shows this hint).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `failed to set HDMI passthrough status` (write error) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_HdmiPassthroughSetRequest'
            example:
              enabled: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_HdmiPassthroughSetRequest'
            example:
              enabled: true
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/hostname:
    get:
      tags:
      - VM
      operationId: vm_getHostname
      summary: Get hostname
      description: |
        Returns the device hostname read from `/etc/hostname` (trailing
        newline stripped). Together with mDNS this forms the
        `<hostname>.local` name reported by `GET /api/vm/info`.

        Failure: `code: -1`, `msg: "read Hostname failed"` (HTTP 200) when
        the file cannot be read.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Current hostname.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_HostnameState'
              example:
                code: 0
                msg: success
                data:
                  hostname: nanokvm
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setHostname
      summary: Set hostname
      description: |
        Writes the new hostname to **both** `/boot/hostname` (persistent
        across system updates/reflashes) and `/etc/hostname` (live). No
        `hostname` command is run, so the running kernel hostname and the
        mDNS name only change after a reboot — the web UI tells the user
        "Hostname updated. Reboot to apply."

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-2` | `failed to write data` (`/boot/hostname`) |
        | `-3` | `failed to write data` (`/etc/hostname`) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_HostnameSetRequest'
            example:
              hostname: nanokvm-lab
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_HostnameSetRequest'
            example:
              hostname: nanokvm-lab
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/info:
    get:
      tags:
      - VM
      operationId: vm_getInfo
      summary: Get device information
      description: |
        Returns the device identity and network inventory shown on the web UI
        "About" page.

        Fields:

        - `ips` — every **IPv4** address of an interface that is up and whose
          name starts with `eth`/`en` (reported as `type: "Wired"`) or
          `wlan`/`wl` (reported as `type: "Wireless"`). `version` is always the
          literal `"IPv4"` (IPv6 addresses are skipped). `name` is the Linux
          interface name (for example `eth0`). The field is `null` when no
          suitable interface exists.
        - `mdns` — `<hostname>.local` when the `avahi-daemon` service is
          running, otherwise an empty string.
        - `image` — system **image** version, read from `/boot/ver`; the last
          `-`-separated token is returned (`"v0.0.0"` when the file is empty
          or missing).
        - `application` — installed application version from
          `/kvmapp/version` (default `"1.0.0"`).
        - `deviceKey` — device key read from `/device_key` (empty when the
          file is missing).
        - `pn` — product/device number: the last space-separated token of
          `/proc/lt6911_info/version`, `"unknown"` when that file cannot be
          read.
        - `arch` — kernel architecture from `gopsutil` host info (for example
          `arm64`), falling back to the server binary's GOARCH.

        This endpoint has no failure path: it always answers `code: 0`
        (individual fields silently degrade to empty values when their source
        files are missing).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Device information.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_Info'
              example:
                code: 0
                msg: success
                data:
                  ips:
                  - name: eth0
                    addr: 192.168.1.42
                    version: IPv4
                    type: Wired
                  - name: wlan0
                    addr: 192.168.1.77
                    version: IPv4
                    type: Wireless
                  mdns: nanokvm.local
                  image: v1.0.4
                  application: 1.2.14
                  deviceKey: 5f2a9c31e8b7d4a0
                  pn: '2410150032'
                  arch: arm64
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/lcd/display-policy:
    get:
      tags:
      - VM
      operationId: vm_getLcdDisplayPolicy
      summary: Get LCD display policy
      description: |
        Returns the combined idle-display policy of the **Desk** touchscreen:
        what the built-in screen shows while idle, plus the scheduled
        screen-off window.

        - `screenType` — `"ATX"` or `"DESK"` (from
          `/proc/lt6911_info/version`). On ATX the handler answers with just
          `{"screenType": "ATX"}` (all other fields zero/null) — the ATX has
          no touchscreen.
        - `supportedModes` — idle modes this firmware supports, a subset of
          `alwaysOn`, `idleClock`, `idleOff`.
        - `mode` — the active mode (omitted when the policy has none).
        - `modeTimeoutSeconds` — per-mode idle timeout in seconds (for
          example `{"idleClock": 30, "idleOff": 60}`); omitted when not
          reported.
        - `schedule` — the scheduled screen-off window (same shape as
          `GET /api/vm/lcd/screen-off`) plus `wakeTimeoutSeconds`, the delay
          before an idle screen wakes on interaction.

        On Desk the values come from the on-device `kvm_ui` service
        (`/display-policy/get`); when that endpoint does not exist (older
        `kvm_ui`), the handler falls back to the legacy `/screenoff/get`
        and fills only `schedule`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `read screen type failed` |
        | `-2` | `get LCD display policy failed` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: LCD display policy (or screen type only on ATX).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_LcdDisplayPolicy'
              example:
                code: 0
                msg: success
                data:
                  screenType: DESK
                  supportedModes:
                  - alwaysOn
                  - idleClock
                  - idleOff
                  mode: idleClock
                  modeTimeoutSeconds:
                    idleClock: 30
                    idleOff: 60
                  schedule:
                    supported: true
                    enabled: true
                    startMinute: 1320
                    endMinute: 360
                    wakeTimeoutSeconds: 15
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setLcdDisplayPolicy
      summary: Set LCD display policy
      description: |
        Updates the **Desk** touchscreen display policy. At least one of
        `mode` or `schedule` must be present (an empty update is rejected).

        - `mode` — one of `alwaysOn`, `idleClock`, `idleOff` (anything else
          is rejected with a validation error).
        - `schedule` — the scheduled screen-off window; when present,
          `enabled`, `startMinute` and `endMinute` are all required,
          minutes must be in `0…1439`, and when `enabled` is `true` the two
          minutes must differ.

        The update is sent to the on-device `kvm_ui` service
        (`/display-policy/set`). On older `kvm_ui` builds that only expose
        the legacy screen-off endpoint, a `schedule`-only update is applied
        through it, while a `mode` update fails with `code: -4`, `msg:
        "LCD display modes are not supported by this device"`.

        Hardware precondition: **Desk form only** — any other screen type
        answers `code: -3`, `msg: "LCD display policy is only supported on
        Desk"`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments`, `display policy update is empty`, `unsupported LCD display mode "…"`, `schedule requires enabled, startMinute, and endMinute`, `startMinute and endMinute must be between 0 and 1439`, `startMinute and endMinute must differ` |
        | `-2` | `read screen type failed` |
        | `-3` | `LCD display policy is only supported on Desk` |
        | `-4` | `set LCD display policy failed` / `LCD display modes are not supported by this device` / `set screen-off schedule failed` |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_LcdDisplayPolicySetRequest'
            example:
              mode: idleClock
              schedule:
                enabled: true
                startMinute: 1320
                endMinute: 360
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/lcd/screen-off:
    get:
      tags:
      - VM
      operationId: vm_getLcdScreenOff
      summary: Get LCD screen-off schedule
      description: |
        Returns the scheduled screen-off window of the **Desk** touchscreen
        (the screen turns off between `startMinute` and `endMinute`, minutes
        since local midnight; the interval may wrap past midnight).

        On the ATX form the handler answers immediately with
        `supported: false` and zeroed fields. On the Desk the values come
        from the on-device `kvm_ui` service (`/screenoff/get`).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `read screen type failed` |
        | `-2` | `get screen-off schedule failed` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: 'Screen-off schedule (or `supported: false` on ATX).'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_LcdScreenOffConfig'
              example:
                code: 0
                msg: success
                data:
                  supported: true
                  enabled: true
                  startMinute: 1320
                  endMinute: 360
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setLcdScreenOff
      summary: Set LCD screen-off schedule
      description: |
        Replaces the scheduled screen-off window of the **Desk** touchscreen.
        The values are forwarded to the on-device `kvm_ui` service
        (`/screenoff/set`).

        All three fields are required (the handler dereferences them);
        `startMinute`/`endMinute` are minutes since local midnight and must
        be in `0…1439`; when `enabled` is `true` the two minutes must differ
        (an equal pair is only allowed for a disabled schedule). The window
        may wrap past midnight (for example start `1320` = 22:00,
        end `360` = 06:00).

        Hardware precondition: **Desk form only** — on any other screen type
        the handler answers `code: -3`, `msg: "screen-off scheduling is only
        supported on Desk"`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments`, or a validation message (`enabled, startMinute and endMinute are required`, `startMinute and endMinute must be between 0 and 1439`, `startMinute and endMinute must differ`) |
        | `-2` | `read screen type failed` |
        | `-3` | `screen-off scheduling is only supported on Desk` |
        | `-4` | `set screen-off schedule failed` |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_LcdScreenOffSetRequest'
            example:
              enabled: true
              startMinute: 1320
              endMinute: 360
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_LcdScreenOffSetRequest'
            example:
              enabled: true
              startMinute: 1320
              endMinute: 360
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/lcd/time/format:
    get:
      tags:
      - VM
      operationId: vm_getLcdTimeFormat
      summary: Get LCD time format
      description: |
        Returns the clock format shown on the **Desk** touchscreen, read
        from the on-device `kvm_ui` service (`/lvtime/get`). The wire value
        is lowercase: `"12h"` or `"24h"` (the web UI upper-cases it for
        display).

        Hardware precondition: the LCD endpoints talk to `kvm_ui`, which
        only runs on the Desk form; on other hardware the call fails.

        Failure: `code: -1`, `msg: "get time format failed"` (HTTP 200).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: LCD clock format.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_LcdTimeFormat'
              example:
                code: 0
                msg: success
                data:
                  format: 24h
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setLcdTimeFormat
      summary: Set LCD time format
      description: |
        Sets the clock format of the **Desk** touchscreen. The value is
        lower-cased and must then be `"12h"` or `"24h"` (the web UI sends
        `"12H"`/`"24H"`, which the server normalises); anything else is
        rejected by `kvm_ui` (`/lvtime/set`).

        Hardware precondition: Desk form only (the call goes to the
        on-device `kvm_ui` service).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid parameters` (binding/validation error) |
        | `-2` | `set time format failed` (invalid format or `kvm_ui` unreachable) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_LcdTimeFormatSetRequest'
            example:
              format: 24h
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_LcdTimeFormatSetRequest'
            example:
              format: 24h
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/ledstrip/get:
    get:
      tags:
      - VM
      operationId: vm_getLedConfig
      summary: Get LED strip configuration
      description: |
        Returns the current WS2812 LED strip configuration from the
        on-device `kvm_ui` service (`/ledstrip/get` on `127.0.0.1:65501`).

        Failure: `code: -1` with the transport error as `msg` (HTTP 200)
        when `kvm_ui` is unreachable or returns invalid JSON.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: LED strip configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_LedStripConfig'
              example:
                code: 0
                msg: success
                data:
                  brightness: 40
                  hor: 60
                  'on': true
                  ver: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/ledstrip/set:
    post:
      tags:
      - VM
      operationId: vm_setLedConfig
      summary: Set LED strip configuration
      description: |
        Configures the WS2812 LED strip around the device. The values are
        forwarded verbatim to the on-device `kvm_ui` service
        (`/ledstrip/set` on `127.0.0.1:65501`), which drives the LEDs.

        - `on` — master switch for the strip.
        - `hor` — number of LEDs in the horizontal run.
        - `ver` — number of LEDs in the vertical run.
        - `brightness` — brightness (the web UI slider covers `0…100`).

        The server performs **no validation** of the numbers; the web UI
        constrains `hor` to `1 … 150 − 2·ver` and `ver` to
        `1 … floor((150 − hor) / 2)`. Changing `hor`/`ver` only takes effect
        after the strip is turned off and on again (the web UI shows a
        restart hint); `on` and `brightness` apply immediately.

        All fields are optional (`omitempty`); omitted fields bind to their
        zero value and are still sent to `kvm_ui`, so send the complete
        configuration (as the web UI does).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid argument` (binding error) |
        | `-2` | `failed to set led strip` (`kvm_ui` did not answer `status: "ok"`) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_LedStripSetRequest'
            example:
              'on': true
              hor: 60
              ver: 20
              brightness: 40
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_LedStripSetRequest'
            example:
              'on': true
              hor: 60
              ver: 20
              brightness: 40
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/low-power:
    get:
      tags:
      - VM
      operationId: vm_getLowPower
      summary: Get low power mode status
      description: |
        Returns whether low power mode is active, i.e. whether the
        `kvm-sleep.service` systemd unit is running. In low power mode the
        HDMI output is turned off during idle periods to reduce power
        consumption and heat; waking the HDMI path needs re-initialisation
        (roughly 10 seconds of "no signal" on the monitor).

        Failure: `code: -1`, `msg: "failed to get status"` (HTTP 200) when
        the systemd query fails.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Low power mode status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_LowPowerState'
              example:
                code: 0
                msg: success
                data:
                  enabled: false
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setLowPower
      summary: Set low power mode
      description: |
        Enables or disables low power mode by starting/stopping
        `kvm-sleep.service`. Starting also **enables** the unit (it will be
        active again after a reboot); stopping also disables it.

        When enabled, HDMI output is automatically turned off during idle
        periods; waking it requires re-initialisation and the monitor may
        show "no signal" for about 10 seconds (the web UI warns about both
        effects before enabling).

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `failed to start service` |
        | `-3` | `failed to stop service` |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted. `enable` is
        optional (`omitempty`); an omitted value binds to `false`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_LowPowerSetRequest'
            example:
              enable: true
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_LowPowerSetRequest'
            example:
              enable: true
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mdns:
    get:
      tags:
      - VM
      operationId: vm_getMdnsState
      summary: Get mDNS state
      description: |
        Returns whether the mDNS responder (`avahi-daemon.service`) is
        running, i.e. whether the device is discoverable as
        `<hostname>.local`.

        A systemd query error is reported as `enabled: false`, so this
        endpoint has no failure path.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: mDNS responder state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_MdnsState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mdns/disable:
    post:
      tags:
      - VM
      operationId: vm_disableMdns
      summary: Disable mDNS
      description: |
        Stops and disables the mDNS responder: `avahi-daemon.service` is
        stopped and disabled (no longer starts at boot). The device stops
        answering on `<hostname>.local`; existing clients keep using the IP
        address.

        Takes no request body.

        Failure: `code: -1`, `msg: "failed to disable mdns"` (HTTP 200).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mdns/enable:
    post:
      tags:
      - VM
      operationId: vm_enableMdns
      summary: Enable mDNS
      description: |
        Enables and starts the mDNS responder: `avahi-daemon.service` is
        enabled (starts at boot) and restarted, making the device
        resolvable as `<hostname>.local`.

        Takes no request body.

        Failure: `code: -1`, `msg: "failed to enable mdns"` (HTTP 200).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/menubar:
    get:
      tags:
      - VM
      operationId: vm_getMenuBarConfig
      summary: Get menu bar configuration
      description: |
        Returns which web-UI menu bar items are hidden. The configuration is
        read from `/etc/kvm/menubar` (a JSON file
        `{"disabledItems": [...]}`); `disabledItems` is `null`/empty when
        nothing is hidden.

        Item keys used by the official web UI: `volume`, `microphone`,
        `image`, `script`, `assistant`, `terminal`, `wol`, `power`,
        `fullscreen`, `collapse`.

        Failure: `code: -1`, `msg: "get menu bar config failed"` (HTTP 200)
        when the file cannot be read or parsed.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Menu bar configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_MenuBarConfig'
              example:
                code: 0
                msg: success
                data:
                  disabledItems:
                  - assistant
                  - wol
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setMenuBarConfig
      summary: Set menu bar configuration
      description: |
        Replaces the whole menu bar configuration: `disabledItems` becomes
        the new list of hidden items (an empty array re-enables everything).
        The list is written as JSON to `/etc/kvm/menubar`.

        The field is optional (`omitempty`); an omitted field binds to an
        empty list, i.e. hides nothing.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `write config failed` |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_MenuBarConfigSetRequest'
            example:
              disabledItems:
              - assistant
              - wol
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_MenuBarConfigSetRequest'
            example:
              disabledItems: *id001
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mouse-jiggler:
    get:
      tags:
      - VM
      operationId: vm_getMouseJiggler
      summary: Get mouse jiggler state
      description: |
        Returns the state of the mouse jiggler (the feature that
        periodically moves the virtual mouse so the target machine does not
        sleep or lock).

        - `enabled` — `true` when the persistence file
          `/etc/kvm/mouse-jiggler` exists (the jiggler is also auto-started
          at server boot when the file exists).
        - `mode` — `"relative"` or `"absolute"`, read from the content of
          that file; the default is `"relative"`.

        This endpoint has no failure path.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Mouse jiggler state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_MouseJigglerState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
                  mode: relative
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/mouse-jiggler/:
    post:
      tags:
      - VM
      operationId: vm_setMouseJiggler
      summary: Set mouse jiggler state
      description: |
        Enables or disables the mouse jiggler.

        - `enabled: true` — writes `mode` to `/etc/kvm/mouse-jiggler`
          (persisted across reboots) and starts the jiggler loop.
        - `enabled: false` — removes the persistence file and stops the
          jiggler (the in-memory mode resets to `"relative"`).

        `mode` selects how the mouse is moved every interval:

        - `"relative"` — a small relative HID move (two opposite deltas,
          100 ms apart).
        - `"absolute"` — two absolute-position HID reports.

        The jiggler moves the pointer every **15 seconds**, but only when no
        real keyboard/mouse activity has arrived from the WebSocket input
        channel in the last 15 seconds (remote input resets the timer), so
        it never fights an active user.

        **Path note:** the Gin route is registered **with a trailing slash**
        (`POST /api/vm/mouse-jiggler/`). Gin's `RedirectTrailingSlash`
        (enabled by default) answers a POST to the unslashed
        `/api/vm/mouse-jiggler` with `307 Temporary Redirect` to the slashed
        path; the official web UI posts to the unslashed URL and follows the
        redirect, so both spellings work for HTTP clients that follow
        redirects and re-send the body.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `operation failed` (the persistence file could not be written/removed) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted. Both fields
        are optional (`omitempty`); an omitted `enabled` binds to `false`
        (i.e. disables).
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_MouseJigglerSetRequest'
            example:
              enabled: true
              mode: relative
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_MouseJigglerSetRequest'
            example:
              enabled: true
              mode: relative
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/oled:
    get:
      tags:
      - VM
      operationId: vm_getOled
      summary: Get OLED configuration
      description: |
        Returns the OLED screen configuration. The values are read from the
        on-device `kvm_ui` service (`/ui/get` on `127.0.0.1:65501`), which
        drives the small OLED panel of the **ATX** form (the web UI only
        shows this setting when `type` is `"ATX"`).

        - `exist` — always `true` in the current implementation (hardcoded).
        - `type` — screen form read from `/proc/lt6911_info/version`:
          `"ATX"` or `"DESK"`.
        - `sleep` — seconds of inactivity before the OLED turns off (`0` =
          never). When `kvm_ui` cannot be reached the object is still
          returned with `sleep: 0`.

        Failure: `code: -1`, `msg: "read screen type failed"` (HTTP 200)
        when `/proc/lt6911_info/version` is unreadable or contains an
        unknown form.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: OLED configuration.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_OledConfig'
              example:
                code: 0
                msg: success
                data:
                  exist: true
                  type: ATX
                  sleep: 60
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setOled
      summary: Set OLED configuration
      description: |
        Sets the OLED sleep timeout. The value is forwarded to the on-device
        `kvm_ui` service (`/ui/set` with `{"sleep_s": <seconds>}`), which
        drives the OLED panel of the ATX form.

        `sleep` is the inactivity timeout in **seconds**; `0` means "never
        turn off". The web UI offers 0, 15, 30, 60, 180, 300, 600, 1800 and
        3600. The field is optional (`omitempty`); an omitted value binds to
        `0`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `operation failed` (`kvm_ui` rejected the value or is unreachable) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_OledSetRequest'
            example:
              sleep: 60
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_OledSetRequest'
            example:
              sleep: 60
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/script:
    get:
      tags:
      - VM
      operationId: vm_getScripts
      summary: List scripts
      description: |
        Lists user scripts stored in `/etc/kvm/scripts` (recursively). Only
        files whose name ends with `.sh` or `.py` (case-insensitive) are
        returned; `data.files` contains bare file names.

        Failure: `code: -1`, `msg: "get scripts failed"` (HTTP 200) when the
        directory walk fails.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Script file names.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_ScriptList'
              example:
                code: 0
                msg: success
                data:
                  files:
                  - health-check.sh
                  - flash-bios.py
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - VM
      operationId: vm_deleteScript
      summary: Delete a script
      description: |
        Deletes a script from `/etc/kvm/scripts`.

        The name is used verbatim in the path (no traversal sanitisation),
        so only trusted callers should reach this endpoint. The official web
        UI sends a JSON body with a `DELETE` request.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-3` | `delete failed` (file missing or not removable) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_ScriptDeleteRequest'
            example:
              name: health-check.sh
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_ScriptDeleteRequest'
            example:
              name: health-check.sh
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/script/run:
    post:
      tags:
      - VM
      operationId: vm_runScript
      summary: Run a script
      description: |
        Runs a previously uploaded script from `/etc/kvm/scripts`.

        The command is executed as `sh -c "/etc/kvm/scripts/<name>"`; when
        the name ends with `.py` (case-insensitive) it is prefixed with
        `python`. The name is used verbatim in the path (no traversal
        sanitisation).

        `type` selects the execution mode:

        - `"foreground"` — the handler waits for the script, captures
          stdout+stderr and returns it in `data.log`.
        - anything else (the web UI sends `"background"`) — the script is
          started in a detached goroutine with output discarded; the handler
          returns immediately with `data.log: ""`. This is an asynchronous
          endpoint: success only means the process was started.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-2` | `run script failed` (foreground execution returned an error) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_ScriptRunRequest'
            example:
              name: health-check.sh
              type: foreground
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_ScriptRunRequest'
            example:
              name: health-check.sh
              type: foreground
      responses:
        '200':
          description: Combined output of a foreground run (empty for background runs).
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_ScriptRunResult'
              example:
                code: 0
                msg: success
                data:
                  log: |
                    uptime: 03:14
                    temperature: 51.2C
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/script/upload:
    post:
      tags:
      - VM
      operationId: vm_uploadScript
      summary: Upload a script
      description: |
        Uploads a script to `/etc/kvm/scripts` and marks it executable for
        its owner (mode `0100` is ensured on top of the existing mode).

        The multipart part must be named `file`; the **filename** must end
        with `.sh` or `.py` (case-insensitive) — anything else is rejected
        with `code: -2`, `msg: "invalid arguments"`. The file is stored under
        exactly the submitted filename. There is no size limit and no
        content validation.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `bad request` (no `file` part in the multipart body) |
        | `-2` | `invalid arguments` (wrong extension) / `create file failed` / `save failed` |

        Example:

        ```sh
        curl -c cookies.txt -F "file=@health-check.sh" \
             http://nanokvm.local/api/vm/script/upload
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Vm_ScriptUploadRequest'
      responses:
        '200':
          description: Stored file name.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_ScriptUploadResult'
              example:
                code: 0
                msg: success
                data:
                  file: health-check.sh
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/ssh:
    get:
      tags:
      - VM
      operationId: vm_getSshState
      summary: Get SSH state
      description: |
        Returns whether the device's SSH server is running. The state is
        `true` when either the `ssh.service` **or** the `ssh.socket` systemd
        unit is active (sub-state `running`/`listening`).

        This endpoint has no failure path (a systemd query error is logged
        and reported as `enabled: false`).
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: SSH server state.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_SshState'
              example:
                code: 0
                msg: success
                data:
                  enabled: true
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/ssh/disable:
    post:
      tags:
      - VM
      operationId: vm_disableSsh
      summary: Disable SSH
      description: |
        Stops and disables the device's SSH server: `ssh.service` is stopped
        and disabled (so it no longer starts at boot), then `ssh.socket` is
        stopped and disabled too (errors on the socket unit are ignored).
        Existing SSH sessions are terminated.

        Takes no request body.

        Failure: `code: -1`, `msg: "operation failed"` (HTTP 200) when the
        service cannot be stopped.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/ssh/enable:
    post:
      tags:
      - VM
      operationId: vm_enableSsh
      summary: Enable SSH
      description: |
        Enables and starts the device's SSH server: `ssh.service` is enabled
        (so it starts at boot) and restarted, then `ssh.socket` is enabled
        and started as well (errors on the socket unit are ignored). The
        server listens on port 22; the credentials are the system account
        (change the password from the web UI "Account" page first — the web
        UI shows this hint).

        Takes no request body.

        Failure: `code: -1`, `msg: "operation failed"` (HTTP 200) when the
        service cannot be enabled/started.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/system/pikvm:
    post:
      tags:
      - VM
      operationId: vm_switchPikvm
      summary: Switch system to PiKVM
      description: |
        Switches the device's dual-boot system to **PiKVM**: writes the
        literal string `pikvm` to `/etc/kvm/server.txt` and then reboots the
        device. At boot the system selector reads that file and starts the
        PiKVM system instead of the NanoKVM system.

        Notes:

        - The device **reboots immediately** after the file is written; the
          official web UI shows a confirmation dialog warning about the
          reboot and reloads the page after 60 seconds.
        - The switch is one-way from this API — returning to the NanoKVM
          system must be done from PiKVM's own interface.
        - The reboot is issued asynchronously (`reboot` is started, not
          waited for), so the response usually still gets sent.

        Takes no request body.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `operation failed` (writing `/etc/kvm/server.txt` failed) |
        | `-2` | `reboot failed` |
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload); the device reboots right after.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/system/reboot:
    post:
      tags:
      - VM
      operationId: vm_reboot
      summary: Reboot the system
      description: |
        Reboots the device. The `reboot` command is started asynchronously
        (`exec.Command("reboot").Start()`), so this endpoint returns
        immediately and the device goes down a moment later — clients should
        expect the connection to drop rather than a graceful shutdown
        response. All streams and WebSocket sessions terminate.

        Takes no request body.

        Failure: `code: -1`, `msg: "operation failed"` (HTTP 200) when the
        reboot command could not be started.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload); the device reboots right after.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/terminal:
    get:
      tags:
      - VM
      operationId: vm_terminal
      summary: Open the web terminal (WebSocket)
      description: |
        WebSocket endpoint that exposes an interactive **root shell** on the
        device. The route is behind `CheckToken`, so the handshake must be
        authenticated (see below); after the upgrade the server spawns
        `/bin/sh` attached to a pseudo-terminal (PTY) with the environment
        `TERM=xterm-256color` and `COLORTERM=truecolor`, running as the
        server process user (root).

        ### Handshake

        Standard WebSocket upgrade (`Connection: Upgrade`,
        `Upgrade: websocket`, `Sec-WebSocket-Key`, …). No subprotocol is
        negotiated, and the server accepts any `Origin`
        (`CheckOrigin` always returns `true`). Read/write buffer size is
        1024 bytes.

        **Authentication** — `CheckToken` runs before the upgrade: browsers
        send the `nano-kvm-token` cookie automatically on a same-origin
        handshake (this is what the official web UI relies on); the
        `Authorization: Bearer` header cannot be set from the browser
        WebSocket API, so non-browser clients should either send the cookie
        or add the header themselves. Loopback connections are exempt. A
        failed check yields HTTP 401 with the body `"unauthorized"` and no
        upgrade.

        ### Wire protocol

        Two independent pumps run after the upgrade:

        **Server → client — binary frames.** Raw PTY output. Each frame
        carries up to 1024 bytes of exactly what the shell wrote (no
        framing, escaping or encoding). The server sets a 10-second write
        deadline per frame and drops the connection when a write fails.

        **Client → server — two frame types:**

        - **Text frames** are written verbatim to the PTY stdin — keystrokes
          and command lines, including the trailing `\r` that submits them.
        - **Binary frames** are interpreted as a **terminal resize** request:
          the payload must be UTF-8 JSON `{"rows": <uint16>, "cols":
          <uint16>}` and is applied with `pty.Setsize`. Any binary frame that
          is not valid JSON of this shape is silently dropped — binary
          frames are never forwarded to the shell.

        Resize frame payload example: `{"rows":24,"cols":80}`.

        There is no application-level heartbeat, ping/pong or message
        acknowledgement; the connection stays open until either side closes
        it. On disconnect the server kills and reaps the shell process.

        ### How the official client uses it

        The web UI (xterm.js with the attach addon) opens
        `wss://<host>/api/vm/terminal`, sends the initial window size as a
        binary JSON frame right after `onopen`, re-sends it on window
        resize, and pipes xterm input as text frames. When the page URL
        carries `?port=…&baud=…&parity=…&flow=…&databits=…&stopbits=…`, it
        types a `picocom <port> --baud … …\r` command into the shell to
        attach to the target machine's serial console, and on exit sends the
        picocom quit sequence `0x01 0x18` (Ctrl-A Ctrl-X) before closing the
        socket. With `?type=assistant&cmd=install` it instead types
        `pip install -r /tmp/requirements.txt\r`.

        The companion `GET /api/vm/terminal/auth` endpoint exists for
        SSH-credential gating, but the WebSocket itself performs no such
        check in the current build.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '101':
          description: |
            WebSocket upgrade (Switching Protocols). The connection then
            carries the PTY protocol described above: binary frames
            server→client with raw shell output; text frames client→server
            written to the shell stdin; binary frames client→server holding
            `{"rows":…,"cols":…}` JSON to resize the terminal.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/terminal/auth:
    get:
      tags:
      - VM
      operationId: vm_terminalAuth
      summary: Authenticate terminal credentials
      description: |
        Verifies **SSH credentials** for the web terminal and, on success,
        creates a one-shot lock file.

        The request must carry an HTTP Basic `Authorization` header
        (`Basic base64(username:password)`). The handler decodes it and opens
        an SSH connection to `127.0.0.1:22` (the device's own sshd) using
        password authentication with those credentials, ignoring the host
        key. In other words, the credentials checked are the **system**
        account (typically `root`), not the web-account credentials.

        On success it creates the lock file `/etc/kvm/terminal_auth`
        (`O_CREATE|O_EXCL`, so a second call while a session is "locked"
        fails) and answers `code: 0`. On any failure it answers HTTP 200 with
        `code: -1`, `msg: "authentication failed"`; when the `Authorization`
        header is missing entirely, the response additionally carries
        `WWW-Authenticate: Basic realm="Restricted", charset="UTF-8"`.

        Notes:

        - The endpoint is still behind `CheckToken`, so the session cookie /
          bearer token is required in addition to the Basic header.
        - The current `Terminal` WebSocket handler no longer checks the lock
          file (the check is commented out), and the shipped web UI connects
          to the WebSocket directly without calling this endpoint — it is
          effectively unused by the official client.
      security:
      - cookieAuth: []
      - bearerAuth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: |
          HTTP Basic credentials of a system (SSH) account, for example
          `Basic cm9vdDpwYXNzd29yZA==` for `root:password`.
        schema:
          type: string
          example: Basic cm9vdDpwYXNzd29yZA==
        example: Basic cm9vdDpwYXNzd29yZA==
      responses:
        '200':
          description: 'Success (no `data` payload), or `code: -1` on failed authentication.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/time:
    get:
      tags:
      - VM
      operationId: vm_getTime
      summary: Stream the current time (SSE)
      description: |
        A **Server-Sent Events** stream that pushes the device's wall-clock
        time once per second. The web UI opens it with `EventSource` and
        renders the timestamp in the selected time zone and format.

        - Response `Content-Type`: `text/event-stream`; the connection stays
          open until the client disconnects (or the request context is
          cancelled) — the server never ends the stream on its own.
        - Each event is named `message` and its data is the current time as
          **Unix milliseconds** (an integer, not JSON):

          ```
          event: message
          data: 1759345600123

          ```

        - The first event arrives about one second after the connection is
          opened (the server ticks on a 1 s timer).
        - This endpoint does **not** use the JSON envelope — the body is the
          raw event stream.
        - Authentication: `EventSource` sends the `nano-kvm-token` cookie
          automatically for same-origin connections; loopback is exempt.

        Example:

        ```sh
        curl -N -H 'Accept: text/event-stream' --cookie 'nano-kvm-token=<jwt>' \
             http://nanokvm.local/api/vm/time
        ```
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: |
            Server-Sent Events stream of the current time. Each event is
            `event: message` with `data:` set to Unix milliseconds; one
            event per second, forever.
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: message
                data: 1759345600123
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/time/status:
    get:
      tags:
      - VM
      operationId: vm_getTimeStatus
      summary: Get time synchronization status
      description: |
        Returns the NTP synchronization status, parsed from
        `chronyc tracking`:

        - `isSynchronized` — `true` when chrony's "Leap status" is `Normal`.
        - `lastSyncTime` — the "Ref time (UTC)" converted to **Unix
          milliseconds**; `0` when chrony has never synchronized.

        Failure: `code: -1`, `msg: "get chrony sync status failed"` (HTTP
        200) when chronyc cannot be run or its output cannot be parsed.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: NTP synchronization status.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_TimeStatus'
              example:
                code: 0
                msg: success
                data:
                  isSynchronized: true
                  lastSyncTime: 1759345600123
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/time/sync:
    post:
      tags:
      - VM
      operationId: vm_syncTime
      summary: Synchronize time
      description: |
        Triggers an immediate NTP measurement burst: runs
        `chronyc burst 4/4` (chronyd takes a burst of measurements from its
        configured sources), then waits 2 seconds before responding so the
        status has usually settled by the time the client polls
        `GET /api/vm/time/status`.

        Note: the burst only triggers measurements — whether the clock is
        actually stepped depends on chrony's configuration; the web UI
        re-reads the status after this call.

        Takes no request body.

        Failure: `code: -1`, `msg: "sync time failed"` (HTTP 200) when
        chronyc fails or does not answer `200 OK`.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/timezone:
    get:
      tags:
      - VM
      operationId: vm_getTimezone
      summary: Get current time zone
      description: |
        Returns the IANA time zone name currently in effect, derived from
        the `/etc/localtime` symlink (for example `Asia/Shanghai`).

        Failure: `code: -1`, `msg: "failed to get timezone"` (HTTP 200)
        when the symlink cannot be resolved.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Current IANA time zone.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_Timezone'
              example:
                code: 0
                msg: success
                data:
                  timezone: Asia/Shanghai
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setTimezone
      summary: Set time zone
      description: |
        Sets the system time zone. The value is first validated as an IANA
        zone name (Go `time.LoadLocation`), then applied with
        `timedatectl set-timezone <zone>`.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding/validation error) |
        | `-2` | `invalid timezone` (unknown zone name) / `set timezone failed` (timedatectl error) |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_TimezoneSetRequest'
            example:
              timezone: Asia/Shanghai
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_TimezoneSetRequest'
            example:
              timezone: Asia/Shanghai
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vm/web-title:
    get:
      tags:
      - VM
      operationId: vm_getWebTitle
      summary: Get web title
      description: |
        Returns the custom browser-tab title, read from
        `/etc/kvm/web-title` (trailing newline stripped). The web UI uses it
        as the document title on every page.

        Failure: `code: -1`, `msg: "read web title failed"` (HTTP 200) when
        the file does not exist (i.e. no custom title has been set) or
        cannot be read.
      security:
      - cookieAuth: []
      - bearerAuth: []
      responses:
        '200':
          description: Custom web title.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Vm_WebTitle'
              example:
                code: 0
                msg: success
                data:
                  title: Lab KVM — rack 3
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - VM
      operationId: vm_setWebTitle
      summary: Set web title
      description: |
        Sets the custom browser-tab title. A non-empty `title` is written to
        `/etc/kvm/web-title`; an **empty string removes the file**, resetting
        the title to the default. The field is optional (`omitempty`), so an
        omitted field also resets the title.

        Failure codes (HTTP 200):

        | `code` | `msg` |
        |--------|-------|
        | `-1` | `invalid arguments` (binding error) |
        | `-2` | `reset failed` (the file could not be removed) |
        | `-3` | `write failed` |

        The body is bound with `ShouldBind`, so JSON (primary) and
        `application/x-www-form-urlencoded` are both accepted.
      security:
      - cookieAuth: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Vm_WebTitleSetRequest'
            example:
              title: Lab KVM — rack 3
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Vm_WebTitleSetRequest'
            example:
              title: Lab KVM — rack 3
      responses:
        '200':
          description: Success (no `data` payload), or a negative `code` on failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 0
                msg: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/ws:
    get:
      operationId: ws_connect
      tags:
      - WebSocket
      summary: Real-time input channel
      security:
      - cookieAuth: []
      - bearerAuth: []
      description: |
        The keyboard/mouse input channel (and server event push). The endpoint upgrades to
        a WebSocket; browsers authenticate with the `nano-kvm-token` cookie sent on the
        handshake (non-browsers can also connect from loopback, which bypasses auth).

        ### Client → server: binary frames

        The first byte selects the message type; the rest is the HID report.

        | byte 0 | meaning | payload |
        |---|---|---|
        | `0x00` | heartbeat | none |
        | `0x01` | keyboard report | 8 bytes: `[modifiers, reserved, key1..key6]` (USB HID boot-protocol keyboard) |
        | `0x02` | mouse report | 4 bytes (relative: `[dx, dy, wheel, buttons]`) or 6 bytes (absolute: `[buttons, x-hi, x-lo, y-hi, y-lo, wheel]`) |

        Keyboard example — press `a` (usage `0x04`):
        `01 00 00 04 00 00 00 00 00`, release: `01 00 00 00 00 00 00 00 00`.

        Absolute mouse example — move to (16384, 16384) of the 0–32767 HID grid with no
        buttons: `02 00 40 00 40 00 00`.

        Every message (including heartbeats) refreshes the connection's liveness; the
        jiggler also treats any input as activity.

        ### Server → client: JSON text messages

        `{"type": "<event>", "data": "<json-string>"}`. The application update flow pushes
        progress here: `type: "update"` with `data` being
        `{"step": "download", "progress": 42}` (step is one of the update steps,
        progress 0–100).

        **Example** (Node.js):

        ```js
        const ws = new WebSocket('ws://nanokvm.local/api/ws', {
          headers: { Cookie: 'nano-kvm-token=<jwt>' }
        });
        // press Ctrl+Alt+Del: modifiers 0b00000101 = 0x05, keys 0x1D 0x06 0x4C
        ws.send(Buffer.from([0x01, 0x05, 0x00, 0x1D, 0x06, 0x4C, 0x00, 0x00, 0x00]));
        ws.send(Buffer.from([0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00])); // release
        ```
      responses:
        '101':
          description: WebSocket upgrade (Switching Protocols).
        '401':
          $ref: '#/components/responses/Unauthorized'
